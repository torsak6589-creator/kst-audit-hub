นินการ : Operation"],["8.9.2.3","➤ เมื่อพบว่าเกณฑ์การปฏิบัติ (Action Criteria) ของ OPRP ไม่เป็นตามที่กำหนดไว้ มีการประเมินผลกระทบที่ส่งผลต่อความปลอดภัยของอาหาร เพื่อระบุสาเหตุและขอบเขตของผลิตภัณฑ์ที่ได้รับผลกระทบ และมีการจัดการกับผลิตภัณฑ์ที่ได้รับผลกระทบตามข้อ 8.9.4 หรือไม่",[],[],"(8) การดำเนินการ : Operation"],["8.9.2.4","➤ มีการจัดเก็บและบันทึกข้อมูลเอกสารที่ระบุรายละเอียดของความไม่สอดคล้อง, สาเหตุของปัญหา และผลลัพธ์ที่เกิดจากการดำเนินการแก้ไขไว้อย่างครบถ้วนหรือไม่",[],[],"(8) การดำเนินการ : Operation"],["8.9.3","การปฏิบัติการแก้ไข (Corrective Action)",["• มีการกำหนดหรือไม่ว่าต้องมีการประเมินความจำเป็นในการปฏิบัติการแก้ไข กรณีที่ค่าวิกฤต และเกณฑ์การปฏิบัติไม่เป็นไปตามที่กำหนดไว้ • มีการบันทึกและจัดทำเอกสารขั้นตอนดำเนินการปฏิบัติการแก้ไขที่เกี่ยวข้องกับความปลอดภัยอาหารที่รวมถึง (a) การทบทวนความไม่สอดคล้องว่ามาจากสาเหตุใด (b) การพิจารณาวิธีการแก้ไขและป้องกันสาเหตุของความไม่เป็นไปตามข้อกำหนดที่ตรวจพบ (c) มีการบันทึกเป็นลายลักษณ์อักษร รวมทั้งมีการทวนสอบว่าวิธีการแก้ไขและป้องกันมีประสิทธิภาพ"],["- ตรวจ PM-MR-05: การปฏิบัติการแก้ไขและป้องกัน - สุ่มตรวจใบ CAR"],"(8) การดำเนินการ : Operation"],["8.9.4","การจัดการกับผลิตภัณฑ์ที่อาจจะไม่ปลอดภัย",[],[],"(8) การดำเนินการ : Operation"],["8.9.4.1","➤ ทั่วไป",["• มีการกำหนดวิธีปฏิบัติการเพื่อป้องกันไม่ให้ผลิตภัณฑ์ที่อาจไม่ปลอดภัยเข้าสู่ห่วงโซ่อาหารหรือไม่ • ถ้ามีการปล่อยผลิตภัณฑ์ที่อาจไม่ปลอดภัยเข้าสู่ห่วงโซ่อาหาร มีเอกสารการยืนยันหรือไม่ว่าอันตรายดังกล่าวยังคงอยู่ในระดับที่ยอมรับได้ หรือลดลงอยู่ในระดับที่กำหนด • มีการแยกกักผลิตภัณฑ์ที่อาจไม่ปลอดภัย (ติด NCR) ไว้ในพื้นที่ควบคุม และห้ามเคลื่อนย้ายจนกว่าจะได้รับผลการประเมินและการตัดสินใจวิธีการจัดการของผลิตภัณฑ์ดังกล่าวหรือไม่ • ในกรณีที่พบว่าผลิตภัณฑ์ที่จำหน่ายออกไปแล้วไม่ปลอดภัย บริษัทได้มีการแจ้งไปยั…"],["- สุ่มตรวจสอบ/ สอบถามใบรายการ NCR ว่ามีการดำเนินงานตาม PM และดำเนินการจัดการกับผลิตภัณฑ์ดังกล่าวเหมาะสมหรือไม่ กรณีพบว่าสินค้าดังกล่าวไม่ปลอดภัย"],"(8) การดำเนินการ : Operation"],["8.9.4.2","➤ การประเมินเพื่อการปล่อย",["• เมื่อพบสินค้าไม่เป็นไปตามข้อกำหนดได้มีการประเมินผลสินค้าในล็อตนั้นๆ แล้วหรือไม่ • ผลิตภัณฑ์ที่พิจารณาแล้วว่าได้รับผลกระทบจากจุดวิกฤต (CCP) ที่ไม่เป็นไปตามกำหนด มีการดำเนินการจัดการตาม 8.9.4.3 หรือไม่ (เอาไป Reprocess/ Down Grade/ Destroy) • ผลิตภัณฑ์ที่พิจารณาแล้วว่าได้รับผลกระทบจากเกณฑ์การปฏิบัติ (OPRP) ที่ไม่เป็นตามกำหนด สามารถปล่อยเข้าสู่กระบวนการได้ แต่ต้องมีเอกสาร/การยืนยัน (a) มีหลักฐานอื่นนอกเหนือจากบันทึก (เช่น ผลการทวนสอบ, ผล Lab) เพื่อพิสูจน์ว่ามาตรการควบคุมนั้นยังคงมีประสิทธิภาพ (b…"],[],"(8) การดำเนินการ : Operation"],["8.9.4.3","➤ การจัดการกับผลิตภัณฑ์ที่ไม่เป็นไปตามข้อกำหนด",["• ผลิตภัณฑ์ที่ไม่สามารถปล่อยเข้าสู่กระบวนการได้ มีการดำเนินการจัดการโดยการนำไป Reprocess, Down Grade หรือ Destroy ใช่หรือไม่ และมีการบันทึกข้อมูลเป็นเอกสารที่ระบุถึงวิธีการดำเนินการจัดการ และบุคคลที่มีอำนาจในการดำเนินการครั้งนั้น"],[],"(8) การดำเนินการ : Operation"],["8.9.5","การถอน/ การเรียกคืน",["• ระบบการเรียกคืนผลิตภัณฑ์สามารถดำเนินการได้อย่างมีประสิทธิภาพหรือไม่ • มีการกำหนดขั้นตอนการปฏิบัติการดังต่อไปนี้หรือไม่ (a) การสื่อสารไปยังผู้มีส่วนได้ส่วนเสียที่เกี่ยวข้อง (ปกติจะแจ้งภายใน 3 วัน) (b) การจัดการกับผลิตภัณฑ์ที่เรียกคืน และที่ยังอยู่ในคลังสินค้า (c) การปฏิบัติตามลำดับขั้นตอนการเรียกคืนสินค้าที่กำหนดไว้อย่างถูกต้องและเป็นขั้นตอน • มีการจัดทำรายงานสรุป สาเหตุ ขอบเขต และผลลัพธ์ของการเรียกคืนสินค้า เพื่อนำเสนอต่อผู้บริหาร ระดับสูงในการประชุมทบทวนฝ่ายบริหาร (Management Review) หรือไม่…"],["- ตรวจ PM-QA-08: การควบคุมผลิตภัณฑ์ที่ไม่สอดคล้องกับข้อกำหนด - ตรวจว่ากำหนดใครเป็นผู้มีอำนาจในการดำเนินการ/ ทีมงานเรียกคืนมีประกาศไว้หรือไม่"],"(8) การดำเนินการ : Operation"],["9.1","การเฝ้าระวังติดตาม การวัด การวิเคราะห์ และการประเมินผล",[],[],"(9) การประเมินสมรรถนะ : Performance Evaluation"],["9.1.1","บททั่วไป",["• ได้มีการกำหนดว่า (a) สิ่งที่ต้องมีการตรวจติดตาม/ตรวจวัด (b) วิธีการตรวจ (c) ความถี่ในการตรวจติดตาม ตรวจวัด (d) ความถี่ในการประเมินผลของการตรวจวัดและตรวจติดตาม (e) ผู้รับผิดชอบในการประเมินผล • มีการจัดเก็บเอกสารและบันทึกอย่างเหมาะสม เพื่อใช้เป็นหลักฐานแสดงผลลัพธ์หรือไม่ • ได้ประเมินประสิทธิผล และประสิทธิภาพของระบบการจัดการความปลอดภัยของอาหาร (FSMS) หรือไม่"],["การเฝ้าระวังติดตาม(Monitoring) การวัด(Measurement) การวิเคราะห์(Analysis) และการประเมินผล(Evaluation)"],"(9) การประเมินสมรรถนะ : Performance Evaluation"],["9.1.2","การวิเคราะห์ และประเมินผล",["• องค์กรได้นำข้อมูลและสารสนเทศที่ได้จากผลการเฝ้าติดตาม การวัด กิจกรรมการทวนสอบ PRPs แผนการควบคุมอันตราย ตลอดจนผลการตรวจติดตามทั้งภายในและภายนอก มาทำการวิเคราะห์และประเมินผล เพื่อระบุแนวโน้มประสิทธิภาพของระบบ FSMS"],["- ถามหาเอกสารการประเมิน ส่วนใหญ่จะอยู่ในบันทึกการประชุมทบทวนบริหาร"],"(9) การประเมินสมรรถนะ : Performance Evaluation"],["9.2","การตรวจติดตามภายใน",[],[],"(9) การประเมินสมรรถนะ : Performance Evaluation"],["9.2.1","• ได้ดำเนินการตรวจติดตามภายในตามช่วงเวลาที่กำหนดไว้ในแผนหรือไม่",[],[],"(9) การประเมินสมรรถนะ : Performance Evaluation"],["9.2.2","• ตรวจสอบว่าองค์กรได้มีการ (a) ทำแผนการตรวจ ที่มีการระบุ ความถี่ วิธีการ ความรับผิดชอบ ข้อกำหนดในการวางแผนและการรายงานโปรแกรมการตรวจ (b) เกณฑ์และขอบเขตในการตรวจ (c) มีการคัดเลือกผู้ตรวจ (d) ผลการตรวจถูกจัดเก็บในรูปแบบเอกสาร และรายงานให้แก่ผู้เกี่ยวข้อง ผู้บริหาร รับทราบ (e) มีการกำหนดมาตรการแก้ไขแล…",[],[],"(9) การประเมินสมรรถนะ : Performance Evaluation"],["9.3","การทบทวนโดยฝ่ายบริหาร",[],[],"(9) การประเมินสมรรถนะ : Performance Evaluation"],["9.3.1","ทั่วไป",["• ตรวจผู้บริหารระดับสูง ได้ทำการทบทวนระบบการจัดการความปลอดภัยอาหาร (FSMS) ขององค์กรตามช่วงเวลาที่วางแผนไว้หรือไม่ เพื่อให้มั่นใจว่าระบบยังมีความเหมาะสมและมีประสิทธิภาพหรือไม่"],[],"(9) การประเมินสมรรถนะ : Performance Evaluation"],["9.3.2","วาระการทบทวนโดยฝ่ายบริหาร",["• ตรวจว่าการทบทวนโดยฝ่ายบริหารมีการพิจารณาตามหัวข้อกล่าวหรือไม่ (a) สถานะของการดำเนินการทบทวนก่อนหน้า (b) การเปลี่ยนแปลงทั้งภายในและนอก ที่เกี่ยวกับ FSMS/QMS (c) ผลการดำเนินงานในเรื่อง: ผลของกิจกรรมการปรับระบบให้ทันสมัย (4.4 กับ 10.3)/ ผลของการตรวจติดตามและตรวจวัด/ การวิเคราะห์ผลของการทวนสอบ PRP OPRP CCP (8.8.2)/ ความไม่สอดคล้อง การดำเนินการแก้ไขและป้องกัน/ ผลการตรวจประเมินจากภายในและภายนอก/ ผลการตรวจสอบ (กฎหมาย ข้อบังคับ ลูกค้า)/ สมรรถนะผู้ส่งมอบจากภายนอก/ การทบทวนความเสี่ยงและโอกาสและประสิทธิ…"],["ตรวจ PM-MR การทบทวนโดยฝ่ายบริหารว่าระบุครบตามวาระการประชุมมั้ย และตรวจเอกสารบันทึกการประชุม"],"(9) การประเมินสมรรถนะ : Performance Evaluation"],["9.3.3","ผลลัพธ์ของการทบทวนโดยฝ่ายบริหาร",["• ผลลัพธ์ของการทบทวนบริหาร ต้องประกอบด้วย (a) การตัดสินใจและการดำเนินการกับโอกาสในการปรับปรุงอย่างต่อเนื่อง (b) ความต้องการที่จะปรับปรุงและเปลี่ยนด้านระบบ FSMS รวมถึงด้านทรัพยากรที่จำเป็น","• มีการเก็บรักษาบันทึกหรือรายงาน ผลการประชุมทบทวนโดยฝ่ายบริหารไว้เป็นหลักฐานหรือไม่"],[],"(9) การประเมินสมรรถนะ : Performance Evaluation"],["10.1","สิ่งที่ไม่เป็นไปตามข้อกำหนด และกิจกรรมการแก้ไข",[],[],"(10) การปรับปรุง : Improvement"],["10.1.1","เมื่อมีความไม่สอดคล้องเกิดขึ้น มีการดำเนินการดังต่อไปนี้หรือไม่ (a) ตอบสนองต่อความไม่สอดคล้อง โดยการดำเนินทำกิจกรรมการควบคุมแก้ไข (b) ประเมินความต้องการในการดำเนินการกำจัดสาเหตุต่างๆของความไม่สอดคล้อง เพื่อไม่ให้เกิดขึ้น หรือไม่ (c) ดำเนินกิจกรรมที่จำเป็น (d) ทบทวนประสิทธิผลของการดำเนินกิจกรรมว่าสา…",[],[],"(10) การปรับปรุง : Improvement"],["10.1.2","มีการจัดเก็บเอกสารเพื่อเป็นหลักฐานการดำเนินการหรือไม่",[],[],"(10) การปรับปรุง : Improvement"],["10.2","การปรับปรุงอย่างต่อเนื่อง",["• องค์กรได้มีการปรับปรุงความเหมาะสม ความเพียงพอ และประสิทธิผลของระบบ FSMS อย่างต่อเนื่องหรือไม่","• ตรวจผู้บริหารว่ามีการปรับปรุงอย่างต่อเนื่องโดยใช้ การสื่อสาร (7.4) การทบทวนโดยฝ่ายบริหาร (9.3) การตรวจประเมินภายใน (9.2) การวิเคราะห์ผลของกิจกรรมการทวนสอบ (8.8.2) การวิเคราะห์ผลของกิจกรรมการทวนสอบ (8.5.3) Validation (8.9.3) การปฏิบัติการแก้ไข (Preventive การป้องกัน) และ (10.3) การปรับปรุงระบบ FSMS ให้ทันสมัย"],[],"(10) การปรับปรุง : Improvement"],["10.3","การปรับระบบ FSMS ให้ทันสมัย (เป็นปัจจุบัน)",["• ตรวจสอบว่ามีการประเมินระบบ FSMS ตามแผน โดยพิจารณาจาก (a) การสื่อสารภายในและภายนอก (7.4) (b) ข้อมูลอื่นๆที่เกี่ยวข้อง เช่น ข้อกำหนด กฎหมายที่มีการเปลี่ยนแปลง (c) ผลการวิเคราะห์และประเมินผล (9.1.2 ) (d) ผลจากการทบทวนฝ่ายบริหาร (9.3)","• กิจกรรมการปรับระบบ FSMS มีการจัดทำเป็นเอกสาร และใช้ในการทบทวนบริหารหรือไม่","1. คำนิยามของผลการตรวจสอบ - N/A: ข้อกำหนดดังกล่าวไม่เกี่ยวข้องกับพื้นที่ที่เข้าตรวจ - PASS (หรือ ü): มีการปฏิบัติตามข้อกำหนดอย่างครบถ้วน และถูกต้อง - OBS (Observation): ยังตรวจไม่พบข้อบกพร่อง หรือมีหลักฐานไม่เพียงพอ แต่ผู้ตรวจติดตามคาดว่าจะมีปัญหาในอนาคต หรือหน่วยงานสามารถปฏิบัติให้ได้ผลดีกว่าที่เป็นอยู่ได้ - MI (Minor): ตรวจพบข้อบกพร่องหรือความไม่สอดคล้องกับข้อกำหนดเล็กน้อย จำนวนไม่มาก ไม่รุนแรง ยังสามารถปฏิบัติตามข้อกำหนด/ มาตรฐานไว้อย่างถูกต้อง - MA (Major): ตรวจพบข้อบกพร่องหรือความไม่สอดคล้…"],[],"(10) การปรับปรุง : Improvement"]],"p":[["4.1","ข้อกำหนดทั่วไป",["• การออกแบบอาคารและการวางผังการผลิต มีการแบ่งแยกพื้นที่อย่างเหมาะสมเพื่อป้องกันการปนเปื้อนข้าม • โครงสร้างของตัวอาคารภานอก (ผนัง, พื้น, เพดาน) มีความแข็งแรง ทนทาน ไม่ก่อให้เกิดอันตรายต่อผลิตภัณฑ์ • มีแผนและการดำเนินการ บำรุงรักษาอาคาร อย่างสม่ำเสมอ เพื่อให้อาคารอยู่ในสภาพที่สมบูรณ์และปลอดภัย"],["- ตรวจแผนที่โรงงาน - ตรวจสภาพความสะอาดสมบูรณ์ของตัวอาคาร - แผนการบำรุงรักษาโครงสร้างอาคาร"],"(4) การก่อสร้างและแผนผังของตัวอาคาร : Construction and layout of buildings"],["4.2","สภาพแวดล้อม",["• มีการระบุและพิจารณาความเสี่ยงจากแหล่งปนเปื้อนทางสิ่งแวดล้อมโดยรอบโรงงาน ที่อาจส่งผลกระทบต่อพื้นที่ผลิตหรือไม่ และมีมาตรการป้องกันกำหนดไว้ • บริเวณที่ตั้งของอาคารผลิตอาหารไม่ได้อยู่ในพื้นที่เสี่ยงหรือพื้นที่ที่มีสารอันตรายรุนแรง • มีการทบทวนประสิทธิภาพของมาตรการป้องกันสิ่งปนเปื้อนภายนอกอย่างเป็นระยะ เพื่อให้มั่นใจว่ามาตรการยังคงใช้ได้ผล"],["- มีการวิเคราะห์ความเสี่ยงด้านสิ่งแวดล้อมมั้ย"],"(4) การก่อสร้างและแผนผังของตัวอาคาร : Construction and layout of buildings"],["4.3","ทำเลที่ตั้งของสถานที่ประกอบการ",["• มีการกำหนดขอบเขตของพื้นที่สถานประกอบการอย่างชัดเจน • มีการควบคุมการเข้า-ออก พื้นที่ เพื่อป้องกันการปนเปื้อนหรือบุคคลภายนอกที่ไม่ได้รับอนุญาต • โครงสร้างภายนอกและบริเวณโดยรอบสถานประกอบการได้รับการบำรุงรักษาให้อยู่ในสภาพที่ดี • มีการดูแล ตัดหญ้า และกำจัดวัชพืช รอบอาคาร อย่างสม่ำเสมอเพื่อไม่ให้เป็นที่อยู่อาศัยของสัตว์พาหะ • มีการตรวจสอบและบำรุงรักษาระบบระบายน้ำที่มีประสิทธิภาพเพื่อป้องกันน้ำท่วมขัง"],["- มีรั้ว/ การแบ่งขอบเขตของโรงงานชัดเจน - PM-HR การรักษาความปลอดภัยในโรงงาน - ตรวจสอบทางกายภาพ - แผนผังของทางระบายน้ำ"],"(4) การก่อสร้างและแผนผังของตัวอาคาร : Construction and layout of buildings"],["5.1","ข้อกำหนดทั่วไป",["• เส้นทางการไหลของกระบวนการสามารถป้องกันการปนเปื้อนข้าม • มีการแบ่งแยกพื้นที่ชัดเจนเพื่อป้องกันโอกาสการปนเปื้อน"],["- ตรวจ Plant Layout ของพื้นที่กระบวนการผลิต"],"(5) แผนผังของสถานที่และพื้นที่ในการทำงาน : Layout of premises and workspace"],["5.2","การออกแบบภายใน แผนผัง และการกำหนดเส้นการเดินทาง",["• ตัวอาคารผลิต (พื้น, ผนัง, เพดาน และหลังคา) มีความแข็งแรง ทนทานอยู่ในสภาพที่ได้รับการบำรุงรักษาอย่างเหมาะสม ไม่ชำรุด และระบบหลังคา สามารถระบายน้ำได้เองโดยไม่เกิดน้ำขัง • มีการแบ่งแยกพื้นที่ ระหวางพื้นที่จัดเก็บวัถุดิบ ออกจากพื้นที่จัดเก็บผลิตภัณฑ์ และพื้นที่การผลิตอย่างชัดเจน เพื่อป้องกันโอกาสการเกิดปนเปื้อนข้าม"],[],"(5) แผนผังของสถานที่และพื้นที่ในการทำงาน : Layout of premises and workspace"],["5.3","แผนผังของสถานที่และพื้นที่ในการทำงาน",["• ผนังและพื้นในพื้นการผลิตทำจากวัสดุที่ทนทานต่อสารเคมี/ วิธีการทำความสะอาด ล้างทำความสะอาดง่าย และรอยต่อระหว่างพื้นที่กับผนังควรเป็นลักษณะมุมโค้ง เพื่อป้องกันการสะสมของสิ่งสกปรก • พื้นในพื้นที่ผลิตมีการออกแบบให้มีความลาดเอียงที่เหมาะสม เพื่อป้องกันน้ำท่วมขัง และท่อระบายน้ำมีฝาปิดที่มิดชิด • เพดานและอุปกรณ์ที่ติดตั้งอยู่เหนือศรีษะ ต้องถูกออกแบบและดูแลรักษาเพื่อลดการสะสมของฝุ่น และไม่มีการควบแน่นของหยดน้ำ • มีการติดตั้งมุ้งลวดหรือม่านริ้วพลาสติก เพื่อป้องกันสัตว์พาหะเข้าสู่พื้นที่ผลิต"],[],"(5) แผนผังของสถานที่และพื้นที่ในการทำงาน : Layout of premises and workspace"],["5.4","ตำแหน่งของเครื่องจักรอุปกรณ์",["• เครื่องจักรอุปกรณ์ทั้งหมด ถูกออกแบบและติตตั้งในตำแหน่งที่เว้นระยะห่างเหมาะสม ไม่ติดผนังหรือชิดกันจนเกินไป เพื่อให้สามารถปฏิบัติงาน ตรวจสอบ การทำความสะอาดและการซ่อมบำรุงได้อย่างมีประสิทธิภาพ"],[],"(5) แผนผังของสถานที่และพื้นที่ในการทำงาน : Layout of premises and workspace"],["5.5","สิ่งอำนวยความสะดวกในห้องปฏิบัติการ",["• ห้องปฏิบัติการ (โดยเฉพาะด้านจุลชีววิทยา) มีตำแหน่งที่ตั้ง การออกแบบ และขั้นตอนงานที่ป้องกันการปนเปื้อนข้ามสู่พื้นที่ผลิต พนักงาน หรือผลิตภัณฑ์ และไม่มีประตูเปิดตรงสู่ไลน์ผลิต"],[],"(5) แผนผังของสถานที่และพื้นที่ในการทำงาน : Layout of premises and workspace"],["5.6","สิ่งปลูกสร้างชั่วคราว หรือที่สามารถเคลื่อนย้ายได้",["• สิ่งปลูกสร้างชั่วคราว มีการประเมินอันตรายจัดตั้งในทำเลที่เหมาะสม และควบคุมไม่ให้เป็นแหล่งอาศัยของสัตว์พาหนะหรือปนเปื้อนสู่ผลิตภัณฑ์"],[],"(5) แผนผังของสถานที่และพื้นที่ในการทำงาน : Layout of premises and workspace"],["5.7","การเก็บรักษาวัตถุดิบ ส่วนผสม บรรจุภัณฑ์ สารเคมี และผลิตภัณฑ์",["• มีการป้องกันไม่ให้เกิดการปนเปื้อน • พื้นที่เก็บต้องแห้ง มีระบบระบายอากาศที่ดี มีการตรวจสอบและควบคุมอุณหภูมิและความชื้นตามที่กำหนด • วัตถุดิบและผลิตภัณฑ์ต้องเก็บให้สูงจากพื้น และเว้นช่องว่างออกจากผนัง • พื้นที่เก็บรักษาอุปกรณ์ทำความสะอาด สารเคมี และสารอันตรายอื่นๆ มีการแบ่งแยกพื้นที่เฉพาะ • พื้นที่เก็บต้องมีการบำรุงรักษา ทำความสะอาด แบ่งแยกพื้นที่เก็บชัดเจน และมีระบบความปลอดภัย เช่น กุญแจล็อค/ ควบคุมการเข้าออก"],[],"(5) แผนผังของสถานที่และพื้นที่ในการทำงาน : Layout of premises and workspace"],["6.1","ข้อกำหนดทั่วไป",["• เส้นทางการแจกจ่ายและคุณภาพของระบบสาธารณูปโภค ที่ส่งไปยังกระบวนการผลิต และพื้นที่เก็บรักษา ได้ถูกออกแบบและตรวจสอบอย่างม่ำเสมอ เพื่อมั่นใจว่าปลอดภัยและไม่เสี่ยงต่อการปนเปื้อนสู่ผลิตภัณฑ์"],[],"(6) สาธารณูปโภค - อากาศ น้ำ พลังงาน : Utilities - air, water, energy"],["6.2","น้ำใช้",["• ปริมาณน้ำเพียงพอต่อความต้องการในกระบวนการผลิต • น้ำบริโภค/ น้ำ น้ำแข็ง ไอน้ำ ในกระบวนการ ต้องมีคุณภาพตามมาตรฐานและข้อกำหนดทางจุลินทรีย์ • มีแผนการสุ่มตรวจ และผลวิเคราะห์ทางจุลชีววิทยาของน้ำที่สัมผัสอาหาร • กรณีที่มีการเติมคลอรีนในน้ำ มีกำหนดเกณฑ์มาตรฐานปริมาณคลอรีนหลงเหลือไว้อย่างชัดเจน และมีการบันทึกผลการตรวจสอบปริมาณคลอรีนหลงเหลือในน้ำอย่างสม่ำเสมอ • มีการแยกชัดเจนระหว่างน้ำบริโภค และน้ำใช้ชัดเจน • ท่อน้ำสำหรับส่วนที่สัมผัสกับผลิตภัณฑ์ ถูกออกแบบให้มีการไหลเวียนของน้ำที่ดี ไม่มีจุดอับน้ำที่อ…"],["- PM-QA-05: การวิเคราะห์นํ้าที่ใช้ภายในบริษัท - PM-EN-03: ระบบผลิตไอน้ำ - PM-EN-04: ระบบบําบัดน้ำเสีย - PM-EN-05: ระบบผลิตน้ำ - แผนผังการจ่ายน้ำ/ แผนผังการบำบัดน้ำ ฉบับปัจจุบัน - น้ำบริโภค/ น้ำ น้ำแข็ง ไอน้ำ ในกระบวนการ ต้องมีคุณภาพตามมาตรฐานและข้อกำหนดทางจุลินทรีย์ // ต้องตรวจสอบคลอรีนปลายสาย (STD. 0.2 - 0.5 ppm) - มีการบ่งชี้ท่อให้ชัดเจน"],"(6) สาธารณูปโภค - อากาศ น้ำ พลังงาน : Utilities - air, water, energy"],["6.3","สารเคมีที่ใช้สำหรับหม้อกำเนิดไอน้ำ",["• หากมีการใช้ต้องมั่นใจว่า สารเคมีดังกล่าวได้รับการรับรองว่าเป็น Food Grade หรือ ได้รับการรับรองว่าปลอดภัยสำหรับใช้ในอาหาร • มีการแยกพื้นที่จัดเก็บเป็นสัดส่วนชัดเจน และมีระบบควบคุมความปลอดภัย (เช่น การปิดล็อคห้อง/ตู้จัดเก็บ หรือควบคุมการเข้า-ออกโดยผู้รับผิดชอบ)"],["- สารเคมีที่ใช้สำหรับ Boiler ต้องแยกเก็บชัดเจน มีการล็อคกุญแจป้องกัน และมี MSDS ติดกำกับ"],"(6) สาธารณูปโภค - อากาศ น้ำ พลังงาน : Utilities - air, water, energy"],["6.4","คุณภาพของอากาศและระบบระบายอากาศ",["• มีการกำหนดข้อกำหนดสำหรับการกรองอากาศ ความชื้นของอากาศ ค่าจุลชีววิทยา และบันทึกผลการตรวจวิเคราะห์เชื้อจุลินทรีย์ในอากาศ • ระบบระบายอากาศ (โดยธรรมชาติ หรือการใช้เครื่องจักร) ต้องสามารถกำจัดไอน้ำส่วนเกิน และกลิ่นออกไปได้ และมีการบำรุงรักษาให้คงสามารถประสิทธิภาพไว้ • ทิศทางการไหลของอากาศต้องไหลจากพื้นที่ Low Risk ไปยังพื้นที่ High Risk เพื่อป้องกันการปนเปื้อนข้าม"],["- SP-QA-07: แผนการตรวจสอบเชื้อบนพื้นผิว,เชื้อในอากาศ และแผนการตรวจสอบ ตรวจสอบโปรตีนตกค้างหลังทำความสะอาด - แผนผัง Flow แสดงการไหลเวียนของอากาศในกระบวนการผลิต"],"(6) สาธารณูปโภค - อากาศ น้ำ พลังงาน : Utilities - air, water, energy"],["6.5","การอัดอากาศหรือก๊าซอื่นๆ",["• ระบบอัดอากาศและระบบก๊าซอื่นๆ ที่ใช้ในกระบวนการผลิตหรือสัมผัสผลิตภัณฑ์ ต้องมีเอกสารรับรองมาตรฐานสัมผัสอาหาร (Food Grade) จากแหล่งผลิตที่น่าเชื่อถือ และมีการควบคุม กำหนดพารามิเตอร์ในการตรวจสอบ • ในกรณีที่เครื่องอัดอากาศมีการใช้น้ำมันหล่อลื่นและลมนั้นมีโอกาสสัมผัสผลิตภัณฑ์ น้ำมันดังกล่าวต้องเป็นเกรดสำหรับอาหาร (Food Grade)"],["- วิธีการตรวจสอบก๊าซไนโตรเจนที่ใช้ในกุ้งทอด - มาตรฐานก๊าซไนโตรเจน - ปั๊มลมมีการตรวจสอบและบำรุงรักษาหรือไม่"],"(6) สาธารณูปโภค - อากาศ น้ำ พลังงาน : Utilities - air, water, energy"],["6.6","แสงสว่าง",["• มีการจัดให้มีแสงสว่างที่มีความเข้มของแสงเหมาะสมตามลักษณะประเภทของการปฏิบัติงาน • หลอดไฟที่ติดตั้งในบริเวณผลิต คลังสินค้า หรือจุดที่มีความเสี่ยง มีมาตรการป้องกันการแตกกระจาย (เช่นมีฝาครอบ) เพื่อมั่นใจว่า จะไม่เกิดการปนเปื้อนเศษแก้วสู่วัตถุดิบผลิตภัณฑ์"],[],"(6) สาธารณูปโภค - อากาศ น้ำ พลังงาน : Utilities - air, water, energy"],["7.1","ข้อกำหนดทั่วไป",["• มีระบบในการจัดการของเสียที่ครอบคลุมตั้งแต่การชี้บ่ง การเก็บรวบรวม การเคลื่อนย้าย และการกำจัดอย่างเหมาะสม"],["- PM-EV-06: การจัดการขยะมูลฝอยและของเสียอันตราย - สัญญาการทำบริการขนถ่ายขยะ/ บันทึกการขนถ่ายขยะ"],"(7) การกำจัดของเสีย : Waste disposal"],["7.2","ภาชนะบรรจุสำหรับของเสียและสิ่งไม่สามารถกินได้หรือสารอันตราย",["• มีการระบุและบ่งชี้วัตถุประสงค์ในการใช้งานอย่างชัดเจน (เช่น ติดป้ายเตือน, แยกสีถัง) เพื่อป้องกันการนำไปใช้ผิดประเภท • ระบุตำแหน่งการวางไว้ตามแผนผังอย่างเป็นสัดส่วน • ทำจากวัสดุที่มีความแข็งแรง ทนทาน ไม่ดูดซับน้ำ ง่ายต่อการทำความสะอาด • มีการปิดฝาภาชนะบรรจุของเสียหรือสารอันตรายทันทีในเวลาที่ไม่ได้ใช้งาน • ในจุดจัดเก็บของเสียหรือสารอันตรายที่มีความเสี่ยงจะปนเปื้อนสู่อาหาร (เช่น ห้องเก็บสารเคมี หรือถังเก็บขยะอันตรายใกล้ไลน์ผลิต) มีระบบการปิดล็อคอย่างแน่นหนา"],["- แผนผังเส้นทางการนำออกของของเสีย - แผนผังจุดวางถังขยะแต่ละประเภท"],"(7) การกำจัดของเสีย : Waste disposal"],["7.3","การจัดการและการกำจัดของเสีย",["• มีการกำหนดพื้นที่และแบ่งโซนสำหรับจัดเก็บขยะ/ของเสียออกจากพื้นที่จัดเก็บวัตถุดิบและสินค้าอย่างชัดเจน • มีการควบคุมดูแลไม่ให้มีขยะสะสมในไลน์ผลิตหรือคลังสินค้า • ฉลาก ผลิตภัณฑ์ หรือบรรจุภัณฑ์ที่มีตราสินค้าที่กลายเป็นของเสีย ได้ถูกทำให้เสียรูปทรงหรือทำลายทิ้งก่อน เพื่อป้องกันการนำกลับมาใช้ซ้ำ"],["- WI-PD-17: การจัดการของเสียจากการผลิต - บันทึกการอบรมการกำจัดขยะ"],"(7) การกำจัดของเสีย : Waste disposal"],["7.4","ท่อระบายน้ำและการระบายน้ำ",["• ท่อระบายน้ำและรางระบายน้ำในพื้นที่ผลิตเพียงพอต่อการระบายน้ำ ไม่ทำให้เกิดน้ำท่วมขังหรือเอ่อล้นในระหว่างกระบวนการผลิตและทำความสะอาด • ทิศทางการไหลของน้ำภายในท่อหรือรางระบายน้ำ ได้รับการออกแบบให้ไหลจากพื้นที่ Low Risk ไปยังพื้นที่ High Risk และไม่ไหลย้อนกลับ"],[],"(7) การกำจัดของเสีย : Waste disposal"],["8.1","ข้อกำหนดทั่วไป",["• อุปกรณ์ที่สัมผัสกับอาหารต้องถูกออกแบบให้ง่ายต่อการทำความสะอาด ฆ่าเชื้อ และการบำรุงรักษา • ทำจากวัสดุที่ทนต่อการทำความสะอาดซ้ำๆ ไม่เกิดปฏิกิริยาที่ส่งผลต่อผลิตภัณฑ์"],[],"(8) ความเหมาะสมของอุปกรณ์ การทำความสะอาด และการบำรุงรักษา : Equipment suitability, cleaning and maintenance"],["8.2","การออกแบบให้ถูกสุขลักษณะ",["• พื้นผิวต้องเรียบ ทำความสะอาดได้ง่าย ในพื้นที่การผลิตที่เปียกต้องสามารถระบายน้ำได้เอง • วัสดุที่ใช้ไม่ทำปฏิกิริยากับตัวผลิตภัณฑ์อาหาร ทนทานต่อการกัดกร่อนของสารเคมีและน้ำยาที่ใช้ในขั้นตอนการล้างทำความสะอาด • โครงสร้างของเครื่องจักรไม่มีส่วนที่เป็นหลุม บ่อ รอยเจาะลึก ซึ่งอาจกลายเป็นจุดอับสะสมของสิ่งสกปรก • ท่อและระบบท่อต้องสามารถทำความสะอาดได้ ไม่มีการสะสมของสิ่งสกปรก"],[],"(8) ความเหมาะสมของอุปกรณ์ การทำความสะอาด และการบำรุงรักษา : Equipment suitability, cleaning and maintenance"],["8.3","พื้นผิวที่สัมผัสกับผลิตภัณฑ์",["• พื้นผิวของวัสดุและอุปกรณ์ทุกชนิดที่ต้องสัมผัสกับผลิตภัณฑ์โดยตรง ได้รับการออกแบบและผลิตขึ้นจากวัสดุสำหรับอาหาร (Food Grade) ซึ่งมีคุณสมบัติทนทาน ไม่เป็นสนิม ไม่เกิดการกัดกร่อน และน้ำหรือของเหลวไม่สามารถซึมผ่านได้ (Non-absorbent)"],["- เอกสารที่ยืนยันว่าสามารถสัมผัสกับอาหาร/ ใช้งานกับอาหารได้"],"(8) ความเหมาะสมของอุปกรณ์ การทำความสะอาด และการบำรุงรักษา : Equipment suitability, cleaning and maintenance"],["8.4","อุปกรณ์ควบคุมอุณหภูมิและอุปกรณ์สำหรับตรวจสอบ",["• อุปกรณ์หรือเครื่องจักรที่ใช้สำหรับให้ความร้อน/ แช่เยือกแข็ง สามารถเพิ่ม/ลดระดับอุณหภูมิได้ถึงเกณฑ์ และสามารถคงสภาวะอุณหภูมิไว้ได้อย่างเสถียรตามข้อกำหนดที่เกี่ยวข้องกับผลิตภัณฑ์ • มีการติดตั้งอุปกรณ์สำหรับเฝ้าตรวจติดตามและควบคุมอุณหภูมิ ที่มีการสอบเทียบตามแผน"],[],"(8) ความเหมาะสมของอุปกรณ์ การทำความสะอาด และการบำรุงรักษา : Equipment suitability, cleaning and maintenance"],["8.5","การทำความะอาดโรงงาน เครื่องมือ เครื่องใช้และอุปกรณ์",["• โปรแกรมทำความสะอาด ต้องระบุ รายการเครื่องมือเครื่องจักรอุปกรณ์ที่ต้องทำความสะอาดให้ครบถ้วน, ผู้รับผิดชอบ, วิธีการทำความสะอาดและฆ่าเชื้อ, วิธีการทวนสอบ, ความถี่ในการทำความสะอาดและการทวนสอบ"],["SP-PD-07: โปรแกรมทำความสะอาด"],"(8) ความเหมาะสมของอุปกรณ์ การทำความสะอาด และการบำรุงรักษา : Equipment suitability, cleaning and maintenance"],["8.6","การบำรุงรักษาเชิงป้องกันและแก้ไข",["• มีการจัดทำโปรแกรมการบำรุงรักษาเชิงป้องกัน ที่ครอบคลุมอุปกรณ์ตรวจติดตาม/ควบคุม อันตรายทั้งหมด และมีการให้ความสำคัญเร่งด่วนกับการแจ้งซ่อมในจุดที่ส่งผลกระทบต่อความปลอดภัยของผลิตภัณฑ์ • มีการควบคุม สุขอนามัยในกิจกรรมซ่อมบำรุง อย่างถูกต้องเพื่อป้องกันการปนเปื้อน (เช่น เปลี่ยนการซ่อมชั่วคราวเป็นถาวรตามแผน, ใช้น้ำมันหล่อลื่น Food Grade ในจุดที่มีความเสี่ยง, ทำความสะอาดและฆ่าเชื้อเครื่องมือที่ซ่อมเสร็จก่อนนำกลับไปใช้ และพนักงานซ่อมบำรุงผ่านการฝึกอบรมด้านความปลอดภัยของอาหาร"],["- PM-EN-01: การดำเนินงานแผนกซ่อมบำรุง - PM-EN-06: การดำเนินงานแผนกบำรุงรักษา - PM-EN-07: การดำเนินงานแผนกซ่อมบำรุงไฟฟ้า - มาตรการดำเนินการกรณีต้องมีการซ่อมแบบชั่วคราว - การทำความสะอาดและตรวจสอบความสะอาดก่อนดำเนินการส่งงาน"],"(8) ความเหมาะสมของอุปกรณ์ การทำความสะอาด และการบำรุงรักษา : Equipment suitability, cleaning and maintenance"],["9.1","ข้อกำหนดทั่วไป",["• มีการควบคุมการจัดซื้อวัตถุดิบที่มีผลกระทบต่อความปลอดภัยของอาหาร เพื่อให้มั่นใจว่าผู้ส่งมอบมีความสามารถตามเกณฑ์ที่กำหนด และมีการทวนสอบวัตถุดิบรับเข้าให้สอดคล้องกับข้อกำหนดการจัดซื้อที่ระบุไว้"],[],"(9) การบริหารจัดการทางด้านการจัดซื้อวัตถุดิบ : Management of purchased materials"],["9.2","การคัดเลือกและบริหารจัดการผู้ขาย",["• มีการกำหนดกระบวนการคัดเลือก อนุมัติ เฝ้าติดตามผู้ขาย • กระบวนการที่ใช้ต้องพิสูจน์ว่าถูกต้องโดยการประเมินอันตราย และความเสี่ยงที่อาจเกิดขึ้น และต้องรวมถึง (a) ประเมินว่า Supplier มีความสามารถในการควบคุมด้านคุณภาพและความปลอดภัยอาหาร (b) รายละเอียดวิธีการประเมินผู้ขาย สามารถทำได้โดย Audit Supplier/ เอกสาร ใบรับรองจากหน่วยงานที่น่าเชื่อถือ/ การส่ง Questionaire ในกรณีที่พิจารณาแล้วว่ามีความเสี่ยงต่ำ (c) การตรวจติดตามการดำเนินการของผู้ขายเพื่อให้มั่นใจอย่างต่อเนื่อง เช่น การขอผลและใบเซอร์ประจำปี, ต…"],["- PM-PR-01: กระบวนการจัดซื้อวัตถุดิบ - PM-PR-02: การคัดเลือกและการขึ้นทะเบียนผู้ขายวัตถุดิบ - PM-PU-01: กระบวนการจัดซื้อส่วนสนับสนุนการผลิต - PM-PU-02: การคัดเลือกประเมินผู้ขายและให้บริการ - บันทึกการประเมินความเสี่ยงของแต่ละ Supplier - ตรวจเกณฑ์การประเมินว่าแต่ละระดับมีการดำเนินการควบคุม Supplier ยังไง"],"(9) การบริหารจัดการทางด้านการจัดซื้อวัตถุดิบ : Management of purchased materials"],["9.3","มาตรฐานการรับวัตถุดิบ (วัตถุดิบ/ ส่วนผสม/ บรรจุภัณฑ์)",["• มีขั้นตอนการปฏิบัติงานที่เป็นเอกสารในการตรวจสอบรถขนส่ง (ทั้งก่อนและระหว่างถ่ายสินค้า) รวมถึงการตรวจสอบ/ทดสอบวัตถุดิบและใบ COA ก่อนการรับเข้า เพื่อทวนสอบความสอดคล้องตามมาตรฐาน • กรณีรับวัตถุดิบในปริมาณมากต้องมีการชี้บ่ง และปิดล็อคไว้ โดยสามารถนำไปใช้ได้หลังจากที่ผลการตรวจผ่าน • ถ้าผลตรวจพบว่าไม่สอดคล้องตามาตรฐานต้องมีวิธีการจัดการที่กำหนดไว้เป็นเอกสาร"],[],"(9) การบริหารจัดการทางด้านการจัดซื้อวัตถุดิบ : Management of purchased materials"],["10.1","ข้อกำหนดทั่วไป",["• ต้องจัดทำโปรแกรมเพื่อป้องกัน ควบคุม การปนเปื้อนด้านกายภาพ สารก่อภูมิแพ้ และการปนเปื้อนด้านจุลชีววิทยา"],[],"(10) มาตการควบคุมเพื่อป้องกันการปนเปื้อนข้าม : Measures for prevention of cross contamination"],["10.2","การปนเปื้อนข้ามทางด้านจุลชีววิทยา",["• บริษัทมีการแบ่งแยกพื้นที่วัตถุดิบออกจากผลิตภัณฑ์ • พื้นที่ที่มีความเสี่ยงสูงมีการป้องกันด้วยการแบ่งแยกโดยโครงสร้าง เช่น มีการกั้นทางกายภาพ การสร้างผนัง หรือการแยกอาคารออกจากกันอย่างชัดเจน • มีการควบคุมเส้นทางการเข้าออกของพนักงานอย่างเป็นระบบ รวมถึงมีข้อกำหนดให้เปลี่ยนชุดทำงาน/รองเท้า หรือปฏิบัติกำหนดการแต่งกายตามความจำเป็นของแต่ละพื้นที่ • มีการกำหนดทิศทางการเดินของพนักงานและวัตถุดิบ และการแยกใช้เครื่องมือ อุปกรณ์หรือพนักงานเพื่อป้องกันการปนเปื้อนข้าม • การออกแบบและควบคุมระบบความดันอากาศหรือท…"],[],"(10) มาตการควบคุมเพื่อป้องกันการปนเปื้อนข้าม : Measures for prevention of cross contamination"],["10.3","การจัดการกับสารก่อภูมิแพ้",["• กรณีที่ผลิตภัณฑ์มีสารก่อภูมิแพ้ต้องมีการบ่งชี้ไว้บนฉลากเพื่อเตือนผู้บริโภค หรือระบุในเอกสารประกอบสำหรับนำไปแปรรูปต่ออย่างชัดเจน • การกำหนดมาตรการป้องกันการปนเปื้อนข้ามกับสารก่อภูมิแพ้โดยไม่ตั้งใจ ในขั้นตอนการทำความสะอาด การเปลี่ยนแผนปฏิบัติงานระหว่างสายการผลิต • พนักงานด้รับการอบรมเกี่ยวกับความตระหนักในสารก่อภูมิแพ้ และการปฏิบัติงานที่เกี่ยวข้อง"],["- PM-QA-10: การควบคุมสารก่อภูมิแพ้ (เพิ่ม Allergen List) - บันทึกอบรมเกี่ยวกับสารก่อภูมิแพ้ประจำปี - แบบสอบถามเกี่ยวกับ Allergen (ตรวจสอบว่า Supplier มีการกรอกแบบฟอร์ม FM-PU-10 หรือไม่)"],"(10) มาตการควบคุมเพื่อป้องกันการปนเปื้อนข้าม : Measures for prevention of cross contamination"],["10.4","การปนเปื้อนทางกายภาพ",["• มีการจัดทำทะเบียนและข้อกำหนดในการตรวจสอบวัสดุที่แตกเปราะง่าย (เช่น แก้ว พลาสติกแข็ง) พร้อมทั้งมีขั้นตอนปฏิบัติงานกรณีเกิดการแตกหักเสียหาย • มีการติดตั้งและตรวจสอบการทำงานของอุปกรณ์ตรวจจับหรือกำจัด เช่น เครื่องตรวจจับโลหะ • มีมาตรการควบคุมแหล่งที่มีโอกาสปนเปื้อนทางกายภาพอื่นๆ เช่น เสื้อคลุม/ชุดแต่งกายของพนักงาน และอุปกรณ์ที่นำเข้ามาใช้ในพื้นที่ผลิต"],["- WI-QC-18: การควบคุมแก้วและพลาสติกแข็งในกระบวนการผลิต - SP-QC-12: ทะเบียนและแผนผังแก้วพลาสติกในไลน์ผลิต - การประเมินความเสี่ยงของอุปกรณ์ในกระบวนการผลิต"],"(10) มาตการควบคุมเพื่อป้องกันการปนเปื้อนข้าม : Measures for prevention of cross contamination"],["11.1","ข้อกำหนดทั่วไป",["• โปรแกรมในการทำความสะอาดและการฆ่าเชื้อต้องมั่นใจว่าเครื่องมือ เครื่องจักร อุปกรณ์ และสภาพแวดล้อมของกระบวนการผลิตถูกสุขลักษณะ ได้รับการบำรุงรักษาอย่างต่อเนื่อง"],[],"(11) การทำความสะอาดและการฆ่าเชื้อโรค : Cleaning and sanitizing"],["11.2","การทำความสะอาด และสารฆ่าเชื้อและเครื่องมือ",["• สิ่งอำนวยความสะดวกและอุปกรณ์ต่างๆ มีการบำรุงรักษาให้อยู่ในสภาพที่ง่ายต่อการทำความสะอาด • สารทำความสะอาด สารฆ่าเชื้อ และสารเคมี ต้องมีการรับรองจากหน่วยงานที่น่าเชื่อถือว่าสามารถใช้ได้กับอุตสาหกรรมอาหาร • เครื่องมือและอุปกรณ์ในกระบวนการผลิต ได้รับการออกแบบให้ถูกสุขลักษณะและได้รับการบำรุงรักษาให้อยู่ในสภาพที่ดี เพื่อไม่ให้เป็นแหล่งสะสมของสิ่งที่ไม่พึงประสงค์"],["- ดู SP-QA ทะเบียนสารเคมีที่ใช้ในกระบวนการผลิต - สุ่มขอ MSDS/ ใบรับรอง มีการควบคุมการเบิกจ่าย - เอกสารที่ยืนยันว่าอุปกรณ์ต่างๆสามารถสัมผัสกับอาหาร/ ใช้งานกับอาหารได้ - วิธีการเตรียมสารเคมี สารทำความสะอาด คลอรีน - สุ่มดูว่าพวกสารเคมี สารทำความสะอาดในพื้นที่จัดเก็บและในไลน์มีติดป้ายบ่งชี้มั้ย"],"(11) การทำความสะอาดและการฆ่าเชื้อโรค : Cleaning and sanitizing"],["11.3","โปรแกรมการทำความสะอาดและการฆ่าเชื้อโรค",["• ต้องมีการยืนยันความใช้ได้ของแผนการทำความสะอาด • ในโปรแกรมการทำความสะอาดต้องมีการระบุ (a) ทำความสะอาดอะไร (b) ผู้รับผิดชอบ (c) วิธีการทำความสะอาดและฆ่าเชื้อ (d) ความถี่ในการทำความสะอาด (e) การเฝ้าตรวจติดตามและแผนทวนสอบ (f) การตรวจสอบหลังทำความสะอาด/ ก่อนเริ่มการผลิต"],["- SP-PD-07: โปรแกรมทำความสะอาด - ตรวจบันทึกการทำความสะอาด - SP-QA-07: แผนการตรวจสอบเชื้อบนพื้นผิว,เชื้อในอากาศ และแผนการตรวจสอบ ตรวจสอบโปรตีนตกค้างหลังทำความสะอาด // ผล Swab-Air Test"],"(11) การทำความสะอาดและการฆ่าเชื้อโรค : Cleaning and sanitizing"],["11.4","การทำความสะอาดภายในระบบปิด ที่ไม่สามารถถอดชิ้นส่วนออกมาเพื่อทำความสะอาดได้ (CIP)",["• ระบบการทำความสะอาดแบบ CIP มีการแยกออกจากสายการผลิตที่ใช้งานอยู่อย่างชัดเจนเพื่อป้องกันการปนเปื้อน พร้อมทั้งมีการกำหนดและตรวจติดตามตัวแปรสำคัญ (ชนิด ความเข้มข้น ระยะเวลา และอุณหภูมิของสารเคมี) อย่างถูกต้อง"],[],"(11) การทำความสะอาดและการฆ่าเชื้อโรค : Cleaning and sanitizing"],["11.5","การเฝ้าตรวจติดตามประสิทธิภาพของการสุขาภิบาล",["• มีการกำหนดแผนการทำความสะอาดและการสุขาภิบาลสำหรับเฝ้าตรวจติดตามตามความถี่ที่กำหนด เพื่อสร้างความมั่นใจว่าการดำเนินงานมีความต่อเนื่อง เหมาะสม และมีประสิทธิภาพ"],["- การวิเคราะห์แนวโน้มผล Swab-Air Test ว่าตามแผนที่เรากำหนดนั้นยังคงมีประสิทธิภาพหรือไม่"],"(11) การทำความสะอาดและการฆ่าเชื้อโรค : Cleaning and sanitizing"],["12.1","ข้อกำหนดทั่วไป",["• มีการนำวิธีการปฏิบัติในเรื่องสุขลักษณะ, การทำความสะอาด, การตรวจรับวัตถุดิบ และระบบการตรวจติดตาม ไปลงมือปฏิบัติจริงเพื่อหลีกเลี่ยงการสร้างสิ่งแวดล้อมที่ดึงดูดหรือเอื้อต่อการเข้ามาของสัตว์พาหะนำโรค"],[],"(12) การควบคุมสัตว์รบกวน : Pest Control"],["12.2","โปรแกรมการควบคุมสัตว์รบกวน",["• มีการแต่งตั้งบุคคลภายในเพื่อรับผิดชอบดำเนินการควบคุมสัตว์พาหะ และ/หรือประสานงานร่วมกับผู้รับเหมาที่เป็นผู้เชี่ยวชาญจากภายนอกอย่างเป็นทางการ • มีการจัดทำแผนการจัดการสัตว์พาหะ และการฝึกอบรมพนักงาน • มีการระบุรายการสารเคมีกำจัดสัตว์รบกวนทั้งหมดที่ใช้ และสารเคมีเหล่านั้นได้รับการอนุมัติอย่างถูกต้องเพื่อนำมาใช้เฉพาะในพื้นที่ที่กำหนดไว้"],["- ประกาศแต่งตั้ง - WI-QC-20: การควบคุมสัตว์พาหะ"],"(12) การควบคุมสัตว์รบกวน : Pest Control"],["12.3","การป้องกันการเข้ามาของสัตว์รบกวน",["• ตัวอาคารได้รับการบำรุงรักษาให้อยู่ในสภาพดี โดยช่องว่าง รอยแตก ท่อระบายน้ำ หรือทางเข้าอื่นๆ ที่สัตว์พาหะมีโอกาสหลุดรอดเข้ามา ได้รับการปิดสนิทหรือติดตั้งอุปกรณ์ป้องกัน (เช่น ตะแกรงดักหนู) อย่างเหมาะสม • ประตู หน้าต่าง หรือช่องเปิดระบายอากาศ ได้รับการออกแบบ ติดตั้ง และควบคุม (เช่น การติดตั้งม่านริ้วพลาสติก หรือมุ้งลวดกันแมลง) เพื่อลดโอกาสที่สัตว์พาหะจะเข้ามาภายในพื้นที่ผลิต"],[],"(12) การควบคุมสัตว์รบกวน : Pest Control"],["12.4","ที่พักและการเข้าอยู่อาศัย",["• มีการออกแบบพื้นที่จัดเก็บเพื่อลดการเป็นแหล่งอาหารและน้ำแก่สัตว์พาหะ รวมถึงมีการกำจัดแหล่งที่อาจเป็นที่พักอาศัยของสัตว์พาหะ (เช่น โพรง พุ่มไม้หนา หรือบริเวณที่มีการกองจัดเก็บสิ่งของรกทึบ) ทั้งภายในและภายนอกอาคาร • เมื่อตรวจพบวัตถุดิบที่มีสัตว์พาหะเข้ามาอยู่อาศัยหรือรบกวน ต้องมีขั้นตอนการดำเนินงานเพื่อกักแยกและจัดการอย่างเหมาะสม เพื่อป้องกันการแพร่กระจายเชื้อหรือปนเปื้อน • กรณีที่มีการใช้พื้นที่ด้านนอกอาคารเพื่อการจัดเก็บ ต้องมีการป้องกันความเสียหายและโอกาสการปนเปื้อนจากสภาพอากาศ หรือสัตว์พาหะ"],[],"(12) การควบคุมสัตว์รบกวน : Pest Control"],["12.5","การตรวจติดตามและการตรวจจับ",["• มีการจัดทำแผนการตรวจติดตามที่ครอบคลุมการวางเครื่องดักแมลง กาวดักหนู และกล่องดักจิ้งจกในตำแหน่งที่สำคัญ มีการเก็บรักษาแผนผังการกำจัดสัตว์พาหะ และอุปกรณ์เหล่านั้นถูกจัดตั้งในจุดที่ป้องกันไม่ให้เกิดการปนเปื้อนสู่ผลิตภัณฑ์ • อุปกรณ์ที่นำมาใช้งาน มีลักษณะแข็งแรง ทนทาน สามารถล่อสัตว์พาหะ และมีความเหมาะสมกับประเภทของสัตว์พาหะที่เป็นเป้าหมายในการกำจัดของแต่ละพื้นที่ • มีการเข้าตรวจสอบอุปกรณ์ตามความถี่ที่กำหนดเพื่อให้อุปกรณ์พร้อมใช้งานอยู่เสมอ และมีการนำผลการตรวจสอบมาทำการวิเคราะห์แนวโน้มเพื่อใช้พิจาร…"],["- รายงานวิเคราะห์แนวโน้มของ Rentokil"],"(12) การควบคุมสัตว์รบกวน : Pest Control"],["12.6","การกำจัด",["• มีมาตรการหรือขั้นตอนปฏิบัติในการเข้าจัดการกำจัดสัตว์พาหะ กรณีได้รับรายงานหรือพบหลักฐานการเข้ามาของสัตว์พาหะในพื้นที่ • การใช้ยาฆ่าแมลงหรือสารเคมีกำจัดสัตว์รบกวน ดำเนินการโดยผู้ปฏิบัติงานที่ผ่านการฝึกอบรมแล้วเท่านั้น และมีการควบคุมกระบวนการฉีดพ่นเพื่อหลีกเลี่ยงไม่ให้เกิดอันตรายต่อความปลอดภัยของผลิตภัณฑ์อาหาร • มีบันทึกว่าใช้ยาฆ่าแมลงหรือสารเคมีกำจัดสัตว์รบกวนชนิดอะไร ใช้ที่ไหน ใช้เมื่อไหร่ ใช้อย่างไร และสัตว์พาหะเป้าหมาย"],["- วิธีการดำเนินการกรณีพบร่องรอย/ การระบาดของสัตว์พาหะ"],"(12) การควบคุมสัตว์รบกวน : Pest Control"],["13.1","ข้อกำหนดทั่วไป",["• ต้องมีการจัดทำเอกสารการควบคุมพนักงาน ผู้เยี่ยมชม และผู้รับเหมา"],["- WI-QC-19: การควบคุมสุขลักษณะส่วนบุคคล"],"(13) สุขลักษณะส่วนบุคคลและสิ่งอำนวยความสะดวกของพนักงาน : Personal hygiene and employee facilities"],["13.2","สิ่งอำนวยสุขลักษณะส่วนบบุคคลและห้องน้ำ",["• อ่างล้างมือ อุปกรณ์สำหรับทำมือแห้ง สารฆ่าเชื้อ สารทำความสะอาด มีจำนวนเพียงพอ และติดตั้งในตำแหน่งที่เหมาะสม • อ่างล้างมือเป็นแบบไม่ใช้มือสัมผัส แยกอ่างล้างมือกับอ่างล้างกุ้งให้ชัดเจน ไม่ใช้ร่วมกัน • ห้องน้ำ และอ่างล้างมือมีจำนวนเพียงพอ (อ้างอิง: กฎกระทรวง ฉบับที่ 63 ---> จำนวนคนงาน 41-80 คน (ชาย) ห้องส้วม/ ที่ถ่ายปัสสาวะ/อ่างล้างมือ = 3, (หญิง) ห้องส้วม = 6/ อ่างล้างมือ = 3 ** เกิน 80 คน ให้เพิ่มอย่างละ 1 ที่ ต่อคนงานทุก 50 คน) • สิ่งอำนวยความสะดวกด้านสุขอนามัยไม่เปิดโดยตรงสู่พื้นที่ที่มีการผล…"],["- SP-QC-13: ขั้นตอนการปฏิบัติตัวก่อนและหลังเข้าในพื้นที่การผลิต - แผนผังข้อมูลระบุจำนวนห้องน้ำ/ อ่างล้างมือ"],"(13) สุขลักษณะส่วนบุคคลและสิ่งอำนวยความสะดวกของพนักงาน : Personal hygiene and employee facilities"],["13.3","โรงอาหารสำหรับพนักงานและการกำหนดบริเวณรับประทานอาหาร",["• โรงอาหารสำหรับพนักงาน พื้นที่สำหรับเก็บอาหาร และบริเวณรับประทานอาหาร ได้รับการจัดตั้งอยู่ในทำเลที่ลดโอกาสเกิดการปนเปื้อนข้ามไปสู่พื้นที่กระบวนการผลิตอาหาร • มีการสื่อสารและควบคุมให้พนักงานจัดเก็บและรับประทานอาหารส่วนตัวเฉพาะในบริเวณที่บริษัทกำหนดไว้เท่านั้น เพื่อป้องกันไม่ให้นำอาหารเข้าไปในพื้นที่ผลิต"],["- สภาวะการจัดเก็บ การเก็บรักษา การปรุงอาหาร และอุณหภูมิในการรักษา และการจำกัดเวลาต้องถูกกำหนด (ทวนว่ามีการกำหนดนี้รึยัง)"],"(13) สุขลักษณะส่วนบุคคลและสิ่งอำนวยความสะดวกของพนักงาน : Personal hygiene and employee facilities"],["13.4","ชุดทำงานและเสื้อคลุม",["• ชุดทำงานสำหรับปฏิบัติงานหรือเข้าไปในพื้นที่ผลิตผลิตภัณฑ์ รวมถึงวัตถุดิบ ต้องสะอาด และอยู่ในสภาพดี ถูกสุขลักษณะ • ชุดทำงานต้องไม่ถูกเอาไปใช้เพื่อวัตถุประสงค์อื่น (ห้ามใส่นอกพื้นที่) • ชุดทำงานต้องไม่มีกระดุม ไม่มีกระเป๋าด้านนอกที่เหนือระดับเอว โดยสามารถใช้แบบซิป กระดุมแปะ หรือแบบเชือกผูกได้ • ชุดทำงานต้องทำความสะอาดให้ได้ตามาตรฐาน (เช่น แยกซักกับอย่างอื่น/ อัตราส่วนน้ำยา/ วิธีการจัดเก็บ) • ถุงมือที่ใช้สัมผัสอาหารต้องสะอาด อยู่ในสภาพดี • รองเท้าที่ใช้ในพื้นที่การผลิตต้องปิดมิดชิด ทำจากวัสดุที่ไ…"],["- SP-HR-10: มาตรฐานการทำความสะอาดเครื่องแต่งกายพนักงาน - WI-QC-19: การควบคุมสุขลักษณะส่วนบุคคล //และบันทึก"],"(13) สุขลักษณะส่วนบุคคลและสิ่งอำนวยความสะดวกของพนักงาน : Personal hygiene and employee facilities"],["13.5","สุขภาพ",["• พนักงานต้องตรวจสุขภาพก่อนรับเข้าทำงาน (พนักงานที่สัมผัสอาหาร/ ขายอาหาร)"],["- PM-HR การตรวจสุขภาพพนักงาน / Stool Test"],"(13) สุขลักษณะส่วนบุคคลและสิ่งอำนวยความสะดวกของพนักงาน : Personal hygiene and employee facilities"],["13.6","การเจ็บปวดและการบาดเจ็บ",["• องค์กรมีการกำหนดมาตรการและสื่อสารให้พนักงานทราบ เพื่อให้พนักงานต้องรายงานการเจ็บป่วยที่อาจแพร่กระจายสู่ทางอาหาร ให้ผู้รับผิดชอบทราบเพื่อคัดแยกผู้ป่วยออกจากพื้นที่ปฏิบัติงานด้านอาหาร • องค์กรมีมาตรการควบคุมไม่ให้พนักงานที่มีอาการ หรือสงสัยว่าจะเกิดการติดเชื้อ บาดเจ็บ หรือเจ็บป่วยที่มีโอกาสแพร่กระจายเชื้อสู่อาหาร เข้าปฏิบัติงานในส่วนที่เกี่ยวข้องกับอาหารหรือวัสดุสัมผัสอาหาร • ในกรณีที่พนักงานมีบาดแผล มีการควบคุมการใช้พลาสเตอร์ และสามารถตรวจจับโลหะได้"],["- PM-HR การตรวจสุขภาพพนักงาน / Stool Test - สุ่มตรวจดูผลตรวจประจำปี/ ผล Stool - PM-HR การควบคุมพลาสเตอร์ - สุ่มดูการควบคุมพลาสเตอร์"],"(13) สุขลักษณะส่วนบุคคลและสิ่งอำนวยความสะดวกของพนักงาน : Personal hygiene and employee facilities"],["13.7","การทำความสะอาดส่วนบุคคล",["• พนักงานรับทราบและปฏิบัติตัวได้ถูกต้องในเรื่อง (a) ต้องล้างมือและฆ่าเชื้อ ก่อนเริ่มงาน, ทันทีหลังเข้าห้องน้ำ สั่งน้ำมูก, ทันทีหลังปฏิบัติงานใดๆที่โอกาสปนเปื้อน (b) ห้ามไอ จาม เหนือวัตถุดิบหรือผลิตภัณฑ์ ห้ามถ่มน้ำลาย (c) เล็บสะอาด และต้องตัดให้สั้น"],[],"(13) สุขลักษณะส่วนบุคคลและสิ่งอำนวยความสะดวกของพนักงาน : Personal hygiene and employee facilities"],["13.8","พฤติกรรมส่วนบุคคล",["• มีการกำหนดเป็นเอกสารเพื่ออธิบายถึงการกำหนดพฤติกรรมของพนักงานในพื้นที่กระบวนการผลิต บรรจุ เก็บรักษา โดยต้องครอบคลุมอย่างน้อย (a) อนุญาตให้สูบบุหรี่ รับประทานอาหาร และเคี้ยวหมากฝรั่ง ในสถานที่กำหนดไว้เท่านั้น (b) มาตรการควบคุมเพื่อลดการเกิดอันตราย โดยการสวมเครื่องประดับตามที่อนุญาต (c) ห้ามใช้น้ำยาทาเล็บ ใส่เล็บปลอม และติดขนตาปลอม (d) ห้ามใส่ตุ้มหู (e) บำรุงรักษาล็อคเกอร์ส่วนตัวไม่ให้มีขยะและเสื้อผ้าที่สกปรก (g) ห้ามเก็บเครื่องมือหรืออุปกรณ์ที่สัมผัสผลิตภัณฑ์ไว้ในล็อคเกอร์ส่วนตัว"],["- WI-QC-19: การควบคุมสุขลักษณะส่วนบุคคล - มาตรการ/ บันทึกการตรวจล็อคเกอร์"],"(13) สุขลักษณะส่วนบุคคลและสิ่งอำนวยความสะดวกของพนักงาน : Personal hygiene and employee facilities"],["14.1","ข้อกำหนดทั่วไป",["• มีการกำหนดมาตรการสำหรับผลิตภัณฑ์ที่นำกลับไปผลิตซ้ำต้องถูกจัดเก็บ จัดการ และใช้ โดยผลิตภัณฑ์ต้องมั่นใจว่าปลอดภัย มีคุณภาพมีระบบสืบย้อนกลับได้ และถูกต้องตามกฎหมาย"],[],"(14) การทำซ้ำ : Rework"],["14.2","การเก็บรักษา การชี้บ่ง และการสืบย้อนหลับ",["• มีมาตรการป้องกันผลิตภัณฑ์ที่นำกลับไปผลิตซ้ำ (Rework) จากการปนเปื้อนทางด้านจุลชีววิทยา เคมี หรือสิ่งแปลกปลอมจากภายนอก โดยจัดให้มีการแบ่งแยกพื้นที่จัดเก็บอย่างชัดเจน (เช่น การแยกกลุ่มสารก่อภูมิแพ้) และมีการจัดทำเป็นลายลักษณ์อักษรที่สอดคล้องกับการปฏิบัติงานจริง • ผลิตภัณฑ์ที่นำกลับไปผลิตซ้ำ (Rework) ทั้งหมดต้องถูกชี้บ่งให้ชัดเจน เพื่อสามารถสืบย้อนกลับได้ • มีการจัดบันทึกข้อมูลประเภทของผลิตภัณฑ์ที่นำกลับไปผลิตซ้ำและเหตุผลในการดำเนินงาน โดยครอบคลุมข้อมูลที่จำเป็นอย่างครบถ้วน (เช่น ชื่อผลิตภัณฑ์ วั…"],[],"(14) การทำซ้ำ : Rework"],["14.3","การใช้ผลิตภัณฑ์ที่นำมาผลิตซ้ำ",["• มีการกำหนดขั้นตอน วิธีการใช้ รวมถึงประเภท สภาพ และปริมาณสัดส่วนสูงสุดที่ยอมรับได้ของผลิตภัณฑ์รอการผลิตซ้ำ (Rework) ในแต่ละขั้นตอนของกระบวนการผลิตไว้อย่างชัดเจน • มีการกำหนดมาตรการและเงื่อนไขที่จำเป็นในขั้นตอนการเตรียมการ ก่อนที่จะนำผลิตภัณฑ์รอการผลิตซ้ำ (Rework) กลับเข้าสู่สายการผลิต เพื่อรักษามาตรฐานความปลอดภัยของอาหาร • ในกรณีที่ต้องมีการแกะผลิตภัณฑ์ออกจากบรรจุภัณฑ์ องค์กรมีมาตรการควบคุมและแยกประเภทเศษบรรจุภัณฑ์อย่างเข้มงวด เพื่อป้องกันความเสี่ยงจากการปนเปื้อนของสิ่งแปลกปลอมจากภายนอกเข้าสู่…"],["- ตรวจสอบว่ามีการกำหนดเกณฑ์ยังไง และรุไว้ในเอกสารไหน เคยมีกรณีนี้หรือไม่ขอดูบันทึก"],"(14) การทำซ้ำ : Rework"],["15.1","ข้อกำหนดทั่วไป",["• มีระบบที่ทำให้มั่นใจว่าผลิตภัณฑ์ที่ไม่เป็นไปตามข้อกำหนดที่เกี่ยวข้องกับมาตรฐานความปลอดภัยทางด้านอาหารสามารถถูกชี้บ่ง ตำแหน่งการจัดวาง"],[],"(15) ขั้นตอนการเรียกคืนผลิตภัณฑ์ : Product recall procedures"],["15.2","ข้อกำหนดในการเรียกคืนผลิตภัณฑ์",["• มีการระบุรายชื่อผู้ติดต่อกรณีฉุกเฉิน ที่ได้รับการปรับปรุงข้อมูลให้เป็นปัจจุบันอยู่เสมอ เพื่อใช้ในการแจ้งเตือนลูกค้าและผู้มีส่วนได้ส่วนเสียทันทีเมื่อเกิดเหตุการณ์เรียกคืนผลิตภัณฑ์ • มีการกำหนดขั้นตอนการปฏิบัติงานในกรณีที่ผลิตภัณฑ์ที่ถูกเรียกคืนหรือผลิตภัณฑ์อื่น ๆ ที่ผลิตในสภาวะเดียวกันยังคงหลงเหลืออยู่ภายในโรงงาน โดยจัดให้มีระบบการกักกัน และการควบคุมอย่างเข้มงวดเพื่อป้องกันไม่ให้ผลิตภัณฑ์เหล่านั้นถูกจัดส่งออกไปภายนอก • มีขั้นตอนและมาตรการที่ชัดเจนในการจัดการ พิจารณาทำลาย หรือจำหน่ายผลิตภัณฑ์ที…"],["- PM-QA-07 การสอบกลับและเรียกคืนผลิตภัณฑ์"],"(15) ขั้นตอนการเรียกคืนผลิตภัณฑ์ : Product recall procedures"],["16.1","ข้อกำหนดทั่วไป",["• วัตถุดิบและผลิตภัณฑ์ต้องจัดเก็บในสถานที่สะอาด แห้ง มีระบบระบายอากาศที่ดี มีการป้องกันฝุ่น การเกิดหยดน้ำ ควัน กลิ่น หรือจากแหล่งปนเปื้อนอื่น"],["- บันทึกการตรวจ GMP ประจำวัน"],"(16) การจัดเก็บและขนส่ง : Warehousing"],["16.2","ช้อกำหนดสำหรับโกดังเก็บสินค้า",["• มีการควบคุมมาตรฐาน (เช่น อุณหภูมิ ความชื้น และสภาพแวดล้อมอื่นๆ) ตามความจำเป็น • มีการกำหนดมาตรการจัดเก็บว่าสามารถเรียงซ้อนกันได้กี่ชั้นหรือกำหนดความสูงกี่เมตร • วัสดุที่เป็นขยะและสารเคมี (เช่น น้ำยาทำความสะอาด น้ำมันหล่อลื่น และยาฆ่าแมลง) ต้องแยกจัดเก็บ • วัตถุดิบที่ไม่เป็นไปตามข้อกำหนดต้องถูกชี้บ่ง และมีการแยกจัดเก็บ หรือวิธีการอื่นๆเพื่อชี้บ่งให้ชัดเจน • ต้องมีการกำหนดระบบหมุนเวียนสต็อค (FIFO/ FEFO)"],[],"(16) การจัดเก็บและขนส่ง : Warehousing"],["16.3","พาหนะ, การขนส่ง, และตู้คอนเทนเนอร์",["• มีระบบการดูแลรักษา การซ่อมแซม และกระบวนการทำความสะอาด โฟล์คลิฟต์ ยานพาหนะ รวมถึงตู้คอนเทนเนอร์ขนส่งสินค้าอย่างสม่ำเสมอ เพื่อให้อยู่ในสภาพที่พร้อมใช้งานและสอดคล้องตามมาตรฐานที่เกี่ยวข้อง • ยานพาหนะและตู้คอนเทนเนอร์มีมาตรการที่มีประสิทธิภาพในการป้องกันผลิตภัณฑ์ปนเปื้อน หรือการเสียหายระหว่างการขนส่ง รวมถึงมีการควบคุม สังเกตการณ์ และบันทึกข้อมูลอุณหภูมิและความชื้น • ในกรณีที่มีการใช้ยานพาหนะหรือตู้คอนเทนเนอร์ร่วมกันระหว่างผลิตภัณฑ์อาหารและผลิตภัณฑ์ที่ไม่ใช่อาหารต้องมีขั้นตอนการทำความสะอาดและฆ่าเช…"],[],"(16) การจัดเก็บและขนส่ง : Warehousing"],["17.1","การให้ข้อมูลผลิตภัณฑ์",["• มีการควบคุมการจัดทำและแสดงข้อมูลผลิตภัณฑ์อาหารเพื่อให้ผู้บริโภคได้รับข้อมูลที่สำคัญอย่างเพียงพอและถูกต้อง โดยเนื้อหาและรูปแบบการแสดงข้อมูลดังกล่าวได้รับการตรวจสอบว่ามีความสอดคล้องตามข้อกำหนดทางกฎหมายของประเทศปลายทาง • มีการให้ข้อมูลผลิตภัณฑ์ผ่านทางฉลากสินค้า หรือช่องทางอื่น ๆ ที่เหมาะสม (เช่น เว็บไซต์ของบริษัท หรือสื่อโฆษณา) โดยครอบคลุมข้อมูลการเก็บรักษา ขั้นตอนการจัดเตรียม และข้อแนะนำในการบริโภค"],[],"(17) การให้ข้อมูลผลิตภัณฑ์ : Product information/ consumer awareness"],["18.1","ข้อกำหนดทั่วไป",["• มีการประเมินภัยคุกคามและอันตราย ที่อาจเกิดขึ้นกับผลิตภัณฑ์อันเนื่องมาจากการก่อวินาศกรรม การทำลายทรัพย์สิน หรือจากการกระทำของผู้ก่อการร้าย และได้นำผลการประเมินดังกล่าวมาใช้ในการกำหนดมาตรการป้องกันอย่างเป็นรูปธรรม"],["- PM-MR-XX: การปกป้องอาหารจากการประสงค์ร้าย (Food Defense) - ประกาศแต่งตั้ง Food defence - การประเมินความเสี่ยงและมาตรการ Food defence"],"(18) การปกป้องอาหาร หารระมัดระวังทางด้านชีวภาพ การก่อการร้ายทางชีวภาพ : Food defence, biovigilance and bioterrorism"],["18.2","การควบคุมการเข้าออกพื้นที่",["• มีการชี้บ่งพื้นที่หรือจุดที่มีความสำคัญและมีความเสี่ยงสูงภายในสถานประกอบการ พร้อมทั้งจัดทำเป็นแผนผังและการควบคุมการเข้าออกอย่างชัดเจน • มีการจำกัดและควบคุมการเข้าออกในพื้นที่สำคัญอย่างเข้มงวด โดยใช้มาตรการป้องกันทางกายภาพที่เหมาะสม เช่น การใช้กุญแจล็อค บัตรอิเล็กทรอนิกส์ หรือระบบสแกนอัตลักษณ์บุคคล เพื่อป้องกันบุคคลที่ไม่ได้รับอนุญาตเข้าสู่พื้นที่","1. คำนิยามของผลการตรวจสอบ - N/A: ข้อกำหนดดังกล่าวไม่เกี่ยวข้องกับพื้นที่ที่เข้าตรวจ - PASS (หรือ ü): มีการปฏิบัติตามข้อกำหนดอย่างครบถ้วน และถูกต้อง - OBS (Observation): ยังตรวจไม่พบข้อบกพร่อง หรือมีหลักฐานไม่เพียงพอ แต่ผู้ตรวจติดตามคาดว่าจะมีปัญหาในอนาคต หรือหน่วยงานสามารถปฏิบัติให้ได้ผลดีกว่าที่เป็นอยู่ได้ - MI (Minor): ตรวจพบข้อบกพร่องหรือความไม่สอดคล้องกับข้อกำหนดเล็กน้อย จำนวนไม่มาก ไม่รุนแรง ยังสามารถปฏิบัติตามข้อกำหนด/ มาตรฐานไว้อย่างถูกต้อง - MA (Major): ตรวจพบข้อบกพร่องหรือความไม่สอดคล้…"],["- SP-HR-11: ทะเบียนรายชื่อบุคคลผู้ได้รับอนุญาตเข้าพื้นที่ - แผนผังพื้นที่ที่ต้องมีการควบคุม"],"(18) การปกป้องอาหาร หารระมัดระวังทางด้านชีวภาพ การก่อการร้ายทางชีวภาพ : Food defence, biovigilance and bioterrorism"]],"a":[["2.5.1","a. เพิ่มเติมจากข้อกำหนด 7.1.6 ของ ISO 22000:2018",["• กรณีที่มีการตรวจวิเคราะห์โยห้องปฏิบัติการสำหรับทวนสอบ (Verification) หรือตรวจสอบความถูกต้อง (Validation) ของพารามิเตอร์ที่สำคัญต่อความปลอดภัยอาหาร ต้องตรวจสอบโดยห้องแลปที่มีความสามารถ วิเคราะห์ผลแม่นยำ เช่น การทดสอบความชำนาญ (PT Test), โปรแกรมที่ผ่านการรับรองทางกฎหมาย, มีการรับรองมาตรฐาน ISO/IEC 17025 หรือการวิเคราะห์จะต้องดำเนินการตามข้อกำหนดที่เกี่ยวข้อง ISO/IEC 17025"],["- PM-QA-02: การควบคุมห้องปฏิบัติการ - WI-QA-25: การทดสอบความชำนาญของพนักงานในห้องปฏิบัติการ - Cert. ISO 17025 ของห้องแลปที่ใช้บริการ"],"(2.5.1) การควบคุมงานบริการ และการจัดซื้อวัตถุดิบ : Management of Services and Purchased Materials"],["2.5.1","b. เพิ่มเติมจากข้อกำหนด 7.1.6 ของ ISO 22000:2018",["• มีการจัดทำและคงรักษาไว้ซึ่งขั้นตอนการปฏิบัติงานสำหรับการจัดซื้อในกรณีฉุกเฉิน เพื่อให้มั่นใจว่าผลิตภัณฑ์ยังคงมีความสอดคล้องกับข้อกำหนดความปลอดภัยของอาหาร และผู้ส่งมอบได้ผ่านการประเมินตามเกณฑ์ที่เหมาะสม"],[],"(2.5.1) การควบคุมงานบริการ และการจัดซื้อวัตถุดิบ : Management of Services and Purchased Materials"],["2.5.1","c. เพิ่มเติมจากข้อกำหนด 9.2 ของ ISO/TS 22002-1:2009",["• มีนโยบายที่เป็นลายลักษณ์อักษรสำหรับการจัดซื้อ Animal, Fish และ Seafood เกี่ยวกับการควบคุมสารต้องห้าม (เช่น pharmaceuticals , veterinary medicines , heavy metals , pesticides) โดยมีมาตรการที่ชัดเจนในการควบคุม ตรวจสอบ และเฝ้าระวังสารต้องห้าม"],[],"(2.5.1) การควบคุมงานบริการ และการจัดซื้อวัตถุดิบ : Management of Services and Purchased Materials"],["2.5.1","d. เพิ่มเติมตามข้อกำหนดในการใช้",["• ได้จัดทำ นำไปใช้ และคงรักษาไว้ซึ่งกระบวนการทบทวนข้อกำหนดวัตถุดิบและผลิตภัณฑ์สำเร็จรูป (Raw material and Finished product specifications) เพื่อให้มั่นใจว่ามีความสอดคล้องอย่างต่อเนื่องกับด้านความปลอดภัยอาหาร คุณภาพ กฎหมาย และข้อกำหนดของลูกค้า"],[],"(2.5.1) การควบคุมงานบริการ และการจัดซื้อวัตถุดิบ : Management of Services and Purchased Materials"],["2.5.2","a. เพิ่มเติมจากข้อกำหนด 8.5.1.3 ของ ISO 22000:2018",["• มีการตรวจสอบและบันทึกผลเพื่อให้มั่นใจว่าผลิตภัณฑ์สุดท้ายได้รับการติดฉลากถูกต้องสอดคล้องตามกฎหมายของประเทศปลายทาง รวมถึงมีการระบุสารก่อภูมิแพ้ (Allergens) และข้อกำหนดเฉพาะของลูกค้าครบถ้วน"],[],"(2.5.2) ฉลากผลิตภัณฑ์และวัสดุพิมพ์ : Product Labeling and Printed Materials"],["2.5.2","b. กรณีที่เป็นผลิตภัณฑ์ที่ไม่มีฉลาก (Unlabeled)",["• ได้จัดทำและส่งมอบข้อมูลของผลิตภัณฑ์ที่เกี่ยวข้องทั้งหมด เพื่อให้มั่นใจในความปลอดภัยต่อการนำไปใช้หรือบริโภคของลูกค้า"],[],"(2.5.2) ฉลากผลิตภัณฑ์และวัสดุพิมพ์ : Product Labeling and Printed Materials"],["2.5.2","c. กรณีที่มีการกล่าวอ้าง (Product Claims) บนฉลากหรือบรรจุภัณฑ์",["• ต้องมีหลักฐานยืนยันเพื่อสนับสนุนการกล่าวอ้าง และจะต้องมีการทวนสอบเพื่อให้มั่นใจว่าผลิตภัณฑ์มีลักษณะตรงตามที่กล่าวอ้าง"],["- Product Claims เช่น กล่าวอ้างคุณค่าทางโภชนาการ, สารก่อภูมิแพ้, วิธีการผลิต, สถานะวัตถุดิบ เช่น สายพันธุ์กุ้ง)"],"(2.5.2) ฉลากผลิตภัณฑ์และวัสดุพิมพ์ : Product Labeling and Printed Materials"],["2.5.3.1","การประเมินภัยคุกคาม",["• a) มีการดำเนินการและจัดทำเอกสารการประเมินภัยคุกคามปกป้องอาหาร เพื่อระบุและประเมินภัยคุกคามที่มีแนวโน้มจะเกิดขึ้นกับกระบวนการและผลิตภัณฑ์ภายในขอบเขตขององค์กร • b) พัฒนาและนำมาตรการที่เหมาะสมไปปฏิบัติ เพื่อลดผลกระทบสำหรับภัยคุกคามที่มีนัยสำคัญอย่างมีประสิทธิภาพ"],[],"(2.5.3) การปกป้องอาหารจากการประสงค์ร้าย : Food Defense"],["2.5.3.2","แผนงาน",["• a) มีเอกสารแผนงานปกป้องอาหารจากการประสงค์ร้าย (Food Defense Plan) ที่จัดทำขึ้นจากผลการประเมินภัยคุกคาม โดยระบุมาตรการควบคุมเฉพาะเจาะจงและขั้นตอนการดำเนินงานทวนสอบอย่างชัดเจน • b) แผนงานปกป้องอาหารจากการประสงค์ร้ายดังกล่าว ได้ถูกนำไปปฏิบัติใช้งานจริงและได้รับการสนับสนุนผ่านระบบการจัดการความปลอดภัยของอาหาร (FSMS) ขององค์กร • c) แผนงานปกป้องอาหารจากการประสงค์ร้ายมีการปฏิบัติตามกฎหมายที่เกี่ยวข้อง ครอบคลุมทุกกระบวนการและผลิตภัณฑ์ภายในขอบเขตขององค์กร รวมทั้งได้รับการปรับปรุงให้เป็นปัจจุบันอยู่เสมอ"],[],"(2.5.3) การปกป้องอาหารจากการประสงค์ร้าย : Food Defense"],["2.5.4.1","การประเมินความอ่อนไหว",["• a) ได้ดำนินการและจัดทำเอกสารการประเมินความเสี่ยงของการปลอมอาหาร เพื่อระบุและประเมินความเสี่ยงที่มีแนวโน้มจะเกิดขึ้นครอบคลุมทุกกระบวนการและผลิตภัณฑ์ภายในขอบเขตขององค์กร • b) องค์กรได้พัฒนาและนำมาตรการที่เหมาะสมไปปฏิบัติ เพื่อลดผลกระทบสำหรับความเสี่ยงจากการปลอมอาหารที่มีนัยสำคัญอย่างมีประสิทธิภาพ"],["- ตรวจ PM-MR-16: การประเมินอาหารปลอม - ประกาศแต่งตั้ง Food Fraud - มีการประเมินครอบคลุมแล้วหรือไม่"],"(2.5.4) การลดผลกระทบการปลอมอาหาร : Food Fraud Mitigation"],["2.5.4.2","แผนงาน",["• a) องค์กรมีเอกสารแผนงานลดผลกระทบการปลอมอาหาร (Food Fraud Mitigation Plan) ที่จัดทำขึ้นจากผลการประเมินความเสี่ยง โดยระบุมาตรการควบคุมเฉพาะเจาะจงและขั้นตอนการดำเนินงานทวนสอบอย่างชัดเจน • b) แผนงานลดผลกระทบการปลอมอาหารดังกล่าว ได้ถูกนำไปปฏิบัติใช้งานจริงและได้รับการสนับสนุนผ่านระบบการจัดการความปลอดภัยของอาหาร (FSMS) ขององค์กร • c) แผนงานลดผลกระทบการปลอมอาหารมีการปฏิบัติตามกฎหมายที่เกี่ยวข้อง ครอบคลุมทุกกระบวนการและผลิตภัณฑ์ภายในขอบเขตขององค์กร รวมทั้งได้รับการปรับปรุงให้เป็นปัจจุบันอยู่เสมอ"],["- กรณีพิจารณาว่าเสี่ยงต่อการเกิดอาหารปลอมมีมาตรการยังไง มีบันทึกผล/ บันทึกการทวนสอบมั้ย แล้วเอาไปประเมินผลแจ้งใน Management Review - มีการอัพเดตข้อมูลเกี่ยวกับอาหารปลอมที่เกี่ยวข้องเป็นปัจจุบันหรือไม่"],"(2.5.4) การลดผลกระทบการปลอมอาหาร : Food Fraud Mitigation"],["2.5.5","การใช้โลโก้",["• a) มีการควบคุมการใช้โลโก้ FSSC 22000 ให้จำกัดอยู่เฉพาะกิจกรรมทางการตลาด เช่น ในสิ่งพิมพ์ขององค์กร เว็บไซต์ หรือสื่อส่งเสริมการขายอื่น ๆ โดยเป็นไปตามเกณฑ์ที่กำหนดอย่างถูกต้อง • b) ในกรณีที่มีการใช้โลโก้ FSSC 22000 ต้องร้องขอสำเนาโลโก้ล่าสุดจากหน่วยงานที่ให้รับรองและนำมาใช้งานโดยปฏิบัติตามเงื่อนไขและข้อกำหนดอย่างเคร่งครัด • c) มีการควบคุมดูแลเพื่อให้อยู่ในเกณฑ์ข้อห้าม โดยไม่มีการใช้เครื่องหมาย FSSC 22000 หรือข้อความกล่าวอ้างเกี่ยวกับสถานะการรับรอง บนผลิตภัณฑ์ ฉลาก บรรจุภัณฑ์ ใบ COA/COC หรือบนสื…"],["- ตรวจ QM-MR ว่ามีการกำหนดการใช้หรือไม่ หรือ ในเอกสารขั้นตอนไหนที่มีการชี้บ่งเรื่องนี้บ้าง"],"(2.5.5) การใช้โลโก้ : Logo Use"],["2.5.6","การจัดการสารก่อภูมิแพ้",["• a) จัดทำเอกสารบัญชีรายชื่อวัตถุดิบและผลิตภัณฑ์ที่มีสารก่อภูมิแพ้ทั้งหมดไว้อย่างชัดเจน • b) การประเมินความเสี่ยงเพื่อระบุแหล่งปนเปื้อนข้ามของสารก่อภูมิแพ้ในกระบวนการทั้งหมด • c) การนำมาตรการควบคุมไปใช้งานจริงตามผลการประเมินความเสี่ยง เพื่อลดการปนเปื้อนข้าม • d) การพิสูจน์ยืนยัน และทดสอบทวนสอบของมาตรการควบคุม เมื่อมีการผลิตผลิตภัณฑ์มากกว่าหนึ่งชนิดซึ่งมีชนิดสารก่อภูมิแพ้ต่างกัน เช่น การทดสอบพื้นผิวการสุ่มตัวอย่างอากาศ หรือการทดสอบผลิตภัณฑ์ • e) การติดฉลากคำเตือนสารก่อภูมิแพ้อย่างถูกต้องเมื่อมีค…"],["- การประเมินความเสี่ยงของโอกาสการปนเปื้อนสารก่อภูมิแพ้ - มาตรการจัดการ ผลการทวนสอบ (Allergen Test Kit)"],"(2.5.6) การจัดการสารก่อภูมิแพ้ : Management of Allergens"],["2.5.7","การเฝ้าระวังสภาพแวดล้อม",["• a) ต้องมีโปรแกรมเฝ้าระวังสภาพแวดล้อมตามพื้นที่ความสี่ยง สำหรับเชื้อจุลินทรีย์ก่อโรคที่เกี่ยวข้อง จุลินทรีย์ที่ทำให้เกิดการเสื่อมเสีย และจุลินทรีย์ที่เป็นตัวชี้วัด • b) มีขั้นตอนการปฏิบัติงานเพื่อประเมินประสิทธิภาพการควบคุมทางจุลชีววิทยา และสอดคล้องตามกฎหมายหรือข้อกำหนดลูกค้า • c) มีการรวบรวมข้อมูลกิจกรรมการตรวจติดตามสภาพแวดล้อม และนำมาวิเคราะห์แนวโน้ม อย่างสม่ำเสมอ • d) โปรแกรมเฝ้าระวังสภาพแวดล้อม จะต้องได้รับการทบทวนเพื่อประสิทธิผลและความต่อเนื่องอย่างน้อย 1 ครั้ง/ปี หรือเมื่อเกิดเหตุการณ์ที…"],["- PM-MR-XX: Environtmental Monitoring"],"(2.5.7) การเฝ้าระวังสภาพแวดล้อม : Environtmental Monitoring"],["2.5.8","วัฒนธรรมคุณภาพและความปลอดภัยอาหาร",["• a) เพิ่มเติมจากข้อกำหนด 5.1 ของ ISO 22000:2018 ผู้บริหารระดับสูงได้จัดทำ นำไปใช้ และคงรักษาไว้ซึ่งวัตถุประสงค์ของวัฒนธรรมองค์กร โดยครอบคลุมด้านการสื่อสาร (เช่น Morning talk/บอร์ดสื่อสาร) การฝึกอบรม ข้อมูลย้อนกลับและการมีส่วนร่วมของพนักงาน และการวัดสมรรถนะกิจกรรม • b) วัตถุประสงค์จะต้องได้รับการสนับสนุน โดยเอกสารแผนวัฒนธรรมและความปลอดภัยของอาหารพร้อมเป้าหมาย และระยะเวลา รวมทั้งต้องรวมอยู่ใน Management Review และกระบวนการปรับปรุงอย่างต่อเนื่อง"],["- แผนการดำเนินงานจัดกิจกรรมวัฒนธรรมองค์กร และต้องมีที่มาว่ากิจกรรม/KPI นั้นเลือกมายังไง - ผล KPI และผลการดำเนินกิจกรรมต้องรายงานในการทบทวนบริหาร"],"(2.5.8) วัฒนธรรมคุณภาพและความปลอดภัยอาหาร : Food Safety and Quality Culture"],["2.5.9","การควบคุมคุณภาพ",["• a) องค์กรต้อง - เพิ่มเติมจาก 5.2 และ 6.2 ของ ISO 22000:2018 ให้จัดทำ นำไปใช้งาน และคงรักษาไว้ซึ่งนโยบายคุณภาพและวัตถุประสงค์คุณภาพ - จัดทำ นำไปใช้งาน และคงรักษาไว้ซึ่ง พารามิเตอร์ด้านคุณภาพ - เพิ่มเติมจาก 9.1 และ 9.3 ของ ISO 22000:2018 การวิเคราะห์และประเมินผลของพารามิเตอร์ด้านควบคุมคุณภาพ เพื่อใช้ใน Management Review - เพิ่มเติมจาก 9.2 ของ ISO 22000:2018 รวมถึงองค์ประกอบด้านคุณภาพตามที่กำหนดไว้ในข้อนี้ ภายในขอบเขตของการตรวจสอบภายใน • b) มีขั้นตอนการปฏิบัติงานเพื่อควบคุมปริมาณ (เช่น น้ำหนัก/ป…"],["- PM-QA-XX, PM-QC-XX - WI-QC-08: การตรวจสอบผลิตภัณฑ์ก่อนฟรีส - WI-QC-09: การตรวจสอบบรรจุภัณฑ์, การบรรจุผลิตภัณฑ์และผลิตภัณฑ์หลังฟรีส - WI-QC-12: การทวนสอบเครื่องมืออุปกรณ์ก่อนใช้งาน - WI-PD-07: การเตรียมผลิตภัณฑ์เพื่อแช่เยือกแข็ง - WI-PD-XX: การเริ่มสายการผลิตและการเปลี่ยนสายการผลิต (Line Clearance) --> ขั้นตอนการทำงาน และบันทึก แนะนำว่าอาจทำเป็น Checklist ที่มีการตรวจหัวข้อ เช่น 1.ความสะอาดของเครื่องจักร อุปกรณ์ และพื้นที่การผลิต 2. ไม่มีผลิตภัณฑ์หรือส่วนประกอบที่ผลิตก่อนหน้าในพื้นที่การผลิต 3…"],"(2.5.9) การควบคุมคุณภาพ : Quality Control"],["2.5.10","การขนส่ง การจัดเก็บและการจัดการคลังสินค้า",["• a) มีการจัดทำ นำไปใช้ และคงรักษาไว้ซึ่งขั้นตอนการปฏิบัติงานในการหมุนเวียนสต็อก โดยใช้หลักการ FEFO/ FIFO อย่างเคร่งครัด"],[],"(2.5.10) การขนส่ง การจัดเก็บและการจัดการคลังสินค้า : Transport Storage and Warehousing"],["2.5.11","การควบคุมอันตรายและมาตรการควบคุมสำหรับป้องกันการปนเปื้อน",["• a) เพิ่มเติมตามข้อกำหนด 8.5.1.3 ของ ISO 22000:2018 ต้องมีการกำหนดเกณฑ์และแสดงหลักฐานการควบคุม ในกรณีที่ใช้บรรจุภัณฑ์ที่มีผลกระทบหรือมีหน้าที่เฉพาะต่ออาหาร (เช่น ซองดูดกลิ่น/ดูดความชื้น, บรรจุภัณฑ์เคลือบ anti-microbial, Active Packaging ที่ปล่อย CO2) • d) เพิ่มเติมตามข้อกำหนด 8.2.4 (h) ของ ISO 22000:2018 ต้องมีการประเมินความเสี่ยงเพื่อกำหนดอุปกรณ์ที่ใช้ตรวจจับสิ่งแปกปลอมที่จำเป็น (ในกรณีที่องค์กรเห็นว่าไม่จำเป็นต้องใช้อุปกรณ์ตรวจจับสิ่งแปกปลอม จะต้องระบุเหตุผลและจัดเก็บเป็นเอกสาร) //อุปกรณ์ตรว…"],["- มีการใช้บรรจุภัณฑ์ที่มีผลกระทบหรือมีหน้าที่เฉพาะต่ออาหารหรือไม่ แล้วถ้ามีควบคุมดำเนินการยังไง - WI-QC-18: การควบคุมแก้วและพลาสติกแข็งในกระบวนการผลิต //บันทึกผล - การประเมินความเสี่ยงของอุปกรณ์ - การประเมินโอกาสที่มีการปนเปื้อนของสิ่งแปกปลอมในกระบวนการ เช่น สิ่งแปกปลอมที่ติดมากับวัตถุดิบ"],"(2.5.11) การควบคุมอันตรายและมาตรการควบคุมสำหรับป้องกันการปนเปื้อน : Hazard Control and Measures for Preventing Cross-Co…"],["2.5.12","การทวนสอบ PRP",["• เพิ่มเติมตามข้อกำหนด 8.8.1 ของ ISO 22000:2018 ต้องจัดทำ นำไปใช้ และคงรักษาไว้ซึ่งกิจกรรมการตรวจสอบสถานที่และ PRP Checks (ทั้งภายในและภายนอก) เป็นประจำ โดยกำหนดความถี่ เนื้อหา และเกณฑ์การสุ่มตัวอย่างบนพื้นฐานของความเสี่ยง และสอดคล้องกับข้อกำหนดทางเทคนิค (PRP (ISO/TS 22002-1:2009 Group C1) ที่เกี่ยวข้องอย่างเหมาะสม"],["- ผล IQA/ ผล GMP ประจำเดือน"],"(2.5.12) การทวนสอบ PRP : PRP Verification"],["2.5.13","การออกแบบและพัฒนาผลิตภัณฑ์",["• a) มีการประเมินและปรับปรุงข้อมูลการวิเคราะห์อันตรายของระบบ FSMS (รวมถึงประเด็นสารก่อภูมิแพ้ใหม่) เมื่อเกิดการเปลี่ยนแปลงของผลิตภัณฑ์หรือกระบวนการ • b) มีการพิจารณาผลกระทบของการเปลี่ยนแปลงต่อแผนภูมิการไหลของกระบวนการทั้งสำหรับผลิตภัณฑ์ใหม่และผลิตภัณฑ์เดิมที่มีอยู่ • c) มีการพิจารณาและจัดสรรความต้องการด้านทรัพยากร รวมถึงการฝึกอบรมบุคลากรที่เกี่ยวข้องกับการพัฒนาผลิตภัณฑ์ใหม่ • d) มีการกำหนดข้อกำหนดของเครื่องจักรอุปกรณ์ และแผนการบำรุงรักษาที่รองรับสำหรับผลิตภัณฑ์ใหม่ • e) มีบันทึกการทดสอบการผลิต …"],["- PM-MR-18: การควบคุมการเปลี่ยนแปลง (รวมถึงฝ่ายอื่นๆเมื่อมีการเปลี่ยนแปลง เช่น RD: กรณีมีการเปลี่ยนสเปค เปลี่ยน Supplier ของวัตถุดิบที้ ดำเนินการยังไง) ---> ถ้ามีการเปลี่ยนแปลง มีบันทึกที่ประเมินว่าส่งผลต่อระบบ FSMS มั้ย เช่น ระบบ HACCP, ผังการไหล/ ต้องมีการเพิ่มอุปกรณ์ เครื่องจักร หรืออบรมอะไรมั้ย/ ผล Test Run, Shelf life/ ผลทวนสอบตามแผน - กรณีมีการชี้แจงวิธีการบริโภค เช่นการอุ่นปรุงสุก หาข้อมูลอ้างอิงจากข้อมูลที่น่าเชื้อถือได้ก็จะดี หรือทำเป็นผลการทวนสอบโดยแลป - WI-RD-03: การศึกษาอายุการเก็บร…"],"(2.5.13) การออกแบบและพัฒนาผลิตภัณฑ์ : Product Design and Development"],["2.5.15","เพิ่มเติมตามข้อกำหนด 8.2.4 ของ ISO 22000:2018",["• a) มีเอกสารข้อกำหนดการจัดซื้อ ซึ่งระบุถึงการออกแบบที่ถูกสุขลักษณะ กฎหมายที่ใช้บังคับ ข้อกำหนดของลูกค้า และวัตถุประสงค์ในการใช้งานอุปกรณ์ โดย Supplier ต้องแสดงหลักฐานว่าเป็นไปตามข้อกำหนดการซื้อก่อนการติดตั้ง • b) กรณีติดตั้งเครื่องจักรอุปกรณ์ใหม่ หรือมีการเปลี่ยนแปลงใดๆ ต้องมีการประเมินความเสี่ยง กำหนดมาตรการควบคุม รวมถึงหลักฐานของการทดสอบการใช้งานที่ประสบความสำเร็จ"],["- มีการจัดทำข้อกำหนดของเครื่องมือ อุปกรณ์ เครื่องจักรก่อนซื้อ และพอติดตั้งหรือรับมาต้องมีการเซ็นต์รับทราบจากฝ่ายที่เป็นผู้ใช้งาน (ดูใน FSSC 22000 เรื่อง Equipment Management) - มีแบบฟอร์ม/บันทึกการตรวจเครื่องมือ อุปกรณ์ เครื่องจักร ตอนรับเข้า และผลการใช้งาน - ขั้นตอนการประเมินความเสี่ยง กรณีเครื่องจักรใหม่"],"(2.5.15) การจัดการเครื่องจักรอุปกรณ์ : Equipment Management"],["2.5.16","การสูญเสียอาหารและของเสีย",["• a) กำหนดนโยบายและวัตถุประสงค์ ที่ระบุถึงกลยุทธ์ในการลดการสูญเสียอาหารและของเสีย (Food Loss and Waste) ภายในองค์กรและห่วงโซ่อุปทาน • b) มีมาตรการควบคุมการจัดการผลิตภัณฑ์ที่นำไปบริจาคให้แก่องค์กรการกุศล พนักงาน หรือหน่วยงานอื่น ๆ เพื่อให้มั่นใจว่าผลิตภัณฑ์เหล่านั้นยังคงปลอดภัยต่อการบริโภค • c) มีระบบการจัดการผลิตภัณฑ์ส่วนเกินหรือผลพลอยได้ (By-products) ที่นำไปใช้เป็นอาหารสัตว์ เพื่อป้องกันการปนเปื้อนข้ามอย่างมีประสิทธิภาพ • d) กระบวนการจัดการของเสียและการสูญเสียอาหารทั้งหมด เป็นไปตามกฎหมายที่บั…"],["- PM-MR-XX: Food Loss and Waste Management (ดูใน FSSC 22000) ---> กำหนดของทุกแผนกลงไปด้วย PD, CS, ST, RD, QA, QC - ผลการประเมิน KPI ที่เกี่ยวข้องกับ Food Loss and Waste - WI-PR-07: การขายวัตถุดิบเศษวัตถุดิบ - ตรวจสัญญา/ข้อกำหนดเรื่องราคาซื้อให้เป็นปัจจุบัน (เป็นคนหัวหน้าคนเก่าที่เซ็นต์)"],"(2.5.16) การสูญเสียอาหารและของเสีย : Food Loss and Waste"],["2.5.17","เพิ่มเติมตามข้อกำหนด 8.4.2 ของ ISO 22000:2018",["• ต้องกำหนดและดำเนินการแจ้งหน่วยงานให้การรับรองภายใน 3 วันทำการ เมื่อเกิดเหตุการณ์ร้ายแรงที่ส่งผลกระทบต่อ FSMS ได้แก่ (a) เหตุการณ์ร้ายแรงที่ส่งผลกระทบต่อ FSMS : ความถูกต้องของกฎหมาย หรือความถูกต้องสมบูรณ์ของใบรับรอง รวมถึงสถานการณ์ที่เป็นภัยคุกคาม ภัยธรรมชาติ ภัยที่มนุษย์สร้างขึ้น เช่น สงคราม การแฮ็กคอมพิวเตอร์ (b) สถานการณ์ร้ายแรงที่ความถูกต้องสมบูรณ์ของใบรับรองตกอยู่ในความเสี่ยง หรือทำให้เกิดความเสื่อมเสียชื่อเสียงได้ (เช่น การเรียกคืนสินค้าสู่สาธารณะ การโดนสั่งปิดโรงงาน การฟ้องร้องทางกฎหมาย…","1. คำนิยามของผลการตรวจสอบ - N/A: ข้อกำหนดดังกล่าวไม่เกี่ยวข้องกับพื้นที่ที่เข้าตรวจ - PASS (หรือ ü): มีการปฏิบัติตามข้อกำหนดอย่างครบถ้วน และถูกต้อง - OBS (Observation): ยังตรวจไม่พบข้อบกพร่อง หรือมีหลักฐานไม่เพียงพอ แต่ผู้ตรวจติดตามคาดว่าจะมีปัญหาในอนาคต หรือหน่วยงานสามารถปฏิบัติให้ได้ผลดีกว่าที่เป็นอยู่ได้ - MI (Minor): ตรวจพบข้อบกพร่องหรือความไม่สอดคล้องกับข้อกำหนดเล็กน้อย จำนวนไม่มาก ไม่รุนแรง ยังสามารถปฏิบัติตามข้อกำหนด/ มาตรฐานไว้อย่างถูกต้อง - MA (Major): ตรวจพบข้อบกพร่องหรือความไม่สอดคล้…"],[],"(2.5.17) ข้อกำหนดการสื่อสาร : Communication Requirement"]]};
var Q9X={"5.2.1":["ตรวจผู้บริหารระดับสูง: อธิบายขั้นตอนการกำหนดและประกาศนโยบายคุณภาพได้หรือไม่","นโยบายเหมาะสมกับวัตถุประสงค์ บริบทองค์กร และสนับสนุนทิศทางกลยุทธ์หรือไม่","ประกาศนโยบายมีคำมั่นสัญญาในการตอบสนองข้อกำหนดที่ใช้บังคับ และการปรับปรุง QMS อย่างต่อเนื่องหรือไม่"],"5.2.2":["นโยบายตาม 5.2.1 จัดทำเป็นเอกสารหรือไม่","เอกสารนโยบายติดประกาศ/สื่อสารให้พนักงานทุกคนรับทราบหรือไม่","สุ่มพนักงานระดับต่างๆ ให้อธิบายนโยบายตามที่ประกาศ"],"6.1.1":["ประเมินความเสี่ยงและโอกาสจากความต้องการและความคาดหวังของผู้มีส่วนได้เสียที่กำหนดหรือไม่"],"6.1.2":["กรณีมีความเสี่ยง/โอกาสสำคัญ วางแผนปรับปรุงการปฏิบัติงานในหน่วยงานที่เกี่ยวข้องอย่างไร"],"6.2.1":["เป้าหมายคุณภาพ: (a) ทำเป็นเอกสาร (b) วัดได้ (c) สอดคล้องกับนโยบาย (d) กระจายไปหน่วยงานที่เกี่ยวข้อง (e) สื่อสารอย่างไร"],"6.2.2":["แผนปฏิบัติการมี: (a) สิ่งที่จะทำ (b) ทรัพยากร (c) ผู้รับผิดชอบ (d) กำหนดเสร็จ (e) วิธีประเมินผลหรือไม่","เมื่อถึงกำหนด ทบทวนผลว่าเสร็จตามแผนและได้ตามเป้าหมายคุณภาพหรือไม่ และทบทวนแผนปฏิบัติการหรือไม่"],"7.1.1":["องค์กรกำหนดและจัดหาทรัพยากรที่จำเป็นในการสร้าง นำไปปฏิบัติ คงรักษา และปรับปรุง QMS อย่างต่อเนื่องหรือไม่ (สุ่มตรวจ JD/ใบรับรอง/ใบอนุญาตผู้ปฏิบัติงาน)"],"7.1.3":["การบำรุงรักษาโครงสร้างพื้นฐานแต่ละรายการ: (a) แผนบำรุงรักษา (b) การจ้างผู้รับจ้าง (c) บันทึกการจ้าง ประวัติการบำรุงรักษา และการควบคุมอะไหล่สำรอง"],"7.1.5":["มีทะเบียนอุปกรณ์เฝ้าติดตามและวัดที่ต้องสอบเทียบ/ทวนสอบครบถ้วนหรือไม่"],"7.1.5.1":["ประเมินความถูกต้องที่จำเป็นของเครื่องมือให้เหมาะสมกับงาน","เก็บคู่มือการใช้งาน/บำรุงรักษาเครื่องมือวัดไว้","กำหนดการบำรุงรักษาและวิธีการใช้งานที่เหมาะสม"],"7.1.5.2":["หน่วยงานที่ดูแลการสอบเทียบ: (a) กำหนดเครื่องมือที่ต้องสอบเทียบ/ทวนสอบ (b) ความถี่ (c) สอบเทียบเองหรือส่งออก (d) ใบรับรองผล (e) ติดป้ายสถานะ (f) ป้องกันจุดปรับแต่ง (g) วิธีเก็บและเคลื่อนย้าย"],"7.3":["สุ่มดูประวัติอบรมพนักงาน (พ้นทดลองงาน) หรือสุ่มถามความเข้าใจ"],"7.4":["กำหนดการสื่อสารภายในและภายนอกหรือไม่ (อะไร เมื่อไร กับใคร อย่างไร)"],"7.5.1":["กำหนดสารสนเทศเป็นเอกสาร (สื่อ กระดาษ อิเล็กทรอนิกส์) ไว้อย่างไร และหน่วยงานคงรักษาตามที่กำหนดหรือไม่"],"7.5.2":["สารสนเทศเป็นเอกสารระบุ: (a) การชี้บ่งและรายละเอียด (b) รูปแบบ (c) การทบทวนและอนุมัติที่เหมาะสมหรือไม่","บันทึกที่ต้องเก็บรักษา ได้รับการอนุมัติอย่างเหมาะสมหรือไม่"],"8.1":["ตรวจหน่วยงานผลิต: (a) มีขั้นตอน/Control plan (b) ระบุขั้นตอนผลิต การควบคุม เอกสารอ้างอิง บันทึก และวิธีจัดการกรณีผลไม่เป็นไปตามกำหนด (c) ควบคุมการเปลี่ยนแปลงตาม 6.3"],"9.1.1":["องค์กรกำหนด (a) สิ่งที่ต้องเฝ้าติดตามและวัด (b) วิธีเฝ้าติดตาม วัด วิเคราะห์ ประเมินผล (c) เมื่อไรต้องเฝ้าติดตาม (d) เมื่อไรวิเคราะห์และประเมินผลหรือไม่"]};

    SPEC.push(['f22','FSSC · ISO 22000 '+gname,k,top[1]||('ข้อ '+k),(top[2][0]||'ตรวจตามหัวข้อย่อยในแนวทางเชิงลึกด้านล่าง')]);
  });
  F22X.p.forEach(function(x){
    SPEC.push(['f22','FSSC · PRP '+(x[4]||''),'PRP '+x[0],x[1],(x[2][0]||x[1]),{b:x[2].slice(1),g:x[3]}]);
  });
  var seenA={};
  F22X.a.forEach(function(x){
    var id=x[0];seenA[id]=(seenA[id]||0)+1;
    SPEC.push(['f22','FSSC · Additional Requirements (AR)','AR '+x[0]+(seenA[id]>1||F22X.a.filter(function(y){return y[0]===id}).length>1?'.'+String.fromCharCode(96+seenA[id]):''),(x[2][0]||x[1]).slice(0,90),(x[2].join(' • ')||x[1]),{g:x[3]}]);
  });
  /* ISO 9001 8.1 (จาก FM-MR-10) */
  SPEC.unshift(['q9','ISO 9001 · การปฏิบัติการ','8.1','การวางแผนและควบคุมการปฏิบัติการ','วางแผนและควบคุมการผลิต/ให้บริการ มีเอกสารขั้นตอน/Control plan บันทึกผลการปฏิบัติ และจัดการกรณีผลไม่เป็นไปตามกำหนด ตลอดจนควบคุมการเปลี่ยนแปลง']);
  var seen={};
  BAPX.forEach(function(x){
    var id=x[0]+'_'+cn(x[2]);seen[id]=(seen[id]||0)+1;
    var t=x[4].length>70?x[4].slice(0,70)+'…':x[4];
    SPEC.push(['bap',x[1],x[2],t,x[4],{g:x[5],crit:x[3],sfx:seen[id]>1?'_'+seen[id]:'',k:x[0]}]);
  });
})();
var RC={};
/* ข้อกำหนด BAP ที่เทียบเท่าข้อกำหนดร่วม ISO (HLS) — ตามตารางเทียบในไฟล์ Checklist รวม (คอลัมน์ข้อกำหนด) */
var BMAP={'4.3':['2.1.1','2.2.1.1','2.2.1.2','2.2.1.4'],'5.1':['2.5.1'],'5.2':['2.3.1'],'5.3':['2.4.1','2.4.2'],'6.2':['2.1.3'],'7.1':['2.4.3'],
 '7.5':['2.8.1','2.9.1','2.10.1','2.10.2','2.10.3','2.10.4','2.10.5','2.10.6'],'9.2':['4.2.1','4.2.2','4.2.3','4.2.4'],'9.3':['2.5.2','2.5.3'],'10.2':['2.11.1','2.11.2','2.11.3']};
function rowsFor(systems){
  var key=systems.slice().sort().join(',');if(RC[key])return RC[key];
  var rows=[],hs=systems.filter(function(s){return s==='q9'||s==='e14'||s==='f22'});
  var withBap=systems.indexOf('bap')>=0&&hs.length>0,used={};
  if(hs.length){
    HLS.forEach(function(h){
      var qs=hs.map(function(s){return{s:s,c:h.c[s],q:h.q[s]}}).filter(function(x){return x.q});
      if(withBap&&BMAP[h.c.q9]){
        BMAP[h.c.q9].forEach(function(bc){SPEC.forEach(function(r){
          if(r[0]==='bap'&&r[2]===bc&&!used[r[3]+'|'+r[2]]){used[r[3]+'|'+r[2]]=1;qs.push({s:'bap',c:r[2],q:r[4],ex:r[5]||null,mref:r})}})});
      }
      if(qs.length)rows.push({id:'H_'+h.c.q9.replace(/\./g,'_'),group:'ข้อกำหนดร่วม ISO (โครงสร้าง HLS) · '+hs.map(function(s){return SYS[s].short}).join(' + ')+(withBap?' + BAP':''),title:h.t,qs:qs});
    });
  }
  SPEC.forEach(function(r){
    if(systems.indexOf(r[0])<0)return;
    if(withBap&&r[0]==='bap'&&used[r[3]+'|'+r[2]])return;
    var ex=r[5]||null,id=r[0]+'_'+(ex&&ex.k?ex.k+'_':'')+cn(r[2])+((ex&&ex.sfx)||'');
    rows.push({id:id,group:r[1],title:r[3],qs:[{s:r[0],c:r[2],q:r[4]}],ex:ex});
  });
  rows.forEach(function(r){r.qs.forEach(function(q){q.det=detFor(q.s,q.c)})});
  return RC[key]=rows;
}

var CFG=window.KST_CONFIG||{};
function configured(){return CFG.url&&CFG.anonKey&&CFG.url.indexOf('YOUR-')<0&&CFG.anonKey.indexOf('YOUR-')<0}
var IDCOL={audits:'id',cars:'id',config:'key'};
function adapter(sb){
  function snapDocs(rows){return {docs:rows.map(function(r){return{id:r.id,data:function(){return r.data}}})}}
  var ch=0;
  return{
    doc:function(path){var p=path.split('/'),tbl=p[0],id=p[1],col=IDCOL[tbl];
      return{
        set:function(d){var row={data:d,updated_at:new Date().toISOString()};row[col]=id;
          return sb.from(tbl).upsert(row).then(function(r){if(r.error)throw r.error})},
        delete:function(){return sb.from(tbl).delete().eq(col,id).then(function(r){if(r.error)throw r.error})},
        onSnapshot:function(next){
          var load=function(){sb.from(tbl).select('data').eq(col,id).maybeSingle().then(function(r){
            var d=r.data&&r.data.data;next({exists:!!d,data:function(){return d}})})};
          load();sb.channel('cfg'+(++ch)).on('postgres_changes',{event:'*',schema:'public',table:tbl},load).subscribe();}
      }},
    collection:function(tbl){return{
      onSnapshot:function(next){
        var load=function(){sb.from(tbl).select('id,data').then(function(r){if(!r.error)next(snapDocs(r.data||[]))})};
        load();sb.channel('col'+tbl+(++ch)).on('postgres_changes',{event:'*',schema:'public',table:tbl},load).subscribe();}
    }}
  };
}

  var mode='in';
  var draw=function(){
    d.innerHTML='<h1 style="font-size:24px">KST Audit Hub</h1><p class="muted" style="margin:0">'+(mode==='in'?'เข้าสู่ระบบด้วยอีเมลบริษัทและรหัสผ่าน':'ลงทะเบียนครั้งแรก: ตั้งรหัสผ่านของคุณ (อย่างน้อย 6 ตัวอักษร)')+'</p>'+
     '<label class="f">อีเมลบริษัท (พิมพ์เฉพาะชื่อหน้า @ ก็ได้)<input id="lg-mail" type="text" inputmode="email" placeholder="ชื่อ@kst-hatyai.com" autocomplete="username" autocapitalize="off"></label>'+
     '<label class="f">รหัสผ่าน<input id="lg-pw" type="password" autocomplete="'+(mode==='in'?'current-password':'new-password')+'"></label>'+
     (mode==='up'?'<label class="f">ยืนยันรหัสผ่าน<input id="lg-pw2" type="password" autocomplete="new-password"></label>':'')+
     '<button class="btn pri" id="lg-go">'+(mode==='in'?'เข้าสู่ระบบ':'ลงทะเบียน')+'</button>'+
     '<div class="small"><a href="#" id="lg-sw">'+(mode==='in'?'ยังไม่เคยเข้าใช้ — ลงทะเบียนครั้งแรก':'มีบัญชีแล้ว — เข้าสู่ระบบ')+'</a>'+(mode==='in'?' · <a href="#" id="lg-fg">ลืมรหัสผ่าน</a>':'')+'</div><div class="small" id="lg-msg">'+esc(msg||'')+'</div>';
    var g=function(i){return document.getElementById(i)},say=function(t){g('lg-msg').textContent=t};
    var mail=function(){var m=g('lg-mail').value.trim().toLowerCase();if(m&&m.indexOf('@')<0)m+='@kst-hatyai.com';
      if(!/^[^@\s]+@kst-hatyai\.com$/.test(m)&&m!==ADMIN2){say('ใช้ได้เฉพาะอีเมลบริษัท @kst-hatyai.com');return null}return m};
    g('lg-sw').onclick=function(e){e.preventDefault();mode=mode==='in'?'up':'in';msg='';draw()};
    if(g('lg-fg'))g('lg-fg').onclick=function(e){e.preventDefault();var m=mail();if(!m)return;
      sb.auth.resetPasswordForEmail(m,{redirectTo:location.href.split('#')[0]}).then(function(r){say(r.error?'ส่งไม่ได้: '+r.error.message:'ส่งลิงก์ตั้งรหัสผ่านใหม่ไปที่ '+m+' แล้ว')})};
    var go=function(){
      var m=mail(),pw=g('lg-pw').value;if(!m)return;if(!pw){say('กรอกรหัสผ่าน');return}
      var b=g('lg-go');b.disabled=true;say('กำลังดำเนินการ…');
      var done=function(r){b.disabled=false;
        if(r.error){var e=r.error.message||'';
          say(/invalid login/i.test(e)?'อีเมลหรือรหัสผ่านไม่ถูกต้อง (ถ้ายังไม่เคยลงทะเบียน กดลิงก์ด้านล่าง)':/already|registered/i.test(e)?'อีเมลนี้ลงทะเบียนแล้ว ใช้ “เข้าสู่ระบบ” หรือ “ลืมรหัสผ่าน”':/confirm/i.test(e)?'ต้องยืนยันอีเมลก่อน (แจ้ง QMR ปิด Confirm email ใน Supabase)':/rate|limit/i.test(e)?'ลองบ่อยเกินไป รอสักครู่':e)}
        else if(r.data&&r.data.session){/* onAuthStateChange จะเปิดหน้าหลัก */}
        else say('ลงทะเบียนแล้ว — ต้องยืนยันอีเมลก่อนเข้าใช้ (แจ้ง QMR ปิด Confirm email ใน Supabase)')};
      if(mode==='in')sb.auth.signInWithPassword({email:m,password:pw}).then(done);
      else{if(pw.length<6){b.disabled=false;say('รหัสผ่านอย่างน้อย 6 ตัวอักษร');return}
        if(pw!==g('lg-pw2').value){b.disabled=false;say('รหัสผ่านทั้งสองช่องไม่ตรงกัน');return}
        sb.auth.signUp({email:m,password:pw}).then(done)}};
    g('lg-go').onclick=go;g('lg-pw').onkeydown=function(e){if(e.key==='Enter')go()};
  };
  draw();
}
function start(sb,sess){
  var d=document.getElementById('login');if(d)d.remove();
  document.querySelector('main').hidden=false;document.querySelector('header.top').hidden=false;
  S.email=(sess&&sess.user&&sess.user.email)||'';S.db=true;computeMe();whoRender();
  attach(sb,adapter(sb));show(S.tab);
}
if(configured()&&window.supabase){
  var sb=window.supabase.createClient(CFG.url,CFG.anonKey);
  if(OPEN){S.sbStarted=true;start(sb,null)}
  else sb.auth.getSession().then(function(r){
    if(r.data&&r.data.session)start(sb,r.data.session);else loginView(sb);
    sb.auth.onAuthStateChange(function(ev,sess){if(sess&&!S.sbStarted){S.sbStarted=true;if(!S.email)start(sb,sess)}});
  });
}
})();
</script>
</body></html>
