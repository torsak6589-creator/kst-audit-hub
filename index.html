จ่าย และต้องมีการบำรุงรักษาและเปลี่ยนตามความจำเป็นอย่างเหมาะสม","เจตนา: เพื่อยืนยันว่าพนักงานสามารถเข้าถึง PPE ที่ได้รับการบำรุงรักษาอย่างดีได้โดยไม่มีค่าใช้จ่าย การตีความ: การบำรุงรักษา PPE รวมถึงการทำความสะอาด การซ่อมแซม และการเปลี่ยน PPE ตามความจำเป็น เพื่อให้มั่นใจว่าใช้งานได้ตามวัตถุประสงค์"],["2a","BAP · 2A Social · SR12","SR12.1","","สถานประกอบการต้องจัดให้พนักงานทุกคนสามารถเข้าถึงสถานพยาบาลได้ รวมถึงการเข้าถึงหรือการติดต่อสื่อสารกับหน่วยงานทางการแพทย์และหน่วยงานฉุกเฉินอื่น ๆ ในกรณีเกิดเหตุฉุกเฉินหรืออุบัติเหตุ","เจตนา: เพื่อยืนยันว่าสถานประกอบการให้การดูแลทางการแพทย์ที่จำเป็นแก่พนักงาน การตีความ: การดูแลทางการแพทย์ขั้นพื้นฐานอาจจัดให้ ณ สถานประกอบการ ส่วนการดูแลที่มีความซับซ้อนมากขึ้นควรจัดให้โดยสถานพยาบาลภายนอก"],["2a","BAP · 2A Social · SR12","SR12.2","","สถานประกอบการต้องจัดทำและเก็บบันทึกการดูแลทางการแพทย์ที่ให้แก่บุคคลในสถานประกอบการ บันทึกดังกล่าวต้องเก็บเป็นความลับและจัดเก็บไว้เป็นระยะเวลาอย่างน้อย 3 ปี","เจตนา: เพื่อยืนยันว่าสถานประกอบการมีการบันทึกการดูแลทางการแพทย์ที่ให้ และเก็บรักษาบันทึกไว้เป็นความลับ การตีความ: การเก็บเป็นความลับ หมายถึงมีเพียงผู้ที่จำเป็นต้องทราบเท่านั้นที่สามารถเข้าถึงบันทึกดังกล่าวได้"],["2a","BAP · 2A Social · SR12","SR12.3","","ชุดปฐมพยาบาลต้องมีการทำเครื่องหมายอย่างชัดเจน พร้อมให้พนักงานเข้าถึงได้ทันที อยู่ใกล้กับพื้นที่ปฏิบัติงานและพื้นที่พักผ่อน และปิดผนึกเพื่อป้องกันการปนเปื้อน","เจตนา: เพื่อยืนยันว่าพนักงานสามารถเข้าถึงชุดปฐมพยาบาลที่ถูกสุขลักษณะได้อย่างรวดเร็ว การตีความ: ชุดปฐมพยาบาลต้องสามารถระบุได้ง่ายว่าเป็นชุดปฐมพยาบาล ปิดมิดชิด และอยู่ในระยะใกล้จากพื้นที่ปฏิบัติงานและพื้นที่พักผ่อน"],["2a","BAP · 2A Social · SR12","SR12.3.1","","สถานประกอบการต้องจัดทำรายการอุปกรณ์ปฐมพยาบาลที่มีสำรองไว้ และวันหมดอายุของอุปกรณ์ดังกล่าว (ในกรณีที่มี) รายการใด ๆ ที่หมดอายุต้องได้รับการเปลี่ยนใหม่","เจตนา: เพื่อให้สถานประกอบการทราบว่ามีอุปกรณ์ปฐมพยาบาลชนิดใดสำรองไว้ และเมื่อใดที่ต้องเปลี่ยนใหม่ การตีความ: องค์การแรงงานระหว่างประเทศ (ILO) ระบุว่า กล่องปฐมพยาบาลแบบพื้นฐานทั่วไปมักประกอบด้วยรายการดังต่อไปนี้: • แผ่นปิดแผลปลอดเชื้อแบบห่อแยกชิ้น; • ผ้าพันแผล (และผ้าพันแผลห้ามเลือด ในกรณีที่เหมาะสม); • ผ้าปิดแผลหลากหลายชนิด; • แผ่นปลอดเชื้อสำหรับแผลไฟไหม้/น้ำร้อนลวก; • แผ่นปิดตาปลอดเชื้อ; • ผ้าพันแผลรูปสามเหลี่ยม; • เข็มกลัดซ่อนปลาย; • กรรไกรหนึ่งคู่; • น้ำยาฆ่าเชื้อ; • สำลีก้อน; • บัตรคำแนะนำการปฐมพยาบาล"],["2a","BAP · 2A Social · SR12","SR12.4","","สถานประกอบการต้องมีขั้นตอนการเยียวยาสำหรับบุคคลที่ได้รับบาดเจ็บโดยตรงจากอุบัติเหตุในสถานที่ทำงาน และปัจจุบันไม่มีความสามารถทางการแพทย์ในการปฏิบัติหน้าที่การทำงานตามสัญญาจ้างได้","เจตนา: เพื่อยืนยันว่าพนักงานได้รับการช่วยเหลือหากได้รับบาดเจ็บจากการทำงานและไม่สามารถปฏิบัติหน้าที่ตามงานที่ได้รับมอบหมายได้อีกต่อไป การตีความ: ขั้นตอนการเยียวยาจะจัดทำขึ้นโดยอาศัยคำแนะนำของผู้เชี่ยวชาญทางการแพทย์ เพื่อกำหนดว่างานประเภทใดที่พนักงานยังมีความสามารถทางการแพทย์ในการปฏิบัติได้ การเยียวยาอาจรวมถึงการชดเชยทางการเงินหากพนักงานไม่สามารถทำงานได้อีกต่อไป หรือสามารถปฏิบัติหน้าที่ได้เพียงงานที่มีค่าตอบแทนต่ำกว่าเดิม"],["2a","BAP · 2A Social · SR13","SR13.1","","สถานประกอบการต้องมีการฝึกอบรมพนักงานที่มีการบันทึกเป็นเอกสาร โดยพิจารณาตามบทบาทหน้าที่เฉพาะของพนักงานภายในองค์กร ในด้านต่าง ๆ ซึ่งรวมถึงแต่ไม่จำกัดเพียงหัวข้อที่ระบุไว้ด้านล่างนี้ การฝึกอบรมทั้งหมดต้องอยู่ภายใต้การควบคุมดูแลของผู้มีอำนาจที่ผ่านการฝึกอบรม (competent authority) • การควบคุมเครื่องจักรและอุปกรณ์อันตรายอื่น ๆ • สารเคมีอันตราย สารพิษ และการใช้งานและการกำจัดวัสดุอันตราย รวมถึงการทำความสะอาดกรณีสารหกรั่วไหล • การฝึกอบรมปฐมนิเทศพนักงานใหม่ในเรื่องสุขภาพทั่วไป ความปลอดภัย คุณภาพผลิตภัณฑ์ และการป้องกันการปนเปื้อนผลิตภัณฑ์ ต้องดำเนินการก่อนที่พนักงานจะเริ่มปฏิบัติงานใด ๆ หรือการฝึกอบรมในขณะปฏิบัติงาน • การป้องกันและความปลอดภัยจากอัคคีภัยและไฟฟ้าฉุกเฉิน • สุขวิทยาส่วนบุคคล • ความปลอดภัยด้านอาหารและหลักเกณฑ์วิธีการที่ดีในการผลิต (GMP) • โครงการฝึกอบรมทบทวนความรู้ • ด้านอื่นใดที่พิจารณา…","เจตนา: เพื่อยืนยันว่าพนักงานได้รับการฝึกอบรมในด้านที่สำคัญและมีใบอนุญาตที่จำเป็น การตีความ: การฝึกอบรมควรจัดขึ้นอย่างน้อยปีละครั้ง และเป็นส่วนหนึ่งของการฝึกอบรมสำหรับพนักงานใหม่"],["2a","BAP · 2A Social · SR13","SR13.2","","โปรแกรมการฝึกอบรมต้องมีข้อกำหนดที่เฉพาะเจาะจงในการติดตาม ตรวจสอบ และบันทึกประสิทธิผลของการฝึกอบรม และต้องมั่นใจว่าโปรแกรมการฝึกอบรมได้ถูกนำไปปรับใช้ในสถานที่ทำงานอย่างมีประสิทธิผล","เจตนา: เพื่อยืนยันว่าการฝึกอบรมได้ถูกนำไปปรับใช้กับงานอย่างมีประสิทธิผล"],["2a","BAP · 2A Social · SR13","SR13.2.1","","ต้องจัดทำและเก็บรักษาบันทึกที่ยืนยันการฝึกอบรมที่เหมาะสมสำหรับองค์ประกอบทั้งหมดที่กล่าวมาข้างต้นเป็นระยะเวลา 3 ปี","เจตนา: เพื่อยืนยันว่าการฝึกอบรมมีการบันทึกเป็นเอกสารและเก็บรักษาบันทึกไว้เป็นเวลา 3 ปี การตีความ: การยืนยันการฝึกอบรมอาจรวมถึงรายชื่อผู้เข้าร่วมในหลักสูตรการฝึกอบรมแต่ละหลักสูตร"],["2a","BAP · 2A Social · SR13","SR13.3","","การฝึกอบรมทั้งหมดต้องดำเนินการภายในเวลาทำงานปกติของพนักงาน และไม่มีค่าใช้จ่ายทางการเงินใด ๆ ต่อพนักงาน ในกรณีที่ต้องจัดการฝึกอบรมนอกเวลาทำงานปกติ พนักงานต้องได้รับค่าตอบแทนสำหรับเวลาดังกล่าว และได้รับค่าจ้างในอัตราพิเศษสำหรับชั่วโมงการทำงานล่วงเวลาใด ๆ ตามที่ระบุไว้ในข้อ SR2.4","เจตนา: เพื่อยืนยันว่าการฝึกอบรมจัดให้โดยไม่มีค่าใช้จ่าย และหากจัดขึ้นนอกเวลาทำงาน พนักงานจะได้รับค่าตอบแทนสำหรับเวลาดังกล่าว การตีความ: ต้องจ่ายค่าจ้างในอัตราพิเศษหากการฝึกอบรมนั้นส่งผลให้เกิดชั่วโมงการทำงานล่วงเวลา"],["2b","BAP · 2B Enhanced · หมวด 1","1.1","","โรงงานต้องมีมาตรฐาน (ESM) ฉบับปัจจุบันพร้อมให้พนักงานและผู้ตรวจประเมินเข้าถึงได้","เจตนา: โรงงานทราบถึงมาตรฐานฉบับปัจจุบันล่าสุด และมีการทบทวนอย่างสม่ำเสมอเพื่อให้มั่นใจว่ามีการปฏิบัติตาม"],["2b","BAP · 2B Enhanced · หมวด 1","1.2","","โรงงาน หรือบริษัทแม่ ต้องมีกระบวนการทบทวนและติดตามกฎหมายระดับประเทศและระดับท้องถิ่น เพื่อให้มั่นใจว่านโยบายและขั้นตอนการปฏิบัติงานเป็นปัจจุบันและสอดคล้องกับกฎระเบียบที่บังคับใช้อย่างถูกต้อง","เจตนา: เพื่อยืนยันว่าโรงงานมีกระบวนการสำหรับการปฏิบัติตามกฎหมายและกฎระเบียบของประเทศ"],["2b","BAP · 2B Enhanced · หมวด 1","1.3","","โรงงานต้องมีนโยบายด้านสิทธิมนุษยชน (Human Rights Policy) เป็นลายลักษณ์อักษรซึ่งได้รับการอนุมัติจากผู้บริหารระดับสูง ครอบคลุมการดำเนินงานทุกส่วนของโรงงาน และกำหนดแผนกหรือผู้แทนฝ่ายบริหารที่รับผิดชอบดูแลการนำไปปฏิบัติไว้อย่างชัดเจน","เจตนา: เพื่อยืนยันการมีอยู่ของนโยบายด้านสิทธิมนุษยชน ความมุ่งมั่นของผู้บริหารระดับสูง และแผนการนำไปปฏิบัติจริง การตีความ: ผู้บริหารระดับสูง คือ ระดับบริหารสูงสุดขององค์กร นโยบายด้านสิทธิมนุษยชนควรมีพื้นฐานจากหลักการชี้แนะแห่งสหประชาชาติว่าด้วยธุรกิจกับสิทธิมนุษยชน (UN Guiding Principles on Business and Human Rights) ปฏิญญาสากลว่าด้วยสิทธิมนุษยชน (Universal Declaration of Human Rights) และอนุสัญญาที่เกี่ยวข้องขององค์การแรงงานระหว่างประเทศ (International Labor Organization)"],["2b","BAP · 2B Enhanced · หมวด 1","1.4","","นโยบายด้านสิทธิมนุษยชนต้องได้รับการสื่อสารไปยังพนักงานทุกคน ผู้รับเหมา คู่ค้าทางธุรกิจที่เกี่ยวข้อง และผู้มีส่วนได้ส่วนเสียอื่น ๆ ที่สอบถาม","เจตนา: เพื่อยืนยันว่านโยบายด้านสิทธิมนุษยชนเป็นที่รับรู้ในกลุ่มผู้มีส่วนได้ส่วนเสียต่าง ๆ การตีความ: การสื่อสารกับพนักงานควรใช้ภาษาที่พนักงานเข้าใจ และสำหรับพนักงานที่อ่านไม่ออกเขียนไม่ได้ ต้องสื่อสารด้วยวาจาในภาษาที่พนักงานเข้าใจ"],["2b","BAP · 2B Enhanced · หมวด 1","1.4.1","","การสื่อสารทั้งหมดกับพนักงาน ผู้รับเหมา และคู่ค้าทางธุรกิจที่เกี่ยวข้อง ต้องดำเนินการด้วยภาษาหรือรูปแบบที่ผู้รับสารเข้าใจ","เจตนา: เพื่อยืนยันว่าผู้มีส่วนได้ส่วนเสีย โดยเฉพาะพนักงาน ได้รับข้อมูลในภาษาและรูปแบบที่เข้าใจ การตีความ: การสื่อสารกับพนักงานควรใช้ภาษาที่พนักงานเข้าใจ และสำหรับพนักงานที่อ่านไม่ออกเขียนไม่ได้ ต้องสื่อสารด้วยวาจาในภาษาที่พนักงานเข้าใจ"],["2b","BAP · 2B Enhanced · หมวด 1","1.5","","พนักงานในทุกหน่วยงานที่เกี่ยวข้องต้องได้รับการฝึกอบรมเกี่ยวกับนโยบายด้านสิทธิมนุษยชนของโรงงาน และต้องมีการบันทึกการเข้าร่วมฝึกอบรมไว้เป็นหลักฐาน","เจตนา: เพื่อยืนยันว่าพนักงานทั่วทั้งองค์กรได้รับการฝึกอบรมเกี่ยวกับนโยบายด้านสิทธิมนุษยชน"],["2b","BAP · 2B Enhanced · หมวด 1","1.6","","โรงงานต้องมีนโยบายด้านจริยธรรมทางธุรกิจ ซึ่งได้รับการอนุมัติจากผู้บริหารระดับสูง เพื่อแสดงถึงความมุ่งมั่นของโรงงานในการปฏิบัติตามกฎหมายต่อต้านการติดสินบนของประเทศที่ใช้บังคับทั้งหมด และห้ามการทุจริต การข่มขู่เรียกร้องผลประโยชน์ การยักยอกทรัพย์ หรือการติดสินบนในทุกรูปแบบ ไม่ว่าโดยทางตรงหรือทางอ้อม","เจตนา: เพื่อยืนยันว่าโรงงานดำเนินงานอย่างมีจริยธรรม การตีความ: หากประเทศนั้นไม่มีกฎหมายต่อต้านการติดสินบน โรงงานยังคงต้องปฏิบัติตามมาตรฐานนี้ในเรื่องการห้ามการทุจริต การข่มขู่เรียกร้องผลประโยชน์ การยักยอกทรัพย์ หรือการติดสินบนในทุกรูปแบบ โรงงานต้องเก็บบันทึกไว้เพื่อพิสูจน์ว่ามีการปฏิบัติตามข้อกำหนดของมาตรฐานนี้อย่างต่อเนื่อง"],["2b","BAP · 2B Enhanced · หมวด 1","1.7","","โรงงานต้องไม่ปลอมแปลงข้อมูลใด ๆ เกี่ยวกับกิจกรรม โครงสร้าง และผลการดำเนินงานของโรงงาน รวมถึงข้อมูลที่อาจถูกมองว่าเป็นการบิดเบือนข้อเท็จจริงในสายอุปทาน (supply chain)","เจตนา: เพื่อยืนยันว่าโรงงานมีนโยบายป้องกันการให้ข้อมูลที่เป็นเท็จหรือทำให้เข้าใจผิดโดยเจตนา"],["2b","BAP · 2B Enhanced · หมวด 1","1.8","","โรงงานต้องแจ้งให้ผู้ส่งมอบและลูกค้าทั้งหมดทราบถึงนโยบายและข้อกำหนดด้านการค้าที่มีจริยธรรม (Ethical Trading Policy) ของโรงงาน","เจตนา: เพื่อยืนยันว่าผู้ส่งมอบและลูกค้าของโรงงานรับทราบนโยบายการค้าที่มีจริยธรรม"],["2b","BAP · 2B Enhanced · หมวด 1","1.9","","พนักงานทุกคนต้องได้รับการฝึกอบรม/แจ้งข้อมูลเกี่ยวกับนโยบายการค้าที่มีจริยธรรมและขั้นตอนที่เกี่ยวข้อง และต้องมีการบันทึกไว้เป็นหลักฐาน","เจตนา: เพื่อยืนยันว่าพนักงานทุกคนเข้าใจนโยบายการค้าที่มีจริยธรรม เพื่อช่วยให้มั่นใจว่ามีการปฏิบัติตามนโยบายดังกล่าว"],["2b","BAP · 2B Enhanced · หมวด 1","1.10","","โรงงานต้องดำเนินการควบคุมอย่างเหมาะสมตามขอบเขตของมาตรฐานนี้ต่อผู้รับเหมา/โรงงานใด ๆ ที่ใช้ในการจ้างเหมาช่วงกระบวนการที่อาจส่งผลกระทบต่อความรับผิดชอบต่อสังคม","เจตนา: เพื่อยืนยันว่างานที่จ้างเหมาช่วงดำเนินการโดยยึดถือมาตรฐานด้านสังคมเดียวกันกับที่กำหนดไว้ในมาตรฐานนี้ เช่นเดียวกับโรงงาน การตีความ: การควบคุมอย่างเหมาะสม หมายถึง การกำหนดให้ใช้มาตรฐานด้านสังคมเดียวกัน และมีกระบวนการยืนยันว่ามีการปฏิบัติตามมาตรฐานดังกล่าวจริง"],["2b","BAP · 2B Enhanced · หมวด 1","1.11","","โรงงานต้องมีนโยบายหรือขั้นตอนการตรวจประเมินภายในด้าน ESM (ESM Internal Audit) เป็นลายลักษณ์อักษร ซึ่งต้องมีการทบทวนเป็นประจำทุกปี และอยู่ภายใต้การกำกับดูแลของผู้มีอำนาจหน้าที่และ/หรือหน่วยงานที่มีความรู้ความสามารถภายในองค์กร","เจตนา: เพื่อยืนยันว่าโรงงานมีนโยบายและกระบวนการสำหรับการตรวจประเมินภายในด้าน ESM"],["2b","BAP · 2B Enhanced · หมวด 1","1.12","","ข้อไม่สอดคล้องทั้งหมดที่พบจากการตรวจประเมินภายในด้าน ESM ต้องได้รับการปิดประเด็นก่อนการตรวจประเมินภายนอกด้าน ESM โดยต้องระบุมาตรการแก้ไขและระยะเวลาที่ใช้ในการดำเนินการ","เจตนา: เพื่อยืนยันว่าโรงงานมีการตรวจประเมินภายในด้านสังคม และดำเนินการแก้ไขข้อไม่สอดคล้องก่อนการตรวจประเมินภายนอก"],["2b","BAP · 2B Enhanced · หมวด 1","1.13","","ผู้ตรวจประเมินภายในต้องได้รับการฝึกอบรมในการตรวจประเมินภายในตามมาตรฐาน ESM นี้ และห้ามให้ผู้ตรวจประเมินตรวจประเมินในหมวดใดของมาตรฐานนี้ที่ตนเองรับผิดชอบโดยตรง","เจตนา: เพื่อยืนยันความน่าเชื่อถือของการตรวจประเมินภายใน"],["2b","BAP · 2B Enhanced · หมวด 1","1.14","","ข้อไม่สอดคล้องและมาตรการแก้ไขทั้งหมดที่เกิดขึ้นจากการตรวจประเมินภายในต้องแจ้งให้ทีมผู้บริหารระดับสูงของโรงงานทราบเพื่อพิจารณาอนุมัติ","เจตนา: เพื่อยืนยันว่าผู้บริหารระดับสูงมีการทบทวนและอนุมัติมาตรการแก้ไข"],["2b","BAP · 2B Enhanced · หมวด 1","1.15","","บันทึกและเอกสารอื่น ๆ ทั้งหมดต้องมีความถูกต้อง และต้องไม่มีหลักฐานหรือข้อบ่งชี้ของการปลอมแปลงหรือการดัดแปลงข้อมูล","เจตนา: เพื่อยืนยันความถูกต้องของเอกสาร การตีความ: บันทึกต้องอ่านออกได้ชัดเจนและบันทึกข้อมูลของสิ่งที่ถูกติดตามหรืออธิบายไว้อย่างถูกต้องตามที่เกิดขึ้นจริง ต้องระบุเวลาและวันที่ที่ถูกต้อง การควบคุมบันทึกต้องแสดงให้เห็นได้โดยการกำหนดผู้มีอำนาจในการเข้าถึงและดูแลรักษาบันทึก บันทึกต้องอ่านออกได้ชัดเจนโดยไม่ใช้น้ำยาลบคำผิด (white out/liquid paper/liquid correction) สำหรับการแก้ไขข้อผิดพลาดหรือเอกสารที่ไม่ถูกต้อง การแก้ไขบันทึกใด ๆ ต้องทำโดยขีดเส้นตรงพาดผ่านข้อความที่ผิดอย่างเรียบร้อย และเขียนข้อมูลที่ถูกต้องไว้ พร้อมทั้งระบุเหตุผลของข้อผิดพลาด และลงชื่อย่อของผู้บันทึกข้อมูลไว้เหนือข้อความที่ถูกขีดฆ…"],["2b","BAP · 2B Enhanced · หมวด 2","2.1","","โรงงานต้องดูแลให้พนักงานทุกคนได้รับค่าจ้างไม่น้อยกว่าอัตราค่าจ้างขั้นต่ำตามกฎหมาย สำหรับสัปดาห์การทำงานปกติ โดยไม่รวมค่าล่วงเวลา หรืออัตราค่าจ้างที่กำหนดไว้ในสัญญาจ้างงานหรือข้อตกลงร่วมด้านแรงงาน (collective bargaining agreement) แล้วแต่อัตราใดสูงกว่า","เจตนา: เพื่อยืนยันว่าพนักงานได้รับค่าจ้างไม่น้อยกว่าที่ได้รับการรับปากไว้ หรือค่าจ้างขั้นต่ำ แล้วแต่อัตราใดสูงกว่า การตีความ: ครอบคลุมพนักงานทุกประเภท ได้แก่ พนักงานที่จ้างโดยตรง พนักงานพาร์ทไทม์ พนักงานที่รับค่าจ้างตามผลงาน (piece rate) พนักงานสัญญาจ้าง และพนักงานผู้รับเหมาช่วง"],["2b","BAP · 2B Enhanced · หมวด 2","2.1.1","","พนักงานไม่รู้สึกว่าถูกบังคับให้ทำงานโดยไม่ได้รับค่าจ้างหรือได้รับค่าจ้างต่ำ","เจตนา: เพื่อยืนยันว่าพนักงานไม่รู้สึกถูกกดดันให้ทำงานโดยได้รับค่าจ้างน้อยกว่าที่ตกลงไว้"],["2b","BAP · 2B Enhanced · หมวด 2","2.2","","โรงงานต้องมีแผนงานและบันทึกขั้นตอนการดำเนินการเพื่อบรรลุแผนดังกล่าว ซึ่งต้องมีการทบทวนอย่างน้อยปีละครั้ง เพื่อจ่ายค่าจ้างที่เพียงพอต่อการดำรงชีพ (living wage) แก่พนักงาน โดยอ้างอิงจากการประเมินความต้องการค่าจ้างในระดับท้องถิ่นเพื่อครอบคลุมค่าใช้จ่ายพื้นฐานของพนักงาน และเผื่อเงินสำหรับใช้จ่ายตามความจำเป็นของพนักงานและครอบครัว","เจตนา: เพื่อยืนยันว่าโรงงานมีแผนงานที่มีการทบทวนอย่างสม่ำเสมอเพื่อจ่ายค่าจ้างที่เพียงพอต่อการดำรงชีพ การตีความ: องค์การแรงงานระหว่างประเทศ (ILO) นิยามค่าจ้างที่เพียงพอต่อการดำรงชีพ (living wage) ว่าคือ \"ระดับค่าจ้างที่จำเป็นสำหรับให้พนักงานและครอบครัวมีมาตรฐานการครองชีพที่เหมาะสม โดยพิจารณาตามสภาพการณ์ของประเทศ และคำนวณจากงานที่ปฏิบัติในช่วงเวลาทำงานปกติ\" ตำแหน่งงานของพนักงาน อายุงานในบริษัท หรือปัจจัยอื่น ๆ ไม่ถือเป็นเงื่อนไขในการพิจารณาว่าพนักงานควรได้รับค่าจ้างที่เพียงพอต่อการดำรงชีพหรือไม่ แต่ปัจจัยดังกล่าวอาจนำมาพิจารณาเป็นส่วนหนึ่งของแผนงานของโรงงานในการมุ่งสู่การจ่ายค่าจ้างที่เพียงพอต่…"],["2b","BAP · 2B Enhanced · หมวด 2","2.3","","สถานประกอบการต้องจัดให้มีสวัสดิการอย่างน้อยตามที่กฎหมายท้องถิ่นหรือกฎหมายระดับประเทศ หรือข้อตกลงร่วมในการเจรจาต่อรอง (Collective Bargaining Agreement) กำหนด หากกฎหมายไม่ได้กำหนดไว้ สถานประกอบการต้องพยายามจัดให้มีสวัสดิการขั้นพื้นฐานเพื่อให้คนงานมีสภาพการทำงานที่เหมาะสม ซึ่งรวมถึงสิทธิการลาพักร้อน สวัสดิการเมื่อเจ็บป่วย การประกันสุขภาพหรือประกันการรักษาพยาบาล และการลาคลอด/ลาเพื่อเลี้ยงดูบุตรโดยได้รับค่าจ้าง","เจตนา: เพื่อยืนยันว่าคนงานได้รับสวัสดิการที่พึงมีสิทธิได้รับ และอย่างน้อยได้รับสวัสดิการขั้นพื้นฐาน หรือสถานประกอบการมีแผนดำเนินการเพื่อไปสู่การจัดสวัสดิการขั้นพื้นฐานและสวัสดิการที่ตกลงกันไว้ในสัญญาจ้างงานหรือข้อตกลงร่วมในการเจรจาต่อรอง การตีความ: ข้อกำหนดนี้ใช้กับคนงานทุกคน รวมถึงคนงานที่จ้างผ่านบุคคลที่สามและคนงานต่างชาติ"],["2b","BAP · 2B Enhanced · หมวด 2","2.4","","สถานประกอบการต้องจ่ายค่าตอบแทนแก่คนงานสำหรับชั่วโมงการทำงานล่วงเวลาที่เกินกว่าสัปดาห์การทำงานมาตรฐานที่กำหนดโดยกฎหมายระดับประเทศ ในอัตราพิเศษ (premium rate) เท่ากับอัตราที่กำหนดไว้ในสัญญาจ้างงาน ข้อตกลงร่วมในการเจรจาต่อรอง หรือกฎหมายท้องถิ่น แล้วแต่อัตราใดจะสูงกว่า","เจตนา: เพื่อยืนยันว่าคนงานได้รับค่าตอบแทนล่วงเวลาในอัตราพิเศษที่ถูกต้อง การตีความ: หากไม่ได้กำหนดอัตราพิเศษสำหรับค่าล่วงเวลาไว้ อนุสัญญาองค์การแรงงานระหว่างประเทศ (ILO) ฉบับที่ 1 และฉบับที่ 30 ระบุว่าอัตราค่าจ้างล่วงเวลาต้องไม่น้อยกว่า 1.25 เท่าของอัตราค่าจ้างปกติ อัตราพิเศษค่าล่วงเวลาที่ร้อยละ 50 เหนือกว่าค่าจ้างปกติเป็นมาตรฐานที่ใช้ในหลายประเทศ ในบางเขตอำนาจศาล ข้อตกลงร่วมในการเจรจาต่อรอง (Collective Bargaining Agreement: CBA) สามารถเจรจาเงื่อนไขที่ต่ำกว่าที่กฎหมายกำหนดได้อย่างถูกต้องตามกฎหมาย ในกรณีดังกล่าว จะไม่ถือเป็นข้อบกพร่อง (NC) หากอัตราค่าล่วงเวลาใน CBA ต่ำกว่าอัตราค่าล่วงเวลาที่กฎห…"],["2b","BAP · 2B Enhanced · หมวด 2","2.5","","สถานประกอบการต้องไม่หักค่าจ้างในลักษณะที่กฎหมายระดับประเทศไม่อนุญาต","เจตนา: เพื่อยืนยันว่ามีการหักเงินเฉพาะรายการที่ได้รับอนุญาตเท่านั้น การตีความ: การหักเงินคือจำนวนเงินใดๆ ที่ถูกหักออกจากค่าจ้าง โดยทั่วไปการหักเงินมักเป็นไปเพื่อประโยชน์ของคนงาน เช่น ประกันสุขภาพ เงินออมเพื่อการเกษียณอายุ แต่ก็อาจเป็นการหักเพื่อภาษีได้เช่นกัน การหักเงินต้องไม่ถูกนำมาใช้เป็นส่วนหนึ่งของมาตรการทางวินัย หรือเพื่อชำระค่าใช้จ่ายที่จำเป็นสำหรับการทำงาน เช่น อุปกรณ์หรือค่าเดินทางมายังสถานประกอบการ"],["2b","BAP · 2B Enhanced · หมวด 2","2.6","","สถานประกอบการต้องไม่หักค่าจ้างเป็นส่วนหนึ่งของกระบวนการทางวินัย","ดูข้อมูลข้างต้น"],["2b","BAP · 2B Enhanced · หมวด 2","2.7","","คนงานต้องได้รับแจ้งเกี่ยวกับการหักเงินใดๆ เป็นลายลักษณ์อักษร และ/หรือด้วยภาษา/รูปแบบที่คนงานสามารถเข้าใจได้","เจตนา: เพื่อยืนยันว่าคนงานเข้าใจรายการหักเงินที่ได้รับอนุญาต การตีความ: หากมีคนงานที่ไม่สามารถอ่านออกเขียนได้ นอกจากการให้ข้อมูลเป็นลายลักษณ์อักษรแล้ว ควรมีการสื่อสารด้วยวาจาในภาษาที่คนงานเข้าใจ และ/หรือผ่านรูปภาพด้วย"],["2b","BAP · 2B Enhanced · หมวด 2","2.8","","สถานประกอบการสามารถเข้าถึงบัญชีธนาคารของคนงานได้เฉพาะเพื่อการนำเงินเข้าบัญชีเท่านั้น","เจตนา: เพื่อยืนยันว่าสถานประกอบการไม่ได้ใช้ข้อมูลบัญชีของคนงานเพื่อถอนเงิน การตีความ: หากสถานประกอบการกำหนดให้คนงานต้องให้ข้อมูลบัญชีธนาคารเพื่อการโอนเงินทางอิเล็กทรอนิกส์ สถานประกอบการต้องจัดเก็บรายละเอียดบัญชีธนาคารไว้ในที่ปลอดภัย และใช้ข้อมูลดังกล่าวเพื่อการนำเงินเข้าบัญชีของคนงานเท่านั้น"],["2b","BAP · 2B Enhanced · หมวด 2","2.9","","การจ่ายค่าจ้างต้องไม่จ่ายให้แก่บุคคลอื่นที่ไม่ใช่ตัวคนงาน หรือเข้าบัญชีที่คนงานไม่ได้เป็นผู้ควบคุมดูแล","เจตนา: เพื่อยืนยันว่าคนงาน ไม่ใช่บริษัทจัดหางาน สมาชิกในครอบครัว หรือหน่วยงานอื่น เป็นผู้รับค่าจ้างของคนงานโดยตรง การตีความ: สถานประกอบการต้องมีกระบวนการตรวจสอบว่าคนงานเป็นผู้ควบคุมบัญชีนี้โดยตรง และบัญชีดังกล่าวไม่ได้ถูกควบคุมโดยผู้จัดหาแรงงาน สมาชิกในครอบครัว หรือหน่วยงานอื่น"],["2b","BAP · 2B Enhanced · หมวด 2","2.10","","คนงานทุกคนต้องได้รับค่าจ้างเต็มจำนวน เป็นเงินที่ชำระหนี้ได้ตามกฎหมาย (legal tender) หรือโอนเข้าบัญชีธนาคารในชื่อของคนงานโดยตรง อย่างน้อยเดือนละครั้งหรือบ่อยกว่านั้นตามที่ระบุไว้ในสัญญาจ้างงานของคนงาน ไม่อนุญาตให้มีการจ่ายค่าจ้างล่าช้าหรือจ่ายอย่างไม่สม่ำเสมอ และไม่อนุญาตให้มีการบังคับออมเงิน","เจตนา: เพื่อยืนยันว่าคนงานได้รับค่าจ้างอย่างสม่ำเสมอ ครบเต็มจำนวน และตรงเวลา และคนงานสามารถเข้าถึงเงินทั้งหมดได้ การตีความ: \"คนงานทุกคน\" หมายรวมถึงคนงานที่จ้างโดยตรง คนงานผู้รับเหมา และคนงานต่างชาติ เงินที่ชำระหนี้ได้ตามกฎหมาย (Legal tender) คือเงินที่มีผลบังคับใช้ตามกฎหมายสำหรับการชำระหนี้"],["2b","BAP · 2B Enhanced · หมวด 2","2.10.1","","การจ่ายค่าจ้างทุกครั้งต้องมีการจัดทำเป็นเอกสาร และต้องออกสลิปเงินเดือนให้แก่คนงาน โดยแสดงข้อมูลอย่างน้อยเกี่ยวกับค่าจ้างและรายการหักเงิน","เจตนา: เพื่อยืนยันว่าคนงานได้รับเอกสารแสดงการจ่ายค่าจ้าง การตีความ: เอกสารควรระบุค่าจ้างปกติและค่าล่วงเวลา รายการหักเงิน และสวัสดิการ"],["2b","BAP · 2B Enhanced · หมวด 2","2.11","","สถานประกอบการต้องไม่ใช้ผู้รับเหมา ผู้รับเหมาช่วง คนงานชั่วคราว คนงานที่ทำงานจากที่พัก ผู้ฝึกงาน หรือรูปแบบการจ้างงานแบบไม่เต็มเวลาอื่นๆ เพื่อหลีกเลี่ยงการจ่ายสวัสดิการ ประกันสังคม และอื่นๆ ที่กฎหมายท้องถิ่นหรือกฎหมายระดับประเทศกำหนดไว้สำหรับความสัมพันธ์การจ้างงานตามปกติ","เจตนา: เพื่อยืนยันว่าสถานประกอบการไม่ได้ลดโอกาสในการมีงานที่มีคุณค่า (decent work) การตีความ: หากสถานประกอบการจ้างคนงานที่ไม่ได้จ้างโดยตรงหรือไม่ได้ทำงานเต็มเวลา สถานประกอบการต้องมีเอกสารชี้แจงเหตุผลว่าเหตุใดจึงไม่เสนอการจ้างงานโดยตรงแบบเต็มเวลา ข้อกำหนดนี้มุ่งเน้นไปที่การพิจารณาว่ามีการใช้รูปแบบการจ้างงานดังกล่าวเพื่อหลีกเลี่ยงกฎหมายหรือไม่"],["2b","BAP · 2B Enhanced · หมวด 2","2.12","","สถานประกอบการต้องเก็บรักษาเอกสารที่เกี่ยวข้องทั้งหมด รวมถึงบันทึกการทำงานและบัตรลงเวลาที่ครบถ้วนและถูกต้อง เพื่อพิสูจน์ว่าคนงานทุกคน รวมถึงคนงานที่รับค่าจ้างตามผลงาน (piece rate) และคนงานที่จ้างผ่านบุคคลที่สาม ได้รับค่าจ้างเป็นไปตามกฎหมายท้องถิ่นและกฎหมายระดับประเทศที่ควบคุมเรื่องค่าจ้างขั้นต่ำ ค่าล่วงเวลา และสวัสดิการ","เจตนา: เพื่อยืนยันว่าสถานประกอบการกำหนดอัตราค่าจ้างและเก็บรักษาเอกสารเพื่อพิสูจน์ว่าคนงานได้รับค่าจ้างเป็นไปตามกฎหมายท้องถิ่นและกฎหมายระดับประเทศที่ควบคุมเรื่องค่าจ้างขั้นต่ำ ค่าล่วงเวลา และสวัสดิการ การตีความ: ข้อกำหนดนี้ต้องให้สถานประกอบการกำหนดอัตราค่าจ้างสำหรับแต่ละระดับ/ประเภทของการปฏิบัติงานภายในสถานประกอบการ เพื่อให้แน่ใจว่าคนงานประจำและคนงานประเภทอื่น เช่น คนงานที่รับค่าจ้างตามผลงาน คนงานพาร์ทไทม์ และคนงานที่จ้างผ่านเอเจนซี่ ได้รับอัตราค่าจ้างเดียวกันสำหรับงานประเภทเดียวกัน และไม่มีการเลือกปฏิบัติ หากกฎหมายของประเทศกำหนดอัตราค่าจ้างและสวัสดิการ เช่น วันหยุด ก็ต้องปฏิบัติตามสำหรับตำแหน…"],["2b","BAP · 2B Enhanced · หมวด 2","2.13","","คนงานต้องไม่ถูกบังคับหรือกดดันให้เรียกร้องสิทธิประโยชน์ประกันสังคมโดยทุจริต หรือถูกบังคับให้กู้เงินหรือทำสัญญาสินเชื่อ","เจตนา: เพื่อยืนยันว่าไม่มีการเรียกร้องสิทธิประโยชน์ประกันสังคมโดยทุจริต และคนงานไม่ถูกบังคับให้ก่อหนี้"],["2b","BAP · 2B Enhanced · หมวด 2","2.14","","จุดข้อมูล: กรุณากรอกอัตราค่าจ้างล่วงเวลาเฉลี่ยต่อชั่วโมง เป็นสกุลเงินดอลลาร์สหรัฐ (USD)","การเก็บข้อมูล"],["2b","BAP · 2B Enhanced · หมวด 3","3.1","","สถานประกอบการต้องกำหนดชั่วโมงการทำงานสำหรับสัปดาห์การทำงานมาตรฐานไม่เกิน 48 ชั่วโมง ไม่รวมชั่วโมงการทำงานล่วงเวลา โดยเป็นไปตามกฎหมายท้องถิ่นหรือกฎหมายระดับประเทศ ข้อตกลงร่วมในการเจรจาต่อรองหรือข้อตกลงตามสัญญา (ถ้ามี) หรือมาตรฐานอุตสาหกรรมในประเทศนั้น แล้วแต่ข้อใดจะให้สวัสดิภาพที่ดีกว่าแก่คนงาน","เจตนา: เพื่อยืนยันว่าชั่วโมงการทำงานปกติถูกกำหนดไว้ไม่เกิน 48 ชั่วโมงต่อสัปดาห์ การตีความ: สัปดาห์การทำงานมาตรฐานไม่ควรเกิน 48 ชั่วโมง และโดยทั่วไปไม่ควรเกิน 8 ชั่วโมงต่อวัน"],["2b","BAP · 2B Enhanced · หมวด 3","3.2","","คนงานต้องไม่ทำงานล่วงเวลาเกิน 12 ชั่วโมงในสัปดาห์การทำงานมาตรฐานใดๆ เว้นแต่ได้รับอนุญาตให้ทำงานล่วงเวลาภายใต้สถานการณ์พิเศษ กฎหมายระดับประเทศอนุญาตให้ทำได้ และได้แสดงให้เห็นว่ามีมาตรการป้องกันเพื่อคุ้มครองสุขภาพและความปลอดภัยของคนงาน","เจตนา: เพื่อยืนยันว่าการทำงานล่วงเวลาเป็นไปโดยความสมัครใจและไม่มากเกินไป การตีความ: การทำงานล่วงเวลาเกิน 12 ชั่วโมงต่อสัปดาห์ไม่ควรเกิดขึ้นเป็นประจำ กล่าวคือ ไม่ควรเกิดขึ้นนานกว่า 3 เดือนในทุกๆ ระยะเวลา 6 เดือน"],["2b","BAP · 2B Enhanced · หมวด 3","3.2.1","","หากกฎหมายแห่งชาติที่บังคับใช้อนุญาตให้มีชั่วโมงการทำงานมากกว่า 60 ชั่วโมงต่อสัปดาห์ จำนวนชั่วโมงการทำงานสูงสุดทั้งหมดจะต้องได้รับการตรวจสอบว่าเป็นไปตามข้อกำหนดของกฎหมายแห่งชาติ และต้องมีการบันทึกชื่อ ตำแหน่ง และจำนวนชั่วโมงการทำงานของพนักงานในแต่ละสัปดาห์","เจตนา: เพื่อจำกัดและเก็บบันทึกการทำงานล่วงเวลาที่มากเกินไป การตีความ: หากมีข้อห่วงกังวลด้านความเป็นส่วนตัว โรงงานอาจใช้หมายเลขประจำตัวของพนักงานแทนชื่อพนักงานได้"],["2b","BAP · 2B Enhanced · หมวด 3","3.3","","พนักงานทุกคนต้องได้รับการจัดเวลาพักและเวลาพักรับประทานอาหารระหว่างการทำงานเป็นผลัด โดยต้องเป็นไปตามกฎหมายท้องถิ่นและกฎหมายแห่งชาติเป็นอย่างน้อย","เจตนา: เพื่อยืนยันว่ามีการจัดเวลาพักที่เพียงพอเพื่อช่วยปกป้องสุขภาพและความปลอดภัย การตีความ: ในวันทำงาน 8 ชั่วโมง โรงงานอาจจัดเวลาพัก เช่น 2 ครั้ง ครั้งละ 10-30 นาที บวกกับเวลาพักรับประทานอาหารกลางวันที่ยาวกว่า รวมทั้งอนุญาตให้มีเวลาพักเข้าห้องน้ำ เวลาพักละหมาด/ประกอบศาสนกิจ และเวลาพักเพื่อจัดการความจำเป็นส่วนตัวอื่น ๆ"],["2b","BAP · 2B Enhanced · หมวด 3","3.4","","พนักงานต้องมีสิทธิได้รับวันหยุดพักเต็มวันอย่างน้อย 1 วัน (24 ชั่วโมงต่อเนื่อง) หลังจากทำงานติดต่อกัน 6 วัน หรือได้รับวันหยุดพักเต็มวัน 2 วันในรอบระยะเวลา 14 วัน","เจตนา: เพื่อยืนยันว่าพนักงานมีสิทธิเลือกที่จะได้รับวันหยุดพัก การตีความ: โดยปกติควรจัดให้มีวันหยุดพักประจำสัปดาห์อย่างน้อย 1 วันเต็ม ในกรณีที่ปริมาณการผลิตเพิ่มสูงขึ้นจนต้องทำงานอย่างต่อเนื่อง ควรจัดให้มีวันหยุดพักเต็มวันอย่างน้อย 2 วันทุกสองสัปดาห์ พนักงานอาจเลือกที่จะไม่ใช้วันหยุดดังกล่าวก็ได้ สำหรับโรงงานแปรรูปในพื้นที่ห่างไกลที่จับสัตว์น้ำจากธรรมชาติและดำเนินงานตามฤดูกาล (ดำเนินงานต่อเนื่องน้อยกว่า 3 เดือน) พนักงานอาจตกลงไว้เป็นส่วนหนึ่งของสัญญาว่าในสถานการณ์ที่มีเหตุจำเป็นพิเศษเพื่อป้องกันการสูญเสียสินค้าที่เน่าเสียง่าย พนักงานอาจต้องทำงานติดต่อกันเกิน 14 วัน ในสถานการณ์พิเศษดังกล่าว หน่…"],["2b","BAP · 2B Enhanced · หมวด 3","3.5","","จุดข้อมูล: กรุณาระบุจำนวนชั่วโมงการทำงานล่วงเวลาเฉลี่ยของพนักงานต่อเดือน","การเก็บข้อมูล"],["2b","BAP · 2B Enhanced · หมวด 3","3.6","","จุดข้อมูล: กรุณาระบุจำนวนชั่วโมงทำงานเฉลี่ยของพนักงานในสัปดาห์ทำงานปกติ","การเก็บข้อมูล"],["2b","BAP · 2B Enhanced · หมวด 4","4.1","","การทำงานทั้งหมด รวมถึงการทำงานล่วงเวลา ต้องเป็นไปโดยความสมัครใจ พนักงานต้องมีสิทธิยกเลิกสัญญาการจ้างงานของตน รวมถึงข้อตกลงเกี่ยวกับการทำงานล่วงเวลาโดยความสมัครใจ โดยไม่ถูกข่มขู่ด้วยบทลงโทษหรือมาตรการลงโทษ และสามารถลาออกจากงานได้หลังจากแจ้งล่วงหน้าตามระยะเวลาที่ตกลงกันไว้ หนี้สินที่มีต่อโรงงานหรือบุคคลอื่นใดต้องไม่เป็นเหตุขัดขวางพนักงานจากการยกเลิกสัญญาการจ้างงาน","เจตนา: เพื่อป้องกันการใช้แรงงานบังคับ และยืนยันว่าการทำงานเป็นไปโดยความสมัครใจ การตีความ: พนักงานควรให้ความยินยอมโดยเสรีและได้รับข้อมูลครบถ้วน การข่มขู่ด้วยบทลงโทษครอบคลุมถึงการบังคับขู่เข็ญทั้งทางตรงและทางอ้อมในหลากหลายรูปแบบ หากพนักงานตกลงยินยอมทำงานล่วงเวลาไว้ในสัญญาจ้าง การทำงานล่วงเวลาดังกล่าวถือเป็นการทำงานโดยความสมัครใจ เว้นแต่มีข้อบ่งชี้ของการใช้แรงงานบังคับ ตามข้อมูลของ ILO Helpdesk ระบุว่า \"การกำหนดให้ทำงานล่วงเวลาไม่ถือเป็นการใช้แรงงานบังคับ ตราบใดที่อยู่ภายในขอบเขตที่กฎหมายแห่งชาติหรือข้อตกลงร่วมอนุญาตไว้ หากเกินขอบเขตดังกล่าว จำเป็นต้องพิจารณาสถานการณ์ที่ก่อให้เกิดความเชื่อมโยงระ…"],["2b","BAP · 2B Enhanced · หมวด 4","4.1.1","","ในวันสุดท้ายของการจ้างงานหรือก่อนหน้านั้น โรงงานต้องจ่ายค่าจ้างให้แก่พนักงานสำหรับชั่วโมงการทำงานทั้งหมดนับตั้งแต่การจ่ายค่าจ้างครั้งล่าสุด ค่าจ้าง รวมถึงค่าจ้างวันหยุดที่พึงได้รับ ต้องไม่มีเงื่อนไขว่าต้องทำงานให้ครบระยะเวลาขั้นต่ำหรือระยะเวลาที่กำหนดไว้","เจตนา: เพื่อช่วยให้เกิดความมั่นใจว่าพนักงานได้รับค่าจ้างครบถ้วนสำหรับการทำงานของตน และไม่รู้สึกว่าต้องทำงานให้ครบระยะเวลาขั้นต่ำหรือระยะเวลาที่กำหนดจึงจะได้รับค่าจ้างครบถ้วน"],["2b","BAP · 2B Enhanced · หมวด 4","4.2","","โรงงานต้องไม่กระทำการค้ามนุษย์ในรูปแบบใด ๆ รวมถึงการใช้แรงงานบังคับหรือแรงงานขัดหนี้","เจตนา: เพื่อยืนยันว่าโรงงานไม่ได้ใช้แรงงานบังคับหรือแรงงานขัดหนี้ในรูปแบบใด ๆ การตีความ: แรงงานบังคับ คือ การทำงานที่เกิดขึ้นโดยไม่สมัครใจและอยู่ภายใต้การข่มขู่ด้วยบทลงโทษใด ๆ ข้อบ่งชี้ของการใช้แรงงานบังคับตาม ILO มี 11 ข้อ ได้แก่ การฉวยโอกาสจากความเปราะบาง • การหลอกลวง • การจำกัดการเดินทาง/เคลื่อนไหว • การกักตัวให้อยู่โดดเดี่ยว • ความรุนแรงทางร่างกายและทางเพศ • การข่มขู่และคุกคาม • การยึดเอกสารประจำตัว • การไม่จ่ายค่าจ้าง • การผูกมัดด้วยหนี้ (debt bondage) • สภาพการทำงานและสภาพความเป็นอยู่ที่เลวร้าย • การทำงานล่วงเวลาที่มากเกินไป สามารถดูข้อมูลเพิ่มเติมเกี่ยวกับแต่ละข้อบ่งชี้ได้ที่:https://w…"],["2b","BAP · 2B Enhanced · หมวด 4","4.3","","โรงงานต้องไม่ยึดเอกสารประจำตัวส่วนบุคคลของพนักงาน รวมถึงหนังสือเดินทาง ใบอนุญาตทำงาน และวีซ่า หรือทรัพย์สินมีค่า รวมถึงโทรศัพท์มือถือหรือช่องทางการสื่อสารอื่น ๆ ต้องไม่ขัดขวางหรือกีดกันการต่ออายุเอกสารการเดินทางหรือเอกสารประจำตัว หรือกระทำการบังคับขู่เข็ญในรูปแบบอื่นใดที่มีเจตนาบังคับให้บุคคลใดต้องทำงาน","เจตนา: เพื่อยืนยันว่าพนักงานไม่ถูกขัดขวางจากการออกจากโรงงานเนื่องจากไม่สามารถเข้าถึงเอกสารประจำตัวของตนได้ การตีความ: โรงงานอาจเก็บสำเนาเอกสารประจำตัวของพนักงานไว้ได้ แต่ข้อห้ามนี้หมายถึงการเก็บเอกสารตัวจริง"],["2b","BAP · 2B Enhanced · หมวด 4","4.4","","หากมีการใช้แรงงานนักโทษ การใช้แรงงานดังกล่าวต้องเป็นไปตามอนุสัญญา ILO ว่าด้วยแรงงานบังคับ (ฉบับที่ 29) ค.ศ. 1930","เจตนา: เพื่อยืนยันว่าแรงงานนักโทษเป็นไปโดยความสมัครใจและเคารพสิทธิแรงงาน การตีความ: ตามข้อมูลของ ILO Helpdesk ข้อบ่งชี้ที่ดีว่านักโทษยินยอมทำงานโดยเสรีหรือไม่ คือการพิจารณาว่าสภาพการจ้างงานนั้นใกล้เคียงกับความสัมพันธ์แรงงานเสรีหรือไม่ ข้อบ่งชี้มีดังนี้: • พนักงานแต่ละคนได้รับและลงนามในแบบฟอร์มความยินยอมมาตรฐานจากสถานประกอบการ ซึ่งระบุว่าตนยินยอมทำงาน แบบฟอร์มดังกล่าวระบุค่าจ้างและสภาพการทำงาน • สภาพการทำงานที่สถานประกอบการจัดให้มีลักษณะคล้ายคลึงกับการทำงานภายนอกเรือนจำ ได้แก่: o ค่าจ้างเทียบเคียงได้กับค่าจ้างของพนักงานเสรีที่มีทักษะและประสบการณ์คล้ายคลึงกันในอุตสาหกรรมหรืออาชีพที่เกี่ยวข้อง โ…"],["2b","BAP · 2B Enhanced · หมวด 4","4.5","","ห้ามกำหนดให้พนักงานต้องชำระเงินมัดจำ พันธบัตร หรือหลักประกันค้ำประกัน หรือค่าธรรมเนียมการจัดหางาน หรือค่าใช้จ่ายที่เกี่ยวข้อง ทั้งโดยทางตรงหรือทางอ้อม เพื่อให้ได้รับการจ้างงานกับโรงงาน","เจตนา: เพื่อยืนยันว่าพนักงานไม่ได้ตกอยู่ในภาวะแรงงานขัดหนี้ การตีความ: ค่าธรรมเนียมการจัดหางานและค่าใช้จ่ายที่เกี่ยวข้อง ตามคำนิยามของ ILO ครอบคลุมถึงค่าใช้จ่ายด้านการแพทย์ การเดินทาง ที่พัก อุปกรณ์ การฝึกอบรม การปฐมนิเทศ การทดสอบ และค่าใช้จ่ายด้านธุรการที่เกี่ยวข้องกับการจัดหางาน https://www.ilo.org/wcmsp5/groups/public/---ed_protect/---protrav/---migrant/documents/publication/wcms_536755.pdf. การชำระเงินดังกล่าวอาจต้องกู้ยืมเงิน โดยอาจใช้ที่ดิน ทองคำ เครื่องประดับ ยานพาหนะ หรืออุปกรณ์การเกษตร เป็นหลักประกันเงินกู้"],["2b","BAP · 2B Enhanced · หมวด 4","4.6","","พนักงานทุกคนต้องมีสิทธิเดินทางไปมาได้อย่างเสรีภายในสถานประกอบการ ยกเว้นในพื้นที่ที่มีการจำกัดการเข้าถึงด้วยเหตุผลด้านสุขภาพและความปลอดภัย และความปลอดภัยด้านอาหาร และต้องมีสิทธิออกจากสถานประกอบการเมื่อไม่ได้ปฏิบัติงาน รวมถึงการเดินทางกลับบ้านในช่วงลาพัก ห้ามมีการเฝ้าติดตามเพื่อจุดประสงค์ในการข่มขู่หรือควบคุมพนักงาน หากสถานประกอบการตั้งอยู่ในพื้นที่ห่างไกล จะต้องไม่มีการระงับการจัดหายานพาหนะเพื่อกักกันพนักงานไม่ให้ออกจากสถานที่ทำงาน","เจตนา: เพื่อยืนยันว่าการเคลื่อนย้ายของพนักงานไม่ถูกควบคุม การตีความ: สถานประกอบการต้องระบุไว้ในนโยบายเสรีภาพในการเคลื่อนย้ายว่าพนักงานทุกคนมีสิทธิที่จะออกจากสถานประกอบการได้ทุกเมื่อ หากมีการจัดหาที่พักหรือหอพักให้ หรือกำหนดให้ต้องพักอาศัย พนักงานต้องมีสิทธิเข้า-ออกได้ตามความประสงค์ และเคลื่อนย้ายได้อย่างเสรีในพื้นที่ส่วนกลางและในห้องพักของตนเอง"],["2b","BAP · 2B Enhanced · หมวด 4","4.7","","สถานประกอบการต้องแสดงข้อมูลในตำแหน่งที่เห็นได้อย่างชัดเจน โดยใช้ภาษาท้องถิ่นหรือรูปแบบที่พนักงานสามารถเข้าใจได้ เกี่ยวกับการร้องเรียนและข้อร้องทุกข์ สายด่วน หน่วยงานที่มีอำนาจหน้าที่รับผิดชอบ และแหล่งข้อมูลอื่น ๆ สำหรับผู้ที่ตกเป็นเหยื่อของการละเมิดสิทธิแรงงาน","เจตนา: เพื่อยืนยันว่าพนักงานได้รับข้อมูลเกี่ยวกับวิธีการขอความช่วยเหลือหากสิทธิแรงงานของตนถูกละเมิด การตีความ: ต้องมีการให้ข้อมูลเกี่ยวกับแหล่งข้อมูลทั้งภายในและภายนอกสถานประกอบการ"],["2b","BAP · 2B Enhanced · หมวด 4","4.8","","หากมีการให้เงินล่วงหน้าหรือเงินกู้แก่พนักงาน สถานประกอบการต้องมีนโยบายเป็นลายลักษณ์อักษรที่ระบุข้อกำหนดและเงื่อนไข และต้องสื่อสารให้พนักงานทราบอย่างเข้าใจง่ายและโปร่งใสก่อนที่พนักงานจะยอมรับเงินกู้หรือเงินล่วงหน้าดังกล่าว ข้อกำหนดเหล่านี้ต้องไม่ถูกใช้เพื่อผูกมัดพนักงานให้ต้องคงอยู่ในการจ้างงาน และต้องไม่มีอัตราดอกเบี้ยสูงกว่าอัตราตลาด พนักงานต้องไม่ถูกกำหนดให้ต้องชำระหนี้ให้หมดก่อนจึงจะสามารถลาออกจากงานได้","เจตนา: เพื่อยืนยันว่าพนักงานไม่ถูกบังคับให้คงอยู่ในงานเพื่อชำระเงินกู้ การตีความ: ข้อกำหนดและเงื่อนไขของเงินกู้ต้องเป็นประโยชน์ต่อพนักงานไม่น้อยกว่าเงินกู้จากธนาคารในท้องถิ่น และต้องอนุญาตให้พนักงานลาออกจากงานได้ก่อนที่จะชำระเงินกู้ครบถ้วน สถานประกอบการควรให้เงินกู้เป็นทางเลือกสุดท้ายเท่านั้น โดยสนับสนุนให้พนักงานขอกู้เงินจากสถาบันการเงินที่เป็นทางการก่อนเป็นอันดับแรก"],["2b","BAP · 2B Enhanced · หมวด 4","4.9","","การสื่อสารของพนักงานต้องไม่ถูกจำกัด รวมถึงต้องไม่ถูกขัดขวางจากการติดต่อกับครอบครัวหรือบุคคลอื่นภายนอกสถานประกอบการ","เจตนา: เพื่อยืนยันว่าพนักงานไม่ถูกกักกันให้อยู่อย่างโดดเดี่ยว"],["2b","BAP · 2B Enhanced · หมวด 4","4.10","","ต้องไม่มีการเปลี่ยนสัญญาจ้างงาน (contract switching) เกิดขึ้น ข้อกำหนดและเงื่อนไขในสัญญาฉบับเดิมต้องไม่ถูกเปลี่ยนแปลงโดยที่พนักงานไม่รับทราบและไม่ให้ความยินยอม","เจตนา: เพื่อยืนยันว่าข้อกำหนดและเงื่อนไขที่พนักงานได้ตกลงยอมรับนั้นเป็นประโยชน์ไม่น้อยกว่าข้อกำหนดและเงื่อนไขที่พนักงานกำลังปฏิบัติงานอยู่จริง การตีความ: ตามหลักการที่ดี พนักงานควรได้รับการแจ้งและให้ความยินยอมต่อการเปลี่ยนแปลงใด ๆ ในข้อกำหนดและเงื่อนไขการจ้างงานของตน ในทางปฏิบัติ หากมีการเปลี่ยนแปลงเกิดขึ้น เงื่อนไขดังกล่าวควรเป็นประโยชน์ไม่น้อยกว่าข้อกำหนดและเงื่อนไขที่พนักงานปฏิบัติงานอยู่ในปัจจุบันเป็นอย่างน้อย ข้อกำหนดนี้มุ่งเน้นไปที่การเปลี่ยนแปลงสัญญาแม้กระทั่งก่อนเริ่มการจ้างงาน"],["2b","BAP · 2B Enhanced · หมวด 4","4.11","","สถานประกอบการต้องมีนโยบายและขั้นตอนปฏิบัติเพื่อลดความเสี่ยงของการใช้แรงงานบังคับ","เจตนา: เพื่อช่วยป้องกันการใช้แรงงานบังคับ"],["2b","BAP · 2B Enhanced · หมวด 4","4.12","","จุดข้อมูล: พนักงานมีบาดแผลหรือการบาดเจ็บที่ไม่ได้รับการรักษา หรือมีลักษณะหวาดกลัว เก็บตัว สับสน สกปรก หรือขาดสารอาหารหรือไม่?","การเก็บข้อมูล เพื่อพิจารณาว่าพนักงานได้รับการปฏิบัติอย่างมีเกียรติและศักดิ์ศรีหรือไม่ หากคำตอบของคำถามนี้คือ ใช่ อาจบ่งชี้ถึงการละเมิดสิทธิแรงงานในด้านอื่น ๆ ด้วย"],["2b","BAP · 2B Enhanced · หมวด 4","4.13","","จุดข้อมูล: พนักงานมองไปยังหรือปล่อยให้บุคคลอื่นพูดแทนตนเองหรือไม่?","การเก็บข้อมูล เพื่อยืนยันว่าพนักงานรู้สึกสบายใจที่จะพูดแทนตนเอง หากไม่เป็นเช่นนั้น อาจบ่งชี้ว่าพนักงานไม่สามารถให้ข้อมูลที่ถูกต้องได้ และอาจกำลังปกปิดการละเมิดสิทธิแรงงาน"],["2b","BAP · 2B Enhanced · หมวด 4","4.14","","จุดข้อมูล: มีพนักงานคนใดที่ถูกแยกออกจากพนักงานคนอื่น ๆ หรือไม่?","การเก็บข้อมูล เพื่อระบุว่ามีการแยกกักกันพนักงานซึ่งอาจบ่งชี้ถึงการละเมิดสิทธิแรงงานหรือไม่"],["2b","BAP · 2B Enhanced · หมวด 4","4.15","","จุดข้อมูล: หากพนักงานเป็นหนี้สถานประกอบการ ให้ระบุสาเหตุ อัตราดอกเบี้ย และอัตราการชำระคืน","การเก็บข้อมูล เพื่อทำความเข้าใจเหตุผลที่สถานประกอบการให้เงินกู้ รวมถึงอัตราดอกเบี้ยและอัตราการชำระคืน"],["2b","BAP · 2B Enhanced · หมวด 5","5.1","","สถานประกอบการต้องไม่ดำเนินการหรือสนับสนุนการใช้แรงงานเด็ก สถานประกอบการต้องปฏิบัติตามกฎหมายท้องถิ่นเกี่ยวกับแรงงานเด็กในเรื่องอายุขั้นต่ำในการทำงาน หรืออายุที่สิ้นสุดการศึกษาภาคบังคับ หรือให้สอดคล้องกับอนุสัญญาองค์การแรงงานระหว่างประเทศ (ILO) ฉบับที่ 138 ว่าด้วยอายุขั้นต่ำ (Minimum Age Convention) โดยให้ใช้เกณฑ์อายุที่สูงกว่า สถานประกอบการต้องเก็บรวบรวม ตรวจสอบ และจัดเก็บบันทึกที่เกี่ยวข้องกับอายุของพนักงาน เพื่อยืนยันว่าเป็นไปตามข้อกำหนดด้านอายุ","เจตนา: เพื่อยืนยันว่าสถานประกอบการไม่ได้ใช้แรงงานเด็ก การตีความ: อนุสัญญา ILO ว่าด้วยอายุขั้นต่ำ (C138) กำหนดอายุขั้นต่ำในการทำงานไว้ที่ 15 ปี เว้นแต่ในกรณีที่ระบบเศรษฐกิจหรือสถานศึกษาของประเทศนั้นยังพัฒนาไม่เพียงพอ ซึ่งในกรณีดังกล่าวสามารถกำหนดอายุขั้นต่ำเริ่มต้นไว้ที่ 14 ปีได้"],["2b","BAP · 2B Enhanced · หมวด 5","5.2","","การจ้างงานพนักงานเยาวชน (ผู้ที่มีอายุสูงกว่าอายุขั้นต่ำแต่ต่ำกว่า 18 ปี) ต้องเป็นไปตามกฎหมายท้องถิ่นหรือกฎหมายระดับประเทศ รวมถึงการเข้าถึงการศึกษาภาคบังคับตามที่กำหนด และข้อจำกัดด้านชั่วโมงและเวลาในการทำงาน","เจตนา: เพื่อยืนยันว่าพนักงานเยาวชนปฏิบัติงานที่เหมาะสมกับวัยของตน และการศึกษาภาคบังคับไม่ถูกรบกวน การตีความ: ตามที่ ILO ระบุว่า \"การที่เด็กหรือเยาวชนที่มีอายุสูงกว่าอายุขั้นต่ำในการเข้าทำงาน เข้าร่วมทำงานที่ไม่ส่งผลกระทบต่อสุขภาพและพัฒนาการส่วนบุคคล หรือไม่รบกวนการศึกษาของพวกเขา โดยทั่วไปถือว่าเป็นสิ่งที่ดี...กิจกรรมลักษณะนี้มีส่วนช่วยต่อพัฒนาการของเด็กและความเป็นอยู่ที่ดีของครอบครัว โดยช่วยให้พวกเขาได้รับทักษะและประสบการณ์ และช่วยเตรียมความพร้อมให้พวกเขาเป็นสมาชิกที่มีคุณค่าต่อสังคมเมื่อเติบโตเป็นผู้ใหญ่\""],["2b","BAP · 2B Enhanced · หมวด 5","5.3","","พนักงานเยาวชนต้องไม่ถูกให้ทำงานภายใต้สภาวะที่ก่อให้เกิดความเสี่ยงต่อสุขภาพหรือความปลอดภัยของตน ทั้งนี้รวมถึงการจำกัดชั่วโมงการทำงาน และการห้ามทำงานกลางคืนและงานที่มีความเสี่ยงอันตราย","เจตนา: เพื่อยืนยันว่าพนักงานที่มีอายุระหว่างอายุขั้นต่ำในการทำงานถึง 18 ปี ไม่ได้ปฏิบัติงานที่ก่อให้เกิดความเสี่ยงต่อสุขภาพและความปลอดภัย หรือต่อพัฒนาการทางศีลธรรมและสังคมของตน การตีความ: ประเภทของงานที่ห้ามตามที่ระบุในข้อกำหนดนี้ให้เป็นไปตามที่กำหนดโดยกฎหมายและระเบียบข้อบังคับของประเทศนั้น ๆ"],["2b","BAP · 2B Enhanced · หมวด 5","5.4","","สถานประกอบการต้องมีนโยบายและขั้นตอนปฏิบัติในการเยียวยา (remediation) เพื่อให้การสนับสนุนแก่ผู้ที่ถูกระบุว่าเป็นแรงงานเด็กในสถานประกอบการ ทั้งนี้ ขึ้นอยู่กับอายุของเด็ก การสนับสนุนอย่างน้อยต้องรวมถึงการนำเด็กออกจากการทำงานและการนำกลับเข้าสู่ระบบการศึกษา","เจตนา: เพื่อยืนยันว่าสถานประกอบการมีแผนการเยียวยาหากพบการใช้แรงงานเด็ก การตีความ: นโยบายการเยียวยาควรรวมถึงข้อกำหนดเพื่อให้แน่ใจว่าเด็กได้รับความช่วยเหลือที่จำเป็นเพื่อกลับเข้าเรียน ซึ่งรวมถึงการชำระค่าเล่าเรียน และการเปิดโอกาสให้เด็กสามารถกลับมาทำงานในสถานประกอบการได้เมื่อมีอายุครบตามข้อกำหนดด้านอายุที่ระบุไว้ในข้อ 5.2"],["2b","BAP · 2B Enhanced · หมวด 5","5.5.1","","หากมีการดำเนินการตามขั้นตอนการเยียวยา สถานประกอบการต้องจัดเก็บบันทึกการดำเนินการทั้งหมดและขั้นตอนปฏิบัติที่จัดทำขึ้นเพื่อป้องกันการเกิดเหตุซ้ำ ไว้เป็นระยะเวลาอย่างน้อยสามปี","เจตนา: เพื่อยืนยันว่าได้มีการดำเนินการเยียวยา มีการจัดทำเอกสารบันทึก และมีการดำเนินมาตรการป้องกัน การตีความ: มาตรการป้องกันควรอ้างอิงจากการวิเคราะห์หาสาเหตุที่แท้จริง (root cause analysis) เพื่อระบุสาเหตุที่เด็กถูกจ้างงานโดยขัดต่อนโยบายห้ามใช้แรงงานเด็ก"],["2b","BAP · 2B Enhanced · หมวด 5","5.5","","ในกรณีที่มีการใช้ผู้รับเหมาหรือบริษัทจัดหาแรงงาน สถานประกอบการต้องมีนโยบายและขั้นตอนปฏิบัติเพื่อตรวจสอบว่าองค์กรดังกล่าวปฏิบัติตามข้อกำหนดของ ESS (Environmental and Social Standard - มาตรฐานด้านสิ่งแวดล้อมและสังคม) ในส่วนที่เกี่ยวข้องกับพนักงานเยาวชน","เจตนา: เพื่อยืนยันว่าพนักงานเยาวชนที่ได้รับการจ้างงานผ่านผู้รับเหมาหรือบริษัทจัดหาแรงงานเป็นไปตามข้อกำหนดของ ESS การตีความ: พนักงานเยาวชน คือ ผู้ที่มีอายุต่ำกว่า 18 ปี แต่สูงกว่าอายุขั้นต่ำในการทำงาน สถานประกอบการควรจัดเก็บเอกสารที่แสดงว่าได้มีการตรวจสอบยืนยันอายุของพนักงานเหล่านี้แล้วว่าสูงกว่าอายุขั้นต่ำในการทำงาน ก่อนที่พนักงานจะเริ่มปฏิบัติงาน"],["2b","BAP · 2B Enhanced · หมวด 5","5.6","","จุดข้อมูล: สถานประกอบการมีการจ้างงานพนักงานเยาวชนที่มีอายุต่ำกว่า 18 ปีหรือไม่?","การเก็บข้อมูล เพื่อยืนยันว่ามีแรงงานเด็ก (young workers) อยู่ในสถานประกอบการหรือไม่ การตีความ: การจ้างแรงงานเด็กอาจมีความเป็นไปได้มากขึ้นในกะทำงานที่อยู่นอกเวลาเรียน ในงานที่สกปรก อันตราย หรือย่ำยีเกียรติ เมื่อแรงงานข้ามชาติเดินทางมาพร้อมกับบุตรของตน เมื่อมีแรงงานที่รับค่าจ้างตามผลงาน (piece rate) หรือเมื่อมีการจ้างงานที่ไม่ใช่การจ้างโดยตรง"],["2b","BAP · 2B Enhanced · หมวด 5","5.6.1","","จุดข้อมูล: มีบุคคลที่ดูเหมือนมีอายุต่ำกว่า 18 ปีอยู่ในสถานประกอบการโดยไม่ได้ทำงานหรือไม่ ไม่รวมเด็กในสถานรับเลี้ยงเด็ก (daycare)","การเก็บข้อมูล เพื่อประเมินว่าอาจมีการใช้แรงงานเด็ก (child labor) หรือไม่"],["2b","BAP · 2B Enhanced · หมวด 6","6.1","","แรงงานต้องมีสิทธิ์ตามกฎหมายในการทำงานในประเทศที่ตนได้รับการจ้างงาน การปฏิบัติงานและเงื่อนไขการจ้างงานต้องเป็นไปตามมาตรฐานแรงงานท้องถิ่น มาตรฐานแรงงานระดับประเทศ หรือมาตรฐานแรงงานระดับสากล โดยให้ใช้มาตรฐานที่เข้มงวดกว่า","เจตนา: เพื่อยืนยันว่ามีการได้รับสัญชาติหรือใบอนุญาตทำงานที่ถูกต้อง การตีความ: สิทธิ์ตามกฎหมายในการทำงาน หมายถึง แรงงานเป็นผู้มีสัญชาติของประเทศที่สถานประกอบการตั้งอยู่ หรือมีใบอนุญาตที่ถูกต้อง เช่น วีซ่าทำงาน (work visa) สำหรับการทำงานในสถานที่นั้น"],["2b","BAP · 2B Enhanced · หมวด 6","6.2","","แรงงานทุกคน รวมถึงแรงงานชั่วคราวและแรงงานที่จ้างผ่านบริษัทจัดหางาน (recruitment agencies) ต้องเข้าทำงานภายใต้สัญญาที่ลงนามแล้ว ซึ่งจัดทำในรูปแบบ/ภาษาที่แรงงานเข้าใจ โดยระบุข้อกำหนดและเงื่อนไขการจ้างงาน รวมถึงสิทธิของแรงงาน สวัสดิการ ค่าตอบแทน ชั่วโมงการทำงานที่คาดหวัง รายละเอียดค่าจ้างสำหรับแต่ละรอบการจ่ายเงินทุกครั้งที่มีการจ่าย และนโยบายของสถานประกอบการเกี่ยวกับการดำเนินการทางวินัย กระบวนการร้องเรียน การหักเงินค่าจ้างที่ได้รับอนุญาต ลักษณะงานที่ต้องปฏิบัติ สภาพแวดล้อมในการทำงานและที่พักอาศัย และเรื่องอื่น ๆ ในลักษณะเดียวกัน","เจตนา: เพื่อยืนยันว่าข้อกำหนดและเงื่อนไขการทำงานได้รับการจัดทำเป็นเอกสารและแรงงานเข้าใจ การตีความ: \"แรงงานทุกคน\" รวมถึงแรงงานที่จ้างโดยตรง แรงงานตามสัญญาจ้าง แรงงานผู้รับเหมาช่วง (subcontracted) และแรงงานข้ามชาติ หากแรงงานอ่านไม่ออกเขียนไม่ได้ ควรมีการอ่านสัญญาให้ฟังเป็นภาษาที่เขาเข้าใจ การหักเงินที่ได้รับอนุญาตที่ยอมรับได้มีเพียงการหักที่กฎหมายอนุญาตเท่านั้น (ดูข้อกำหนดที่ 2.5)"],["2b","BAP · 2B Enhanced · หมวด 6","6.3","","สถานประกอบการต้องมีนโยบายที่สนับสนุนการจ้างแรงงานโดยตรง และในกรณีที่มีการใช้บริษัทจัดหางาน บริษัทดังกล่าวต้องปฏิบัติตามมาตรฐานนี้และ: • ได้รับใบอนุญาตและ/หรือการรับรองจากหน่วยงานที่เกี่ยวข้อง (หากมี) • ปฏิบัติตามกฎระเบียบระดับประเทศที่เกี่ยวข้อง • ดำเนินงานอย่างมีจริยธรรม","เจตนา: เพื่อยืนยันว่ามีการส่งเสริมการจ้างงานโดยตรง และหากมีการใช้บริษัทจัดหางาน บริษัทดังกล่าวเป็นที่รู้จัก มีใบอนุญาต และดำเนินงานอย่างมีความรับผิดชอบ การตีความ: หลักการที่บริษัทจัดหางานที่มีจริยธรรม มีความรับผิดชอบ หรือเป็นธรรมใช้ในการดำเนินงาน มีระบุไว้ใน ILO Principles and Operations Guidelines on Fair Recruitment - https://www.ilo.org/wcmsp5/groups/public/---ed_protect/---protrav/---migrant/documents/publication/wcms_536755.pdf"],["2b","BAP · 2B Enhanced · หมวด 6","6.4","","สถานประกอบการต้องมีขั้นตอนการปฏิบัติงานเพื่อตรวจสอบยืนยันข้อกำหนดข้างต้น","ดูข้อมูลข้างต้น"],["2b","BAP · 2B Enhanced · หมวด 6","6.5","","สถานประกอบการต้องมีนโยบายที่สะท้อนหลักการ Employer Pays Principle (นายจ้างเป็นผู้รับผิดชอบค่าใช้จ่าย) ซึ่งเปิดเผยต่อสาธารณะและสื่อสารให้แรงงานทุกคน บริษัทจัดหางาน และคู่ค้าทางธุรกิจอื่น ๆ รับทราบ","เจตนา: เพื่อยืนยันว่าสถานประกอบการมีนโยบายที่นำไปปฏิบัติเพื่อป้องกันไม่ให้แรงงานต้องจ่ายค่าธรรมเนียมการจัดหางานและค่าใช้จ่ายที่เกี่ยวข้อง การตีความ: หลักการ Employer Pays Principle ระบุว่า \"แรงงานไม่ควรต้องจ่ายเงินเพื่อได้งาน - ค่าใช้จ่ายในการจัดหางานควรเป็นภาระของนายจ้าง ไม่ใช่แรงงาน\" ILO ได้กำหนดนิยามค่าธรรมเนียมการจัดหางานและค่าใช้จ่ายที่เกี่ยวข้องให้รวมถึงสิ่งต่าง ๆ เช่น หนังสือเดินทาง วีซ่า การฝึกอบรม การตรวจสุขภาพ และการเดินทางไปและกลับจากสถานที่ทำงาน สำหรับนิยามฉบับสมบูรณ์ ดูหน้า 27-29 (https://www.ilo.org/wcmsp5/groups/public/---ed_protect/---protrav/---migrant/documents/publication/w…"],["2b","BAP · 2B Enhanced · หมวด 6","6.5.1","","หากแรงงานได้จ่ายค่าธรรมเนียมการจัดหางานหรือค่าใช้จ่ายที่เกี่ยวข้อง สถานประกอบการต้องจัดทำเอกสารและคืนเงินค่าธรรมเนียมดังกล่าวอย่างทันเวลา และต้องจัดทำแผนเพื่อป้องกันการเรียกเก็บค่าธรรมเนียมดังกล่าวในอนาคต","เจตนา: เพื่อยืนยันการเยียวยาในกรณีที่แรงงานได้จ่ายค่าธรรมเนียมการจัดหางาน การตีความ: ดูนิยามของค่าธรรมเนียมการจัดหางานข้างต้น องค์กร Impact ได้จัดทำ Principles and Guidelines for the Repayment of Migrant Worker Recruitment Fees and Related Costs (https://impacttlimited.com/principles-for-repayment-of-recruitment-fees/)"],["2b","BAP · 2B Enhanced · หมวด 6","6.6","","สถานประกอบการต้องจัดทำรายชื่อบริษัทจัดหางานทั้งหมดที่ใช้บริการ และมีกระบวนการที่จัดทำเป็นเอกสารเพื่อติดตามตรวจสอบบริษัทดังกล่าวเป็นประจำทุกปี เพื่อยืนยันว่าบริษัทเหล่านั้นยังคงดำเนินงานอย่างถูกกฎหมายและมีจริยธรรม ต้องมีการจัดเก็บบันทึกข้อมูล และควรมีการจัดเก็บและติดตามแผนการปฏิบัติการแก้ไข (corrective action plans)","เจตนา: เพื่อยืนยันการกำกับดูแลบริษัทจัดหางานเพื่อให้มั่นใจมากขึ้นว่าบริษัทดังกล่าวดำเนินงานอย่างมีจริยธรรม การตีความ: การดำเนินงานอย่างมีจริยธรรม หมายถึง การปฏิบัติตามหลักการของ ILO เกี่ยวกับการจัดหางานที่เป็นธรรม (https://www.ilo.org/wcmsp5/groups/public/---ed_protect/---protrav/---migrant/documents/publication/wcms_703485.pdf)"],["2b","BAP · 2B Enhanced · หมวด 6","6.7","","แรงงานต้องได้รับแจ้งล่วงหน้าก่อนที่สถานประกอบการจะกำหนดให้มีการเปลี่ยนแปลงสัญญาจ้างใด ๆ แรงงานต้องได้รับโอกาสในการยอมรับการเปลี่ยนแปลงดังกล่าวหรือเสนอข้อประนีประนอมที่ทั้งสองฝ่ายยอมรับ หากไม่สามารถบรรลุข้อตกลงได้ แรงงานต้องมีสิทธิ์ลาออกจากตำแหน่งของตน","เจตนา: เพื่อยืนยันว่าแรงงานทราบถึงการเปลี่ยนแปลงสัญญาจ้างก่อนที่จะมีผลบังคับใช้ และไม่ถูกบังคับให้ยอมรับการเปลี่ยนแปลงและทำงานต่อไปหากไม่สามารถยอมรับได้ การตีความ: การเปลี่ยนแปลงสัญญาจ้างต้องมีเหตุผลทางธุรกิจที่สมควร ข้อกำหนดนี้มุ่งเน้นที่การเปลี่ยนแปลงสัญญาจ้างที่เกิดขึ้นหลังจากแรงงานเข้าทำงานแล้ว"],["2b","BAP · 2B Enhanced · หมวด 6","6.8","","สถานประกอบการต้องไม่ใช้สัญญาจ้างระยะสั้นต่อเนื่องกัน และ/หรือโครงการฝึกงานที่ไม่เป็นจริง หรือรูปแบบอื่น ๆ เพื่อหลีกเลี่ยงการปฏิบัติตามพันธกรณีด้านสิทธิ สวัสดิการ และอื่น ๆ ที่มอบให้แก่พนักงานประจำ","เจตนา: เพื่อยืนยันว่าสถานประกอบการไม่ได้จ้างแรงงานพาร์ทไทม์หรือผู้ฝึกงานเพื่อหลีกเลี่ยงพันธกรณีที่มีต่อพนักงานประจำ การตีความ: ข้อเสนอแนะของ ILO เกี่ยวกับการฝึกงานให้นิยามการฝึกงานว่า \"เป็นรูปแบบหนึ่งของการศึกษาและการฝึกอบรมที่อยู่ภายใต้ข้อตกลงการฝึกงาน ซึ่งช่วยให้ผู้ฝึกงานได้รับสมรรถนะที่จำเป็นสำหรับการทำงานในอาชีพนั้น ๆ ผ่านการฝึกอบรมที่มีโครงสร้างและได้รับค่าตอบแทนหรือการชดเชยทางการเงินในรูปแบบอื่น ซึ่งประกอบด้วยการเรียนรู้ทั้งในสถานที่ทำงานและนอกสถานที่ทำงาน และนำไปสู่คุณวุฒิที่ได้รับการยอมรับ\" ข้อกำหนดนี้มุ่งเน้นว่ามีการใช้รูปแบบดังกล่าวเพื่อหลีกเลี่ยงนโยบายของบริษัทหรือไม่"],["2b","BAP · 2B Enhanced · หมวด 6","6.9","","สถานประกอบการที่จัดให้มีหรืออนุญาตให้มีโครงการฝึกอบรม/ฝึกงานต้องแสดงหลักฐานเพื่อยืนยันว่าแรงงานดังกล่าวไม่ได้ถูกแสวงหาประโยชน์โดยมิชอบ และโครงการฝึกอบรมหรือฝึกงานของแรงงานเป็นไปตามข้อกำหนดทางกฎหมายระดับประเทศที่เกี่ยวข้อง","เจตนา: เพื่อยืนยันว่าโครงการฝึกอบรม/ฝึกงานเป็นไปตามข้อกำหนดระดับประเทศ การตีความ: ข้อเสนอแนะของ ILO เกี่ยวกับการฝึกงานให้นิยามการฝึกงานว่า \"เป็นรูปแบบหนึ่งของการศึกษาและการฝึกอบรมที่อยู่ภายใต้ข้อตกลงการฝึกงาน ซึ่งช่วยให้ผู้ฝึกงานได้รับสมรรถนะที่จำเป็นสำหรับการทำงานในอาชีพนั้น ๆ ผ่านการฝึกอบรมที่มีโครงสร้างและได้รับค่าตอบแทนหรือการชดเชยทางการเงินในรูปแบบอื่น ซึ่งประกอบด้วยการเรียนรู้ทั้งในสถานที่ทำงานและนอกสถานที่ทำงาน และนำไปสู่คุณวุฒิที่ได้รับการยอมรับ\""],["2b","BAP · 2B Enhanced · หมวด 6","6.10","","แรงงานต้องไม่ถูกกำหนดให้ลงนามในเอกสารเปล่า","เจตนา: เพื่อยืนยันว่าแรงงานไม่ได้ให้ลายมือชื่อที่อาจถูกนำไปใช้ผูกมัดแรงงานกับข้อกำหนดและเงื่อนไขการจ้างงาน หรือการลาออกที่แรงงานไม่ได้ตกลงยินยอม"],["2b","BAP · 2B Enhanced · หมวด 6","6.11","","จุดข้อมูล: กรุณากรอกค่าธรรมเนียมเฉลี่ยที่จ่ายให้แก่บริษัทจัดหางานต่อแรงงานหนึ่งคน เป็นสกุลเงินดอลลาร์สหรัฐ (USD):","การเก็บข้อมูล"],["2b","BAP · 2B Enhanced · หมวด 6","6.12","","จุดข้อมูล: กรุณากรอกชื่อบริษัทจัดหางาน:","การเก็บข้อมูล"],["2b","BAP · 2B Enhanced · หมวด 7","7.1","","สถานประกอบการต้องมีนโยบายโอกาสที่เท่าเทียมกัน (equal opportunity policy) ที่ห้ามการดำเนินการหรืออนุญาตให้มีการเลือกปฏิบัติในทุกด้านของการสรรหาบุคลากร การจ้างงาน และค่าตอบแทน โดยอาศัยลักษณะส่วนบุคคลที่ได้รับการคุ้มครองตามกฎหมาย ข้อกำหนดและเงื่อนไขการจ้างงานต้องพิจารณาจากความสามารถในการปฏิบัติงาน ไม่ใช่จากลักษณะส่วนบุคคลหรือความเชื่อ","เจตนา: เพื่อยืนยันว่าสถานประกอบการไม่มีการเลือกปฏิบัติ การตีความ: อนุสัญญาองค์การแรงงานระหว่างประเทศ (ILO) ฉบับที่ C111 ว่าด้วยการเลือกปฏิบัติ (การจ้างงานและอาชีพ) กำหนดให้การเลือกปฏิบัติ หมายรวมถึง \"การแบ่งแยก การกีดกัน หรือการให้สิทธิพิเศษใดๆ บนพื้นฐานของเชื้อชาติ ผิวสี เพศ ศาสนา ความคิดเห็นทางการเมือง เชื้อชาติกำเนิด หรือแหล่งกำเนิดทางสังคม\""],["2b","BAP · 2B Enhanced · หมวด 7","7.2","","สถานประกอบการต้องมีนโยบายในสถานที่ทำงานที่ครอบคลุมเรื่องความรุนแรงและการล่วงละเมิดในสถานที่ทำงาน โดยต้องระบุให้ชัดเจนว่าพนักงานทุกคนต้องได้รับการปฏิบัติด้วยความมีเกียรติและความเคารพ และจะไม่ยอมให้เกิดการล่วงละเมิดทางจิตใจ ทางร่างกาย ทางคำพูด หรือทางเพศ การกลั่นแกล้ง หรือการล่วงละเมิด ไม่ว่าจะเกิดขึ้นจริงหรือเป็นการขู่ว่าจะกระทำ","เจตนา: เพื่อยืนยันว่าสถานประกอบการมีนโยบายและวิธีปฏิบัติในการป้องกันความรุนแรงและการล่วงละเมิดในสถานที่ทำงาน การตีความ: ความรุนแรงหรือการล่วงละเมิด รวมถึงการใช้หรือการขู่ว่าจะลงโทษทางร่างกาย การบังคับขู่เข็ญทางจิตใจหรือทางร่างกาย การกลั่นแกล้ง การล่วงละเมิดรวมถึงการล่วงละเมิดทางเพศ หรือการทำร้ายในลักษณะใดๆ"],["2b","BAP · 2B Enhanced · หมวด 7","7.3","","สถานประกอบการต้องไม่เลิกจ้างพนักงานเนื่องจากการตั้งครรภ์ ต้องไม่บังคับให้ใช้วิธีคุมกำเนิด หรือลดค่าจ้าง หรือเลือกปฏิบัติในลักษณะใดๆ ต่อพนักงานที่กลับมาทำงานหลังการลาคลอด/ลาเพื่อดูแลบุตร ผู้สมัครงานและพนักงานต้องไม่ถูกบังคับให้ตรวจการตั้งครรภ์ การตรวจพรหมจรรย์ การตรวจเชื้อ HIV หรือโรคติดต่อทางเพศสัมพันธ์ (STI)","เจตนา: เพื่อยืนยันว่าสถานประกอบการเคารพความเป็นส่วนตัวของพนักงาน และไม่ลงโทษพนักงานเนื่องจากการตัดสินใจเรื่องการเจริญพันธุ์ การตีความ: การตัดสินใจเรื่องการเจริญพันธุ์ควรเป็นสิทธิ์ของพนักงานเอง และพนักงานไม่ควรถูกลงโทษจากการตัดสินใจดังกล่าว"],["2b","BAP · 2B Enhanced · หมวด 7","7.4","","สถานประกอบการต้องมีวิธีปฏิบัติเป็นลายลักษณ์อักษรในการจัดการข้อร้องเรียน คำร้องเรียน และข้อห่วงใยของพนักงานทุกคนและบุคคลภายนอก โดยไม่ต้องกลัวการตอบโต้ วิธีปฏิบัตินี้ต้องระบุว่าจะไม่มีการยอมให้เกิดการตอบโต้ต่อผู้ที่ยื่นข้อร้องเรียน","เจตนา: เพื่อยืนยันว่าพนักงานมีช่องทางในการยกปัญหาขึ้นมาโดยไม่ต้องกลัวการตอบโต้ การตีความ: หลักเกณฑ์ความมีประสิทธิผลของกลไกรับข้อร้องเรียนถูกกำหนดไว้ในหลักการที่ 31 ของหลักการชี้แนะแห่งสหประชาชาติว่าด้วยธุรกิจและสิทธิมนุษยชน (UN Guiding Principles on Business and Human Rights) กลไกรับข้อร้องเรียนที่มีประสิทธิผลควรมีความชอบธรรม เข้าถึงได้ คาดการณ์ได้ เป็นธรรม โปร่งใส สอดคล้องกับสิทธิ เป็นแหล่งของการเรียนรู้อย่างต่อเนื่อง และตั้งอยู่บนพื้นฐานของการมีส่วนร่วมและการเจรจา สถานประกอบการต้องมีวิธีปฏิบัติเป็นลายลักษณ์อักษรในการจัดการข้อร้องเรียนหรือข้อห่วงใย กลไกรับข้อร้องเรียนควรเข้าถึงได้สำหรับพนักง…"],["2b","BAP · 2B Enhanced · หมวด 7","7.5","","สถานประกอบการต้องมีระบบรับข้อร้องเรียนที่จัดตั้งขึ้นเพื่อจัดการกรณีและข้อกล่าวหาต่างๆ รวมถึงการล่วงละเมิด/การล่วงละเมิดทางเพศ การกลั่นแกล้ง และการปฏิบัติที่เลือกปฏิบัติต่อผู้สมัครงานและพนักงาน รวมถึงผู้บริหารและเจ้าหน้าที่ ทั้งนี้ อย่างน้อยต้องประกอบด้วยกลไกการรายงานที่เป็นความลับ ข้อมูลเกี่ยวกับสายด่วนหรือบริการภายนอกอื่นๆ ที่มีอยู่ และความเป็นไปได้ในการเริ่มดำเนินการประเมิน/อนุญาโตตุลาการโดยหน่วยงานอิสระ","เจตนา: เพื่อยืนยันว่าสถานประกอบการมีวิธีปฏิบัติภายในในการจัดการและแก้ไขข้อร้องเรียน และพนักงานทราบถึงบริการภายนอกที่มีอยู่ การตีความ ดูข้อมูลเกี่ยวกับกลไกรับข้อร้องเรียนข้างต้น การแก้ไขควรรวมถึงการวิเคราะห์หาสาเหตุที่แท้จริง (root cause analysis) และการพัฒนาระบบเพื่อช่วยป้องกันไม่ให้ปัญหาเกิดขึ้นอีกในอนาคต"],["2b","BAP · 2B Enhanced · หมวด 7","7.5.1","","หากสถานประกอบการพบว่าตนเองเป็นสาเหตุหรือมีส่วนก่อให้เกิดผลกระทบด้านลบ ไม่ว่าจะทราบผ่านระบบรับข้อร้องเรียนหรือวิธีการอื่นใด สถานประกอบการต้องจัดให้มีหรือให้ความร่วมมือในการดำเนินการแก้ไขที่มีประสิทธิผล","เจตนา: เพื่อยืนยันว่าสถานประกอบการดำเนินการแก้ไขเมื่อเป็นสาเหตุของผลกระทบด้านลบ การตีความ: การแก้ไขควรรวมถึงการวิเคราะห์หาสาเหตุที่แท้จริง และการพัฒนาระบบเพื่อช่วยป้องกันไม่ให้ปัญหาเกิดขึ้นอีกในอนาคต"],["2b","BAP · 2B Enhanced · หมวด 7","7.6","","ต้องมีการเก็บบันทึกการดำเนินการเพื่อจัดการข้อร้องเรียน คำร้องเรียน และข้อห่วงใย เป็นระยะเวลาสูงสุด 3 ปี ในลักษณะที่ปลอดภัยและเป็นความลับ และต้องระบุกรอบเวลาที่กำหนดไว้สำหรับการปิดประเด็นแต่ละเรื่องที่พบจากการตรวจสอบ","เจตนา: เพื่อยืนยันว่ามีการดำเนินการแก้ไขเกิดขึ้นจริง และมีการเก็บบันทึกที่เป็นความลับ การตีความ: ลักษณะที่ปลอดภัยและเป็นความลับ หมายถึงลักษณะที่มีเพียงผู้ที่เกี่ยวข้องกับกรณีนั้นเท่านั้นที่สามารถเข้าถึงบันทึกได้"],["2b","BAP · 2B Enhanced · หมวด 7","7.7","","กรณีการค้ามนุษย์ และการใช้แรงงานนักโทษ แรงงานที่ถูกผูกมัดตามสัญญา แรงงานบังคับ แรงงานขัดหนี้ หรือแรงงานเด็ก ภายในการดำเนินงานของสถานประกอบการหรือห่วงโซ่อุปทานที่เกี่ยวข้อง ไม่ว่าจะเป็นการรับรู้หรือได้รับการพิสูจน์แล้ว ต้องรายงานให้ GSA และหน่วยรับรอง (Certification Body: CB) ของสถานประกอบการทราบโดยทันที หรืออย่างน้อยภายใน 48 ชั่วโมงหลังจากที่สถานประกอบการพบประเด็นดังกล่าว","เจตนา: เพื่อให้มั่นใจว่ามีการรายงานแรงงานบังคับ แรงงานขัดหนี้ และแรงงานเด็กอย่างทันเวลา การตีความ: แรงงานบังคับ คือ งานที่ถูกบังคับให้ทำโดยไม่สมัครใจและอยู่ภายใต้การขู่บังคับด้วยบทลงโทษใดๆ แรงงานขัดหนี้ คือ กรณีที่บุคคลถูกผูกมัดให้ทำงานเพื่อชำระคืนเงินกู้หรือหนี้สิน แรงงานเด็ก โดยทั่วไปหมายถึงงานที่พรากเด็กจากวัยเด็ก ศักยภาพ และเกียรติของตน และเป็นอันตรายต่อพัฒนาการทางร่างกายและจิตใจ"],["2b","BAP · 2B Enhanced · หมวด 7","7.8","","สถานประกอบการต้องมีวิธีปฏิบัติในการแก้ไขเพื่อนำมาใช้เมื่อพบกรณีการค้ามนุษย์ และการใช้แรงงานนักโทษ แรงงานที่ถูกผูกมัดตามสัญญา แรงงานบังคับ แรงงานขัดหนี้ หรือแรงงานเด็ก ภายในการดำเนินงานของสถานประกอบการหรือห่วงโซ่อุปทานที่เกี่ยวข้อง โดยต้องจัดทำแผนการแก้ไขเพื่อสนับสนุนการฟื้นฟูพนักงานที่ได้รับผลกระทบ และในกรณีที่จำเป็นต้องมั่นใจว่ามีการดำเนินการที่แตกต่างกันตามอายุของพนักงาน","เจตนา: เพื่อยืนยันว่ากรณีแรงงานบังคับ แรงงานขัดหนี้ และแรงงานเด็ก ได้รับการแก้ไข และมีการดำเนินการเพื่อป้องกันไม่ให้เกิดกรณีดังกล่าวขึ้นอีกในอนาคต การตีความ: ดูคำนิยามของแรงงานบังคับ แรงงานขัดหนี้ และแรงงานเด็กข้างต้น ตัวอย่างของการแก้ไข ได้แก่ การชดเชยความเสียหายต่อบุคคลและทรัพย์สิน การนำตัวออกจากสถานประกอบการและการกลับคืนสู่ชุมชนพร้อมโอกาสด้านการศึกษาหรือการทำงานที่มีคุณค่า"],["2b","BAP · 2B Enhanced · หมวด 7","7.9","","สถานประกอบการต้องมีวิธีปฏิบัติด้านการลงโทษทางวินัยเป็นลายลักษณ์อักษร โดยจัดทำในภาษาหรือรูปแบบที่พนักงานสามารถเข้าใจได้","เจตนา: เพื่อยืนยันว่ากฎระเบียบเกี่ยวกับการลงโทษทางวินัยได้จัดทำเป็นเอกสารและพนักงานเข้าใจ การตีความ: วิธีปฏิบัติด้านการลงโทษทางวินัยควรมีความเป็นธรรม มีเหตุผลรองรับ และพนักงานต้องได้รับโอกาสในการแสดงหลักฐานว่าตนไม่ได้กระทำการที่สมควรได้รับการลงโทษทางวินัย นอกจากนี้ เมื่อมีการดำเนินการลงโทษทางวินัยต่อพนักงาน ต้องมีการเก็บบันทึกกรณีดังกล่าวไว้อย่างครบถ้วน"],["2b","BAP · 2B Enhanced · หมวด 7","7.9.1","","บันทึกการตรวจสอบพร้อมผลลัพธ์ที่จัดทำเป็นเอกสาร รวมถึงการดำเนินการลงโทษทางวินัย ต้องเก็บรักษาไว้อย่างเป็นความลับเป็นระยะเวลา 3 ปี หรือตามที่กฎหมายระดับประเทศหรือระดับท้องถิ่นกำหนด","เจตนา: เพื่อให้มั่นใจว่ามีการจัดทำเอกสารการดำเนินการลงโทษทางวินัย และมีการเก็บบันทึกไว้อย่างปลอดภัย การตีความ: ลักษณะที่เป็นความลับ หมายถึงลักษณะที่มีเพียงผู้ที่เกี่ยวข้องกับกรณีนั้นเท่านั้นที่สามารถเข้าถึงบันทึกได้"],["2b","BAP · 2B Enhanced · หมวด 7","7.9.2","","สถานประกอบการต้องมั่นใจว่าการดำเนินการลงโทษทางวินัยไม่รวมถึงการปรับเงิน หรือการขู่หรือกล่าวถึงการปรับเงินดังกล่าว หรือการหักเงินอื่นๆ ที่ไม่ได้รับอนุญาตตามกฎหมายของประเทศ","เจตนา: เพื่อยืนยันว่าการดำเนินการลงโทษทางวินัยไม่รวมถึงการปรับเงินหรือการหักเงิน การตีความ: การปรับเงินหรือการหักเงิน รวมถึงข้อห้ามในการลดค่าจ้าง มาตรการลงโทษทางวินัยต้องไม่รวมถึงความรุนแรงหรือการล่วงละเมิดทางร่างกาย ทางคำพูด ทางจิตใจ หรือทางเพศ เนื่องจากการกระทำดังกล่าวเป็นสิ่งต้องห้ามตามข้อ 5.7.2"],["2b","BAP · 2B Enhanced · หมวด 7","7.10","","พนักงานต้องไม่ถูกบังคับให้เสพยาเสพติดหรือเครื่องดื่มแอลกอฮอล์","เจตนา: เพื่อตรวจสอบว่าพนักงานไม่ถูกบังคับให้เสพยาเสพติดหรือเครื่องดื่มแอลกอฮอล์ไม่ว่าด้วยเหตุผลใดก็ตาม รวมถึงเพื่อให้สามารถทำงานได้นานขึ้น"],["2b","BAP · 2B Enhanced · หมวด 8","8.1","","พนักงานทุกคนต้องมีสิทธิในการรวมกลุ่ม จัดตั้งองค์กร และเจรจาต่อรองร่วมกัน (หรือไม่ดำเนินการดังกล่าว) โดยไม่จำเป็นต้องได้รับอนุญาตล่วงหน้าจากฝ่ายบริหาร สถานประกอบการต้องไม่ตอบโต้พนักงานที่ใช้สิทธิในการมีตัวแทนตามมาตรฐานแรงงานระดับสากล","เจตนา: เพื่อยืนยันว่าสถานประกอบการไม่ได้บั่นทอนสิทธิของพนักงานในเรื่องเสรีภาพในการรวมตัวและการเจรจาต่อรองร่วมกัน การตีความ: เสรีภาพในการรวมตัว คือ สิทธิในการจัดตั้งหรือเข้าร่วมสหภาพแรงงาน ซึ่งเป็นสิทธิแรงงานขั้นพื้นฐานและได้รับการบรรจุไว้ในปฏิญญาสากลว่าด้วยสิทธิมนุษยชน"],["2b","BAP · 2B Enhanced · หมวด 8","8.2","","ในกรณีที่สิทธิในการรวมตัวและการเจรจาต่อรองร่วม (freedom of association and collective bargaining) ถูกห้ามหรือถูกจำกัดภายใต้กฎหมายท้องถิ่นหรือกฎหมายระดับประเทศ สถานประกอบการจะต้องพยายามส่งเสริม ไม่ใช่ขัดขวาง วิธีการทางเลือกอื่นเพื่ออำนวยความสะดวกในการเป็นตัวแทนและการเจรจาของพนักงาน (ตัวอย่างเช่น การเลือกตั้งพนักงานหนึ่งคนหรือมากกว่าโดยพนักงานคนอื่น ๆ เพื่อเป็นตัวแทนเจรจากับฝ่ายบริหาร)","เจตนา: เพื่อให้พนักงานมีวิธีการทางเลือกอื่นในการร่วมกันปรับปรุงสภาพการทำงานของตน หากสิทธิในการรวมตัว (freedom of association) ถูกห้ามในประเทศที่สถานประกอบการดำเนินงานอยู่ การตีความ: ดูข้อมูลข้างต้น"],["2b","BAP · 2B Enhanced · หมวด 8","8.3","","สถานประกอบการจะต้องอนุญาตให้ผู้แทนพนักงานเข้าถึงสถานที่ทำงานเพื่อปฏิบัติหน้าที่ในการเป็นผู้แทน","เจตนา: เพื่อยืนยันว่าผู้แทนที่พนักงานเลือกสามารถปฏิบัติหน้าที่เป็นตัวแทนพนักงานได้ การตีความ: ดูข้อมูลข้างต้น"],["2b","BAP · 2B Enhanced · หมวด 8","8.4","","สถานประกอบการจะต้องแจ้งให้พนักงานทราบถึงสิทธิในการรวมตัว (freedom of association) และการเจรจาต่อรองร่วม และจะต้องปรึกษาหารือกับสหภาพแรงงานที่ได้รับการเสนอชื่อหรือผู้แทนพนักงานในทุกประเด็นที่อาจส่งผลกระทบต่อพนักงาน","เจตนา: เพื่อยืนยันว่าสถานประกอบการสนับสนุนสิทธิในการรวมตัว (freedom of association) การตีความ: สิทธิในการรวมตัว (freedom of association) คือสิทธิในการก่อตั้งหรือเข้าร่วมสหภาพแรงงาน ซึ่งเป็นสิทธิแรงงานขั้นพื้นฐานและได้รับการรับรองไว้ในปฏิญญาสากลว่าด้วยสิทธิมนุษยชน (Universal Declaration of Human Rights)"],["2b","BAP · 2B Enhanced · หมวด 9","9.1","","หากมีการจัดหาที่พักหรือกำหนดให้ต้องมีที่พัก ที่พักดังกล่าวจะต้องตั้งอยู่ในอาคารที่แยกต่างหากจากพื้นที่ปฏิบัติงานและพื้นที่จัดเก็บ","เจตนา: เพื่อยืนยันว่าพนักงานไม่ได้พักนอนอยู่ในพื้นที่ผลิตหรือพื้นที่จัดเก็บ การตีความ: พนักงานควรมีที่พักที่ปลอดภัย สะอาด และให้ความเป็นส่วนตัวในระดับที่เหมาะสม"],["2b","BAP · 2B Enhanced · หมวด 9","9.2","","ที่พักที่จัดหาให้หรือที่กำหนดให้ต้องมีนั้น จะต้องเป็นไปตามมาตรฐานความปลอดภัยและสุขภาพของท้องถิ่นและ/หรือระดับประเทศ ซึ่งรวมถึงแต่ไม่จำกัดเพียง โครงสร้างที่สะอาดและกันน้ำได้ พื้นที่ที่เพียงพอตามภาระการใช้งานของสถานประกอบการ ระบบทำความร้อน/ระบายอากาศ/ทำความเย็น การควบคุมสัตว์รบกวน และจำนวนอ่างล้างมือ ห้องอาบน้ำ และห้องสุขาที่เพียงพอ","เจตนา: เพื่อยืนยันว่าที่พักที่นายจ้างจัดหาให้มีความปลอดภัย สะอาด และให้ความสะดวกสบายและความเป็นส่วนตัวในระดับหนึ่ง การตีความ: มาตรฐานท้องถิ่นหรือระดับประเทศเกี่ยวกับที่พักที่นายจ้างจัดหาให้อาจมีข้อจำกัด ข้อกำหนดนี้จึงกำหนดมาตรฐานขั้นต่ำไว้สำหรับกรณีดังกล่าว"],["2b","BAP · 2B Enhanced · หมวด 9","9.2.1","","สถานประกอบการจะต้องไม่เรียกให้พนักงานชำระเงินมัดจำสำหรับที่พักที่มีบทลงโทษทางการเงินหากลาออกจากงานหรือออกจากที่พักก่อนกำหนด","เจตนา: เพื่อยืนยันว่าพนักงานไม่รู้สึกถูกกดดันให้ต้องทำงานหรืออยู่ในที่พักนานเกินกว่าที่ต้องการเพื่อหลีกเลี่ยงการสูญเสียเงิน"],["2b","BAP · 2B Enhanced · หมวด 9","9.3","","สถานประกอบการจะต้องจัดให้มีสภาพแวดล้อมที่ปลอดภัย มีสุขลักษณะ และสะอาด ในพื้นที่ทำงาน พื้นที่พักผ่อน พื้นที่รับประทานอาหาร และพื้นที่พักอาศัยที่กำหนดไว้ทั้งหมดตามความเกี่ยวข้อง ซึ่งรวมถึงแต่ไม่จำกัดเพียง การจัดหาน้ำดื่มสะอาด สุขาที่ถูกสุขลักษณะ และพื้นที่ครัวและพื้นที่จัดเก็บการผลิตอาหารที่สะอาด","เจตนา: เพื่อยืนยันว่าสถานที่ทำงานและพื้นที่อื่น ๆ ที่นายจ้างจัดหาให้มีความปลอดภัยและสะอาด การตีความ: ในทุกพื้นที่ที่สถานประกอบการจัดหาให้ สภาพแวดล้อมต้องมีความปลอดภัยและสะอาด"],["2b","BAP · 2B Enhanced · หมวด 9","9.3.1","","พนักงานจะต้องสามารถเข้าถึงน้ำดื่มสะอาดได้โดยไม่มีค่าใช้จ่าย ณ บริเวณใกล้กับสถานที่ทำงานของตน","เจตนา: เพื่อยืนยันว่าพนักงานสามารถเข้าถึงน้ำดื่มได้ในระหว่างวันทำงาน การตีความ: น้ำดื่มควรอยู่ในบริเวณที่ใกล้พอที่จะทำให้พนักงานสามารถไปดื่มน้ำได้โดยไม่ต้องละจากงานเป็นเวลานาน และต้องมีภาชนะสำหรับดื่มน้ำในจำนวนที่เพียงพอ"],["2b","BAP · 2B Enhanced · หมวด 9","9.4","","สถานประกอบการจะต้องมีห้องสุขาและจุดล้างมือส่วนตัว สะอาด และปลอดภัยในจำนวนที่เพียงพอ สอดคล้องกับกฎหมายท้องถิ่นและระดับประเทศ และมีการบริหารจัดการให้สามารถรองรับความต้องการใช้งานในช่วงเวลาพัก สิ่งอำนวยความสะดวกเหล่านี้จะต้องสามารถเข้าถึงได้ง่ายสำหรับพนักงาน และได้รับการดูแลซ่อมแซมให้อยู่ในสภาพดี","เจตนา: เพื่อยืนยันว่าพนักงานสามารถเข้าถึงห้องสุขาที่สะอาดและเป็นส่วนตัวได้โดยไม่มีค่าใช้จ่าย การตีความ: การเข้าถึงห้องสุขาไม่ควรถูกจำกัดเฉพาะช่วงเวลาใดเวลาหนึ่ง"],["2b","BAP · 2B Enhanced · หมวด 9","9.5","","พนักงานทุกคนจะต้องได้รับการจัดหาสิ่งอำนวยความสะดวกในการเปลี่ยนเสื้อผ้าส่วนตัวที่ปลอดภัยและมีสุขลักษณะโดยไม่มีค่าใช้จ่าย รวมทั้งตู้ล็อกเกอร์สำหรับจัดเก็บเอกสารส่วนตัวและสิ่งของส่วนตัวทั้งหมดอย่างปลอดภัย ซึ่งสามารถเข้าถึงได้ทุกเมื่อ","เจตนา: เพื่อยืนยันว่าพนักงานมีพื้นที่ส่วนตัวสำหรับเปลี่ยนเสื้อผ้าและมีที่จัดเก็บสิ่งของอย่างปลอดภัยระหว่างชั่วโมงทำงาน การตีความ: การเข้าถึงสถานที่จัดเก็บสิ่งของอย่างปลอดภัยควรจัดให้โดยไม่มีค่าใช้จ่าย ห้องเปลี่ยนเสื้อผ้าควรมีความเป็นระเบียบและแยกเป็นห้องหรือพื้นที่เฉพาะบุคคล หรือแยกตามเพศ"],["2b","BAP · 2B Enhanced · หมวด 9","9.6","","หากมีการจัดหาอาหาร อาหารดังกล่าวจะต้องปลอดภัย มีคุณค่าทางอาหาร หรือมีคุณค่าทางโภชนาการ และสอดคล้องกับวัฒนธรรมการรับประทานอาหารของพนักงาน","เจตนา: เพื่อยืนยันว่าพนักงานได้รับอาหารที่มีคุณค่าทางโภชนาการซึ่งตอบสนองความต้องการแคลอรีและข้อจำกัดด้านอาหารของตน การตีความ: อาหารที่สถานประกอบการจัดหาให้ควรมีความหลากหลายเพียงพอที่จะให้พนักงานได้รับแคลอรีตามความต้องการและตรงกับข้อจำกัดด้านอาหารของตน ด้วยตัวเลือกที่พนักงานส่วนใหญ่ชื่นชอบ อาหารที่ปลอดภัยตามคำนิยามขององค์การอนามัยโลก (World Health Organization) คือ อาหารที่ \"ไม่มีการปนเปื้อนของแบคทีเรีย ปรสิต ไวรัส สารพิษ สารเคมี และ/หรือสารกัมมันตรังสีที่อาจก่อให้เกิดอันตราย อย่างไรก็ตาม อาหารสามารถปนเปื้อนได้ในทุกขั้นตอนของการผลิตและการจัดจำหน่าย\""],["2b","BAP · 2B Enhanced · หมวด 9","9.7a","","ข้อมูล: มีการจัดหาอาหารให้พนักงานโดยไม่มีค่าใช้จ่ายหรือไม่?","ข้อกำหนดสำหรับการเก็บข้อมูล"],["2b","BAP · 2B Enhanced · หมวด 9","9.7b","","ข้อมูล: มีการจัดหาอาหารให้พนักงานโดยมีค่าใช้จ่ายหรือไม่?","ข้อกำหนดสำหรับการเก็บข้อมูล"],["2b","BAP · 2B Enhanced · หมวด 9","9.7c","","ข้อมูล: สถานประกอบการจัดหาที่พักอาศัย (ที่พัก) แบบชั่วคราวหรือแบบถาวรให้หรือไม่?","การเก็บข้อมูลเพื่อทำความเข้าใจว่ามีการจัดหาที่พักอาศัยหรือไม่"],["2b","BAP · 2B Enhanced · หมวด 9","9.7d","","ข้อมูล: หากมี พนักงานสามารถ \"ปฏิเสธ\" การใช้สิทธิ์ที่พักอาศัยแบบชั่วคราวหรือแบบถาวรนี้ได้หรือไม่?","การเก็บข้อมูลเพื่อทำความเข้าใจว่าพนักงานสามารถปฏิเสธที่พักอาศัยที่จัดหาให้ได้หรือไม่"],["2b","BAP · 2B Enhanced · หมวด 10","10.1","","สถานประกอบการจะต้องแต่งตั้งบุคคลจากฝ่ายบริหารซึ่งรับผิดชอบดูแลด้านสุขภาพ ความปลอดภัย และการฝึกอบรมของพนักงาน","เจตนา: เพื่อยืนยันว่ามีบุคคลในฝ่ายบริหารที่รับผิดชอบด้านสุขภาพ ความปลอดภัย และการฝึกอบรมของพนักงาน การตีความ: ต้องมีนโยบายและโครงสร้างการบริหารจัดการที่ระบุอย่างชัดเจนถึงความรับผิดชอบในการพัฒนาและดำเนินการระบบด้านสุขภาพและความปลอดภัยภายในสถานประกอบการ โดยกำหนดวัตถุประสงค์เพื่อให้แน่ใจว่าระบบดังกล่าวได้รับการดูแลรักษาและปรับปรุงให้มีความเหมาะสมอยู่เสมอ"],["2b","BAP · 2B Enhanced · หมวด 10","10.2","","สถานประกอบการจะต้องระบุ ป้องกัน กำจัด หรือลดความเสี่ยงด้านสุขภาพและความปลอดภัยในสถานที่ทำงานผ่านการวิเคราะห์การประเมินความเสี่ยงที่ดำเนินการโดยผู้มีความรู้ความสามารถ อย่างน้อยปีละครั้ง หรือหลังจากเกิดเหตุการณ์ อุบัติเหตุ หรือเหตุการณ์ที่เฉียดเป็นอุบัติเหตุ (near miss)","เจตนา: เพื่อยืนยันว่ามีระบบสำหรับการประเมินและปรับปรุงนโยบายและแนวปฏิบัติด้านสุขภาพและความปลอดภัยอย่างต่อเนื่อง การตีความ: การวิเคราะห์การประเมินความเสี่ยงควรดำเนินการเป็นประจำทุกปี และควรมีการปรับปรุงนโยบายและแนวปฏิบัติตามผลการประเมินดังกล่าว"],["2b","BAP · 2B Enhanced · หมวด 10","10.3","","การเกิดขึ้นและการสอบสวนเหตุการณ์ด้านสุขภาพและความปลอดภัย การสอบสวนอุบัติเหตุ สาเหตุ และการดำเนินการแก้ไขที่ได้ดำเนินการ จะต้องได้รับการบันทึกเป็นเอกสาร ข้อมูลนี้จะต้องสื่อสารให้ฝ่ายบริหารของสถานประกอบการและพนักงานที่มีความเสี่ยงทราบ","เจตนา: เพื่อยืนยันว่ามีการบันทึกเอกสารเกี่ยวกับเหตุการณ์ด้านสุขภาพและความปลอดภัย การสอบสวน การวิเคราะห์หาสาเหตุที่แท้จริง (root cause analysis) และการดำเนินการแก้ไข การตีความ: สถานประกอบการต้องกำหนดให้มีการหาสาเหตุของเหตุการณ์ด้านสุขภาพและความปลอดภัยเมื่อเกิดขึ้น และต้องมีการดำเนินการแก้ไขที่เหมาะสมเพื่อป้องกันการเกิดเหตุการณ์ลักษณะเดียวกันซ้ำอีก"],["2b","BAP · 2B Enhanced · หมวด 10","10.4","","สถานประกอบการจะต้องมีแผนป้องกันและระงับอัคคีภัยและภาวะฉุกเฉินครอบคลุมทุกส่วนของสถานประกอบการ รวมถึงที่พักอาศัย พื้นที่พักผ่อน โรงอาหาร และพื้นที่จัดเก็บตามความเกี่ยวข้อง ทั้งนี้จะต้องรวมถึงแต่ไม่จำกัดเพียง กฎระเบียบท้องถิ่นและระดับประเทศที่เกี่ยวข้องกับ: • จำนวนเครื่องตรวจจับควันและ/หรือสัญญาณเตือนไฟไหม้ และตำแหน่งที่ติดตั้ง • จำนวนถังดับเพลิง/หัวจ่ายน้ำดับเพลิงที่ใช้งานได้ • การระบุตำแหน่งและจำนวนทางออกฉุกเฉินที่เพียงพอ (รวมถึงการจัดให้มีบันไดหนีไฟฉุกเฉินที่ออกแบบอย่างเหมาะสมในอาคารหลายชั้นเพื่อสนับสนุนการอพยพบุคลากร) • การระบุเส้นทางอพยพที่มีการทำเครื่องหมายอย่างชัดเจน มีแสงสว่างที่เหมาะสม และคงสภาพให้โล่งและไม่ปิดล็อกในขณะที่มีพนักงานอยู่ในสถานที่ • การจัดฝึกอบรมและการบังคับใช้ในการจัดการของเหลวไวไฟและสารเคมี • ขั้นตอนเพื่อป้องกันอัคคีภัยระหว่างการปฏิบัติงานที่มีความร้อนสูงหรือรุนแรง เ…","เจตนา: เพื่อยืนยันว่าสถานประกอบการมีนโยบายและขั้นตอนปฏิบัติด้านความปลอดภัยจากอัคคีภัยและสถานการณ์ฉุกเฉิน เพื่อช่วยป้องกันและลดการบาดเจ็บหรือการสูญเสียชีวิต การตีความ: นโยบายและขั้นตอนปฏิบัติควรอ้างอิงจากการประเมินความเสี่ยง ซึ่งรวมถึงการระบุสิ่งที่อาจก่อให้เกิดอัคคีภัยและบุคคลที่อาจได้รับอันตรายหากเกิดเพลิงไหม้ ควรกำจัดสาเหตุดังกล่าวให้มากที่สุดเท่าที่จะเป็นไปได้ หากไม่สามารถกำจัดได้ ควรลดและควบคุมความเสี่ยง เช่น การแยกแหล่งความร้อน/ประกายไฟออกจากสารไวไฟ การตรวจสอบให้แน่ใจว่าเครื่องทำความร้อนและถังแก๊สไม่สามารถล้มคว่ำได้ การมีเครื่องตรวจจับควัน สัญญาณเตือนอัคคีภัย วิธีดับไฟขนาดเล็กได้อย่างรวด…"],["2b","BAP · 2B Enhanced · หมวด 10","10.5","","สถานประกอบการต้องเฝ้าติดตามความปลอดภัยของเครื่องจักรและอุปกรณ์ ซึ่งรวมถึงแต่ไม่จำกัดเพียง: • ฝาครอบหรือตัวป้องกันที่ทำงานได้อย่างเหมาะสม • เครื่องหมาย/ภาพเตือน • สวิตช์ตัดการทำงานฉุกเฉิน • การดำเนินการตามขั้นตอนล็อกและติดป้าย (lock-out/tag-out) เพื่อป้องกันการเริ่มเดินเครื่องระหว่างการซ่อมบำรุง","เจตนา: เพื่อยืนยันว่าเครื่องจักรของสถานประกอบการมีระบบความปลอดภัยที่เหมาะสม ได้รับการบำรุงรักษาอย่างต่อเนื่อง และพนักงานได้รับการฝึกอบรมอย่างเหมาะสมเพื่อหลีกเลี่ยงการบาดเจ็บหรือการสูญเสียชีวิต การตีความ: การเฝ้าติดตามอุปกรณ์ครอบคลุมการสังเกตด้วยสายตาและการบันทึกข้อมูลที่มีหลักฐานว่าปัญหาได้รับการแก้ไขแล้ว"],["2b","BAP · 2B Enhanced · หมวด 10","10.6","","สถานประกอบการต้องเฝ้าติดตามความแข็งแรง ความมั่นคง และความปลอดภัยของอาคารและอุปกรณ์ในพื้นที่ปฏิบัติงาน พื้นที่รับประทานอาหาร และพื้นที่พักอาศัย (หากมี) ซึ่งรวมถึงแต่ไม่จำกัดเพียงการเชื่อม/การยึดโครงสร้าง การรับรองความปลอดภัยทางไฟฟ้าด้วยการเดินสายไฟที่เหมาะสม การต่อสายดิน และการปิดครอบตู้ไฟฟ้า","เจตนา: เพื่อยืนยันว่าสถานประกอบการตรวจสอบและแก้ไขปัญหาความปลอดภัยของอาคารอย่างสม่ำเสมอ เพื่อป้องกันการบาดเจ็บหรือการสูญเสียชีวิต การตีความ: การเฝ้าติดตามครอบคลุมการสังเกตด้วยสายตาและการประเมินโดยผู้เชี่ยวชาญเป็นประจำเกี่ยวกับความแข็งแรง ความมั่นคง และความปลอดภัยของอาคารและอุปกรณ์ รวมถึงการดำเนินการแก้ไขเมื่อจำเป็น"],["2b","BAP · 2B Enhanced · หมวด 10","10.7","","สถานประกอบการต้องจัดทำแผนตอบสนองต่อสถานการณ์ฉุกเฉิน (Emergency Response Plan) สำหรับกรณีเจ็บป่วยรุนแรง อุบัติเหตุ ภัยธรรมชาติ หรือเหตุการณ์อื่น ๆ โดยเป็นส่วนหนึ่งของแผนนี้ สถานประกอบการต้องแจ้งให้พนักงานทุกคนทราบว่า หากพนักงานรู้สึกว่าตนเองตกอยู่ในอันตรายที่ใกล้จะเกิดขึ้นต่อความปลอดภัยส่วนบุคคล พนักงานมีสิทธิที่จะย้ายไปยังพื้นที่ปลอดภัยได้โดยไม่ต้องขออนุญาตจากทีมบริหารของสถานประกอบการก่อน","เจตนา: เพื่อยืนยันว่ามีแผนตอบสนองต่อสถานการณ์ฉุกเฉิน และพนักงานรับทราบว่าสามารถออกจากสถานประกอบการได้โดยไม่ต้องขออนุญาต หากเกรงว่าความปลอดภัยของตนจะได้รับอันตราย เพื่อหลีกเลี่ยงการบาดเจ็บหรือการสูญเสียชีวิต การตีความ: แผนตอบสนองต่อสถานการณ์ฉุกเฉินควรครอบคลุมอย่างน้อยประเด็นความเสี่ยงระดับสูงหรือระดับกลางในพื้นที่ที่สถานประกอบการตั้งอยู่ แยกประเภทของสถานการณ์ฉุกเฉินที่แตกต่างกัน (เช่น น้ำท่วม แผ่นดินไหว หรืออัคคีภัย) และกำหนดบทบาทและความรับผิดชอบในกรณีเกิดสถานการณ์ฉุกเฉิน"],["2b","BAP · 2B Enhanced · หมวด 10","10.8","","แผนตอบสนองต่อสถานการณ์ฉุกเฉินต้องได้รับการทบทวน และขั้นตอนปฏิบัติฉุกเฉินต้องได้รับการทดสอบ อย่างน้อยปีละครั้ง หรือหลังจากมีการปรับเปลี่ยนที่สำคัญต่อสถานประกอบการ เพื่อให้มั่นใจว่าแผนดังกล่าวสามารถรองรับสุขภาพและความปลอดภัยของพนักงานได้อย่างมีประสิทธิภาพ","เจตนา: เพื่อยืนยันว่าแผนตอบสนองต่อสถานการณ์ฉุกเฉินได้รับการปรับปรุงและทดสอบขั้นตอนปฏิบัติอย่างสม่ำเสมอ"],["2b","BAP · 2B Enhanced · หมวด 10","10.9","","พนักงานที่ได้รับการคัดเลือกต้องได้รับการฝึกอบรมในรายละเอียดของแผนตอบสนองต่อสถานการณ์ฉุกเฉิน และการปฐมพยาบาลกรณีไฟฟ้าดูด เลือดออกมาก จมน้ำ และสถานการณ์ฉุกเฉินทางการแพทย์อื่น ๆ ที่อาจเกิดขึ้น ต้องมีรายชื่อพนักงานที่ผ่านการฝึกอบรมพร้อมให้ตรวจสอบ และต้องมีพนักงานที่ผ่านการฝึกอบรมอย่างน้อยหนึ่งคนประจำอยู่ที่สถานประกอบการในระหว่างที่มีการดำเนินงานหรือการซ่อมบำรุง","เจตนา: เพื่อยืนยันว่าบุคลากรหลักได้รับการฝึกอบรมเกี่ยวกับแผนฉุกเฉินและเข้าใจบทบาทและความรับผิดชอบของตน การตีความ: พนักงานจากแต่ละกะควรได้รับการฝึกอบรม เพื่อให้มั่นใจว่ามีพนักงานที่ผ่านการฝึกอบรมประจำอยู่ที่สถานประกอบการตลอดเวลา"],["2b","BAP · 2B Enhanced · หมวด 10","10.10","","ต้องมีการฝึกซ้อมอพยพฉุกเฉิน (ในกรณีเกิดอัคคีภัย สารเคมีรั่วไหล หรือเหตุการณ์ในลักษณะเดียวกัน) อย่างน้อยปีละครั้ง ให้ครอบคลุมทุกกะและทุกชั้นของอาคาร และจัดขึ้นร่วมกับผู้ใช้อาคารรายอื่น การฝึกซ้อมต้องจัดขึ้นในลักษณะเดียวกันสำหรับสถานที่พักอาศัย ความถี่ของการฝึกซ้อมดับเพลิงและอพยพต้องมีการบันทึกและตรวจสอบยืนยัน","เจตนา: เพื่อยืนยันว่ามีการฝึกซ้อมอย่างสม่ำเสมอ และพนักงานเข้าใจว่าต้องปฏิบัติอย่างไรในกรณีเกิดสถานการณ์ฉุกเฉินประเภทต่าง ๆ การตีความ: ควรมีการฝึกซ้อมอพยพสำหรับสถานการณ์ฉุกเฉินความเสี่ยงระดับสูงหรือระดับกลางแต่ละประเภทในพื้นที่ที่สถานประกอบการตั้งอยู่"],["2b","BAP · 2B Enhanced · หมวด 10","10.11","","สถานประกอบการต้องจำกัดการสัมผัสเสียงของพนักงานที่มีระดับความดังเกิน 85 เดซิเบล (dB) ให้น้อยกว่าแปดชั่วโมงต่อวัน หรือน้อยกว่านั้นหากมีข้อกำหนดที่เข้มงวดกว่าตามมาตรฐานแห่งชาติ หากพนักงานต้องสัมผัสเสียงที่มีระดับความดังเกิน 85 เดซิเบล เป็นเวลานานกว่าแปดชั่วโมงต่อวัน สถานประกอบการต้องจัดหาอุปกรณ์ป้องกันการได้ยินเพื่อลดระดับเสียงให้ต่ำกว่า 85 เดซิเบล","เจตนา: เพื่อยืนยันว่าสถานประกอบการปกป้องพนักงานจากเสียงดังเกินขนาดซึ่งอาจรบกวนการมีสมาธิหรือส่งผลให้สูญเสียการได้ยิน โดยการจำกัดการสัมผัสเสียงที่มีระดับความดังเกิน 85 เดซิเบล (dB) การตีความ: ระดับเสียงควรตรวจวัดด้วยเครื่องวัดระดับเสียง (sound level meter) อุปกรณ์ป้องกันการได้ยินอาจรวมถึงที่อุดหูหรือที่ครอบหู"],["2b","BAP · 2B Enhanced · หมวด 10","10.12","","จุดข้อมูล: มีการรายงานอุบัติเหตุและเหตุการณ์ด้านสุขภาพและความปลอดภัยที่สถานประกอบการในช่วง 12 เดือนที่ผ่านมาจำนวนกี่ครั้ง","ข้อกำหนดการเก็บข้อมูล"],["2b","BAP · 2B Enhanced · หมวด 10","10.13","","จุดข้อมูล: หากมีอุบัติเหตุและเหตุการณ์ด้านสุขภาพและความปลอดภัยเกิดขึ้น กรุณาระบุภาพรวมของจำนวน ประเภท และลักษณะของอุบัติเหตุดังกล่าว:","ข้อกำหนดการเก็บข้อมูล"],["2b","BAP · 2B Enhanced · หมวด 11","11.1","","สถานประกอบการต้องจัดทำบัญชีรายการ PPE (อุปกรณ์ป้องกันส่วนบุคคล) และขั้นตอนการเบิกจ่ายที่มีการควบคุม เพื่อเฝ้าติดตามการใช้อุปกรณ์และเครื่องแต่งกายป้องกันที่จัดให้แก่พนักงาน ผู้รับเหมา และผู้มาเยือนอย่างเหมาะสม","เจตนา: เพื่อยืนยันว่าสถานประกอบการจัดหา PPE ให้ และพนักงาน ผู้รับเหมา และผู้มาเยือนทราบวิธีการใช้งาน การตีความ: PPE รวมถึงเสื้อคลุม อุปกรณ์ป้องกันดวงตา ถุงมือ เครื่องแต่งกายกันความเย็นสำหรับพื้นที่แช่เย็น และรองเท้าบูตสำหรับพื้นที่เปียก การเฝ้าติดตามการใช้งานที่ถูกต้องรวมถึงการให้คำแนะนำหรือการฝึกอบรมวิธีใช้ PPE และการตรวจสอบว่าพนักงาน ผู้มาเยือน และผู้รับเหมาใช้งานอย่างถูกต้อง อุปกรณ์ป้องกันที่จำเป็นสำหรับงานเฉพาะต้องระบุไว้อย่างชัดเจน เช่น ในลักษณะงาน (job description) หรือ SOP (วิธีปฏิบัติงานมาตรฐาน) สำหรับหน้าที่งานเฉพาะนั้น ๆ"],["2b","BAP · 2B Enhanced · หมวด 11","11.2","","ต้องจัดหา PPE และเครื่องแต่งกายเพื่อสุขอนามัยให้แก่พนักงานโดยไม่มีค่าใช้จ่าย และต้องมีการบำรุงรักษาและเปลี่ยนใหม่ตามความจำเป็นอย่างเหมาะสม","เจตนา: เพื่อยืนยันว่ามีการจัดหา PPE ที่ได้รับการบำรุงรักษาอย่างดีโดยไม่มีค่าใช้จ่าย การตีความ: การบำรุงรักษา PPE รวมถึงการทำความสะอาด การซ่อมแซม และการเปลี่ยน PPE ตามความจำเป็น เพื่อให้มั่นใจว่าอุปกรณ์ทำงานได้ตามที่ออกแบบไว้"],["2b","BAP · 2B Enhanced · หมวด 12","12.1","","สถานประกอบการต้องจัดให้พนักงานทุกคนสามารถเข้าถึงสถานพยาบาล รวมถึงการเข้าถึงหรือการติดต่อสื่อสารกับหน่วยงานทางการแพทย์และหน่วยงานฉุกเฉินอื่น ๆ ในกรณีเกิดสถานการณ์ฉุกเฉินหรืออุบัติเหตุ","เจตนา: เพื่อยืนยันว่าสถานประกอบการจัดการดูแลทางการแพทย์ที่จำเป็นให้แก่พนักงาน การตีความ: การดูแลทางการแพทย์ขั้นพื้นฐานอาจจัดให้ ณ สถานประกอบการ ส่วนการดูแลที่ซับซ้อนกว่านั้นควรจัดโดยสถานพยาบาลภายนอก"],["2b","BAP · 2B Enhanced · หมวด 12","12.2","","สถานประกอบการต้องจัดเก็บบันทึกการดูแลทางการแพทย์ที่ให้แก่บุคคลในสถานประกอบการ บันทึกดังกล่าวต้องเก็บเป็นความลับและเก็บรักษาไว้เป็นระยะเวลาอย่างน้อย 3 ปี","เจตนา: เพื่อยืนยันว่าสถานประกอบการมีการบันทึกการดูแลทางการแพทย์ที่ให้ไว้ และเก็บรักษาบันทึกดังกล่าวไว้เป็นความลับ การตีความ: ลักษณะการเก็บรักษาเป็นความลับ หมายถึงมีเพียงผู้ที่จำเป็นต้องรู้เท่านั้นที่สามารถเข้าถึงบันทึกดังกล่าวได้"],["2b","BAP · 2B Enhanced · หมวด 12","12.3","","ชุดปฐมพยาบาลต้องมีการติดป้ายอย่างชัดเจนและพร้อมให้พนักงานเข้าถึงได้ง่ายในบริเวณใกล้พื้นที่ปฏิบัติงานและพื้นที่พักผ่อน และต้องปิดผนึกเพื่อป้องกันการปนเปื้อน","เจตนา: เพื่อยืนยันว่าพนักงานสามารถเข้าถึงชุดปฐมพยาบาลที่ถูกสุขลักษณะได้อย่างรวดเร็ว การตีความ ชุดปฐมพยาบาลควรสามารถระบุได้ง่ายว่าเป็นชุดปฐมพยาบาล อยู่ในสภาพปิด และอยู่ในระยะใกล้จากพื้นที่ปฏิบัติงานและพื้นที่พักผ่อน"],["2b","BAP · 2B Enhanced · หมวด 12","12.3.1","","สถานประกอบการต้องจัดทำบัญชีรายการเวชภัณฑ์ปฐมพยาบาลที่มีไว้ใช้งาน และในกรณีที่เกี่ยวข้อง ต้องระบุวันหมดอายุ และต้องเปลี่ยนเวชภัณฑ์ที่หมดอายุแล้ว","เจตนา: เพื่อให้โรงงานทราบว่ามีเวชภัณฑ์ปฐมพยาบาลชนิดใดอยู่ในสต็อก และเมื่อใดที่ต้องเปลี่ยนใหม่ การตีความ: องค์การแรงงานระหว่างประเทศ (ILO) ระบุว่า กล่องเวชภัณฑ์ปฐมพยาบาลแบบพื้นฐานทั่วไปมักประกอบด้วยรายการดังต่อไปนี้: • แผ่นปิดแผลปลอดเชื้อชนิดมีกาวในตัว บรรจุแยกชิ้น; • ผ้าพันแผล (และผ้าพันแผลห้ามเลือด ตามความเหมาะสม); • ผ้าปิดแผลหลากหลายชนิด; • แผ่นปลอดเชื้อสำหรับแผลไฟไหม้; • แผ่นปิดตาปลอดเชื้อ; • ผ้าพันแผลรูปสามเหลี่ยม; • เข็มกลัดซ่อนปลาย; • กรรไกร 1 เล่ม; • น้ำยาฆ่าเชื้อ (antiseptic); • สำลีก้อน; • บัตรคำแนะนำการปฐมพยาบาล"],["2b","BAP · 2B Enhanced · หมวด 12","12.4","","โรงงานต้องมีขั้นตอนการเยียวยา (remediation) สำหรับบุคคลที่ได้รับบาดเจ็บโดยตรงจากอุบัติเหตุในสถานที่ทำงาน และปัจจุบันไม่สามารถปฏิบัติหน้าที่ตามสัญญาจ้างได้ตามความเห็นทางการแพทย์","เจตนา: เพื่อยืนยันว่าพนักงานได้รับการสนับสนุนหากได้รับบาดเจ็บจากการทำงานและไม่สามารถปฏิบัติหน้าที่ตามที่ได้รับมอบหมายได้อีกต่อไป การตีความ: ขั้นตอนการเยียวยาจะถูกจัดทำขึ้นโดยอาศัยคำแนะนำจากผู้เชี่ยวชาญทางการแพทย์ เพื่อกำหนดว่าพนักงานสามารถปฏิบัติงานประเภทใดได้ตามสภาพร่างกาย การเยียวยาอาจรวมถึงการชดเชยทางการเงินหากพนักงานไม่สามารถทำงานได้อีกต่อไป หรือสามารถปฏิบัติงานได้เฉพาะตำแหน่งที่มีค่าจ้างต่ำกว่าเดิม"],["2b","BAP · 2B Enhanced · หมวด 12","12.5","","โรงงานต้องจัดให้มีการตรวจสุขภาพ (medical screening) เป็นประจำตามผลการประเมินความเสี่ยง สำหรับพนักงานที่ปฏิบัติงานกับวัตถุอันตรายหรือสารเคมี และจัดให้มีการทดสอบการได้ยินสำหรับพนักงานที่สัมผัสกับเสียงดัง","เจตนา: เพื่อยืนยันว่าพนักงานที่สัมผัสกับวัตถุอันตรายหรือสารเคมีมีสิทธิ์เข้ารับการตรวจสุขภาพเป็นประจำ การตีความ: ควรจัดให้มีมาตรการป้องกัน เช่น PPE (อุปกรณ์ป้องกันส่วนบุคคล) และการฝึกอบรมเฉพาะทาง สำหรับพนักงานที่ปฏิบัติงานกับวัตถุอันตรายหรือสารเคมี หากพนักงานมีความเสี่ยงสูงมาก โรงงานต้องจัดให้มีการตรวจสุขภาพเพื่อช่วยระบุปัญหาต่าง ๆ เช่น ปัญหาระบบทางเดินหายใจ ได้ตั้งแต่เนิ่น ๆ"],["2b","BAP · 2B Enhanced · หมวด 13","13.1","","โรงงานต้องมีการฝึกอบรมที่มีการบันทึกเป็นเอกสารสำหรับพนักงาน ตามบทบาทหน้าที่เฉพาะของแต่ละคนภายในบริษัท ในด้านต่าง ๆ ซึ่งรวมถึงแต่ไม่จำกัดเพียงรายการที่ระบุไว้ด้านล่างนี้ การฝึกอบรมทั้งหมดต้องอยู่ภายใต้การดูแลของผู้มีอำนาจหน้าที่ที่ผ่านการฝึกอบรมมาแล้ว • ผู้ควบคุมเครื่องจักรและอุปกรณ์อันตรายอื่น ๆ • สารเคมีอันตราย สารพิษ และการใช้งานและการกำจัดวัตถุอันตราย รวมถึงการทำความสะอาดเมื่อมีการรั่วไหล • การฝึกอบรมปฐมนิเทศพนักงานใหม่ในด้านสุขภาพทั่วไป ความปลอดภัย คุณภาพผลิตภัณฑ์ และการป้องกันการปนเปื้อนของผลิตภัณฑ์ ต้องดำเนินการก่อนที่พนักงานจะปฏิบัติงานหรือฝึกงานในสถานที่ทำงาน • การป้องกันและความปลอดภัยจากอัคคีภัยและไฟฟ้าฉุกเฉิน • สุขอนามัยส่วนบุคคล • ความปลอดภัยด้านอาหารและวิธีการปฏิบัติที่ดีในการผลิต (GMP) • โปรแกรมการฝึกอบรมทบทวนความรู้ • ด้านอื่นใดที่พิจารณาว่าอาจเป็นอันตรายหรือเป็นภัยต่อความปล…","เจตนา: เพื่อยืนยันว่าพนักงานได้รับการฝึกอบรมในด้านสำคัญและมีใบอนุญาตที่จำเป็น การตีความ: ควรมีการฝึกอบรมอย่างน้อยปีละครั้ง และเป็นส่วนหนึ่งของการฝึกอบรมสำหรับพนักงานใหม่"],["2b","BAP · 2B Enhanced · หมวด 13","13.1.1","","โปรแกรมการฝึกอบรมต้องมีข้อกำหนดเฉพาะเพื่อติดตาม ตรวจสอบ และบันทึกผลประสิทธิผลของการฝึกอบรม รวมถึงยืนยันว่าเนื้อหาของโปรแกรมการฝึกอบรมได้ถูกนำไปปรับใช้ในสถานที่ทำงานอย่างมีประสิทธิผล","เจตนา: เพื่อยืนยันว่าสิ่งที่ได้เรียนรู้จากการฝึกอบรมได้ถูกนำไปปฏิบัติจริง"],["2b","BAP · 2B Enhanced · หมวด 13","13.1.2","","ต้องมีการจัดทำและเก็บรักษาบันทึกที่ยืนยันการฝึกอบรมอย่างเหมาะสมในทุกหัวข้อที่กล่าวมาข้างต้น เป็นระยะเวลา 3 ปี","เจตนา: เพื่อยืนยันว่าการฝึกอบรมมีการบันทึกเป็นเอกสารและเก็บรักษาบันทึกไว้เป็นระยะเวลา 3 ปี การตีความ: การตรวจสอบยืนยันการฝึกอบรมอาจรวมถึงรายชื่อผู้เข้าร่วมในแต่ละหลักสูตรการฝึกอบรม"],["2b","BAP · 2B Enhanced · หมวด 13","13.1.3","","ผู้บริหารระดับสูงต้องดูแลให้มั่นใจว่าโปรแกรมการฝึกอบรมทั้งหมดดำเนินการโดยวิทยากร/ผู้ฝึกสอนที่มีคุณสมบัติเหมาะสมอย่างถูกต้อง","เจตนา: เพื่อยืนยันว่าการฝึกอบรมมีคุณภาพที่เหมาะสม การตีความ: คุณสมบัติที่เหมาะสม หมายถึง วิทยากรมีประสบการณ์หรือการฝึกอบรมที่จำเป็น"],["2b","BAP · 2B Enhanced · หมวด 13","13.1.4","","ในกรณีที่กฎหมายท้องถิ่นกำหนดให้พนักงานต้องมีใบอนุญาตในการใช้งานหรือบำรุงรักษาอุปกรณ์ดังกล่าว ต้องมีการเก็บรักษาหลักฐานใบอนุญาตที่ยังไม่หมดอายุไว้","เจตนา: เพื่อยืนยันว่าพนักงานที่ใช้งานหรือบำรุงรักษาอุปกรณ์มีใบอนุญาตที่จำเป็นสำหรับการปฏิบัติงานดังกล่าว"],["2b","BAP · 2B Enhanced · หมวด 13","13.2","","การฝึกอบรมทั้งหมดต้องดำเนินการภายในเวลาทำงานปกติของพนักงาน และไม่มีการเรียกเก็บค่าใช้จ่ายใด ๆ จากพนักงาน ในกรณีที่ต้องจัดการฝึกอบรมนอกเวลาทำงานปกติ พนักงานต้องได้รับค่าตอบแทนสำหรับเวลาดังกล่าว และได้รับค่าจ้างในอัตราพิเศษสำหรับชั่วโมงการทำงานล่วงเวลา ตามที่ระบุไว้ในข้อ 2.4","เจตนา: เพื่อยืนยันว่าการฝึกอบรมไม่มีการเรียกเก็บค่าใช้จ่าย และหากจัดขึ้นนอกเวลาทำงาน พนักงานจะได้รับค่าตอบแทนสำหรับเวลาที่ใช้ การตีความ: ควรมีการจ่ายค่าจ้างในอัตราพิเศษหากการฝึกอบรมนั้นต้องใช้ชั่วโมงการทำงานล่วงเวลา"],["rte","BAP · Module 3 RTE","RTE1","","โรงงานที่ผลิตผลิตภัณฑ์บ่ม เค็ม และรมควัน รวมถึงผลิตภัณฑ์ปรุงสุก จะต้องปฏิบัติตามแนวทางสำหรับผลิตภัณฑ์ดังกล่าวตามที่กำหนดไว้ใน Association of Food and Drug Officials (AFDO) Cured, Salted, and Smoked Fish Establishments Good Manufacturing Practices - 2019 หรือมาตรฐานที่เทียบเท่า ทั้งในประเทศแหล่งกำเนิดและประเทศที่ส่งออกไป","สามารถดูข้อมูลอ้างอิงของ AFDO ได้ที่ : www.afdo.org/wp-content/uploads/2020/11/Cured_salted_and_smoked_fish_establishments_good_manufacturing_practices_acc_updated_2019.pdf สามารถดูข้อมูลอ้างอิงของยุโรปได้ที่ https://ec.europa.eu/food/system/files/2018-10/biosafety_fh_guidance_essa_smoked-salted-marinated-fish.pdf"],["rte","BAP · Module 3 RTE","RTE2","","สำหรับกระบวนการพาสเจอร์ไรซ์ด้วยความร้อน (thermal pasteurization) ความถูกต้อง (validity) ของกระบวนการจะต้องได้รับการพิสูจน์ด้วยผลการศึกษาทางวิทยาศาสตร์เป็นลายลักษณ์อักษร ซึ่งจะต้องนำเสนอให้แก่ผู้ตรวจประเมิน (auditor)","การพัฒนากระบวนการพาสเจอร์ไรซ์ต้องอาศัยความรู้เชี่ยวชาญด้านกระบวนการทางความร้อน ข้อมูลดังกล่าวอาจได้มาจากผู้เชี่ยวชาญภายในองค์กร เอกสารทางวิชาการที่มีอยู่จากหน่วยงานราชการระดับรัฐ ระดับสหพันธรัฐ หรือระดับท้องถิ่น และ/หรือหน่วยงานผู้เชี่ยวชาญด้านกระบวนการที่ได้รับการยอมรับ (recognized process authority)"],["rte","BAP · Module 3 RTE","RTE3","","น้ำที่ใช้หล่อเย็นภาชนะบรรจุ (container) จะต้องผ่านการเติมคลอรีนหรือฆ่าเชื้อด้วยวิธีอื่นตามความจำเป็น จะต้องมีการเก็บบันทึกการเฝ้าติดตามระดับสารฆ่าเชื้อคงเหลือ (sanitizer residue) ในน้ำระบายจากการหล่อเย็น","โรงงานจะต้องดำเนินการตามข้อกำหนดของหน่วยงานกำกับดูแล เพื่อให้มั่นใจว่ามีระดับสารฆ่าเชื้อคงเหลือที่สามารถวัดได้ในน้ำ ก่อนการใช้งานหรือที่จุดระบายน้ำของระบบหล่อเย็นภาชนะบรรจุ"],["rte","BAP · Module 3 RTE","RTE4","","จะต้องมีระบบอากาศแรงดันบวกที่ผ่านการกรอง (filtered positive air flow) ในพื้นที่แปรรูปที่มีความเสี่ยงสูงทุกแห่ง","การกรองอากาศจะต้องมีขนาดน้อยกว่า 5 ไมครอนหรือละเอียดกว่า"],["rte","BAP · Module 3 RTE","RTE5","","น้ำเสียจากกระบวนการผลิตจะต้องระบายออกจากพื้นที่ความเสี่ยงสูง (พื้นที่ปรุงสุกและพื้นที่พร้อมบริโภค - ready-to-eat) ไปยังพื้นที่ความเสี่ยงต่ำกว่า จะต้องมีแผนผังของระบบระบายน้ำเก็บไว้ให้พร้อมใช้งาน","ระบบระบายน้ำแบบเปิดใดๆ จะต้องได้รับการออกแบบเพื่อให้มั่นใจว่าไม่มีการปนเปื้อนข้าม (cross contamination) ระหว่างพื้นที่ผลิตภัณฑ์ดิบและพื้นที่ผลิตภัณฑ์พร้อมบริโภค (ready-to-eat)"],["rte","BAP · Module 3 RTE","RTE6","","ผลิตภัณฑ์อาหารที่เอื้อต่อการเจริญเติบโตของเชื้อ L. monocytogenes จะต้องมีมาตรการควบคุมด้วยสารต้านจุลชีพ (antimicrobial control measures) ที่ผ่านการทวนสอบความถูกต้อง (validated) และจะต้องมีการเก็บบันทึกการควบคุมกระบวนการที่เกี่ยวข้อง","มีวิธีการควบคุมโดยไม่ใช้ความร้อน (non thermal intervention) หลายวิธีที่สามารถใช้เพื่อลดระดับเชื้อ L. monocytogenes บนผลิตภัณฑ์ดิบ ได้แก่ การบำบัดพื้นผิวด้วยสารต้านจุลชีพ การใช้สารเคมี การล้าง การพ่น และการฉีด โปรแกรมการทดสอบสภาพแวดล้อม (environmental testing) สำหรับเชื้อลิสเทอเรียในผลิตภัณฑ์ที่ไม่ผ่านการฆ่าเชื้อด้วยความร้อนถือเป็นวิธีที่ยอมรับได้"],["rte","BAP · Module 3 RTE","RTE7","","พื้นที่ความเสี่ยงต่ำ/ความเสี่ยงสูง อุปกรณ์ทำความสะอาด และ PPE จะต้องมีการระบุไว้อย่างชัดเจนภายในโรงงาน และพื้นที่ความเสี่ยงสูงจะต้องถูกแยกออกจากพื้นที่ความเสี่ยงต่ำอย่างมีประสิทธิภาพ","เจตนารมณ์ของข้อกำหนดนี้คือการแยกพื้นที่แปรรูปความเสี่ยงสูงและความเสี่ยงต่ำออกจากกันอย่างมีประสิทธิภาพ และป้องกันการปนเปื้อนข้ามที่อาจเกิดขึ้น การแยกพื้นที่อาจดำเนินการได้โดยวิธีใดวิธีหนึ่งดังต่อไปนี้ : • ใช้ผนังกั้นที่ไม่ซึมผ่าน (non-permeable barrier) พร้อมประตูปิดอัตโนมัติ (self-closing doors) หรือ •หากใช้มาตรการอื่นในการควบคุมการปนเปื้อนข้ามระหว่างพื้นที่ความเสี่ยงสูงและความเสี่ยงต่ำ จะต้องมีการประเมินความเสี่ยงเป็นลายลักษณ์อักษร เพื่อแสดงให้เห็นว่ามาตรการดังกล่าวสามารถควบคุมการแพร่กระจายของสิ่งปนเปื้อนที่อาจเกิดขึ้นระหว่างพื้นที่ความเสี่ยงต่ำและความเสี่ยงสูงได้อย่างมีประสิทธิภาพ การประเมิ…"],["rte","BAP · Module 3 RTE","RTE8","","พาเลทไม้จะต้องได้รับการตรวจสอบ ทำความสะอาด และฆ่าเชื้อก่อนนำเข้าสู่พื้นที่ RTE","พาเลทไม้อาจก่อให้เกิดความเสี่ยงต่อการปนเปื้อนทางกายภาพและทางจุลชีววิทยาต่อผลิตภัณฑ์ ดังนั้นโดยทั่วไปจึงไม่แนะนำให้ใช้ในพื้นที่พร้อมบริโภค อย่างไรก็ตาม หากมีการจัดทำเอกสารยืนยันว่าพาเลทได้รับการตรวจสอบ ทำความสะอาด และฆ่าเชื้อก่อนนำเข้าพื้นที่ ก็สามารถอนุญาตให้ใช้ในพื้นที่พร้อมบริโภคได้"],["rte","BAP · Module 3 RTE","RTE9","","จะต้องมีสถานีล้างมือแบบไม่ใช้มือสัมผัส (hands-free) ที่จัดไว้เฉพาะและเข้าถึงได้ง่าย ตั้งอยู่ที่ทางเข้าแต่ละแห่งของพื้นที่ RTE และตลอดพื้นที่ผลิตอาหาร ซึ่งจะต้องติดตั้งอุปกรณ์สุขอนามัย สถานีเจลล้างมือ และเครื่องเป่ามือแบบไม่ใช้มือสัมผัส อุปกรณ์เป่าลมแห้งแบบกลไกจะต้องได้รับการทดสอบตามคำแนะนำของผู้ผลิตหรือผลการประเมินความเสี่ยงด้านการปนเปื้อนทางจุลชีววิทยา จะต้องมีการติดป้ายแสดงวิธีการล้างมือที่สถานีล้างมือแต่ละแห่ง ซึ่งแสดงขั้นตอนการล้างมือและการฆ่าเชื้อ","เพื่อให้สถานีสุขอนามัยมีประสิทธิภาพ จะต้องมีการเติมอุปกรณ์และวัสดุสิ้นเปลืองให้พร้อมใช้งานตลอดทุกช่วงเวลาการผลิต เครื่องเป่าลมมือแบบกลไก (mechanical forced hand air dryers) อาจแพร่กระจายการปนเปื้อนได้หากไม่ได้รับการทำความสะอาดและบำรุงรักษาอย่างเหมาะสม จะต้องมีการทดสอบสิ่งปนเปื้อนทางจุลชีววิทยาของเครื่องเป่ามือ ความถี่ในการทดสอบจะต้องพิจารณาจากคำแนะนำของผู้ผลิตหรือผลการประเมินความเสี่ยง หมายเหตุ: ผลการทดสอบเครื่องเป่ามือโดยทั่วไปจะรายงานเป็นค่า Aerobic plate count ค่าขีดจำกัดสำหรับการทดสอบจะถูกกำหนดผ่านการทดสอบพื้นฐาน (baseline testing) ในโรงงาน ผลการทดสอบควรแสดงถึงการปรับปรุงอย่างต่อเนื่อง (จ…"],["rte","BAP · Module 3 RTE","RTE10","","หากโรงงานใช้ถุงมือแบบใช้แล้วทิ้งภายในพื้นที่ RTE จะต้องทิ้งถุงมือและเปลี่ยนใหม่ พร้อมทั้งฆ่าเชื้อถุงมือใหม่ทุกครั้งที่พนักงานสัมผัสใบหน้าของตนเอง ออกจากห้อง RTE หยิบสิ่งของใดๆ ขึ้นจากพื้น สัมผัสพื้นผิวที่ไม่สะอาด หรือเมื่อถุงมือขาดหรือเสียหาย","เจตนารมณ์ของข้อกำหนดนี้คือเพื่อป้องกันการปนเปื้อนข้ามจากการหยิบจับผลิตภัณฑ์ ถุงมือที่เสียหายหรือปนเปื้อนจะต้องถูกทิ้งในถังขยะที่กำหนดไว้เฉพาะ แนวปฏิบัติที่ดีควรรวมถึงการใช้สีของถุงมือที่สามารถแยกแยะได้ง่ายจากผลิตภัณฑ์และวัสดุบรรจุภัณฑ์"],["rte","BAP · Module 3 RTE","RTE11","","PPE ที่ใช้ในพื้นที่ RTE จะต้องใช้เฉพาะสำหรับพื้นที่ RTE เท่านั้น นอกเหนือจากเครื่องแต่งกายป้องกันอื่นๆ จะต้องสวมหน้ากากอนามัยในพื้นที่ RTE เครื่องแต่งกายป้องกันจะต้องเปลี่ยนตามความถี่ที่พิจารณาจากความเสี่ยง หรืออย่างน้อยหนึ่งครั้งต่อรอบการทำงาน (shift)","• ขั้นตอนการทำความสะอาดและฆ่าเชื้อ PPE เช่น รองเท้าบูท เสื้อคลุม หรือผ้ากันเปื้อน จะต้องมีการจัดทำเป็นเอกสารและผ่านการทวนสอบความถูกต้อง (validated) เพื่อให้มั่นใจว่าการทำความสะอาดมีประสิทธิภาพในการลดความเสี่ยงของการปนเปื้อนข้าม • จะต้องมีภาพประกอบหรือป้ายแสดงเป็นเอกสารในพื้นที่สวม/เปลี่ยนอุปกรณ์ ซึ่งแสดงวิธีการปฏิบัติตามขั้นตอน PPE อย่างถูกต้องก่อนเข้าสู่พื้นที่ความเสี่ยงสูง • ภาษาที่ใช้ในเอกสารจะต้องเป็นภาษาที่พ
