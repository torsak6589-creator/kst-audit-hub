นักงานทุกคนในโรงงานสามารถเข้าใจได้"],["rte","BAP · Module 3 RTE","RTE12","","บริการซักผ้าอาจดำเนินการโดยผู้รับเหมาภายนอกที่ได้รับการอนุมัติ (approved 3rd party contractor) หรือดำเนินการภายในโดยโรงงานเอง จำเป็นต้องมีการทวนสอบความถูกต้อง (validation) ของกระบวนการทำความสะอาดทั้งกรณีบริการภายในและภายนอก เสื้อคลุม/ชุดยูนิฟอร์มจะต้องได้รับการป้องกันก่อนนำมาใช้งาน","• เครื่องแต่งกายถือเป็นพื้นผิวที่สัมผัสอาหาร (food contact surface) และจะต้องทำความสะอาดและฆ่าเชื้อก่อนใช้งาน • การทวนสอบความถูกต้องของขั้นตอนการทำความสะอาดจะต้องมีการจัดทำเป็นเอกสาร • อุปกรณ์ป้องกันส่วนบุคคล (Personal Protective Equipment) จะต้องจัดเก็บในลักษณะที่หลีกเลี่ยงการปนเปื้อนก่อนนำมาใช้งาน"],["rte","BAP · Module 3 RTE","RTE13","","รองเท้าที่ใช้ในพื้นที่ RTE จะต้องมีการควบคุมเพื่อป้องกันหรือลดการปนเปื้อนข้ามให้เหลือน้อยที่สุด","การควบคุมรองเท้าอาจดำเนินการโดยโปรแกรมรองเท้าบูทเฉพาะ อ่างจุ่มเท้า (footbaths) หรือการใช้เครื่องล้างรองเท้าบูทแบบกลไก โดยใช้ความเข้มข้นของสารฆ่าเชื้อตามที่ผู้ผลิตแนะนำ"],["rte","BAP · Module 3 RTE","RTE14","","อุปกรณ์ทั้งหมด รวมถึงอุปกรณ์ทำความสะอาดและ PPE ที่ใช้ในพื้นที่พร้อมบริโภค (ready to eat, RTE) จะต้องสามารถระบุได้อย่างชัดเจนและจัดเก็บแยกจากอุปกรณ์ที่ใช้ในพื้นที่ความเสี่ยงต่ำ จะต้องมีขั้นตอนการทำความสะอาดและฆ่าเชื้อที่ผ่านการทวนสอบความถูกต้องสำหรับอุปกรณ์ที่ใช้ในพื้นที่ความเสี่ยงต่ำก่อนนำมาใช้ในพื้นที่ RTE ขั้นตอนการทำความสะอาดและฆ่าเชื้อจะต้องมีการจัดทำเป็นเอกสารและตรวจสอบยืนยัน","อุปกรณ์ร่วมที่ใช้ทั้งในพื้นที่พร้อมบริโภคและพื้นที่วัตถุดิบดิบ จะต้องมีขั้นตอนการทำความสะอาดและฆ่าเชื้อที่ผ่านการทวนสอบความถูกต้อง • แนวปฏิบัติที่ดีควรกำหนดให้มีการตรวจสอบและอนุมัติปล่อยอุปกรณ์ก่อนนำมาใช้ในพื้นที่พร้อมบริโภค • อุปกรณ์ที่ใช้ในพื้นที่ RTE จะต้องสามารถระบุได้อย่างชัดเจนโดยการใช้รหัสสี การติดป้ายกำกับ หรือวิธีการอื่นที่มีประสิทธิภาพ"],["rte","BAP · Module 3 RTE","RTE15","","พนักงานฝ่ายซ่อมบำรุงต้องได้รับการฝึกอบรมที่มีการบันทึกเป็นเอกสาร ก่อนเข้าปฏิบัติงานในพื้นที่ผลิต RTE เกี่ยวกับวิธีการป้องกันการปนเปื้อนข้าม (cross contamination) การฝึกอบรมนี้ต้องจัดขึ้นอย่างน้อยปีละครั้ง และเมื่อได้รับมอบหมายให้เข้าประจำแผนกซ่อมบำรุง","• เจตนารมณ์ของข้อกำหนดนี้คือเพื่อให้พนักงานฝ่ายซ่อมบำรุงทุกคนที่เข้าไปในพื้นที่ผลิตอาหารพร้อมบริโภค (ready to eat) ได้รับการฝึกอบรมด้านการป้องกันการปนเปื้อนและการแพร่กระจายของเชื้อ Listeria • พนักงานฝ่ายซ่อมบำรุงต้องปฏิบัติตามขั้นตอนทั้งหมดที่กำหนดไว้สำหรับการเข้าพื้นที่ผลิตอาหารพร้อมบริโภค รวมถึงหลักปฏิบัติที่ดีในการผลิต (Good Manufacturing Practices: GMPs) การล้างและฆ่าเชื้อเครื่องมือก่อนเข้าพื้นที่ และขั้นตอนการควบคุมสารก่อภูมิแพ้ (allergen)"],["rte","BAP · Module 3 RTE","RTE16","","ต้องมีการจัดทำและดำเนินการตามแผนการเฝ้าติดตามสภาพแวดล้อม (Environmental Monitoring Plan: EMP) ที่มีการบันทึกเป็นเอกสารและอ้างอิงความเสี่ยง เพื่อมุ่งเป้าตรวจหาเชื้อ Listeria spp. แผน EMP ต้องประกอบด้วยองค์ประกอบอย่างน้อยดังต่อไปนี้: • จุดเก็บตัวอย่าง (swab) ตามการแบ่งเขตสุขลักษณะ (Hygienic Zoning) ที่ระบุไว้ในแผน • พื้นที่ที่มีความเสี่ยงสูงต้องได้รับการเก็บตัวอย่างอย่างน้อยสัปดาห์ละครั้ง • ต้องมีการเปลี่ยนตำแหน่งจุดเก็บตัวอย่างเป็นระยะสำหรับทุกเขตพื้นที่ • แผนการปฏิบัติการแก้ไข (Corrective action plan) • การฝึกอบรมพนักงานโรงงานด้านการควบคุมเชื้อ Listeria • การควบคุมวัตถุดิบ • การเก็บตัวอย่างระหว่างการปฏิบัติงาน (Operational swabbing) ที่เกิดขึ้นระหว่างการผลิตต้องรวมอยู่ในแผน EMP","โปรแกรม EMP ต้องเป็นโปรแกรมที่มีการจัดทำเป็นลายลักษณ์อักษร และนำไปปฏิบัติเพื่อตรวจสอบยืนยันความมีประสิทธิผลของโปรแกรมควบคุมเชื้อ Listeria species โปรแกรมที่มีประสิทธิผลจะสามารถระบุตำแหน่งที่พบเชื้อ Listeria และตำแหน่งที่มีศักยภาพเป็นแหล่งหลบซ่อนเชื้อ (harborage sites) ภายในโรงงาน • เขตสุขลักษณะต้องครอบคลุมพื้นผิวที่สัมผัสอาหาร (Food Contact Surfaces: FCS) และพื้นผิวที่ไม่สัมผัสอาหาร (Non-Food Contact Surfaces: Non-FCS) • แผนการปฏิบัติการแก้ไขของ EMP ต้องระบุแนวทางการดำเนินการที่ชัดเจนสำหรับกรณีผลตรวจพบเชื้อ (positive swabs) รวมถึงการทำความสะอาดแบบเจาะลึก (deep cleaning) และการตรวจติดตามผลที่เ…"],["rte","BAP · Module 3 RTE","RTE17","","ผลของโปรแกรม EMP ต้องได้รับการติดตามและวิเคราะห์แนวโน้ม (trend) เพื่อระบุความเป็นไปได้ในการพบเชื้อ Listeria spp. ในพื้นที่ผลิตอาหารพร้อมบริโภค","• โปรแกรมการเฝ้าติดตามที่ได้รับการออกแบบอย่างดีจะช่วยส่งเสริมความรู้และความตระหนักถึงสภาพแวดล้อม • การติดตามและวิเคราะห์แนวโน้มของผลลัพธ์ช่วยให้เห็นภาพรวมของจุดเก็บตัวอย่าง และให้ข้อมูลเกี่ยวกับสภาพแวดล้อมของโรงงาน"],["rte","BAP · Module 3 RTE","RTE18","","กิจกรรมการตรวจสอบยืนยันการทำความสะอาดฆ่าเชื้อ (sanitation verification) ต้องดำเนินการอย่างน้อยก่อนเริ่มการผลิตในแต่ละรอบ (shift) กิจกรรมการตรวจสอบยืนยันต้องรวมถึงการตรวจวัด ATP Swabbing และ/หรือการตรวจหาคราบโปรตีน (protein residue test) และการตรวจสอบด้วยสายตาก่อนเริ่มปฏิบัติงาน (pre-operational visual inspection)","เจตนารมณ์ของข้อกำหนดนี้คือเพื่อให้ข้อมูลป้อนกลับ (feedback) แก่ทีมงานทำความสะอาดฆ่าเชื้อได้อย่างทันที เพื่อให้สามารถดำเนินการแก้ไขได้ก่อนเริ่มการปฏิบัติงาน"],["rte","BAP · Module 3 RTE","RTE19","","โรงงานต้องมีวิธีปฏิบัติงานมาตรฐาน (Standard Operating Procedure: SOP) ที่กำหนดมาตรการที่ต้องดำเนินการเพื่อป้องกันการนำเชื้อก่อโรคเข้าสู่กระบวนการผลิตในระหว่างการติดตั้งเครื่องจักร การซ่อมแซม การก่อสร้าง หรือการปรับปรุงสถานที่","เจตนารมณ์ของข้อกำหนดนี้คือเพื่อป้องกันการนำเชื้อก่อโรคเข้าสู่พื้นที่ผลิต RTE ตัวอย่างมาตรการที่อาจนำมาใช้ ได้แก่: • การตรวจสอบด้าน QA/สุขลักษณะ และการลงนามอนุมัติสำหรับการติดตั้ง การซ่อมแซม หรือการเคลื่อนย้ายเครื่องจักรจากเขตหนึ่งไปยังอีกเขตหนึ่งทั้งหมด • การติดตั้งแนวกั้น (barricade) รอบพื้นที่ก่อสร้าง • การเพิ่มความเข้มข้นของการเก็บตัวอย่างแบบมุ่งเป้า (targeted swabbing) • โปรแกรมการตรวจรับ (commissioning) สำหรับเครื่องจักรและอุปกรณ์ใหม่ทั้งหมด รวมถึงการเก็บตัวอย่าง EMP ก่อนเริ่มปฏิบัติงาน (pre-operational EMP swabbing)"],["rte","BAP · Module 3 RTE","RTE20","","ต้องมีนโยบายด้านสุขอนามัยส่วนบุคคล เพื่อป้องกันไม่ให้พนักงานทุกคนสัมผัสอาหาร RTE ที่เปิดเผยด้วยมือเปล่า เว้นแต่โรงงานสามารถแสดงให้เห็นได้ผ่านการประเมินความเสี่ยงว่ามีมาตรการควบคุมเพื่อป้องกันการปนเปื้อนข้าม","ตัวอย่างมาตรการควบคุม ได้แก่: • โรงงานที่ไม่ได้ให้บริการแก่กลุ่มประชากรที่มีความเสี่ยงสูง (highly susceptible population); • จุดล้างมือ รวมถึงแปรงขัดเล็บ ตั้งอยู่ในตำแหน่งที่เข้าถึงได้ง่าย และอยู่ใกล้กับสถานีปฏิบัติงานที่มีการสัมผัสอาหารด้วยมือเปล่า; • นโยบายด้านสุขภาพพนักงานที่เป็นลายลักษณ์อักษร ซึ่งกำหนดให้มีการบันทึกเป็นเอกสารว่าพนักงานฝ่ายอาหารรับทราบว่าตนได้รับแจ้งให้รายงานข้อมูลด้านสุขภาพและกิจกรรมของตนที่เกี่ยวข้องกับอาการทางระบบทางเดินอาหารและโรคที่สามารถแพร่กระจายผ่านอาหารได้; • นโยบายห้ามสวมเครื่องประดับ; • การใช้น้ำยาฆ่าเชื้อมือหลังการล้างมือ • ขั้นตอนที่มีการบันทึกเป็นเอกสารเกี่ยว…"],["aw","BAP · Module 4 Animal Welfare","AW1","","สัตว์มีชีวิต (หลังการเก็บเกี่ยว) ต้องได้รับการขนส่งไปยังโรงงานแปรรูปหรือตลาดอื่น ๆ ด้วยวิธีการที่คำนึงถึงหลักสวัสดิภาพสัตว์ในระดับสูงและลดความเครียดให้น้อยที่สุด โดยต้องจัดทำเป็นเอกสารในวิธีการปฏิบัติงานมาตรฐานด้านการขนส่ง (Transport Standard Operating Procedures) และต้องครอบคลุมองค์ประกอบต่าง ๆ ตามที่ระบุไว้ในแนวทางปฏิบัติ (guidance) ซึ่งเกี่ยวข้องกับสัตว์น้ำชนิดที่ทำการขนส่ง","เจตนารมณ์ของข้อกำหนดนี้คือเพื่อให้มั่นใจว่าในระหว่างการขนส่งสัตว์มีชีวิต สวัสดิภาพของสัตว์น้ำได้รับการดูแลรักษาอย่างเหมาะสม ควรลดการขนส่งสัตว์มีชีวิตให้น้อยที่สุดเท่าที่จะเป็นไปได้ โดยเลือกใช้วิธีการฆ่า ณ สถานที่ (on-site slaughter) แทน วิธีการปฏิบัติงานมาตรฐานต้องครอบคลุมอย่างน้อยดังต่อไปนี้ • การวางแผนการขนส่ง: ต้องตรวจสอบความพร้อมของปลาก่อนการขนส่ง และห้ามบรรทุกปลาที่แสดงอาการของโรค ความเสียหายทางกายภาพ หรือพฤติกรรมที่ผิดปกติ หรือปลาที่เพิ่งเผชิญกับความเครียดรุนแรงมาก่อน การอดอาหารก่อนการขนส่งต้องไม่เกิน 72 ชั่วโมง • การรักษาคุณภาพน้ำให้เหมาะสมกับชนิดสัตว์น้ำ • กระบวนการเพื่อลดความเสี่ยงด้…"],["aw","BAP · Module 4 Animal Welfare","AW2","","โรงงานต้องจัดทำบันทึกการขนส่ง (transport log) ให้ครบถ้วนสำหรับการขนส่งแต่ละครั้ง รวมถึงการขนส่งที่ดำเนินการโดยผู้ให้บริการขนส่งภายนอกตามสัญญา บันทึกดังกล่าวต้องมีข้อมูลอย่างน้อยดังต่อไปนี้: • วันที่/เวลาเริ่มต้นและสิ้นสุดของการขนส่งสัตว์มีชีวิตในแต่ละรอบ • ต้นทางและปลายทาง • ปริมาณชีวมวล (biomass) โดยประมาณที่ขนส่ง • ปริมาณออกซิเจนที่ละลายในน้ำ (dissolved oxygen) (ตามที่เกี่ยวข้อง) และอุณหภูมิ ณ จุดออกเดินทางและเมื่อถึงปลายทาง • อัตราการตาย","• บันทึกการขนส่งต้องพร้อมให้ผู้ตรวจประเมินตรวจสอบได้ • บันทึกต้องมีความครบถ้วนและถูกต้อง • บันทึกการขนส่งต้องเก็บรักษาไว้ตามนโยบายการเก็บรักษาบันทึกของโรงงาน"],["aw","BAP · Module 4 Animal Welfare","AW2.1","","สมุดบันทึกการขนส่งต้องได้รับการทวนสอบโดยฝ่ายบริหารของโรงงานอย่างน้อยสัปดาห์ละครั้ง เพื่อระบุว่าสวัสดิภาพของสัตว์มีชีวิตระหว่างการขนส่งได้รับผลกระทบหรือไม่ ในกรณีที่สวัสดิภาพของสัตว์มีชีวิตได้รับผลกระทบ โรงงานต้องดำเนินการสอบสวนเพื่อหาสาเหตุที่แท้จริง (root cause) และจัดทำเอกสารบันทึกการปฏิบัติการแก้ไข (corrective actions)","เจตนารมณ์ของข้อกำหนดนี้คือเพื่อระบุและลดปัจจัยต่าง ๆ ที่อาจส่งผลกระทบต่อสวัสดิภาพสัตว์ให้น้อยที่สุด การทวนสอบสมุดบันทึกการขนส่งต้องดำเนินการโดยผู้ที่ได้รับการฝึกอบรมด้านสวัสดิภาพสัตว์ที่เกี่ยวข้องกับชนิดสัตว์น้ำนั้น"],["aw","BAP · Module 4 Animal Welfare","AW2.2","","บันทึกการขนส่งต้องได้รับการลงนามโดยผู้ส่งและผู้รับสินค้า พร้อมระบุวันที่และเวลา","เจตนารมณ์ของข้อกำหนดนี้คือเป็นขั้นตอนการทวนสอบ (verification) บันทึกการขนส่งต้องได้รับการลงนามสำหรับการขนส่งแต่ละครั้ง ทั้งที่จุดต้นทางและจุดรับสินค้า"],["aw","BAP · Module 4 Animal Welfare","AW3","","สำหรับโรงงานที่มีการพักสัตว์มีชีวิตก่อนการฆ่า ต้องมีวิธีการปฏิบัติงานมาตรฐานด้านการพักสัตว์มีชีวิต (Live Holding Standard Operating Procedures) ที่ระบุข้อกำหนดสำหรับการพักสัตว์มีชีวิตภายในโรงงาน ข้อกำหนดดังกล่าวต้องครอบคลุมความหนาแน่น คุณภาพน้ำ ระดับออกซิเจนที่ละลายในน้ำ ระยะเวลาในการพัก วิธีการรวมฝูง (crowding) และการควบคุมอุณหภูมิที่เหมาะสมกับชนิดสัตว์น้ำที่พักไว้","เจตนารมณ์ของข้อกำหนดนี้คือเพื่อให้มั่นใจว่าในระหว่างการพักสัตว์มีชีวิต สวัสดิภาพของสัตว์น้ำได้รับการดูแลรักษาอย่างเหมาะสม วิธีการปฏิบัติงานมาตรฐานด้านการพักสัตว์ต้องมีความเหมาะสมกับชนิดสัตว์น้ำ ควรลดระยะเวลาและความรุนแรงของการรวมฝูง (crowding) ก่อนการฆ่าให้น้อยที่สุด การอดอาหารก่อนการฆ่าต้องไม่เกิน 72 ชั่วโมง ควรลดการจับปลามีชีวิตให้น้อยที่สุด"],["aw","BAP · Module 4 Animal Welfare","AW3.1","","เมื่อไม่สามารถปฏิบัติตามข้อกำหนดของวิธีการปฏิบัติงานมาตรฐานด้านการพักสัตว์มีชีวิตได้ ต้องจัดทำเอกสารบันทึกสาเหตุที่แท้จริง (root cause) และการปฏิบัติการแก้ไข (corrective actions)","เจตนารมณ์ของข้อกำหนดนี้คือเพื่อแก้ไขความเบี่ยงเบน (deviations) ที่พบระหว่างข้อกำหนดของ LSOP และสวัสดิภาพของปลาในระหว่างการพัก"],["aw","BAP · Module 4 Animal Welfare","AW4","","โรงงานต้องมีวิธีการปฏิบัติงานมาตรฐานด้านการฆ่าสัตว์มีชีวิต (Slaughter Standard Operating Procedure) สำหรับการฆ่าสัตว์มีชีวิต วิธีการปฏิบัติงานมาตรฐานด้านการฆ่าต้องกำหนดให้มีการทำให้สลบ (stunning) สัตว์มีชีวิต (ยกเว้นมอลลัสก์) โดยทำให้หมดความรู้สึกตัวอย่างรวดเร็วและคงสภาวะหมดความรู้สึกตัวไว้จนกระทั่งทำการฆ่า วิธีการปฏิบัติงานมาตรฐานด้านการฆ่าต้องอธิบายขั้นตอนสำหรับการประเมินความมีประสิทธิผลของการทำให้สลบด้วย","เจตนารมณ์ของข้อกำหนดนี้คือเพื่อให้มั่นใจว่าสัตว์หมดความรู้สึกตัวอย่างรวดเร็วและคงสภาวะหมดความรู้สึกตัวไว้จนกระทั่งการฆ่าด้วยวิธีปล่อยเลือด (bleeding slaughter) ควรพิจารณาการตอบสนองต่อตัวชี้วัดต่อไปนี้เพื่อประเมินความมีประสิทธิผลของการทำให้สลบในวิธีการปฏิบัติงานมาตรฐานด้านการฆ่า: • พฤติกรรมการว่ายน้ำ • ความสามารถในการพลิกตัวกลับสู่ท่าปกติ (righting ability) • การตอบสนองต่อการจับสัมผัส • การตอบสนองต่อสิ่งกระตุ้น (เช่น การใช้เข็มทิ่ม) • การกลอกตา (eye roll) • การสังเกตการเคลื่อนไหวของแผ่นปิดเหงือก (opercular movement) ที่เป็นปกติ วิธีการปฏิบัติงานมาตรฐานด้านการฆ่าต้องครอบคลุม: • ข้อกำหนดสำหรับกา…"],["aw","BAP · Module 4 Animal Welfare","AW4.1","","ต้องประเมินความมีประสิทธิผลของกระบวนการทำให้สลบทั้งในช่วงเริ่มต้นของการปฏิบัติงานทำให้สลบ และเป็นระยะตลอดกระบวนการทำให้สลบ ปลาที่แสดงอาการรู้สึกตัวหรือทำให้สลบไม่ได้ผลต้องได้รับการทำให้สลบซ้ำก่อนทำการฆ่า","เจตนารมณ์ของข้อกำหนดนี้คือเพื่อให้มั่นใจว่าสัตว์หมดความรู้สึกตัวอย่างรวดเร็วและคงสภาวะหมดความรู้สึกตัวไว้จนกระทั่งการฆ่าด้วยวิธีปล่อยเลือด วิธีการปฏิบัติงานมาตรฐานด้านการฆ่า (Slaughter SOP) (AW4) ต้องกำหนดพฤติกรรมที่ต้องสังเกตซึ่งบ่งชี้ว่าสัตว์หมดความรู้สึกตัวหรือไม่ตอบสนองต่อสิ่งกระตุ้นจากภายนอก"],["aw","BAP · Module 4 Animal Welfare","AW4.2","","เมื่อไม่สามารถปฏิบัติตามข้อกำหนดของวิธีการปฏิบัติงานมาตรฐานด้านการฆ่าได้ ต้องจัดทำเอกสารบันทึกสาเหตุที่แท้จริงและการปฏิบัติการแก้ไข","เจตนารมณ์ของข้อกำหนดนี้คือเพื่อแก้ไขความเบี่ยงเบนที่พบระหว่างข้อกำหนดของ SOP และสวัสดิภาพของปลาในระหว่างการทำให้สลบและการฆ่า"],["aw","BAP · Module 4 Animal Welfare","AW5","","หากกระบวนการทำให้สลบและการฆ่าดำเนินการโดยผู้รับจ้างภายนอก (outsourced) โรงงานต้องทวนสอบว่าผู้รับจ้างแปรรูปภายนอกดังกล่าวปฏิบัติตามวิธีการปฏิบัติงานมาตรฐานด้านการฆ่าของโรงงาน","การทำให้สลบและการฆ่าที่ดำเนินการโดยผู้รับจ้างภายนอกให้แก่โรงงานแปรรูปต้องเป็นไปตามวิธีการปฏิบัติงานมาตรฐานด้านการฆ่า (Slaughter SOP) (AW4) ของโรงงาน โรงงานต้องฝึกอบรมผู้รับจ้างภายนอกในขั้นตอนดังกล่าว โรงงานแปรรูปต้องทวนสอบว่าผู้รับจ้างแปรรูปภายนอกปฏิบัติตามข้อกำหนดของ Slaughter SOP และข้อกำหนดที่เกี่ยวข้อง A4 4.1-A4 4.2 หน่วยปฏิบัติงานฆ่าสัตว์ของผู้รับจ้างภายนอกต้องทวนสอบด้วยการตรวจประเมินภายใน (internal audit) ว่ามีการปฏิบัติตาม Slaughter SOP และบันทึกต่าง ๆ ต้องพร้อมให้ผู้แปรรูปตรวจสอบได้ การตรวจประเมินภายในต้องดำเนินการอย่างน้อยปีละครั้ง"],["aw","BAP · Module 4 Animal Welfare","AW6","","พนักงานทุกคนที่ปฏิบัติงานด้านการขนส่งสัตว์มีชีวิต การทำให้สลบ หรือการฆ่า ต้องได้รับการฝึกอบรมจากผู้ที่มีความรู้ความสามารถ (competent person) ก่อนปฏิบัติงานดังกล่าว การฝึกอบรมต้องมีการจัดทำเป็นเอกสารบันทึก","พนักงานที่ปฏิบัติงานด้านการขนส่ง การพักสัตว์มีชีวิต การทำให้สลบ และการฆ่าสัตว์มีชีวิต ต้องมีความคุ้นเคยกับข้อกำหนดที่เกี่ยวข้องในหมวดนี้ การฝึกอบรมด้านการขนส่งสัตว์มีชีวิตควรครอบคลุมประเด็นต่าง ๆ ดังนี้: • การดูแลรักษายานพาหนะและอุปกรณ์ • การเปลี่ยนน้ำ • การจับและดูแลปลา • การจัดทำและเก็บบันทึก • ความรู้เกี่ยวกับชนิดสัตว์น้ำที่ขนส่ง ความต้องการ และพฤติกรรมของสัตว์น้ำนั้น • ความเข้าใจและวิธีตอบสนองต่อความเครียดและโรค"],["5a","BAP · Module 5A Effluent","C0","","ข้อมูล: โรงงานเลือกใช้แนวทางการจัดการน้ำทิ้ง (Effluent Management) แบบใด?","ขอบข่ายของโมดูลนี้ครอบคลุมข้อกำหนดการระบายน้ำทิ้ง (Effluent Discharge) สำหรับโรงงานแปรรูปที่ผลิตผลิตภัณฑ์สัตว์น้ำจากการเพาะเลี้ยง (Aquaculture) และโรงงานแปรรูปที่ผลิตผลิตภัณฑ์อาหารทะเลจากการจับสัตว์น้ำตามธรรมชาติ (Wild Caught) ที่ไม่ได้ตั้งอยู่ในพื้นที่ห่างไกล (Remote Location) ทั้งนี้ นิยามของ “โรงงานในพื้นที่ห่างไกล (Remote Facility)” ระบุไว้ในโมดูลน้ำทิ้งสำหรับพื้นที่ห่างไกล (Remote Effluent Module)"],["5a","BAP · Module 5A Effluent","C1","","การยกเว้น (Exemptions) ผู้ตรวจประเมิน (Auditor) จะกรอกข้อมูลในหัวข้อนี้ (C1) เฉพาะในกรณีที่โรงงานขอยกเว้นเนื่องจากไม่มีการระบายน้ำทิ้งลงสู่แหล่งน้ำธรรมชาติ หรือระบายน้ำทิ้งทั้งหมดเข้าสู่ระบบบำบัดของเทศบาล หากโรงงานไม่มีคุณสมบัติเข้าเงื่อนไขการยกเว้น ให้เว้นหัวข้อนี้ว่างไว้ และผู้ตรวจประเมินควรไปยังหัวข้อ C2 โดยตรง",""],["5a","BAP · Module 5A Effluent","EFF1","","การยกเว้นกรณีไม่มีการระบายน้ำทิ้ง: โรงงานมีคุณสมบัติเข้าเงื่อนไขการยกเว้น เนื่องจากไม่มีการระบายน้ำทิ้งลงสู่แหล่งน้ำธรรมชาติ และเป็นไปตามใบอนุญาตและกฎระเบียบของหน่วยงานรัฐในระดับท้องถิ่นหรือระดับประเทศ ตัวอย่างของแหล่งน้ำธรรมชาติ ได้แก่ น้ำทะเลชายฝั่ง อ่าว คลอง ปากแม่น้ำ เป็นต้น ตัวอย่างของกรณีไม่มีการระบาย ได้แก่ การนำน้ำทิ้งไปใช้เพื่อการชลประทานหรือวัตถุประสงค์อื่นที่ป้องกันไม่ให้มีการระบายลงสู่แหล่งน้ำธรรมชาติ ผู้ตรวจประเมินจะต้องตรวจสอบยืนยันผ่านบันทึกเอกสารและการตรวจสอบสถานที่จริง หากตรวจสอบยืนยันแล้ว ให้ถือว่าโมดูลนี้เสร็จสมบูรณ์","ผู้ตรวจประเมิน (Auditor) จะกรอกข้อมูลในหัวข้อนี้ (C1) เฉพาะในกรณีที่โรงงานขอยกเว้นเนื่องจากไม่มีการระบายน้ำทิ้งลงสู่แหล่งน้ำธรรมชาติ หรือระบายน้ำทิ้งทั้งหมดเข้าสู่ระบบบำบัดของเทศบาล หากโรงงานไม่มีคุณสมบัติเข้าเงื่อนไขการยกเว้น ให้เว้นหัวข้อนี้ว่างไว้ และผู้ตรวจประเมินควรไปยังหัวข้อ C2- EFF3 โดยตรง"],["5a","BAP · Module 5A Effluent","EFF2","","การยกเว้นกรณีระบายน้ำทิ้งเข้าสู่ระบบเทศบาล: โรงงานมีคุณสมบัติเข้าเงื่อนไขการยกเว้น เนื่องจากมีการระบายน้ำทิ้งเข้าสู่ระบบของเทศบาลหรือโรงบำบัดน้ำเสียของภาคเอกชน ผู้ตรวจประเมินจะต้องตรวจสอบยืนยันผ่านการตรวจสอบสถานที่จริงและบันทึกเอกสาร","นี่คือคำถามเบื้องต้น (Prerequisite) ที่ผู้สมัครขอรับรองต้องตอบ โดยผู้ตรวจประเมินจะทำการตรวจสอบยืนยัน (หากตอบ “ใช่” ให้กรอกข้อกำหนดย่อย EFF2.1 ด้านล่างและหยุด) (หากตอบ “ไม่ใช่” ให้ข้ามไปยังข้อกำหนด EFF3 ถัดไป)"],["5a","BAP · Module 5A Effluent","EFF2.1","","โรงงานต้องไม่ระบายน้ำทิ้งเข้าสู่ระบบบำบัดของเทศบาลหรือนิคมอุตสาหกรรมในระดับที่เกินกว่าปริมาณภาระที่ได้รับอนุญาตจากหน่วยงานรัฐในระดับท้องถิ่นหรือระดับประเทศ","ต้องมีสัญญาที่มีผลบังคับใช้กับเทศบาลหรือนิคมอุตสาหกรรม ซึ่งรับผิดชอบในการบำบัดและกำจัดน้ำทิ้งให้เป็นไปตามกฎระเบียบของหน่วยงานรัฐทั้งในระดับประเทศ ระดับภูมิภาค และระดับท้องถิ่น เมื่อยืนยันได้ดังกล่าวแล้ว ข้อกำหนดเรื่องการเก็บตัวอย่างและทดสอบน้ำทิ้งในโมดูลนี้จะไม่มีผลบังคับใช้"],["5a","BAP · Module 5A Effluent","C2","","การจัดการน้ำทิ้งภายในโรงงาน (Onsite Effluent Management)",""],["5a","BAP · Module 5A Effluent","EFF3","","โรงงานต้องมีใบอนุญาตจากหน่วยงานรัฐที่มีผลบังคับใช้สำหรับการระบายน้ำทิ้งลงสู่แหล่งน้ำธรรมชาติ (ทะเล แม่น้ำ ปากแม่น้ำ เป็นต้น) โรงงานต้องจัดเตรียมคำอธิบายและแผนผังกระบวนการจัดการน้ำทิ้งให้แก่ผู้ตรวจประเมิน","• การบำบัดและระบายน้ำทิ้งภายในโรงงานลงสู่แหล่งน้ำธรรมชาติ จะทำให้ต้องมีการติดตามตรวจสอบน้ำทิ้ง (Effluent Monitoring) และต้องเป็นไปตามค่าพารามิเตอร์น้ำทิ้งของ GSA (Global Seafood Alliance) ทั้งหมดตามตาราง EFF1 • จะมีการเก็บตัวอย่างน้ำทิ้งระหว่างการตรวจประเมิน"],["5a","BAP · Module 5A Effluent","EFF3.1","","หากไม่มีข้อกำหนดให้ต้องมีใบอนุญาตจากหน่วยงานรัฐ โรงงานต้องดำเนินการประเมินผลกระทบสิ่งแวดล้อม (Environmental Impact Assessment) เกี่ยวกับขนาดและระดับของน้ำทิ้งที่สามารถระบายลงสู่แหล่งน้ำธรรมชาตินี้ได้","สำหรับโรงงานใหม่เท่านั้น: การศึกษาผลกระทบสิ่งแวดล้อมอาจแตกต่างกันไปตามประเภทของการแปรรูป ระบบบำบัด ระดับการผลิต และสภาพแวดล้อมที่รองรับการระบาย ประเด็นที่อาจนำมาพิจารณาในการประเมินผลกระทบสิ่งแวดล้อม (Environmental Impact Assessment) มีดังนี้ • ตำแหน่งจุดระบายเมื่อเทียบกับพื้นที่ชุ่มน้ำหรือถิ่นที่อยู่อาศัยที่มีความเปราะบาง • คุณภาพของแหล่งน้ำที่รองรับของเสียจากฟาร์ม • สารเคมี สารประกอบ ของแข็ง และของเสียทางชีวภาพในน้ำเสีย • ความสามารถในการรองรับของแหล่งน้ำที่รับน้ำทิ้ง • ความเสี่ยงในการแพร่กระจายโรคสู่ระบบนิเวศทางน้ำที่รองรับการระบาย • ผลกระทบต่อความหลากหลายทางชีวภาพ โดยเฉพาะชนิดพันธุ์ที่ถูกคุ…"],["5a","BAP · Module 5A Effluent","EFF4","","เพื่อลดความเสี่ยงในการแพร่กระจายโรคจากน้ำทิ้งที่ระบายลงสู่แหล่งน้ำธรรมชาติ โรงงานต้องกรองแยกของแข็งออก และบำบัดน้ำทิ้งโดยใช้กระบวนการฆ่าเชื้อ (Disinfection) ที่มีการทวนสอบความถูกต้อง (Validated) และมีการบันทึกเป็นเอกสาร ซึ่งต้องสามารถทำลายเชื้อก่อโรคได้ก่อนปล่อยน้ำทิ้ง และเป็นไปตามข้อกำหนดการป้องกันโรคที่เฉพาะเจาะจงต่อชนิดสัตว์น้ำ","โรงงานต้องแสดงให้เห็นว่ามีการปฏิบัติตามกระบวนการฆ่าเชื้อที่ผ่านการทวนสอบความถูกต้อง (Validated Disinfection Process)"],["5a","BAP · Module 5A Effluent","EFF4.1","","หลังจากการฆ่าเชื้อน้ำทิ้งแล้ว สารฆ่าเชื้อที่ตกค้างต้องถูกทำให้เป็นกลาง กำจัดออก หรือปล่อยให้สลายไปก่อนที่จะระบายน้ำทิ้ง","ผู้สมัครขอรับรองต้องสามารถแสดงให้เห็นถึงประสิทธิผลของการทำให้สารฆ่าเชื้อเป็นกลาง (Neutralization)"],["5a","BAP · Module 5A Effluent","EFF5","","บันทึกความเข้มข้นของคุณภาพน้ำทิ้งที่ระบายลงสู่แหล่งน้ำธรรมชาติ ต้องเป็นไปตามกฎระเบียบของหน่วยงานรัฐ หรือเกณฑ์ SPS ในตารางที่ 1 โดยให้ใช้เกณฑ์ที่เข้มงวดกว่า","โรงงานต้องกรอกค่าเฉลี่ยรายปี (สำหรับปีปฏิทินที่ผ่านมา) ของแต่ละพารามิเตอร์ และบันทึกผลลงในตาราง EFF1"],["5a","BAP · Module 5A Effluent","EFF5.1","","สำหรับผู้สมัครขอรับรองรายใหม่: ต้องมีข้อมูลน้ำทิ้งที่เก็บระหว่างการดำเนินงานอย่างต่อเนื่องอย่างน้อย 3 เดือน สำหรับน้ำทิ้งที่ระบายลงสู่แหล่งน้ำธรรมชาติ (แม่น้ำ ลำธาร คลอง ปากแม่น้ำ เป็นต้น) ตัวอย่างน้ำทิ้งต้องได้รับการวิเคราะห์ครบทุกตัวแปรที่ระบุไว้ในตารางที่ 1 (รวมถึงข้อมูล 3 เดือนสำหรับตัวแปรที่ตรวจแบบรายไตรมาส)","ผู้สมัครขอรับรองรายใหม่ต้องมีข้อมูลที่เก็บรวบรวมอย่างน้อย 3 เดือน รวมถึงข้อมูล 3 เดือนของพารามิเตอร์ที่ตรวจแบบรายไตรมาส เพื่อนำเสนอในการตรวจประเมินเพื่อขอรับการรับรองครั้งแรก การติดตามตรวจสอบอย่างต่อเนื่องสามารถดำเนินการที่โรงงาน หรือส่งตัวอย่างไปยังห้องปฏิบัติการภายนอกก็ได้"],["5a","BAP · Module 5A Effluent","EFF5.2","","สำหรับการต่ออายุการรับรอง (Recertification): ผลการทดสอบจากการติดตามตรวจสอบคุณภาพน้ำอย่างต่อเนื่อง ต้องเป็นไปตามที่ระบุไว้ในตารางที่ 1 สำหรับปีปฏิทินที่ผ่านมา","#VALUE!"],["5a","BAP · Module 5A Effluent","EFF5.3","","โรงงานต้องบันทึกผลพารามิเตอร์การติดตามตรวจสอบคุณภาพน้ำตามความถี่ที่ระบุไว้ในตารางที่ 1 และรายงานค่าความเข้มข้นเฉลี่ยรายปีของแต่ละพารามิเตอร์ตามที่แสดงในตาราง ในระหว่างการตรวจประเมินประจำปี","หมายเหตุ: เป็นความรับผิดชอบของโรงงานในการคำนวณค่าเฉลี่ยรายปี"],["5a","BAP · Module 5A Effluent","EFF6","","การตรวจสอบยืนยันตัวอย่างระหว่างการตรวจประเมิน: โรงงานหรือห้องปฏิบัติการบุคคลที่สาม (Third-Party Lab) ต้องใช้กระบวนการที่มีการบันทึกเป็นเอกสารในการเก็บ ปิดผนึก และทำเครื่องหมาย/ระบุตัวอย่างทั้งหมด เพื่อให้มั่นใจว่าการดำเนินการเป็นไปอย่างสม่ำเสมอและมาจากตำแหน่งที่กำหนดไว้ล่วงหน้าทั่วทั้งโรงงาน","ผู้ตรวจประเมินต้องกำกับดูแลการเก็บตัวอย่างน้ำทิ้งที่เป็นตัวแทน (Representative Sample) ในการตรวจประเมิน SPS ทุกครั้งที่โมดูลนี้มีผลบังคับใช้ หมายเหตุ: หากบุคคลที่สามดำเนินการเก็บตัวอย่างแบบสุ่มโดยเครื่องจักร ผู้ตรวจประเมินไม่จำเป็นต้องอยู่ตลอดกระบวนการเก็บตัวอย่าง อย่างไรก็ตาม ผู้ตรวจประเมินต้องบันทึกชื่อบริษัทผู้เก็บตัวอย่างบุคคลที่สาม และชื่อผู้แทนที่ทำการเก็บตัวอย่าง"],["5a","BAP · Module 5A Effluent","EFF6.1","","โรงงานต้องแสดงให้เห็นว่ามีการเก็บตัวอย่างอย่างถูกต้องและเป็นไปตามกระบวนการที่กำหนดไว้โดยโรงงานหรือห้องปฏิบัติการบุคคลที่สาม จากตำแหน่งที่ถูกต้อง โดยใช้วิธีการเก็บตัวอย่างที่เป็นที่ยอมรับ และมีการทำเครื่องหมายและปิดผนึกอย่างถูกต้อง","ตัวอย่างต้องถูกเก็บโดยโรงงาน หรือโดยห้องปฏิบัติการบุคคลที่สามที่โรงงานกำหนด ขอแนะนำให้จัดการเก็บตัวอย่างในวันแรกของการตรวจประเมิน ผู้ตรวจประเมินต้องกำกับดูแลกระบวนการนี้และตรวจสอบยืนยันว่ามีการเก็บตัวอย่างจากตำแหน่งที่ถูกต้องและใช้วิธีการเก็บตัวอย่างที่เป็นที่ยอมรับ บันทึกการเก็บตัวอย่างด้วยภาพถ่ายของตัวอย่างที่แสดงให้เห็นว่ามีการทำเครื่องหมายด้วยหมายเลขตัวอย่าง วันที่ เวลา ชื่อโรงงาน ตำแหน่งเก็บตัวอย่าง วิธีการเก็บ และผู้เก็บตัวอย่าง ผู้เก็บตัวอย่างควรตรวจสอบให้แน่ใจว่าตัวอย่างถูกปิดผนึกด้วยเทปป้องกันการงัดแงะ (Tamper Resistant Tape) ต้องพยายามอย่างเต็มที่ในการจัดส่งตัวอย่างไปยังห้องปฏิบัติก…"],["5a","BAP · Module 5A Effluent","EFF6.2","","ตัวอย่างทั้งหมดที่เก็บได้ต้องถูกจัดส่งเพื่อทดสอบไปยังห้องปฏิบัติการทดสอบสิ่งแวดล้อมที่มีการรับรองด้านการทดสอบสิ่งแวดล้อมที่มีผลบังคับใช้ เช่น NELAP (National Environmental Laboratory Accreditation Program) การรับรองมาตรฐาน ISO 17025 หรือการรับรองจากหน่วยงานรัฐระดับประเทศ/ท้องถิ่น","ค่าใช้จ่ายในการทดสอบเป็นความรับผิดชอบของโรงงาน ผู้ตรวจประเมินจะต้องตรวจสอบว่าผลการทดสอบถูกส่งตรงไปยังหน่วยงานรับรอง (Certification Body) โดยตรง ห้องปฏิบัติการบุคคลที่สาม (Third Party Lab) จะต้องได้รับอนุญาตจากโรงงานก่อนเปิดเผยผลการทดสอบให้แก่หน่วยงานรับรอง"],["5a","BAP · Module 5A Effluent","EFF6.2.1","","ข้อมูล: กรอกผลค่า pH จากตัวอย่างที่ทดสอบระหว่างการตรวจประเมิน:","การรวบรวมข้อมูล"],["5a","BAP · Module 5A Effluent","EFF6.2.2","","ข้อมูล: กรอกผลค่าของแข็งแขวนลอยทั้งหมด (Total Suspended Solids, TSS) จากตัวอย่างที่ทดสอบระหว่างการตรวจประเมิน:","การรวบรวมข้อมูล"],["5a","BAP · Module 5A Effluent","EFF6.2.3","","ข้อมูล: กรอกผลค่าฟอสฟอรัสทั้งหมด (Total Phosphorus) จากตัวอย่างที่ทดสอบระหว่างการตรวจประเมิน:","การรวบรวมข้อมูล"],["5a","BAP · Module 5A Effluent","EFF6.2.4","","ข้อมูล: กรอกผลค่าฟอสฟอรัสละลายน้ำ (Soluble Phosphorus) จากตัวอย่างที่ทดสอบระหว่างการตรวจประเมิน:","การรวบรวมข้อมูล"],["5a","BAP · Module 5A Effluent","EFF6.2.5","","ข้อมูล: กรอกผลค่าไนโตรเจนแอมโมเนียทั้งหมด (Total Ammonia Nitrogen, TAN) จากตัวอย่างที่ทดสอบระหว่างการตรวจประเมิน:","การรวบรวมข้อมูล"],["5a","BAP · Module 5A Effluent","EFF6.2.6","","ข้อมูล: กรอกผลค่าความต้องการออกซิเจนทางชีวเคมีในระยะเวลา 5 วัน (5-day Biochemical Oxygen Demand, BOD5) จากตัวอย่างที่ทดสอบระหว่างการตรวจประเมิน:","การรวบรวมข้อมูล"],["5a","BAP · Module 5A Effluent","EFF6.2.7","","ข้อมูล: กรอกผลค่าปริมาณน้ำมันและไขมัน (Oil and Grease) จากตัวอย่างที่ทดสอบระหว่างการตรวจประเมิน:","การรวบรวมข้อมูล"],["5a","BAP · Module 5A Effluent","EFF6.2.8","","ข้อมูล: กรอกผลค่าออกซิเจนละลายน้ำ (Dissolved Oxygen, DO) จากตัวอย่างที่ทดสอบระหว่างการตรวจประเมิน:","การรวบรวมข้อมูล"],["5a","BAP · Module 5A Effluent","EFF7","","ข้อมูลการปล่อยน้ำทิ้งและการดำเนินงาน: โรงงานจะต้องบันทึกและนำเสนอต่อผู้ตรวจประเมินเกี่ยวกับปริมาตรเฉลี่ยรายปีของการปล่อยน้ำทิ้งเป็นลูกบาศก์เมตร และจำนวนวันที่มีการดำเนินงาน",""],["5a","BAP · Module 5A Effluent","EFF7.1","","ข้อมูล: กรอกปริมาตรเฉลี่ยรายปีของน้ำทิ้งที่ปล่อยออก เป็นลูกบาศก์เมตร/วัน สำหรับปีปฏิทินที่ผ่านมา","การรวบรวมข้อมูล"],["5a","BAP · Module 5A Effluent","EFF7.2","","ข้อมูล: กรอกจำนวนวันที่โรงงานดำเนินการผลิตในปีปฏิทินที่ผ่านมา","การรวบรวมข้อมูล"],["5a","BAP · Module 5A Effluent","C3","","เขตผสมน้ำ (Mixing Zone) - สำหรับสภาพแวดล้อมทางทะเลเท่านั้น (ตัวเลือกทางเลือกที่ 1) โรงงานที่ปล่อยน้ำทิ้งโดยตรงลงสู่สภาพแวดล้อมทางทะเลที่มีพลังงานสูง (High Energy Marine Environment) อาจเลือกใช้แนวทางทางเลือกในการปฏิบัติตามข้อกำหนด โดยแสดงให้เห็นว่าความเข้มข้นของคุณภาพน้ำ (ตามพารามิเตอร์ที่ระบุไว้ในตารางที่ 1) ที่บริเวณขอบของเขตผสมน้ำที่กำหนดไว้ มีค่าน้อยกว่าหรือเท่ากับความเข้มข้นที่ตรวจวัดได้บริเวณเหนือน้ำของท่อปล่อยน้ำทิ้ง","การดำเนินการ: เขตผสมน้ำ (Mixing Zone) คือส่วนที่กำหนดไว้ของแหล่งน้ำซึ่งการปล่อยน้ำเสียที่ได้รับอนุญาตเกิดการเจือจางในขั้นต้น โดยเกณฑ์คุณภาพน้ำบางประการได้รับอนุญาตให้เกินขีดจำกัดตัวเลขของเกณฑ์นั้นภายในพื้นที่ที่กำหนดนี้ได้ ส่วนน้ำที่อยู่นอกเขตผสมน้ำที่ได้รับอนุญาตในทันทีจะต้องเป็นไปตามเกณฑ์คุณภาพน้ำทั้งหมดที่ระบุไว้ในตารางที่ 1 เขตผสมน้ำ (Mixing Zone): พื้นที่หรือปริมาตรของน้ำบริเวณใกล้จุดปล่อยน้ำทิ้ง (Effluent Outfall) ที่เกิดการเจือจางในขั้นต้นของน้ำเสีย และเป็นบริเวณที่อนุญาตให้เกินมาตรฐานน้ำทิ้งของแหล่งน้ำที่รองรับได้ เขตผสมน้ำที่มีรัศมีเกิน 10 เมตร จะต้องกำหนดขึ้นโดยอาศัยการศึกษาทางอุทกว…"],["5a","BAP · Module 5A Effluent","EFF8","","เมื่อมีการใช้ตัวเลือกเขตผสมน้ำ (Mixing Zone) โรงงานจะต้องแสดงให้เห็นว่าสามารถปฏิบัติตามข้อกำหนดต่อไปนี้ได้:",""],["5a","BAP · Module 5A Effluent","EFF8.1","","เขตผสมน้ำที่มีรัศมีเกิน 10 เมตร จะต้องกำหนดขึ้นโดยอาศัยการศึกษาทางอุทกวิทยาที่ดำเนินการโดยหน่วยงานวิศวกรรมสิ่งแวดล้อมที่ได้รับอนุญาต","ไม่จำเป็นต้องมีการศึกษาทางอุทกวิทยา หากเขตผสมน้ำที่กำหนดขึ้นมีรัศมีน้อยกว่า 10 เมตร"],["5a","BAP · Module 5A Effluent","EFF8.2","","การติดตามตรวจสอบพารามิเตอร์ที่ระบุไว้ในตารางที่ 1 เป็นรายไตรมาส จะต้องดำเนินการที่จุดบริเวณขอบด้านท้ายน้ำ และอีกจุดหนึ่งบริเวณเหนือน้ำของเขตผสมน้ำที่กำหนดไว้ โดยจะต้องระบุพิกัด GPS เพื่อระบุตำแหน่งของการเก็บตัวอย่าง","•การเก็บตัวอย่างจะต้องดำเนินการที่บริเวณประมาณ 5-10 เมตร เหนือทิศทางกระแสน้ำ (up current) (นอกเขตผสมน้ำ) •เก็บตัวอย่างที่ระดับความลึก 0.5 และ 5.0 เมตร •การเก็บตัวอย่างจะต้องดำเนินการที่บริเวณประมาณ 5-10 เมตร \"ตามทิศทางกระแสน้ำ\" (down current) (ขอบของเขตผสมน้ำ) •เก็บตัวอย่างที่ระดับความลึก 0.5 และ 5.0 เมตร ดูข้อมูลเพิ่มเติมที่ https://dec.alaska.gov/water/water-quality/mixing-zones/"],["5a","BAP · Module 5A Effluent","EFF8.3","","ผลการเก็บตัวอย่างในเขตผสมน้ำจะต้องแสดงให้เห็นว่าความเข้มข้นไม่เพิ่มขึ้นระหว่างจุดตรวจสอบท้ายน้ำและเหนือน้ำ","ไม่จำเป็นต้องมีคำแนะนำเพิ่มเติม"],["5a","BAP · Module 5A Effluent","EFF8.4","","ภายใต้ตัวเลือกเขตผสมน้ำ จะต้องมีการติดตามตรวจสอบตัวอย่างเป็นรายไตรมาส","ความถี่ในการเก็บตัวอย่างสำหรับเขตผสมน้ำแตกต่างจากความถี่ที่ระบุไว้ในตารางที่ 1 อย่างไรก็ตาม พารามิเตอร์ยังคงเหมือนเดิม"],["5a","BAP · Module 5A Effluent","EFF8.4.1","","ข้อมูล: กรอกผลค่า pH จากตัวอย่างไตรมาสล่าสุด:","การรวบรวมข้อมูล"],["5a","BAP · Module 5A Effluent","EFF8.4.2","","ข้อมูล: กรอกผลค่าของแข็งแขวนลอยทั้งหมด (TSS) จากตัวอย่างไตรมาสล่าสุด:","การรวบรวมข้อมูล"],["5a","BAP · Module 5A Effluent","EFF8.4.3","","ข้อมูล: กรอกผลค่าฟอสฟอรัสทั้งหมดจากตัวอย่างไตรมาสล่าสุด:","การรวบรวมข้อมูล"],["5a","BAP · Module 5A Effluent","EFF8.4.4","","ข้อมูล: กรอกผลค่าฟอสฟอรัสละลายน้ำจากตัวอย่างไตรมาสล่าสุด:","การรวบรวมข้อมูล"],["5a","BAP · Module 5A Effluent","EFF8.4.5","","ข้อมูล: กรอกผลค่าไนโตรเจนแอมโมเนียทั้งหมด (TAN) จากตัวอย่างไตรมาสล่าสุด:","การรวบรวมข้อมูล"],["5a","BAP · Module 5A Effluent","EFF8.4.6","","ข้อมูล: กรอกผลค่าความต้องการออกซิเจนทางชีวเคมีในระยะเวลา 5 วัน (BOD5) จากตัวอย่างไตรมาสล่าสุด:","การรวบรวมข้อมูล"],["5a","BAP · Module 5A Effluent","EFF8.4.7","","ข้อมูล: กรอกผลค่าปริมาณน้ำมันและไขมันจากตัวอย่างไตรมาสล่าสุด:","การรวบรวมข้อมูล"],["5a","BAP · Module 5A Effluent","EFF8.4.8","","ข้อมูล: กรอกผลค่าออกซิเจนละลายน้ำจากตัวอย่างไตรมาสล่าสุด:","การรวบรวมข้อมูล"],["5a","BAP · Module 5A Effluent","C4","","การศึกษาความสามารถในการรองรับของแหล่งน้ำ (Assimilative Capacity Study) - สำหรับสภาพแวดล้อมทางทะเลเท่านั้น (ตัวเลือกทางเลือกที่ 2) โรงงานที่ปล่อยน้ำทิ้งลงสู่สภาพแวดล้อมทางทะเลซึ่งไม่สามารถปฏิบัติตามค่าจำกัดที่ผันแปรได้ตามที่ระบุไว้ในตารางที่ 1 อาจเลือกดำเนินการศึกษาความสามารถในการรองรับของแหล่งน้ำ ซึ่งแสดงให้เห็นอย่างชัดเจนว่าการปล่อยน้ำทิ้งของตนไม่ก่อให้เกิดผลกระทบที่ไม่พึงประสงค์ต่อแหล่งน้ำที่รองรับ","การดำเนินการ: การศึกษาความสามารถในการรองรับของแหล่งน้ำจะต้องดำเนินการโดยบุคคลที่สามที่มีคุณสมบัติเหมาะสม และปรับปรุงข้อมูลเป็นประจำทุกปี ตัวเลือกนี้ใช้ได้เฉพาะกับโรงงานที่ได้รับอนุญาตให้ดำเนินการศึกษาความสามารถในการรองรับของแหล่งน้ำตามใบอนุญาตหรือข้อกำหนดของหน่วยงานกำกับดูแลระดับท้องถิ่นหรือระดับประเทศเท่านั้น"],["5a","BAP · Module 5A Effluent","EFF9","","เมื่อมีการใช้ตัวเลือกการศึกษาความสามารถในการรองรับของแหล่งน้ำ การศึกษาดังกล่าวจะต้องดำเนินการโดยบุคคลที่สามที่มีคุณสมบัติเหมาะสม จะต้องพร้อมให้ผู้ตรวจประเมินตรวจสอบ และจะต้องเป็นข้อมูลล่าสุด","การประเมินดังกล่าวจะต้องดำเนินการโดยบุคคลหรือองค์กรที่มีความเชี่ยวชาญและไม่มีส่วนเกี่ยวข้องกับโรงงาน คุณสมบัติที่เหมาะสมของผู้เชี่ยวชาญด้านเทคนิคที่ดำเนินการประเมินผลกระทบสิ่งแวดล้อม (Environmental Impact Assessment, EIA) ได้แก่ 1) การถือครองใบรับรองหรือใบอนุญาตด้านการประเมินสิ่งแวดล้อม 2) การขึ้นทะเบียนเป็นผู้ประเมินด้านสิ่งแวดล้อม 3) การมีประสบการณ์สามปีและมีผลงานการจัดทำ EIA หรือ 4) การเป็นพนักงานของบริษัทที่ปรึกษาด้านสิ่งแวดล้อมที่มีความสามารถในการดำเนินการจัดทำ EIA"],["5a","BAP · Module 5A Effluent","EFF9.1","","โรงงานจะต้องบันทึกและนำส่งผลการติดตามตรวจสอบคุณภาพน้ำตามพารามิเตอร์ที่ระบุไว้ในตารางที่ 1 ให้แก่หน่วยงานรับรอง ตามความถี่ที่กำหนดไว้ในตารางที่ 1 และรายงานความเข้มข้นเฉลี่ยรายปีของแต่ละพารามิเตอร์ตามที่แสดงไว้ในตาราง","จะต้องบันทึกข้อมูลเหล่านี้ไว้ในตารางที่ 1 ไม่ว่าจะมีการใช้ตัวเลือกการศึกษาความสามารถในการรองรับของแหล่งน้ำหรือไม่ก็ตาม"],["5a","BAP · Module 5A Effluent","EFF9.1.1","","ข้อมูล: กรอกความเข้มข้นเฉลี่ยรายปีของค่า pH:","การรวบรวมข้อมูล"],["5a","BAP · Module 5A Effluent","EFF9.1.2","","ข้อมูล: กรอกความเข้มข้นเฉลี่ยรายปีของของแข็งแขวนลอยทั้งหมด (TSS):","การรวบรวมข้อมูล"],["5a","BAP · Module 5A Effluent","EFF9.1.3","","ข้อมูล: กรอกความเข้มข้นเฉลี่ยรายปีของฟอสฟอรัสทั้งหมด:","การรวบรวมข้อมูล"],["5a","BAP · Module 5A Effluent","EFF9.1.4","","ข้อมูล: กรอกความเข้มข้นเฉลี่ยรายปีของฟอสฟอรัสละลายน้ำ:","การรวบรวมข้อมูล"],["5a","BAP · Module 5A Effluent","EFF9.1.5","","ข้อมูล: กรอกความเข้มข้นเฉลี่ยรายปีของไนโตรเจนแอมโมเนียทั้งหมด (TAN):","การรวบรวมข้อมูล"],["5a","BAP · Module 5A Effluent","EFF9.1.6","","ข้อมูล: กรอกค่าความต้องการออกซิเจนทางชีวเคมีในระยะเวลา 5 วัน (BOD5) เฉลี่ยรายปี:","การรวบรวมข้อมูล"],["5a","BAP · Module 5A Effluent","EFF9.1.7","","ข้อมูล: กรอกปริมาณน้ำมันและไขมันเฉลี่ยรายปี:","การรวบรวมข้อมูล"],["5a","BAP · Module 5A Effluent","EFF9.1.8","","ข้อมูล: กรอกค่าออกซิเจนละลายน้ำเฉลี่ยรายปี:","การรวบรวมข้อมูล"],["5b","BAP · Module 5B Remote/Wild Env","C0","","ข้อมูล: โรงงานเลือกใช้ตัวเลือกการจัดการน้ำทิ้งแบบใด?","การเก็บข้อมูล"],["5b","BAP · Module 5B Remote/Wild Env","C1","","ข้อยกเว้น","ผู้ตรวจประเมิน (auditor) จะกรอกข้อมูลในส่วนนี้ (C1) เฉพาะในกรณีที่โรงงานขอใช้ข้อยกเว้น ไม่ว่าจะเป็นกรณีไม่มีการปล่อยน้ำทิ้งสู่แหล่งน้ำธรรมชาติ หรือกรณีที่น้ำทิ้งทั้งหมดถูกปล่อยเข้าสู่ระบบของเทศบาล หากโรงงานไม่มีคุณสมบัติที่จะได้รับข้อยกเว้น ให้เว้นส่วนนี้ไว้เป็นค่าว่าง และผู้ตรวจประเมินควรไปยังส่วน C2 โดยตรง โมดูลนี้ใช้กับเกณฑ์น้ำทิ้งสำหรับโรงงานแปรรูปสัตว์น้ำที่ตั้งอยู่ในพื้นที่ชายฝั่งทะเลที่ห่างไกล (remote) ซึ่งแปรรูปเฉพาะสัตว์น้ำที่จับจากธรรมชาติ (wild caught) เท่านั้น สำหรับวัตถุประสงค์ของโมดูลนี้ คำว่า “ห่างไกล (Remote)” หมายถึง โรงงานแปรรูปที่ตั้งอยู่ในระยะเดินทางทางบกมากกว่า 30 นาที หร…"],["5b","BAP · Module 5B Remote/Wild Env","RWE1","","ข้อยกเว้นสำหรับกรณีไม่มีการปล่อยน้ำทิ้ง: โรงงานมีคุณสมบัติที่จะได้รับข้อยกเว้น เนื่องจากไม่มีการปล่อยน้ำทิ้งสู่แหล่งน้ำธรรมชาติ และเป็นไปตามใบอนุญาตและกฎระเบียบของหน่วยงานราชการส่วนท้องถิ่นหรือระดับประเทศ ตัวอย่างของแหล่งน้ำธรรมชาติ ได้แก่ น้ำทะเลชายฝั่ง อ่าว ปากแม่น้ำ เป็นต้น ตัวอย่างของกรณีไม่มีการปล่อยน้ำทิ้ง ได้แก่ การนำน้ำทิ้งไปใช้เพื่อการชลประทานหรือวัตถุประสงค์อื่นที่ป้องกันการปล่อยน้ำทิ้งสู่แหล่งน้ำธรรมชาติ ผู้ตรวจประเมินต้องตรวจสอบยืนยันผ่านบันทึกและการตรวจสอบสถานที่จริง หากได้รับการยืนยันแล้ว ถือว่าโมดูลนี้เสร็จสมบูรณ์","ตัวอย่างของแหล่งน้ำธรรมชาติ ได้แก่ น้ำทะเลชายฝั่ง อ่าว ปากแม่น้ำ เป็นต้น ตัวอย่างของกรณีไม่มีการปล่อยน้ำทิ้ง ได้แก่ การนำน้ำทิ้งไปใช้เพื่อการชลประทานหรือวัตถุประสงค์อื่นที่ป้องกันการปล่อยน้ำทิ้งสู่แหล่งน้ำธรรมชาติที่อยู่นอกพื้นที่ของโรงงาน หากได้รับการยืนยันว่าไม่มีการปล่อยน้ำทิ้ง ถือว่าโมดูลนี้เสร็จสมบูรณ์"],["5b","BAP · Module 5B Remote/Wild Env","RWE2","","ข้อยกเว้นสำหรับการปล่อยน้ำทิ้งเข้าสู่ระบบเทศบาล: โรงงานมีคุณสมบัติที่จะได้รับข้อยกเว้น เนื่องจากปล่อยน้ำทิ้งเข้าสู่ระบบของเทศบาลหรือโรงบำบัดน้ำเสียของภาคเอกชน ผู้ตรวจประเมินต้องตรวจสอบยืนยันผ่านการตรวจสอบสถานที่จริงและบันทึกต่าง ๆ","ต้องมีสัญญาที่ยังมีผลบังคับใช้กับเทศบาลหรือนิคมอุตสาหกรรมซึ่งรับผิดชอบในการบำบัดและกำจัดน้ำทิ้ง ให้เป็นไปตามกฎระเบียบของหน่วยงานราชการ ระดับภูมิภาค และระดับท้องถิ่น เมื่อได้รับการยืนยันแล้ว ถือว่าโมดูลนี้เสร็จสมบูรณ์"],["5b","BAP · Module 5B Remote/Wild Env","RWE2.1","","โรงงานต้องไม่ปล่อยน้ำทิ้งเข้าสู่ระบบบำบัดของเทศบาลหรือนิคมอุตสาหกรรมในระดับที่เกินกว่าปริมาณภาระ (load) ที่ได้รับอนุญาตจากหน่วยงานราชการส่วนท้องถิ่นหรือระดับประเทศ","เจตนารมณ์ของข้อกำหนดนี้คือเพื่อไม่ให้ฝ่าฝืนเงื่อนไขของข้อกำหนดการปล่อยน้ำทิ้งของโรงงาน"],["5b","BAP · Module 5B Remote/Wild Env","C2","","การจัดการน้ำทิ้งภายในโรงงาน",""],["5b","BAP · Module 5B Remote/Wild Env","RWE3","","ในช่วงเวลาที่โรงงานดำเนินการผลิตและมีการปล่อยน้ำทิ้งอยู่ บันทึกความเข้มข้นของคุณภาพน้ำทิ้งที่ปล่อยเข้าสู่แหล่งน้ำธรรมชาติต้องเป็นไปตามกฎระเบียบของหน่วยงานราชการ","ตรวจสอบสำเนากฎระเบียบของหน่วยงานราชการส่วนท้องถิ่นและ/หรือระดับประเทศ เกี่ยวกับการตรวจติดตามตะกอนดิน (sediment) การตรวจติดตามพื้นทะเล (seafloor monitoring) หรือแผนการตรวจติดตามที่เทียบเท่า แผนการประกันคุณภาพโครงการ (Quality Assurance Project Plan: QAPP) แผนคุณภาพน้ำที่รองรับ (Receiving Water Quality Plan) แผนการนำผลิตภัณฑ์กลับมาใช้ประโยชน์ (Product Reutilization Plan) และอื่น ๆ และพิจารณาว่าขั้นตอนการปล่อยน้ำทิ้งเป็นไปตามข้อกำหนดหรือไม่"],["5b","BAP · Module 5B Remote/Wild Env","RWE3.1","","ข้อมูล: ระบุค่าความเข้มข้นของ pH:","การเก็บข้อมูล"],["5b","BAP · Module 5B Remote/Wild Env","RWE3.2","","ข้อมูล: ระบุค่าความเข้มข้นของสารแขวนลอยทั้งหมด (Total Suspended Solids):","การเก็บข้อมูล"],["5b","BAP · Module 5B Remote/Wild Env","RWE3.3","","ข้อมูล: ระบุค่าความเข้มข้นของฟอสฟอรัสทั้งหมด (Total Phosphorus):","การเก็บข้อมูล"],["5b","BAP · Module 5B Remote/Wild Env","RWE3.4","","ข้อมูล: ระบุค่าความเข้มข้นของฟอสฟอรัสที่ละลายได้ (Soluble Phosphorus):","การเก็บข้อมูล"],["5b","BAP · Module 5B Remote/Wild Env","RWE3.5","","ข้อมูล: ระบุค่าความเข้มข้นของแอมโมเนียไนโตรเจนทั้งหมด (Total Ammonia Nitrogen: TAN):","การเก็บข้อมูล"],["5b","BAP · Module 5B Remote/Wild Env","RWE3.6","","ข้อมูล: ระบุค่าความต้องการออกซิเจนทางชีวเคมีในช่วง 5 วัน (5-day Biochemical Oxygen Demand):","การเก็บข้อมูล"],["5b","BAP · Module 5B Remote/Wild Env","RWE3.7","","ข้อมูล: ระบุปริมาณน้ำมันและไขมัน (Oil and Grease):","การเก็บข้อมูล"],["5b","BAP · Module 5B Remote/Wild Env","RWE3.8","","ข้อมูล: ระบุค่าออกซิเจนละลายในน้ำ (Dissolved Oxygen):","การเก็บข้อมูล"],["5b","BAP · Module 5B Remote/Wild Env","RWE4","","น้ำทิ้งต้องได้รับการดักกรอง (screened) เก็บกัก บำบัด กรอง หรือบดย่อย ก่อนการปล่อยทิ้ง น้ำทิ้งที่ผ่านการดักกรองแล้วต้องเป็นไปตามเกณฑ์ดังต่อไปนี้:","ไม่จำเป็นต้องมีคำแนะนำเพิ่มเติม"],["5b","BAP · Module 5B Remote/Wild Env","RWE4.1a","","ของแข็งทั้งหมดที่ถูกดักกรองได้จากน้ำทิ้งของกระบวนการแปรรูปสัตว์น้ำทั้งหมด ต้องได้รับการกำจัดตามขั้นตอนที่จัดทำเป็นเอกสาร ซึ่งเป็นไปตามข้อกำหนดของหน่วยงานราชการส่วนท้องถิ่น ระดับรัฐ และระดับประเทศ และ/หรือนำไปใช้ประโยชน์ใหม่ตามขั้นตอนที่จัดทำเป็นเอกสารสำหรับการใช้ประโยชน์จากผลพลอยได้ (byproducts)",""],["5b","BAP · Module 5B Remote/Wild Env","RWE4.1b","","โรงงานที่ปล่อยน้ำทิ้งลงสู่สิ่งแวดล้อมทางทะเล ต้องมีเอกสารที่อธิบายว่าการปล่อยน้ำทิ้งดังกล่าวได้รับอนุญาตอย่างไร โดยใช้แผนการสุ่มตัวอย่างตะกอนดิน (sediment sampling) การตรวจติดตามพื้นทะเล (seafloor monitoring) หรือแผนที่เทียบเท่า ซึ่งเป็นไปตามข้อกำหนดของใบอนุญาตสำหรับมาตรฐานท้องถิ่นด้านผลกระทบต่อสิ่งมีชีวิตพื้นท้องน้ำ (benthic impacts) และต้องปฏิบัติตามมาตรฐานดังกล่าว","ตรวจสอบสำเนากฎระเบียบของหน่วยงานราชการส่วนท้องถิ่นและ/หรือระดับประเทศ เกี่ยวกับใบอนุญาตการตรวจติดตามตะกอนดิน การตรวจติดตามพื้นทะเล หรือแผนที่เทียบเท่า และพิจารณาว่าขั้นตอนการปล่อยน  ต้องมีการจัดเก็บบันทึกคุณภาพทางจุลชีววิทยาของน้ำดังกล่าว","• หากผลการเฝ้าติดตามทางจุลชีววิทยาของค่า Aerobic Plate Count มากกว่า 100cfu/ml อาจจำเป็นต้องเพิ่มปริมาณสารฆ่าเชื้อเพื่อป้องกันการเสื่อมเสียจากการรั่วซึม (leaker spoilage) • ความถี่ของการทดสอบ Aerobic Plate Count ต้องพิจารณาจากผลการทดสอบทางจุลชีววิทยาในอดีต (baseline) ของน้ำหล่อเย็น • การทดสอบ APC สามารถดำเนินการโดยสถานประกอบการเองหรือส่งตรวจที่ห้องปฏิบัติการบุคคลที่สาม โดยใช้วิธีที่เผยแพร่และเป็นที่ยอมรับ เช่น วิธี AOAC หรือ FDA BAM"],["lacf","BAP · Module 6 LACF","LACF8","","ผู้ทวนสอบบันทึกของผลิตภัณฑ์ LACF และ HACCP ต้องมีการฝึกอบรมในระดับสูงที่เฉพาะเจาะจงกับด้านความปลอดภัยอาหารดังกล่าว ตัวอย่างเช่น การผ่านหลักสูตร US FDA Better Process Control School หรือเทียบเท่า","• การฝึกอบรม Better Process Control ครอบคลุมหลักการควบคุมกระบวนการด้วยความร้อน การปรับกรด (acidification) และการประเมินการปิดผนึกภาชนะบรรจุ"],["lacf","BAP · Module 6 LACF","LACF9","","สำหรับระบบการแปรรูปและบรรจุแบบปลอดเชื้อ (aseptic processing) สถานประกอบการต้องมีขั้นตอนการฆ่าเชื้อสำหรับเครื่องจักร ภาชนะบรรจุ และฝาปิด เพื่อให้มั่นใจถึงภาวะปลอดเชื้อในทางการค้า ต้องมีเอกสารบันทึกที่ถูกต้องของการฆ่าเชื้อก่อนการผลิต (pre-sterilization)","เครื่องจักรสำหรับการแปรรูปและบรรจุต้องอยู่ในสภาวะปลอดเชื้อในทางการค้าก่อนเริ่มการผลิต ต้องมีการศึกษาเพื่อให้ได้ข้อมูลสนับสนุนขั้นตอนการฆ่าเชื้อ"],["out","BAP · Module 7 Outsourcing","OSP1","","โรงงานหลัก (primary facility) ต้องควบคุมหน่วยงานใดๆ ที่ถูกใช้ในการว่าจ้างกระบวนการภายนอก (outsource) ซึ่งอาจมีผลกระทบต่อความปลอดภัยด้านอาหาร ความถูกต้องตามกฎหมาย คุณภาพ การสืบย้อนกลับ (traceability) และความรับผิดชอบต่อสังคมอย่างเหมาะสม นอกเหนือจากเกณฑ์ที่กำหนดไว้ในโมดูลนี้ มาตรการควบคุมต้องประกอบด้วยข้อใดข้อหนึ่งดังต่อไปนี้: a) โรงงานที่รับจ้างผลิตภายนอก (outsourced facility) มีใบรับรองที่ยังมีผลบังคับใช้และเป็นปัจจุบันตามมาตรฐาน GSA Seafood Processing Standard หรือ b) การตรวจประเมิน ณ สถานที่ (on-site audit) ของโรงงานที่รับจ้างผลิตภายนอก โดยผู้ตรวจประเมินภายใน (internal auditor) ที่มีความสามารถของโรงงานหลัก ซึ่งดำเนินการเป็นประจำทุกปี ให้ครอบคลุมขอบเขตทั้งหมดของมาตรฐาน Seafood Processing Standard ฉบับปัจจุบันและโมดูลที่เกี่ยวข้องทั้งหมด","การว่าจ้างผลิตภายนอก (outsourcing) ตามคำนิยามของ GSA หมายถึงกรณีที่โรงงานโอนกระบวนการผลิตบางส่วนเป็นการชั่วคราว รวมถึงการจัดเก็บ การบรรจุขั้นต้น (primary packaging) การติดป้ายกำกับ การเชือด หรือการแปรรูปผลิตภัณฑ์ ไปยังสถานที่อื่น (ในที่นี้เรียกว่าโรงงานรับจ้างผลิตภายนอก หรือ outsourcing facility) เพื่อดำเนินกระบวนการผลิตขั้นกลางกับวัตถุดิบที่จัดส่งโดยโรงงานที่ขอรับการรับรอง SPS (โรงงานหลัก หรือ primary facility) โรงงานรับจ้างผลิตภายนอกอาจอยู่ภายใต้เจ้าของเดียวกันหรือเจ้าของที่แตกต่างจากโรงงานหลักก็ได้ แต่การควบคุมกระบวนการและผลิตภัณฑ์สุดท้ายต้องคงอยู่ที่โรงงานหลัก และการควบคุมดังกล่าวต้องมีกา…"],["out","BAP · Module 7 Outsourcing","OSP1.1","","ภายใต้ OSP1 ตัวเลือก b) ผู้ตรวจประเมินภายใน (internal auditor) ของโรงงานหลักต้องได้รับการฝึกอบรมและมีความสามารถในการดำเนินการตรวจประเมินภายใน ความสามารถของผู้ตรวจประเมินสามารถแสดงให้เห็นได้โดยการดำเนินการตรวจประเมินแบบเฝ้าสังเกต (witness audit) ร่วมกับผู้ตรวจประเมินภายในที่ผ่านการฝึกอบรมแล้ว และเป็นไปตามข้อกำหนดข้อใดข้อหนึ่งดังต่อไปนี้: • เข้าร่วมและสำเร็จการฝึกอบรมหลักสูตรผู้ตรวจประเมินของ GSA หรือ • สำเร็จการฝึกอบรมผู้ตรวจประเมินภายในที่ได้รับการยอมรับในอุตสาหกรรม","เจตนารมณ์ของข้อกำหนดนี้คือเพื่อยืนยันคุณสมบัติของผู้ตรวจประเมินภายในของโรงงาน เหตุผลของข้อกำหนดด้านคุณสมบัติของผู้ตรวจประเมินภายในคือ ผู้ตรวจประเมินภายในต้องสามารถประเมินความปลอดภัยด้านอาหาร ความถูกต้องตามกฎหมาย คุณภาพและการสืบย้อนกลับ สวัสดิภาพสัตว์ และความรับผิดชอบต่อสังคมของกระบวนการที่ว่าจ้างภายนอก ผู้ตรวจประเมินภายในต้องมีทักษะที่เพียงพอเพื่อรับรองว่าโรงงานควบคุมกระบวนการที่ว่าจ้างภายนอกได้ การตรวจประเมินแบบ “เฝ้าสังเกต” (Witness) คือการตรวจประเมินที่ใช้เป็นการอนุมัติขั้นสุดท้ายสำหรับผู้ที่อยู่ระหว่างการฝึกเป็นผู้ตรวจประเมิน (auditor-in-training) เพื่อให้สามารถตรวจประเมินได้อย่างเป็นอิสร…"],["out","BAP · Module 7 Outsourcing","OSP2","","ผู้ตรวจประเมินของ CB (Certification Body) ต้องตรวจสอบยืนยันว่าการตรวจประเมินภายใน (หากมี) ได้ดำเนินการตามข้อกำหนดของมาตรฐาน Seafood Processing Standard ฉบับปัจจุบันและโมดูลที่เกี่ยวข้องทั้งหมด","การตรวจประเมินภายในควรทำให้มั่นใจว่าโรงงานรับจ้างผลิตภายนอกเป็นไปตามข้อกำหนดของ SPS 6.0 โดยใช้เอกสารเดียวกันกับโรงงานหลัก สิ่งนี้คือสิ่งที่ผู้ตรวจประเมินควรตรวจสอบยืนยัน"],["out","BAP · Module 7 Outsourcing","OSP3","","ข้อไม่สอดคล้อง (nonconformance) ทั้งหมดที่เกิดจากการตรวจประเมินภายในของโรงงานรับจ้างผลิตภายนอก ต้องได้รับการยอมรับและปิดประเด็นภายในกรอบเวลาที่ผู้ตรวจประเมินภายในกำหนด","การไม่ปิดข้อไม่สอดคล้องภายในกรอบเวลาที่ผู้ตรวจประเมินกำหนด จะถือเป็นข้อไม่สอดคล้อง"],["out","BAP · Module 7 Outsourcing","OSP4","","โรงงานหลักต้องว่าจ้างบริการแปรรูปภายนอกเฉพาะกับผู้ส่งมอบที่ได้รับการอนุมัติในโครงการอนุมัติผู้ส่งมอบ (Supplier Approval Program) ของตนเองเท่านั้น","ไม่จำเป็นต้องมีคำแนะนำเพิ่มเติม"],["out","BAP · Module 7 Outsourcing","OSP5","","ข้อกำหนดเฉพาะ (specifications) สำหรับบริการแปรรูปที่ว่าจ้างภายนอกต้องได้รับการจัดทำและนำไปปฏิบัติโดยโรงงานหลัก และต้องรวมอยู่เป็นส่วนหนึ่งของสัญญาหรือข้อตกลงการให้บริการที่ลงนามระหว่างโรงงานหลักและโรงงานรับจ้างผลิตภายนอก","ข้อกำหนดเฉพาะสำหรับกระบวนการที่ว่าจ้างภายนอกต้องมีการจัดทำเป็นเอกสาร"],["out","BAP · Module 7 Outsourcing","OSP6","","การเปลี่ยนแปลงใดๆ ต่อกระบวนการ ส่วนผสม หรือวัสดุบรรจุภัณฑ์ที่ระบุไว้ในสัญญา ต้องได้รับการอนุมัติล่วงหน้าจากโรงงานหลัก","ผู้แปรรูปที่รับจ้างภายนอกต้องไม่เปลี่ยนแปลง ทดแทน หรือแก้ไขสัญญาหรือข้อตกลงการให้บริการโดยไม่ได้รับการอนุมัติล่วงหน้าจากโรงงานหลัก การเปลี่ยนแปลงที่เสนอต้องนำเสนอเป็นลายลักษณ์อักษรต่อโรงงานหลัก"],["out","BAP · Module 7 Outsourcing","OSP7","","โรงงานหลักต้องจัดทำและปรับปรุงบัญชีรายชื่อหน่วยงานทั้งหมดที่ว่าจ้างบริการแปรรูปภายนอกให้เป็นปัจจุบัน พร้อมทั้งกิจกรรม/บริการที่เฉพาะเจาะจงซึ่งว่าจ้างให้แต่ละหน่วยงานดำเนินการ บัญชีรายชื่อนี้ต้องได้รับการทบทวนและปรับปรุงอย่างน้อยปีละครั้ง","ไม่จำเป็นต้องมีคำแนะนำเพิ่มเติม"],["out","BAP · Module 7 Outsourcing","OSP8","","โรงงานหลักต้องแต่งตั้งบุคคลหรือคณะบุคคลระดับบริหารที่ได้รับมอบหมาย ซึ่งมีอำนาจในการอนุมัติและ/หรือไม่อนุมัติบริการแปรรูปที่ว่าจ้างภายนอก hain of custody) จากโรงงานที่รับจ้างเหมา (เช่น ประเทศแหล่งกำเนิด) การขนส่งไปยังโรงงานที่รับจ้างเหมา ระหว่างการจัดการ การผลิต และ/หรือการจัดเก็บที่โรงงานที่รับจ้างเหมา และระหว่างการขนส่งจากโรงงานที่รับจ้างเหมากลับไปยังโรงงานหลัก","หลักฐานการสืบย้อนกลับ (chain of custody) ควรประกอบด้วยใบตราส่งสินค้า (bills of lading) บันทึกการผลิต บันทึกการขนส่ง และบันทึกการจัดเก็บ"],["pid","BAP · Module 8 Product Identity","PIP1","","ขั้นตอนการควบคุมป้ายกำกับ (label control) ต้องรวมถึงขั้นตอนสำหรับการติดป้ายกำกับที่ถูกต้องและการลดระดับสถานะดาว (star status) ของผลิตภัณฑ์ ในกรณีที่โรงงานผสมผลิตภัณฑ์ที่มีระดับดาว BAP ต่างกัน ผลิตภัณฑ์นั้นสามารถอ้างสิทธิ์ได้เพียงระดับดาวที่ต่ำที่สุดเท่านั้น ต้องมีการจัดเก็บบันทึกเพื่อแสดงให้เห็นว่าผลิตภัณฑ์ที่มีระดับดาว BAP ต่างกันชนิดใดถูกนำมาผสมกัน และสถานะดาวของผลิตภัณฑ์ที่ได้ถูกลดระดับลงอย่างถูกต้อง","ตัวอย่าง: • หากผลิตภัณฑ์ BAP 3 ดาว ถูกผสมกับผลิตภัณฑ์ BAP 2 ดาว ผลิตภัณฑ์ทั้งลอตต้องติดป้ายกำกับเป็นผลิตภัณฑ์ BAP 2 ดาว ผลิตภัณฑ์ BAP 3 ดาวจะสูญเสียสถานะ 3 ดาว • ในกรณีที่ผลิตภัณฑ์ 1 ดาวและ 2 ดาวถูกผสมกัน หรือผลิตภัณฑ์ 1, 2 และ 3 ดาวถูกผสมกัน ผลิตภัณฑ์ทั้งลอตต้องถูกลดระดับเป็น 1 ดาว)"],["pid","BAP · Module 8 Product Identity","PIP2","","โรงงานต้องกำหนดรหัสการสืบย้อนกลับ (traceability code) ที่ไม่ซ้ำกันสำหรับผลิตภัณฑ์ในแต่ละระดับดาว BAP ไม่ว่าจะมีการใช้โลโก้ BAP บนบรรจุภัณฑ์หรือไม่ก็ตาม รหัสการสืบย้อนกลับที่ไม่ซ้ำกันนี้ต้องถูกกำหนดตั้งแต่ขั้นตอนการรับวัตถุดิบ และต้องคงอยู่ต่อเนื่องตลอดทุกขั้นตอนของการผลิต การบรรจุ และการจัดเก็บ เพื่อให้สามารถระบุและสืบย้อนกลับผลิตภัณฑ์ BAP 2, 3 และ 4 ดาว แต่ละลอตได้อย่างง่ายดาย ทั้งจากกันเองและจากผลิตภัณฑ์ที่ไม่ใช่ BAP","เจตนารมณ์ของข้อกำหนดนี้คือให้โรงงานสามารถระบุและมีความสามารถในการสืบย้อนกลับผลิตภัณฑ์ BAP ทุกลอตในระดับ 1, 2, 3 และ 4 ดาว ได้ แม้จะไม่ได้ใช้โลโก้ก็ตาม"],["pid","BAP · Module 8 Product Identity","PIP3","","บรรจุภัณฑ์ทั้งหมด รวมถึงบรรจุภัณฑ์ของผลิตภัณฑ์สำเร็จรูปและบรรจุภัณฑ์ชั่วคราวของผลิตภัณฑ์ ต้องคงไว้ซึ่งรหัสเฉพาะดั้งเดิมและรหัสอื่นใดที่กำหนดขึ้นในลำดับต่อมา","เจตนารมณ์ของข้อกำหนดนี้คือเพื่อรักษาความสามารถในการระบุตัวผลิตภัณฑ์ (product identity) บนบรรจุภัณฑ์ทั้งหมดที่ใช้ตลอดกระบวนการ"],["pid","BAP · Module 8 Product Identity","PIP4","","รหัสการสืบย้อนกลับเฉพาะที่กำหนดไว้ในเบื้องต้นต้องถูกโอนไปยังเอกสารการจัดส่งซึ่งมอบให้แก่ผู้ซื้อโดยตรง ธุรกรรมทั้งหมดในห่วงโซ่อุปทาน (supply chain) ต้องมีการเชื่อมโยงกันเพื่อยืนยันความต่อเนื่องของการควบคุม (chain of custody) การขายทั้งหมดจากผู้แปรรูปตลอดห่วงโซ่อุปทาน ยกเว้นผู้บริโภค จะต้องคงรหัสเฉพาะนี้ไว้ นอกจากนี้ เอกสารการจัดส่งต้องระบุรายละเอียดปริมาณของผลิตภัณฑ์ในแต่ละระดับดาว BAP และรหัสเฉพาะหรือหมายเลขลอตของผลิตภัณฑ์นั้น","เจตนารมณ์ของข้อกำหนดนี้คือเพื่อรักษาความสามารถในการระบุตัวผลิตภัณฑ์บนบรรจุภัณฑ์ทั้งหมดที่ใช้ตลอดกระบวนการ ตั้งแต่โรงงานผลิตจนถึงลูกค้า เพื่อให้ข้อมูลการสืบย้อนกลับสามารถถูกเก็บรักษาไว้โดยลูกค้ารายสุดท้าย"],["pid","BAP · Module 8 Product Identity","PIP5","","โรงงานต้องบันทึกและแสดงหลักฐานความสัมพันธ์ที่มีการจัดทำเป็นเอกสารกับโรงงาน BAP ทั้งหมดที่โรงงานมีความเชื่อมโยงด้วย เพื่อวัตถุประสงค์ในการอ้างสิทธิ์สถานะดาว","สำหรับผลิตภัณฑ์ในแต่ละสถานะดาว โรงงานต้องเก็บรักษาข้อมูลอ้างอิงใบรับรอง BAP ของฟาร์ม โรงเพาะฟัก (hatchery) และโรงงานผลิตอาหารสัตว์ (feed mill) ที่เกี่ยวข้อง หลักฐานความสัมพันธ์ที่มีการจัดทำเป็นเอกสาร คือสำเนาใบรับรอง BAP ที่ยังไม่หมดอายุ"],["pid","BAP · Module 8 Product Identity","PIP6","","ต้องจัดทำการตรวจสอบดุลมวล (mass balance) สำหรับผลิตภัณฑ์ในแต่ละระดับดาวที่มีการอ้างสิทธิ์ โรงงานต้องแสดงให้เห็นว่าได้จัดซื้อวัตถุดิบจากแต่ละระดับดาวในปริมาณที่เพียงพอต่อการผลิตผลิตภัณฑ์สำเร็จรูปในปริมาณที่อ้างสิทธิ์สำหรับระดับดาวนั้น ๆ ในปีปฏิทินที่ผ่านมา","การคำนวณทั้งหมดต้องทำแยกตามชนิดสัตว์น้ำ (species) ผลลัพธ์จากการตรวจสอบดุลมวลต้องแสดงให้เห็นอย่างชัดเจนว่าปริมาณวัตถุดิบนำเข้าเทียบกับผลผลิตที่ได้ในแต่ละการทดสอบมีความสอดคล้องกับมาตรฐานอุตสาหกรรมหรือข้อกำหนดของโรงงาน และไม่มีการผสมผลิตภัณฑ์ที่ได้รับการรับรอง BAP กับผลิตภัณฑ์ที่ไม่ได้รับการรับรอง และไม่มีการผสมสัตว์น้ำที่จับจากธรรมชาติ (wild-caught) กับชนิดสัตว์น้ำที่มีสิทธิ์ได้รับการรับรอง BAP ต้องจัดเตรียมปริมาณวัตถุดิบและผลิตภัณฑ์สำเร็จรูปแยกตามชนิดสัตว์น้ำให้แก่ BAP/GSA ตามที่กำหนด"],["pid","BAP · Module 8 Product Identity","PIP7","","โรงงานต้องดำเนินการสืบย้อนไปข้างหน้า (trace forward) และสืบย้อนกลับ (trace back) อย่างน้อยหนึ่งครั้งสำหรับผลิตภัณฑ์ที่มีระดับดาวสูงสุดที่ผลิตขึ้นตั้งแต่การตรวจประเมิน GSA Seafood Processing Standard ครั้งล่าสุด","ผู้ตรวจประเมินต้องเลือกลอตสำหรับการสืบย้อนซึ่งรวมถึงลอตผลิตภัณฑ์ที่ได้จัดส่งไปแล้ว ผลิตภัณฑ์บางส่วนอาจยังคงอยู่ในคลังสินค้า แต่จำเป็นต้องสืบย้อนไปข้างหน้าถึงปลายทางการจัดส่งด้วย"],["pid","BAP · Module 8 Product Identity","PIP8","","ผลของการสืบย้อนไปข้างหน้าและสืบย้อนกลับต้องมีการบันทึกไว้ ต้องสามารถตรวจสอบความครบถ้วนได้ 100% ระหว่างการดำเนินการดังกล่าว","หากการสืบย้อนไม่สามารถระบุความครบถ้วนของผลิตภัณฑ์ได้ 100% โรงงานต้องดำเนินการกระทบยอดผลต่างดังกล่าว โดยระบุสาเหตุ เช่น ความสูญเสียจากการจัดเก็บ ผลผลิตจากกระบวนการแปรรูป (processing yield) ตัวอย่างที่จัดส่งออกไป หรือผลิตภัณฑ์ที่ถูกทิ้ง"],["pid","BAP · Module 8 Product Identity","PIP9","","ผลของการดำเนินการสืบย้อนต้องแล้วเสร็จภายในเวลาไม่เกินครึ่งวันทำงาน (4 ชั่วโมง)","ผู้ตรวจประเมินต้องเป็นผู้ริเริ่มการสืบย้อนและบันทึกเวลาเริ่มต้นและเวลาสิ้นสุด"],["pid","BAP · Module 8 Product Identity","PIP10","","ผลิตภัณฑ์ที่ถูกยกเว้น (excluded products) ต้องไม่ใช้โลโก้ BAP บนบรรจุภัณฑ์ที่หันหน้าเข้าสู่ผู้บริโภค (consumer facing packaging)","ผู้ตรวจประเมินจะได้รับแจ้งเกี่ยวกับผลิตภัณฑ์ที่ได้รับการยกเว้นใด ๆ ล่วงหน้าก่อนการตรวจประเมิน"],["test","BAP · Module 9 Testing","FPT0","","ข้อมูล: ระดับความเสี่ยงของโรงงานต่อสารตกค้างจากยาต้านจุลชีพ (antimicrobial residues) หรือความเสี่ยงด้านเชื้อก่อโรคที่มีผลต่อความปลอดภัยอาหาร (food safety pathogenic risks) อยู่ในระดับใด",""],["test","BAP · Module 9 Testing","FPT1","","ผู้ตรวจประเมินต้องยืนยันว่ารายการสินค้าคงคลังผลิตภัณฑ์ (product inventory list) ได้รับการจัดส่งอย่างทันเวลาในช่วงเริ่มต้นของการตรวจประเมิน และไม่พบความไม่สอดคล้องกันระหว่างรายการสินค้าคงคลังกับผลิตภัณฑ์ที่ถูกเลือกสุ่มตัวอย่างในคลังจัดเก็บระหว่างการสุ่มตัวอย่าง","• รายการสินค้าคงคลังผลิตภัณฑ์ต้องจัดส่งให้ผู้ตรวจประเมินภายในวันแรกของการตรวจประเมิน ซึ่งเป็นความหมายของคำว่า \"ทันเวลา\" • หากโรงงานผลิตเฉพาะผลิตภัณฑ์สดและไม่มีสินค้าคงคลัง ต้องเก็บตัวอย่างจากผลิตภัณฑ์ที่ผลิตในระหว่างการตรวจประเมิน (โดยตรงจากสายการผลิต)"],["test","BAP · Module 9 Testing","FPT2","","ผู้ตรวจประเมินต้องยืนยันว่ามีการเลือกรูปแบบผลิตภัณฑ์และจำนวนตัวอย่างที่ถูกต้องสำหรับการทดสอบ","ต้องเก็บตัวอย่างโดยใช้เทคนิคปลอดเชื้อ (aseptic technique) ตามที่อธิบายไว้ด้านล่าง: เทคนิคปลอดเชื้อใช้เพื่อป้องกันการปนเปื้อนอันเกิดจากวิธีการสุ่มตัวอย่างของท่าน การสุ่มตัวอย่างแบบปลอดเชื้อเกี่ยวข้องกับการใช้อุปกรณ์และภาชนะสุ่มตัวอย่างที่ผ่านการฆ่าเชื้อ (sterile) เทคนิคการสุ่มตัวอย่างของท่านคือวิธีที่ล็อตหรือตัวอย่างสัมผัสกับเฉพาะอุปกรณ์สุ่มตัวอย่างหรือภาชนะเท่านั้น"],["test","BAP · Module 9 Testing","FPT3","","ผู้ตรวจประเมินต้องยืนยันว่าการทดสอบที่ดำเนินการโดยห้องปฏิบัติการบุคคลที่สาม (third-party laboratory) มีความครบถ้วน มีการทดสอบพารามิเตอร์ที่ถูกต้องโดยใช้วิธีทดสอบที่ GSA ยอมรับ และมีการใช้ระดับความไว (sensitivity) ที่ถูกต้อง (LOQs, MRPLs) ตามที่ระบุไว้ใน FPT Tables 2, 3 หรือ 4 เมื่อมีผลการทดสอบพร้อมใช้งาน","ผลการทดสอบจากห้องปฏิบัติการจะปรากฏอยู่ในรายงานผลการทดสอบเมื่อการทดสอบเสร็จสิ้น ระดับปฏิบัติการของ GSA (GSA action levels) แสดงไว้ใน FPT tables 2, FPT 3 และ FPT4 ข้อกำหนดและวิธีการทดสอบของห้องปฏิบัติการมีดังนี้: 1. การทดสอบผลิตภัณฑ์ต้องดำเนินการที่ห้องปฏิบัติการบุคคลที่สามที่ได้รับการรับรอง ISO/IEC17025 2. ห้องปฏิบัติการต้องดำเนินงานภายใต้หลักการของ ISO/IEC17025 และเข้าร่วมโปรแกรมทดสอบความชำนาญ (proficiency testing program) ที่ได้รับการรับรอง 3. ห้องปฏิบัติการต้องดำเนินงานภายใต้หลักปฏิบัติทางห้องปฏิบัติการที่ดี (Good Laboratory Practices: GLPs) และเข้าร่วมโปรแกรมทดสอบความชำนาญที่ได้รับการรับรอ…"],["test","BAP · Module 9 Testing","FPT4","","ผู้ตรวจประเมินต้องยืนยันว่าผลการทดสอบตัวอย่างที่เก็บระหว่างการตรวจประเมินเป็นไปตาม GSA Action Levels และค่าจำกัดที่ระบุไว้ใน FPT Tables 2, 3 หรือ 4 หรือไม่ เมื่อมีผลการทดสอบพร้อมใช้งาน","ในกรณีที่ผลการทดสอบไม่เป็นไปตามค่าจำกัดของ GSA ที่ระบุไว้ใน FPT Tables 2,3 หรือ 4 ให้ถือว่าเป็นข้อไม่สอดคล้อง (non-conformance) var F22X={"i":[["4.1","ความเข้าใจและบริบทองค์กร",["• ผู้บริหารระดับสูง หรือ คณะผู้บริหาร ได้กำหนดบริบทภายนอก และภายในหรือไม่ • มีกำหนดความถี่การทบทวนไว้อย่างไร และทบทวนตามความถี่ที่กำหนดหรือไม่ • บริบทภายนอกและภายใน มีการพิจารณารวมในหัวข้อดังนี้หรือไม่ (กฎหมาย, เทคโนโลยี, การแข่งขัน, ตลาด, วัฒนธรรม, สิ่งแวดล้อมทางสังคมและเศรษฐกิจ, ความปลอดภัยทางไซเบอร์, Food Fraud, Food Defense รวมทั้งความรู้และประสิทธิภาพขององค์กร) • ตรวจดูว่า ผู้บริหาร หรือ คณะผู้บริหาร เข้าใจข้อมูล หรือทำบริบทไว้เป็นเอกสารหรือไม่ • ตรวจดู หรือสอบถามให้อธิบายว่า บริบทที่กำหนด…"],["- ตรวจสอบ SWOT ว่าหัวข้อที่วิเคราะห์ครบมั้ย - ตรวจดู PM ว่ามีกำหนดขั้นตอนถูกมั้ย และผู้รับผิดชอบอธิบายตรงรึป่าว - ความถี่ในการตรวจ ได้ทำตามที่กำหนดไว้รึป่าว - PM-MR-13: บริบทองค์กร - FM-MR-36: การประเมินความเสี่ยงและโอกาส ---> มีการเพิ่มเรื่องความปลอดภัยทางไซเบอร์/ Food Fraud/ Food Defense/ Climate Change แล้วหรือยัง"],"(4) บริบทองค์กร : Context of the organization"],["4.2","ความเข้าใจในความต้องการ และความคาดหวังของผู้มีส่วนได้ส่วนเสีย",["• ตรวจผู้บริหารระดับสูง หรือ คณะผู้บริหาร ว่าได้กำหนดผู้มีส่วนได้ส่วนเสียหรือไม่ • ผู้มีส่วนได้เสียที่กำหนดเป็นใครบ้าง (ภายนอก/ ภายใน องค์กร) • มีการกำหนดความต้องการ ความคาดหวังหรือไม่ และกำหนดความถี่ในการทบทวนอย่างไร"],["- มีการระบุผู้มีส่วนได้ส่วนเสียครบถ้วนหรือไม่ ความถี่ในการทบทวน ได้ทำตามแผนหรือไม่ - สุ่มดูผลว่าผู้มีส่วนได้ส่วนเสียระบุความต้องการว่าอย่างไรบ้าง - PM-MR-03: การประเมินความเสี่ยง/ ทะเบียน และแบบสำรวจความต้องการ-ความคาดหวัง"],"(4) บริบทองค์กร : Context of the organization"],["4.3","การกำหนดขอบเขตของระบบจัดการด้านความปลอดภัยของอาหาร",["• ขอดูเอกสารระบุขอบเขต (การรับรอง) ของค์กร เช่น Quality Manual • ขอบเขตที่ระบุนั้น ระบุเป็น ประเภทผลิตภัณฑ์ หรือรวมถึงบริการหลังการขาย หรือบริการ หรือไม่"],["- ตรวจสอบ QM-MR-01: คู่มือคุณภาพ /เอกสารนโยบายคุณภาพ - สำเนาใบ รง.4/ อ.2"],"(4) บริบทองค์กร : Context of the organization"],["4.4","ระบบบริหารจัดการด้านความปลอดภัยอาหาร",["• องค์กรมีการประยุกต์ใช้ข้อกำหนดข้อกำหนดด้านความปลอดภัยอาหารหรือไม่ • มีการประยุกต์ใช้ในทุกกระบวนการที่เกี่ยวข้องหรือไม่"],["- สอบถามกับทางผู้บริหารว่ามีการนำ FSMS มาใช้ ปฏิบัติยังไง จริงมั้ย - ตรวจสอบ QM-MR-01: คู่มือคุณภาพ/ SP-MR-03: ช้อกำหนด FFSC 22000"],"(4) บริบทองค์กร : Context of the organization"],["5.1","ความเป็นผู้นำ และความมุ่งมั่น (Leadership and Commitment) ผู้บริหารระดับสูง ต้องแสดงความเป็นผู้นำ และคำมั่นสัญญา ตามระบบ FSMS โดย",["• มั่นใจว่านโยบายและวัตถุประสงค์ด้านความปลอดภัยที่จัดทำขึ้น สอดคล้องกับทิศทางกลยุทธ์ของบริษัท • มั่นใจว่าข้อกำหนดของระบบการจัดการด้านความปลอดภัยอาหารได้ถูกนำไปใช้กับกระบวนการทางธุรกิจขององค์กร • มั่นใจว่ามีทรัพยากรเพียงพอสำหรับระบบการจัดการด้านความปลอดภัยอาหาร • มีการสื่อสารถึงความสำคัญของระบบ FSMS ที่มีประสิทธิผล รวมทั้งข้อกำหนดกฎหมายที่เกี่ยวข้อง • มั่นใจว่าระบบ FSMS มีการประเมินและคงรักษา เพื่อให้บรรลุผลลัพธ์ที่คาดหวัง • มีการสนับสนุนบุคลากร และส่งเสริมการปรับปรุงอย่างต่อเนื่อง เพื่อนำไปสู่ป…"],["- สัมภาษณ์จากผู้บริหาร หรือตัวแทน - ตรวจบันทึกการฝึกอบรม FSMS - ตรวจคำสั่งแต่งตั้ง FSMS Team - ตรวจบันทึกการฝึกอบรม FSMS และสุ่มดูว่า FSMS Teams ได้รับการอบรมแล้วหรือไม่"],"(5) ความเป็นผู้นำ : Leadership"],["5.2","นโยบาย (Policy)",[],[],"(5) ความเป็นผู้นำ : Leadership"],["5.2.1","การจัดทำนโยบายด้านความปลอดภัยของอาหาร",["• ตรวจผู้บริหารระดับสูง หรือ คณะผู้บริหาร ให้อธิบาย และควรอธิบายได้"],[],"(5) ความเป็นผู้นำ : Leadership"],["5.2.2","การสื่อสารนโยบายความปลอดภัยอาหาร",["• นโยบายตามข้อ 5.2.1 มีการจัดทำไว้เป็นเอกสารหรือไม่ • เอกสารประกาศนโยบาย ได้ติดประกาศ หรือสื่อสารให้พนักงานทุกคนรับทราบหรือไม่ • สุ่มพนักงานระดับต่างๆ ให้อธิบายนโยบายตามที่ประกาศ • ผู้บริหารระดับสูง หรือคณะผู้บริหาร อธิบายได้ว่านโยบายที่กำหนดเกี่ยวข้องกับผู้มีส่วนได้เสียภายนอกด้วยหรือไม่ และกรณีที่มีความเกี่ยวข้องได้สื่อสารไปยังผู้มีส่วนได้เสียภายนอกทราบด้วยหรือไม่"],[],"(a) สามารถอธิบายขั้นตอนการกำหนด และประกาศนโยบายได้หรือไม่ (b) นโยบายที่กำหนด เหมาะสมกับวัตถุประสงค์ และบริบทขององค์กร (…"],["5.3","บทบาท ความรับผิดชอบ และอำนาจหน้าที่",[],[],"(a) สามารถอธิบายขั้นตอนการกำหนด และประกาศนโยบายได้หรือไม่ (b) นโยบายที่กำหนด เหมาะสมกับวัตถุประสงค์ และบริบทขององค์กร (…"],["5.3.1","ตรวจผู้บริหารระดับสูง หรือ คณะผู้บริหาร ให้อธิบาย และควรอธิบายได้ เพื่อมั่นใจว่าบทบาท ความรับผิดชอบ และอำนาจหน้าที่ที่มอบหมายไว้ ได้รับการสื่อสาร และเป็นที่เข้าใจขององค์กร",["• มีการจัดทำผังโครงสร้างองค์กรไว้หรือไม่ • สุ่มตรวจ Job Description มีการระบุความรับผิดชอบ และอำนาจหน้าที่ไว้หรือไม่ • มีประกาศแต่งตั้งคณะความปลอดภัยอาหาร และหัวหน้าทีมหรือไม่ • มีการกำหนดความรับผิดชอบ และอำนาจหน้าที่ในการจัดทำเอกสารหรือไม่"],["- ตรวจสอบ Organize chart องค์กร/ สุ่มตรวจ JD - สัมภาษณ์พนักงานว่าเข้าใจบทบาทหน้าที่ - ตรวจว่า QMR ได้รับการแต่งตั้งโดยผู้บริหาร และมีหน้าที่เกี่ยวกับการจัดการเรื่อง FSMS หรือไม่ - ตรวจว่ามีประกาศแต่งตั้งทีม FSMS มั้ย ,หน้าที่อะไรบ้าง"],"(a) สามารถอธิบายขั้นตอนการกำหนด และประกาศนโยบายได้หรือไม่ (b) นโยบายที่กำหนด เหมาะสมกับวัตถุประสงค์ และบริบทขององค์กร (…"],["5.3.2","หัวหน้าทีมความปลอดภัยอาหาร",["• มีการแต่งตั้งหัวหน้าทีมความปลอดภัยอาหาร และมีการระบุความรับผิดชอบสำหรับ (a) มั่นใจว่าระบบ FSMS ที่จัดทำ มีการนำปฏิบัติ คงไว้ และปรับปรุงให้ทันสมัย (b) บริหารและจัดการงานของทีมความปลอดภัยอาหาร (c) มั่นใจว่ามีการฝึกอบรม และให้ความสามารถที่จำเป็นกับคณะความปลอดภัยอาหาร (d) รายงานประสิทธิผลของระบบ FSMS ให้แก่ผู้อำนวยการสูงสุด • สุ่มตรวจ Job Description มีการระบุความรับผิดชอบ และอำนาจหน้าที่ไว้หรือไม่ • มีประกาศแต่งตั้งคณะความปลอดภัยอาหาร และหัวหน้าทีมหรือไม่"],["- สุ่มดูประการ FSMS Leader มีหน้าที่ดังกล่าวหรือไม่ - บันทึกการประชุมระบบ FSMS - ในการทบทวนโดยฝ่ายบริหารมีการรายงานในเรื่องความคืบหน้า/ ประสิทธิผลของระบบ FSMS หรือไม่ - PM-MR-02: การทบทวนการจัดการโดยฝ่ายบริหาร"],"(a) สามารถอธิบายขั้นตอนการกำหนด และประกาศนโยบายได้หรือไม่ (b) นโยบายที่กำหนด เหมาะสมกับวัตถุประสงค์ และบริบทขององค์กร (…"],["5.3.3","ผู้บริหารได้กำหนดให้พนักงานทุกคนมีหน้าที่ในการรายงานปัญหาที่เกี่ยวกับการจัดการด้านความปลอดภัยของอาหาร FSMS ให้กับบุคคลที่กำหนดไว้",[],[],"(a) สามารถอธิบายขั้นตอนการกำหนด และประกาศนโยบายได้หรือไม่ (b) นโยบายที่กำหนด เหมาะสมกับวัตถุประสงค์ และบริบทขององค์กร (…"],["6.1","การดำเนินการเพื่อจัดการความเสี่ยงและโอกาส",[],[],"(6) การวางแผน : Planning"],["6.1.1","• การวางแผนดำเนินงานระบบ FSMS องค์กรได้มีการพิจารณาในหัวข้อ (4.1) ความเข้าใจและบริบทองค์กร (4.2) ความต้องการและความคาดหวังของผู้มีส่วนได้ส่วนเสีย (4.3) การกำหนดขอบข่ายของระบบจัดการคุณภาพหรือไม่ • มีการกำหนดความเสี่ยง และโอกาสไว้หรือไม่",[],[],"(6) การวางแผน : Planning"],["6.1.2","• องค์กรมีการวางแผนเพื่อดำเนินการจัดการกับความเสี่ยงและโอกาส • องค์กรมีการวางแผนวิธีการจัดการกับความเสี่ยง และโอกาส มีการนำไปปฏิบัติในกระบวนการ FSMS และประเมินผลของการปฏิบัติ",[],[],"(6) การวางแผน : Planning"],["6.1.3","• การดำเนินการขององค์กรเพื่อจัดการกับความเสี่ยงและโอกาสต้องเหมาะสมกับ (a) ผลกระทบต่อความต้องการด้านความปลอดภัยอาหาร (b) ความสอดคล้องของผลิตภัณฑ์อาหารและบริการกับลูกค้า (c) ความต้องการของผู้มีส่วนได้ส่วนเสียในห่วงโซ่อาหาร",[],[],"(6) การวางแผน : Planning"],["6.2","วัตถุประสงค์ความปลอดภัยอาหาร และแผนงานเพื่อทำให้บรรลุวัตถุประสงค์",[],[],"(6) การวางแผน : Planning"],["6.2.1","• องค์กรต้องจัดทำวัตถุประสงค์ (KPI) ความปลอดภัยอาหาร ตามสายงาน ระดับ และกระบวนการที่เกี่ยวข้อง โดย KPI ดังกล่าวต้อง (a) สอดคล้องกับนโยบายความปลอดภัยอาหาร (b) สามารถวัดค่าได้หรือไม่ (ไม่กำหนด) (c) คำนึงถึงข้อกำหนดด้านความปลอดภัยอาหารที่เกี่ยวข้อง รวมถึงความต้องการของลูกค้า (d) มีการติดตามผล และทวนสอ…",[],[],"(6) การวางแผน : Planning"],["6.2.2","• องค์กรต้องมีการกำหนดแผนเพื่อให้บรรลุ KPI โดยต้องระบุ (a) วิธีการดำเนินการ (b) ทรัพยากรที่ต้องใช้ในการดำเนินการ (c) ผู้รับผิดชอบดำเนินการ (d) กำหนดระยะเวลาแล้วเสร็จ (e) วิธีการประเมินผล",[],[],"(6) การวางแผน : Planning"],["6.3","การวางแผนเปลี่ยนแปลง (Planing of Change)",["• เมื่อองค์กรกำหนดความจำเป็นในการเปลี่ยนแปลงระบบ FSMS รวมถึงการเปลี่ยนแปลงบุคลากร การเปลี่ยนแปลงนั้นๆได้ดำเนินการและสื่อสารถึงแผนที่วางไว้หรือไม่ • เมื่อมีการเปลี่ยนแปลงมีการพิจารณาหัวข้อดังกล่าวหรือไม่ (a) วัตถุประสงค์การเปลี่ยนแปลง และผลกระทบที่มีนัยสำคัญจากการเปลี่ยนแปลง (b) ความสมบูรณ์ของ FSMS (c) ทรัพยากรมีความพร้อมสำหรับการเปลี่ยนแปลงอย่างมีประสิทธิผล (d) มีการมอบหมายหรือการมอบหมายซ้ำ ซึ่งอำนาจหน้าที่และความรับผิดชอบหรือไม่"],["- ตรวจสอบ PM-MR การดำเนินการกรณีมีการเปลี่ยนแปลง - (ถ้ามี) กรณีมีการเปลี่ยนแปลง ได้ดำเนินการตามที่กำหนดใน PM และประเมินผลตามหัวข้อดังกล่าวก่อนหรือไม่ (การเปลี่ยนแปลง เช่น เปลี่ยน Supllier Ingredient, ปรับผังอัตรากำลังคน, ลงเครื่องจักรใหม่)"],"(6) การวางแผน : Planning"],["7.1","ทรัพยากร",[],[],"(7) การสนับสนุน : Support"],["7.1.1","ทั่วไป",["• องค์กรได้กำหนด และจัดหาทรัพยากรที่จำเป็นสำหรับระบบ FSMS หรือไม่ • องค์กรได้พิจารณาถึง ขีดความสามารถ ข้อจำกัดในทรัพยากรที่มีอยู่ และความต้องการทรัพยากรจากภายนอกหรือไม่"],["- จากการสัมภาษณ์เบื้องต้น - สุ่มตรวจด้วยสายตาว่าทรัพยากรเพียงพอหรือไม่ เช่น กำลังคน, พื้นที่ห้องเก็บ"],"(7) การสนับสนุน : Support"],["7.1.2","บุคลากร",["• องค์กรต้องมั่นใจว่าบุคลากรมีประสิทธิภาพ และความสามารถ • กรณีมีที่ปรึกษาจากภายนอกต้องมีหลักฐานสัญญา หน้าที่ความรับผิดชอบให้ชัดเจน"],["- ตรวจ PM-HR-02: กระบวนการสรรหาและคัดเลือกบุคลากร/ บันทึกการอบรม FSMS - (ถ้ามี) ถ้าจ้าง Consult ระบบ FSMS ต้องมีหลักฐาน/ สัญญา หน้าที่ความรับผิดชอบให้ชัดเจน"],"(7) การสนับสนุน : Support"],["7.1.3","โครงสร้างพื้นฐาน (ex. อาคารสถานที่, รถขนส่ง, เครื่องมือ เครื่องจักร, ซอฟต์แวร์)",["• องค์กรได้จัดหา และธำรงรักษาโครงสร้างพื้นฐานที่จำเป็น ที่จะทำให้บรรลุความสอดคล้องของ FSMS หรือไม่"],[],"(7) การสนับสนุน : Support"],["7.1.4","สภาพแวดล้อมการทำงาน (ที่มีผลต่อ FSMS)",["• องค์กรได้จัดหา และธำรงรักษาที่ทำให้สภาพแวดล้อมในการทำงานไม่ส่งผลเสียต่อ FSMS หรือไม่ (สภาพแวดล้อมการทำงาน เช่น ปัจจัยทางสังคม/ ปัจจัยทางจิตใจ/ ปัจจัยทางกายภาพ)"],["- ตรวจสอบว่าได้มีการปฏิบัติไว้หรือไม่ เช่น ความเข้มแสงในการปฏิบัติงาน/ ระดับเสียง/ กล่องรับความคิดเห็นของพนักงาน และถ้าพบว่าเกินเกณฑ์มีการดำเนินการอย่างไรบ้าง - PM-SF-01: การบริหารสภาพแวดล้อมและความปลอดภัยในการทำงาน + ผลตรวจ"],"(7) การสนับสนุน : Support"],["7.1.5","องค์ประกอบที่พัฒนาขึ้นจากภายนอกของ FSMS (ใช้บริการหน่วยงานภายนอก)",["• องค์กรต้องมั่นใจว่าองค์ประกอบที่จัดหานั้น (a) ใช้เพื่อพัฒนาให้เป็นไปตามข้อกำหนด (b) สามารถใช้งานได้กับสถานที่ กระบวนการและผลิตภัณฑ์ขององค์กร (c) ถูกปรับอย่างเฉพาะเจาะจงตามกระบวนการ (d) ดำเนินการ คงรักษาไว้ และปรับปรุงให้ทันสมัย (e) เก็บรักษาไว้ซึ่งข้อมูลที่เป็นเอกสาร"],["- ตรวจสอบว่ากรณีที่มีการใช้ข้อมูลอ้างอิงจากภายนอก เช่น ขั้นตอนการปฏิบัติงาน/ เกณฑ์การดำเนินงาน พอเอามาใช้แล้วได้มีการปรับให้เป็นแนวทางการดำเนินงานของตัวเองหรือไม่ เช่น เอาขั้นตอนการรับวัตถุจากในเน็ตมาอ้างอิง แต่ไม่ได้มีการเปลี่ยนรหัสแบบฟอร์มให้ตรงกับของตัวเอง หรือมาตรฐานการรับเข้าที่ไม่ตรงกับการปฏิบัติงานจริง, ข้อกำหนดกฎหมายที่นำมาอ้างอิงมีการประกาศใช้ใหม่แต่องค์กรไม่ได้มีการนำมาปรับแก้ไขให้สอดคล้อง"],"(7) การสนับสนุน : Support"],["7.1.6","การควบคุมกระบวนการ ผลิตภัณฑ์และบริการที่จัดหาจากภายนอก",["• องค์กรจะต้องมีการควบคุมโดย (a) จัดทำเกณฑ์สำหรับประเมิน มีการคัดเลือกและติดตามสมรรถนะ (b) มีการสื่อสารข้อกำหนดไปยังผู้ส่งมอบ (c) มั่นใจว่าไม่มีผลกระทบต่อความสามารถขององค์กร ในการปฏิบัติตามข้อกำหนดต่างๆ (d) เก็บรักษาข้อมูลเป็นเอกสาร"],["- ตรวจสอบ PM กระบวนการจัดซื้อ คัดเลือก Supplier ยังไง/ สุ่ม Supplier เทียบกับเอกสารว่ามีครบถ้วนมั้ย และมีอยู่ใน AVL, ASL List รึป่าว - มีการแจ้งข้อกำหนด/ สเปคให้ Supplier รับทราบก่อนหรือไม่ - มีเกณฑ์การติดตาม ประเมินผล Supplier ยังไง เช่น Audit Supplier/ ให้ตอบ Questionaire/ ใช้ใบ Cert., External Lab"],"(7) การสนับสนุน : Support"],["7.2","ความสามารถ",["• องค์กรจะต้อง (a) กำหนดทักษะความสามารถที่จำเป็นของบุคลากร รวมถึงบุคคลภายนอก ที่ปฏิบัติงานภายใต้การควบคุมขององค์กร ที่ส่งผลกระทบต่อประสิทธิผลของระบบการจัดการด้านความปลอดภัยของอาหาร b) มั่นใจว่าบุคลากร รวมทั้งทีมงานด้านความปลอดภัยอาหาร มีความสามารถบนพื้นฐานของประสบการณ์ การอบรม หรือการศึกษาอย่างเหมาะสม c) มั่นใจว่าทีมงานด้านความปลอดภัยอาหารมีความรู้ (อบรม) และประสบการณ์หลายด้าน (มาจากหลายฝ่าย) d) ดำเนินการเพื่อให้ได้มาซึ่งทักษะความสามารถ และประเมินประสิทธิผลของการดำเนินการ e) เก็บรักษาข้อมูลที่เ…"],["- PM-HR-03: การฝึกอบรมและพัฒนาบุคลากร/ แผนฝึกอบรมประจำปี - กรณีบุคคลภายนอกต้องมีการอบรมอะไรบ้าง - สุ่มตรวจสอบ OJT/ JD/ บันทึกการอบรมที่เกี่ยวกับ FSMS - เอกสาร Matrix ตามตำแหน่งงาน ว่าต้องมีการอบรมอะไรบ้าง รวมทั้งพนักงาน outsource จากภายนอก (HR ส่งเอกสารให้แต่ละฝ่าย เพื่อกำหนดหลักสูตร) - บันทึกการปฐมนิเทศพนักงาน เพิ่มในเรื่องของ Food Safety - WI-MR-01: การประเมินผลผู้ตรวจติดตามภายใน - ทีมงานด้านความปลอดภัยอาหาร : บันทึกการอบรม/ บันทึกการคัดเลือก"],"(7) การสนับสนุน : Support"],["7.3","ความตระหนัก",["• ต้องมั่นใจว่าทุกคนในองค์กรต้องทราบและตระหนักถึง (a) นโยบายด้านความปลอดภัยอาหาร (b) วัตถุประสงค์ของระบบ FSMS (c) ความรับผิดชอบในการร่วมกับสร้าง FSMS ให้มีประสิทธิภาพ (d) ผลเสีย/อันตรายหากไม่ปฏิบัติตาม FSMS"],["- สุ่มจากการสัมภาษณ์ ว่าพนักงานรับทราบและตระหนักถึงความปลิดภัยอาหารมั้ย - ตรวจสอบว่ามีการจัดทำกิจกรรมบ้างหรือไม่ เช่น Morning Talk ก่อนเริ่มงาน/ ทำให้ดูเป็นตัวอย่าง/ การอบรมพนักงาน/ ป้ายเตือน/ จัดกิจกรรม/ KPI"],"(7) การสนับสนุน : Support"],["7.4","การสื่อสาร",[],[],"(7) การสนับสนุน : Support"],["7.4.1","บททั่วไป",["• มีการกำหนดการสื่อสารภายใน และภายนอกไว้หรือไม่ • ได้มีการกำหนดรายละเอียดของการสื่อสารต่อไปนี้หรือไม่ (a) หัวข้อ/เรื่องที่จะสื่อสาร (b) สื่อสารตอนไหน (c) สื่อสารกับใคร (d) วิธีการสื่อสาร (e) ใครเป็นคนสื่อสาร • การสื่อสารมีประสิทธิภาพ ผู้รับสารเข้าใจและนำไปปฏิบัติตาม"],["- ตรวจ PM-MR การสื่อสาร - สุ่มตรวจสอบการสื่อสารว่ามีการปฏิบัติจริงหรือไม่ ติดตามผลยังไง แล้วนำผลนั้นไปดำเนินการต่อหรือไม่"],"(7) การสนับสนุน : Support"],["7.4.2","การสื่อสารภายนอก",["• มีการสื่อสารข้อมูล ข้อกำหนดขององค์กรให้กับภายนอก รวมทั้งผู้มีส่วนได้ส่วนเสียรับทราบหรือไม่ • มีการสื่อสารข้อมูลที่จำเป็นแก่ผู้ส่งมอบและผู้รับจ้างจากภายนอก/ ลูกค้า/ หน่วยงานด้านกฎหมายและกฎระเบียบ และองค์กรอื่นๆที่มีผลกระทบ หรือจะได้รับผลกระทบจากประสิทธิภาพหรือการปรับปรุงของ FSMS หรือไม่ • มีการรวบรวมข้อมูลการสื่อสารภายนอกเพื่อนำเข้าที่ประชุมทบทวนบริหาร และจัดเก็บข้อมูลดังกล่าวเป็นเอกสารหรือไม่"],["- ตรวจ PM-MR การสื่อสาร - ตรวจบันทึกการทบทวนบริหาร"],"(7) การสนับสนุน : Support"],["7.4.3","การสื่อสารภายใน",["• องค์กรได้สร้าง นำไปปฏิบัติ และคงรักษาระบบการสื่อสาร โดยบุคลากรในองค์กรได้รับทราบประเด็นปัญหาที่มีผลกระทบต่อความปลอดภัยอาหารหรือไม่ • กรณีมีการเปลี่ยนแปลงหัวข้อดังแสดง ทีมงานด้านความปลอดภัยอาหารได้รับแจ้งถึงการเปลี่ยนแปลงดังกล่าวอย่างเหมาะสมและทันท่วงทีหรือไม่ (a) ผลิตภัณฑ์ หรือผลิตภัณฑ์ใหม่ (b) วัตถุดิบส่วนผสม และบริการ (c) ระบบการผลิตและอุปกรณ์ (d) สถานที่ผลิต สภาพแวดล้อม (e) โปรแกรมการทำความสะอาด และสุขาภิบาล (f) บรรจุภัณฑ์ การบรรจุ จัดเก็บ และโหลดสินค้า (g) อำนาจตำแหน่งหน้าที่ (h) กฎหมาย/ …"],["- ตรวจ PM-MR การสื่อสาร - สุ่มสอบถามขั้นตอนการสื่อสารกรณีมีการเปลี่ยนแปลงหัวข้อดังกล่าว - ตรวจบันทึกการทบทวบริหาร"],"(7) การสนับสนุน : Support"],["7.5","เอกสารสารสนเทศ",[],[],"(7) การสนับสนุน : Support"],["7.5.1","ทั่วไป",["• ระบบ FSMS ขององค์กร ต้องประกอบด้วย a) ข้อมูลที่เป็นเอกสารตามข้อกำหนดของระบบ FSMS b) ข้อมูลที่เป็นเอกสารเพิ่มเติม ที่เห็นว่าจำเป็นเพื่อเพิ่มประสิทธิภาพของระบบ FSMS c) ข้อมูลที่เป็นลายลักษณ์อักษร และข้อกำหนดด้านความปลอดภัยอาหาร ที่กำหนดโดยหน่วยงานกำกับดูแล กฎหมาย กฎระเบียบ และลูกค้า"],["- ตรวจ PM-MR-01: การควบคุมเอกสาร (เพิ่มเรื่องภาษาที่ใช้/ รูปแบบการบันทึกกระดาษ หรืออิเล็กทรอนิกส์)/ Master List เอกสาร - PM-IT-01: การจัดการดูแลและควบคุมระบบสารสนเทศ"],"(7) การสนับสนุน : Support"],["7.5.2","การจัดทำและปรับให้ทันสมัย",["• เมื่อมีการจัดทำ อัพเดตเอกสาร ต้องมีรายละเอียด (a) การชี้บ่ง และคำอธิบาย (เช่น ชื่อ วันที่ ผู้จัดทำ หมายเลขอ้างอิง) (b) รูปแบบ (เช่น ภาษา เวอร์ชั่น รูปแบบ) และสื่อ (เช่น กระดาษ อิเล็กทรอนิกส์) (c) การทบทวนและอนุมัติ เหมาะสมถูกต้อง"],["- สุ่มตรวจสอบเอกสารว่ารูปแบบถูกต้อง ตรงตามการปฏิบัติจริงหรือไม่"],"(7) การสนับสนุน : Support"],["7.5.3","การควบคุมข้อมูลที่เป็นเอกสาร",["• เอกสารต้องถูกควบคุม เพื่อมั่นใจว่า (a) มีจำนวนเพียงพอ เหมาะสมกับการใช้งาน (b) มีการป้องกันอย่างเหมาะสม เช่น การใช้งานที่ไม่เหมาะสม เกิดความลับรั่วไหล เอกสารเสียสภาพ • เอกสารในองค์กรต้อง (a) มีการแจกจ่าย เข้าถึง เรียกหา และการใช้ (b) การจัดเก็บดูแล และการรักษาให้สมบูรณ์ (c) ควบคุมการเปลี่ยนแปลง (d) มีบันทึกระยะเวลาจัดเก็บ และบันทึกการทำลาย • เอกสารจากภายนอก องค์กรมีการจัดเก็บและควบคุมอย่างไร"],["- ตรวจ PM-MR การควบคุมเอกสาร - WI-IT-08: การจัดการเข้าถึงและสำรองข้อมูล SharePoint - WI-IT-12: การรักษาความปลอดภัยในระบบคอมพิวเตอร์และอินเทอร์เน็ต - WI-IT-19: การกำหนดสิทธิ์การเข้าถึงข้อมูลและโปรแกรมคอมพิวเตอร์"],"(7) การสนับสนุน : Support"],["8.1","การวางแผนการและการควบคุมการดำเนินงาน",["• องค์กรได้วางแผน นำไปปฏิบัติ ควบคุม คงรักษา และอัพเดตกระบวนการที่จำเป็นเพื่อให้สอดคล้องกับข้อกำหนด เพื่อมุ่งมั่นให้ผลิตภัณฑ์มีความปลอดภัย • องค์กรต้องมีการวางแผนสำหรับกระบวนการต่างๆ ตามที่กำหนดในข้อ 6.1 โดย (a) กำหนดเกณฑ์สำหรับกระบวนการต่างๆ (b) ดำเนินการควบคุมกระบวนการต่างๆ ให้เป็นไปตามเกณฑ์ (c) จัดเก็บข้อมูลบันทึกที่เป็นเอกสาร • ต้องมีการควบคุมและบันทึกกรณีกระบวนการมีการเปลี่ยนแปลงจากที่กำหนดไว้ ว่ามีผลกระทบ และการดำเนินแก้ไขอย่างไร"],["- ตรวจเอกสารการดำเนินงาน/ มีการควบคุมยังไงตรงตามปฏิบัติจริงหรือไม่ แล้วโยงไปยังบันทึกผล - ผลการตรวจสอบ (พารามิเตอร์ ขั้นตอนการควบคุม) ตรงกับที่กำหนดในเอกสารหรือไม่"],"(8) การดำเนินการ : Operation"],["8.2","โปรแกรมสุขลักษณะพื้นฐาน (PRPs & GHPs)",[],[],"(8) การดำเนินการ : Operation"],["8.2.1","• มีการวางแผน นำไปปฏิบัติ ควบคุม รักษา และทำให้เป็นปัจจุบันของโปรแกรมพื้นฐานหรือไม่",[],[],"(8) การดำเนินการ : Operation"],["8.2.2","• ตรวจว่าโปรแกรมสุขลักษณะพื้นฐานต้อง (a) เหมาะสมกับองค์กรโดยคำนึงถึงความปลอดภัยอาหาร (b) เหมาะสมกับขนาด ประเภท และลักษณะของผลิตภัณฑ์ (c) นำไปใช้ทั้งกระบวนการผลิต (d) ได้รับการอนุมัติโดยทีมงานความปลอดภัยอาหาร",[],[],"(8) การดำเนินการ : Operation"],["8.2.3","• สุ่มตรวจโปรแกรมสุขลักษณะพื้นฐานว่าสอดคล้องตามข้อกำหนด กฎหมาย หรือไม่ แนะนำว่าควรระบุกฎหมายอ้างอิงไปในเอกสาร โดยควรเปรียบเทียบจาก ISO/TS 22002-1 และ/หรือมาตรฐานอื่นที่ประยุกต์ใช้",[],[],"(8) การดำเนินการ : Operation"],["8.2.4","• ตรวจสอบว่ามีเอกสารโปรแกรมสุขลักษณะ และบันทึกการทวนสอบครบถ้วนตามแสดงหรือไม่ (a) โครงสร้าง และแผนผังอาคาร สาธารณูปโภคที่เกี่ยวข้อง (b) แผนผังของสถานที่ พื้นที่และสิ่งอำนวยความสะดวกสำหรับพนักงาน (c) ระบบอากาศ น้ำ พลังงาน และสาธารณูปโภคอื่นๆ (d) การควบคุมสัตว์พาหะ การกำจัดของเสียและสิ่งปฏิกูล (e) ควา…",[],[],"(8) การดำเนินการ : Operation"],["8.3","ระบบการสอบย้อนกลับ",["• สุ่มสอบย้อนกลับ หรือสุ่มตรวจสอบจากเอกสารการสอบกลับประจำปี โดยการสืบย้อนกลับต้องสามารถชี้บ่งถึงวัตถุดิบ ไปจนถึงผลิตภัณฑ์สุดท้ายได้ สามารถแจกแจงข้อมูลว่าผลิตภัณฑ์ หรือวัตถุดิบชุดดังกล่าวกระจายไปยังลูกค้าไหนบ้าง • มีการระบุข้อมูลล็อตของวัตถุดิบ ส่วนผสม ผลิตภัณฑ์ถูกต้องหรือไม่ • กรณีพบว่ามีการทำซ้ำ (เช่น Reprocess, การนำไปต้มซ้ำ) ของวัตถุดิบ/ ผลิตภัณฑ์มีบันทึกไว้หรือไม่ • บันทึกการสอบกลับต้องเก็บรักษาอย่างน้อยเท่ากับอายุผลิตภัณฑ์ • สุ่มตรวจสอบว่าองค์กรมีแผนการสอบย้อนกลับ และดำเนินการตามแผนหรือไม่"],["- สุ่มสอบกลับจากวัตถุดิบ หรือจากผลิตภัณฑ์ ตรวจสอบการสอบย้อนกลับว่าถูกต้องหรือไม่ - SP-RD: การชี้บ่ง - ดูแผนและผลของการสอบย้อนกลับประจำปี - ตรวจ PM-QA การสอบกลับ"],"(8) การดำเนินการ : Operation"],["8.4","การเตรียมความพร้อมและการตอบสนองสภาวะฉุกเฉินที่เกี่ยวกับ FSMS",[],[],"(8) การดำเนินการ : Operation"],["8.4.1","บททั่วไป",["• ผู้บริหาระดับสูง มั่นใจว่า มีขั้นตอนการปฏิบัติ เพื่อตอบสนองต่อสถานการณ์ฉุกเฉินที่อาจเกิดขึ้น หรืออุบัติการณ์ที่สามารถมีผลกระทบต่อความปลอดภัยอาหาร ที่เกี่ยวข้องกับ บทบาทขององค์กรในห่วงโซ่อาหาร • ข้อมูลที่เป็นเอกสารต้องถูกจัดทำและคงรักษาไว้"],["- จากการสัมภาษณ์ - ตรวจ PM-SF การเตรียมความพร้อมและตอบสนองเหตุฉุกเฉิน - การประเมินความเสี่ยงเกี่ยวกับเหตุการณ์ฉุกเฉินทั้งหมดในโรงงาน แล้วอันไหนที่พบว่าเป็นความเสี่ยงสูงมีผลต่อ FSMS ก็กำหนดเป็นระเบียบตาม PM-SF"],"(8) การดำเนินการ : Operation"],["8.4.2","การจัดการกับเหตุฉุกเฉินและเหตุการณ์",["• แผนฉุกเฉินที่จัดทำขึ้นมีการดำเนินการตามหัวข้อดังแสดง หรือไม่ (a) แผนฉุกเฉินที่จัดทำขึ้นสอดคล้องกับข้อกำหนดกฎหมายที่บังคับใช้ และกฎระเบียบ (b) เมื่อเกิดเหตุการณ์ฉุกเฉินต้องดำเนินการแจ้งแก่ใครรับทราบ (c) มีการระบุวิธีการแจ้งเหตุแก่พนักงานทุกคน (รวมถึงบุคคลภายนอกที่ได้รับผลกระทบ) อย่างไร • มีการดำเนินการ/ การกำหนดมาตรการเพื่อลดผลกระทบของสถานการณ์ฉุกเฉินหรือไม่ • มีการกำหนดแผนการซ้อมแผนฉุกเฉินหรือไม่ และได้ดำเนินการตามแผนที่กำหนดไว้หรือไม่ • มีการทบทวนและปรับปรุงข้อมูลที่เป็นเอกสารให้เป็นปัจจุบัน…"],["- ตรวจสอบว่ามีการกำหนดมาตรการแก้ไขยังไงบ้างหลังเกิดเหตุฉุกเฉินที่ส่งผลต่อ FSMS เช่น พนักงานเข้าตรวจสอบประเมินผลการทบของเหตุการณ์ฉุกเฉินนั้นๆ ที่มีต่อผลิตภัณฑ์ (ตรวจสอบว่าผลิตภัณฑ์/ วัตถุดิบยังได้คุณภาพและมีความปลอภัย เช่น ไม่เสียสภาพ, เน่าเสีย หรือปนเปื้อนจากสารเคมี หรือไม่) - สุ่มดูแผน และผลการดำเนินการเหตุฉุกเฉิน - PM-SF-02: การเตรียมความพร้อมและการตอบสนองเหตุฉุกเฉิน"],"(8) การดำเนินการ : Operation"],["8.5","การควบคุมอันตราย",[],[],"(8) การดำเนินการ : Operation"],["8.5.1","ขั้นตอนเริ่มต้นสำหรับการวิเคราะห์อันตราย",[],[],"(8) การดำเนินการ : Operation"],["8.5.1.1","➤ บททั่วไป",["• ในการดำเนินการวิเคราะห์อันตราย เอกสารได้ถูกรวบรวม คงรักษา และทบทวนโดยทีมความปลอดภัยอาหารหรือไม่ (เอกสาร เช่น ข้อกำหนดกฎหมาย ข้อกำหนดผลิตภัณฑ์ อันตรายด้านความปลอดภัยของอาหาร)"],["- ตรวจ HACCP ว่าข้อมูลเป็นปัจจุบันหรือไม่ สอดคล้องกับข้อกำหนดของลูกค้า/ กฎหมาย/ มาตรฐาน และอื่นๆที่เกี่ยวข้องและมีการทบทวนให้เป็นปัจจุบัน"],"(8) การดำเนินการ : Operation"],["8.5.1.2","➤ คุณลักษณะของวัตถุดิบ ส่วนผสม และวัสดุที่สัมผัสกับผลิตภัณฑ์",["• ตรวจสอบว่ามีการจัดทำเป็นเอกสารที่ระบุคุณลักษณะดังกล่าวหรือไม่ (ตามความเหมาะสม ไม่จำเป็นต้องครบทุกหัวข้อ) : คุณลักษณะทางชีวภาพ เคมี และกายภาพ/ ส่วนประกอบของวัตถุดิบ ส่วนผสม/ แหล่งที่มา/ ถิ่นกำเนิด/ กรรมวิธีการผลิต บรรจุ และขนส่ง/ สภาวะการจัดเก็บ/ อายุการเก็บรักษา/ วิธีการใช้/ เกณฑ์การยอมรับ"],["- ตรวจพวก COA/ ข้อกำหนดการรับเข้า"],"(8) การดำเนินการ : Operation"],["8.5.1.3","➤ คุณลักษณะของผลิตภัณฑ์สุดท้าย",["• ตรวจเอกสารว่ามีการระบุข้อมูลที่เกี่ยวข้องกับคุณลักษณะของผลิตภัณฑ์สุดท้าย (ตามความเหมาะสม ไม่จำเป็นต้องครบทุกหัวข้อ) : ชื่อผลิตภัณฑ์/ ส่วนประกอบ/ คุณลักษณะทางชีวภาพ เคมี และกายภาพที่เกี่ยวข้องกับความปลอดภัยทางอาหาร/ สภาวะการจัดเก็บ/ อายุการเก็บรักษา/ ฉลากที่เกี่ยวข้องกับความปลอดภัยอาหาร/ ช่องทางและวิธีการขนส่ง"],["- มีกำหนดไว้ใน MN-HA ของทุกผลิตภัณฑ์ สุ่มตรวจสอบว่าถูกต้องและเหมาะสมมั้ย"],"(8) การดำเนินการ : Operation"],["8.5.1.4","➤ วัตถุประสงค์การนำไปใช้",["• ตรวจเอกสารต้องมีการกำหนดวัตถุประสงค์การใช้งาน และกลุ่มผู้ใช้งานหรือไม่"],["- มีกำหนดไว้ใน MN-HA ของทุกผลิตภัณฑ์ สุ่มตรวจสอบว่าถูกต้องและเหมาะสมมั้ย มีการชี้แจงในเรื่องสารก่อภูมิแพ้หรือไม่"],"(8) การดำเนินการ : Operation"],["8.5.1.5","➤ แผนภูมิกระบวนการผลิต และการอธิบายของขั้นตอนกระบวนการ",["• แผนภูมิกระบวนการผลิตได้รับการทบทวนให้เป็นปัจจุบัน และสอดคล้องกับการปฏิบัติงานจริงหรือไม่ • แผนภูมิกระบวนการผลิตมีการระบุรายละเอียดต่อไปนี้หรือไม่ (a) ลำดับและความสัมพันธ์ของขั้นตอนในการดำเนินการ (b) วัตถุดิบ ส่วนผสม สารเคมี บรรจุภัณฑ์ และสาธารณูปโภคที่ใช้ในกระบวนการ (c) ขั้นตอนของการ Rework/ Reprocess (ถ้ามี) (d) ขั้นตอนที่เกิดผลพลอยได้ หรือขั้นตอนที่เกิดของเสีย (ถ้ามี) • ทีมความปลอดภัยอาหารได้ตรวจสอบแผนภูมิกระบวนการผลิตเทียบกับการผลิตจริง เพื่อยืนยันความถูกต้องของแผนภูมิหรือไม่ • ทีมความปลอด…"],["- ตรวจแผนภูมิกระบวนการผลิตใน MN-HA-XX (a) Plant Layout: มีการแบ่ง High Risk/ Low Risk ยังไง, Flow Process ของกระบวนการและพนักงานเป็นยังไงถูกต้องตามหลักการมั้ย/ ป้องกัน cross contaminate ยังไง (b) ทะเบียนอุปกรณ์/ เครื่องจักรที่ใช้ในกระบวนการผลิต: มีอุปกรณ์เครื่องมือ/ เครื่องจักรอะไรบ้าง/ กำหนดจุดที่ใช้ไว้มั้ยว่าสำหรับกระบวนการผลิตอะไร/ วัสดุที่ใช้เป็นอันตรายต่ออาหารหรือไม่ (c) PRPs/ พารามิเตอร์และมาตรการที่ควบคุม: มาตรการดังกล่าวดำเนินการยังไงบ้าง ควบคุมอะไร (d) ข้อกำหนดจากภายนอก: กฎหมาย/ ข้อกำห…"],"(8) การดำเนินการ : Operation"],["8.5.2","การวิเคราะห์อันตราย",[],[],"(8) การดำเนินการ : Operation"],["8.5.2.1","➤ บททั่วไป",["• มีการวิเคราะห์อันตราย และกำหนดอันตรายที่จำเป็นต้องควบคุมหรือไม่"],[],"(8) การดำเนินการ : Operation"],["8.5.2.2","➤ การชี้บ่งอันตราย และการกำหนดระดับที่ยอมรับได้",["• มีการระบุอันตราย (ชีวภาพ, เคมี, กายภาพ) ที่คาดว่าจะเกิดขึ้นทั้งหมดครบถ้วนและจัดทำเป็นเอกสารหรือไม่ • มีการกำหนดอันตรายในทุกขั้นตอนของกระบวนการหรือไม่ • มีการกำหนดระดับที่ยอมรับได้ สำหรับอันตรายแต่ละชนิดในผลิตภัณฑ์ขั้นสุดท้ายไว้อย่างชัดเจนหรือไม่"],["- ตรวจดูว่ามีการวิเคราะห์อันตรายที่อาจเกิดขึ้นในกระบวนการครบถ้วนหรือไม่ - กำหนดเกณฑ์ของแต่ละอันตรายยังไงบ้าง วัดค่ายังไง และหากมีการอ้างอิงกฎหมาย/ ข้อกำหนดจากลูกค้าถูกต้องหรือไม่"],"(8) การดำเนินการ : Operation"],["8.5.2.3","➤ การประเมินอันตราย",["• องค์กรได้ดำเนินการประเมินอันตรายที่ได้กำหนดจากโอกาสการเกิดและความรุนแรงของอันตรายเพื่อวิเคราะห์ว่าอันตรายดังกล่าวมีนัยสำคัญหรือไม่"],["- ดูเอกสาร/ สอบถามว่าประเมินอันตรายยังไง จากเอกสารไหน และดูความถูกต้องของการประเมิน - ตรวจจาก PM-MR-06 การวิเคราะห์อันตรายจุดควบคุมวิกฤต HACCP + Decision Tree"],"(8) การดำเนินการ : Operation"],["8.5.2.4","➤ การเลือกและจัดประเภทของมาตรการควบคุม",["• ได้มีการพิจารณาคัดเลือกมาตรการควบคุมที่เหมาะสม หรือมีมาตรการควบคุมร่วมกัน เพื่อจัดการกับอันตรายที่มีนัยสำคัญ โดยมีความสอดคล้องกับผลการประเมินอันตรายหรือไม่ • มีการยืนยันความถูกต้อง หรือมีหลักฐานสนับสนุนหรือไม่ว่ามาตรการควบคุมที่เลือกใช้มีความสามารถเพียงพอในการป้องกัน หรือลดระดับอันตรายให้ลงมาอยู่ในระดับที่ยอมรับได้ ได้อย่างมีประสิทธิภาพจริง • ได้ดำเนินการจัดหมวดหมู่และประเมินมาตรการควบคุมที่คัดเลือกไว้ว่าเป็นโปรแกรมพื้นฐานด้านปฏิบัติการ (OPRP) หรือ จุดวิกฤตที่ต้องควบคุม (CCP) อย่างเหมาะสมหรือ…"],["- ดูเอกสาร/ สอบถามว่าแต่ละมาตรการควบคุมประเมินยังไง ใช้คำถามอะไร ที่ได้มาว่ามาตรการนั้นเป็น PRP/ OPRP/ CCPและตรวจสอบความเหมาะสม"],"(8) การดำเนินการ : Operation"],["8.5.3","การตรวจยืนยัน (Validation) มาตรการควบคุม และมาตรการควบคุมร่วม",["• มีการตรวจยืนยันความถูกต้องของมาตรการควบคุมหรือไม่ และมีการจัดทำเป็นเอกสาร • การตรวจยืนยันความถูกต้องจะทำก่อนที่จะนำไปปฏิบัติจริง หรือกรณีที่มีการเปลี่ยนแปลงใดๆ • (ถ้ามี) กรณีที่พบว่ามาตรการควบคุมเดิมไม่สามารถควบคุมอันตรายให้อยู่ในระดับที่ยอมรับได้ ต้องมีการปรับปรุง ประเมินซ้ำ และจัดทำเป็นเอกสาร"],["- ตรวจ WI-RD-04: การตรวจพิสูจน์กระบวนการผลิต - ตรวจรายงาน Validate ตามกลุ่มผลิตภัณฑ์ เช่น Phosphate Residue, หม้อต้ม, หม้อทอด, MD - ตรวจ CCP Observer - IQA HACCP"],"(8) การดำเนินการ : Operation"],["8.5.4","แผนการควบคุมอันตราย (HACCP/ OPRP Plan)",[],[],"(8) การดำเนินการ : Operation"],["8.5.4.1","➤ บททั่วไป",["• แผนควบคุมอันตรายมีการระบุรายละเอียดดังนี้หรือไม่ (a) อันตรายที่มีผลต่อความปลอดภัยของอาหารที่ควบคุมโดย CCP หรือ OPRP (b) มีการกำหนดค่าวิกฤต (CL) ณ จุด CCP หรือเกณฑ์การปฏิบัติบัติ (Action Criteria) ณ จุด OPRP (c) วิธีการตรวจเฝ้าระวัง (d) การดำเนินการแก้ไขกรณีพบว่าเกินค่าวิกฤต/ เกณฑ์การปฏิบัติที่กำหนดไว้ (e) ผู้รับผิดชอบ และบันทึกที่ใช้ในการตรวจติดตาม"],["- ตรวจข้อมูลที่ระบุใน MN-HA เทียบกับบันทึกหน้างาน และผล Validate"],"(8) การดำเนินการ : Operation"],["8.5.4.2","➤ การกำหนดค่าวิกฤต หรือเกณฑ์การปฏิบัติ",["• ค่าวิกฤต หรือเกณฑ์การปฏิบัติบัติที่กำหนดไว้มาจากไหน และต้องมีเอกสารข้อมูลที่น่าเชื่อถือ • ค่าวิกฤต (CL) ณ จุด CCP ต้องสามารถวัดผลได้ หรือเกณฑ์การปฏิบัติบัติ (Action Criteria) ณ จุด OPRP ต้องสามารถวัดผลหรือสังเกตได้"],[],"(8) การดำเนินการ : Operation"],["8.5.4.3","➤ ระบบการเฝ้าติดตาม ที่ CCP และ OPRP",["• ระบบการเฝ้าติดตามที่จุด CCP/ OPRP ต้องประกอบด้วยข้อมูลที่เป็นเอกสาร คือ a) วิธีการตรวจวัดและการสังเกตการณ์ b) เครื่องมือที่ใช้ตรวจ c) วิธีการสอบเทียบ หรือทวนสอบเครื่องมือที่ใช้ตรวจ/การสังเกตุการณ์ d) ความถี่ในการตรวจ e) ผลลัพธ์ในการเฝ้าระวัง (f) ผู้รับผิดชอบในการตรวจวัดและสังเกตุการณ์ (g) ผู้รับผิดชอบในการประเมินผลการตรวจวัดและสังเกตุการณ์"],[],"(8) การดำเนินการ : Operation"],["8.5.4.4","➤ การปฏิบัติเมื่อผลการตรวจเฝ้าระวังออกนอกค่าวิกฤต หรือเกณฑ์การปฏิบัติ",["• ตรวจว่ามีการกำหนดการแก้ไขหน้างาน และการแก้ไขระยะยาว เพื่อให้มั่นใจว่า (a) ผลิตภัณฑ์ที่อาจไม่ปลอดภัยจะไม่ถูกปล่อยออกไป (b) สาเหตุของความไม่สอดคล้อง (c) พารามิเตอร์ต้องกลับไปอยู่ใน CL (d) การป้องกันการเกิดซ้ำ"],[],"(8) การดำเนินการ : Operation"],["8.5.4.5","➤ การดำเนินการตามแผนควบคุมอันตราย",["• มีการนำแผนควบคุมอันตรายไปปฏิบัติและจัดเก็บแผนควบคุมอันตรายในรูปแบบเอกสารหรือไม่"],[],"(8) การดำเนินการ : Operation"],["8.6","การปรับปรุงข้อมูลที่ระบุในเอกสาร PRPs และแผนควบคุมอันตราย",["• กรณีมีการปรับปรุงหรือเปลี่ยนแปลงใดๆ (เช่น คุณลักษณะของวัตถุดิบ, ส่วนผสม, ผลิตภัณฑ์, ขั้นตอนกระบวนการผลิต) ได้มีการปรับปรุงทบทวนมาตรการให้เป็นปัจจุบันหรือไม่"],[],"(8) การดำเนินการ : Operation"],["8.7","การควบคุมการเฝ้าติดตามและการวัด",["• ต้องแสดงหลักฐานว่าวิธีการตรวจวัดค่าของแผน PRP/ OPRP/ CCP มีประสิทธิภาพ โดยอุปกรณ์/วิธีการวัดต้อง (a) สอบเทียบ/ทวนสอบตามแผน (b) ปรับเทียบ หรือปรับใหม่ตามความเหมาะสม (c) ระบุสถานะของการสอบเทียบ (d) ป้องกันจากการปรับเปลี่ยนที่ทำให้ตรวจวัดผิดพลาด (e) ป้องกันจากความเสียหายและความเสื่อมสภาพ • สุ่มตรวจสอบความถูกต้องของผลการสอบเทียบและต้องเก็บรักษาไว้เป็นเอกสาร • (ถ้ามี) ในกรณีที่พบว่าอุปกรณ์ทำงานผิดปกติ หรือผลการสอบเทียบ/ทวนสอบ ไม่เป็นไปตามที่กำหนด ได้มีการประเมินความถูกต้องของผลการวัดก่อนหน้านี้เพื…"],["- ตรวจ PM-QA-01: การตรวจสอบผลิตภัณฑ์สำเร็จรูป - ตรวจ PM-QA-02: การควบคุมห้องปฎิบัติการ - ตรวจ PM-QA-04: การควบคุมเครื่องมือตรวจสอบ ตรวจวัด และทดสอบ - ซอฟต์แวร์ เช่น Software ของเครื่อง Metal Detector, โปรแกรมเครื่องชั่งดิจิตอล - สุ่มผลการสอบเทียบจากเครื่องมือหน้างาน - สุ่มดูทะเบียนเครื่องมือ/ แผนสอบเทียบ/ บันทึกการอบรมเจ้าหน้าที่สอบเทียบ"],"(8) การดำเนินการ : Operation"],["8.8","การทวนสอบที่ระบุในเอกสาร PRP และแผนควบคุมอันตราย",[],[],"(8) การดำเนินการ : Operation"],["8.8.1","การทวนสอบ",["• มีการกำหนดแผนการทวนสอบไว้หรือไม่ โดยมีการทวนสอบเพื่อยืนยันว่า (a) PRP และแผนควบคุมอันตราย ถูกนำมาใช้และยังคงมีประสิทธิภาพ (b) ระดับอันตรายอยู่ในระดับที่กำหนดไว้ (c) ข้อมูลที่ใช้สำหรับวิเคราะห์อันตรายถูกทบทวนและปรับปรุงให้เป็นปัจจุบัน โดยผลการทวนสอบมีการจัดเก็บเป็นเอกสารหรือไม่ • ตรวจดูว่ากิจกรรมการทวนสอบไม่ได้ดำเนินการโดยบุคคลที่รับผิดชอบเฝ้าติดตามในกิจกรรมนั้นๆ • กรณีที่ผลการทวนสอบพบว่าไม่สอดคล้องกับระดับความปลอดภัยของอาหารที่ยอมรับได้ มีการดำเนินการจัดการอย่างไรกับผลิตภัณฑ์นั้น"],["- การทวนสอบ เช่น หัวหน้าตรวจสอบความถูกต้องของบันทึก ณ จุดนั้นๆ/ การตรวจติดตามภายใน/ การตรวจโดยห้องปฏิบัติการภายนอก/ ผลการสอบเทียบ/ ผล Validate"],"(8) การดำเนินการ : Operation"],["8.8.2","การวิเคราะห์ผลของกิจกรรมการทวนสอบ",["• ทีมความปลอดภัยอาหารมีการวิเคราะห์ข้อมูลที่ได้จากการทวนสอบ เพื่อนำไปประเมินประสิทธิภาพของระบบ FSMS หรือไม่"],["- ตรวจดูว่ามีการนำไปประเมินประสิทธิภาพของระบบมั้ย เช่น ในรายงานการประชุม"],"(8) การดำเนินการ : Operation"],["8.9","การควบคุมผลิตภัณฑ์และกระบวนการที่ไม่เป็นไปตามข้อกำหนด",[],[],"(8) การดำเนินการ : Operation"],["8.9.1","บททั่วไป",["• การประเมินข้อมูลที่ได้จากการตรวจติดตามจุด OPRP และ CCP ดำเนินการโดยบุคคลที่มีความรู้ความสามารถ และมีอำนาจในการกำหนดการแก้ไขและป้องกันหรือไม่"],[],"(8) การดำเนินการ : Operation"],["8.9.2","การแก้ไข (Correction)",[],[],"(8) การดำเนินการ : Operation"],["8.9.2.1","➤ เมื่อพบว่าค่าวิกฤต (CL) ของ CCP หรือเกณฑ์การปฏิบัติ (Action Criteria) ของ OPRP ไม่เป็นตามที่กำหนดไว้ • ผลิตภัณฑ์ที่ได้รับผลกระทบนั้นมีการชี้บ่ง และมีการควบคุมการดำเนินการในการอนุมัติก่อนใช้หรือไม่ • องค์กรได้จัดทำ นำไปใช้ และคงรักษาไว้ซึ่งข้อมูลเอกสารที่ระบุถึงวิธีการแก้ไข รวมถึงหลักฐานการอนุมัติ…",[],[],"(8) การดำเนินการ : Operation"],["8.9.2.2","➤ เมื่อพบว่าค่าวิกฤต (CL) ของ CCP ไม่เป็นไปตามข้อกำหนด มีการจัดการกับผลิตภัณฑ์ที่ได้รับผลกระทบตามข้อ 8.9.4 หรือไม่",[],[],"(8) การดำเ
