<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KST Audit Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600&display=swap">
<style>
/* Layout: sticky top bar with tabs; single column workspace, checklist rows as ruled audit-sheet lines */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18232d; --muted:#5d6c78; --line:#d9e0e6;
  --accent:#0d5c7a; --accent-ink:#ffffff; --accent-soft:#e1eef3;
  --pass:#1d7a4a; --pass-soft:#e2f3ea; --obs:#9a6400; --obs-soft:#fbf0d9; --nc:#b3261e; --nc-soft:#fbe5e3; --na:#6a7782; --na-soft:#e9edf0;
  --f-body:'IBM Plex Sans Thai','Sarabun',system-ui,sans-serif; --f-head:'Prompt','IBM Plex Sans Thai',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --surface:#17212a; --ink:#e6edf2; --muted:#93a3b0; --line:#2a3947;
  --accent:#5db6d6; --accent-ink:#06222d; --accent-soft:#16323e;
  --pass:#5ccf94; --pass-soft:#123424; --obs:#e8b44f; --obs-soft:#3a2c0e; --nc:#ff8a80; --nc-soft:#3d1a18; --na:#9aa8b3; --na-soft:#222e38; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --surface:#17212a; --ink:#e6edf2; --muted:#93a3b0; --line:#2a3947;
  --accent:#5db6d6; --accent-ink:#06222d; --accent-soft:#16323e;
  --pass:#5ccf94; --pass-soft:#123424; --obs:#e8b44f; --obs-soft:#3a2c0e; --nc:#ff8a80; --nc-soft:#3d1a18; --na:#9aa8b3; --na-soft:#222e38; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
h1,h2,h3{font-family:var(--f-head);font-weight:600;margin:0;text-wrap:balance;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:10px}
.brand{display:flex;flex-direction:column}
.brand b{font-family:var(--f-head);font-size:17px}
.brand span{font-size:12px;color:var(--muted)}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{border:0;background:none;padding:7px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
nav button[aria-selected=true]{background:var(--accent-soft);color:var(--accent)}
nav button:focus-visible,.btn:focus-visible,.res button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px 60px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.sys{display:flex;flex-direction:column;gap:6px;min-width:0}
.sys .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.sys .big{font-family:var(--f-head);font-size:26px;line-height:1}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:500}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:3px 10px;font-size:13px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;padding:1px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent);margin-right:4px;white-space:nowrap}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.chk label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;background:var(--bg)}
.chk input{width:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
.empty{border:1px dashed var(--line);border-radius:8px;padding:24px;text-align:center;color:var(--muted)}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.team{display:flex;flex-direction:column;gap:8px;min-width:0}
.team h3{font-size:16px}
.mem{display:flex;gap:6px;align-items:center;justify-content:space-between;font-size:14px;border-top:1px solid var(--line);padding-top:4px}
.mem select{width:auto;padding:2px 4px;font-size:12px}
.lead{font-weight:600}
/* checklist */
.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.prog{flex:1 1 160px;height:8px;background:var(--na-soft);border-radius:4px;overflow:hidden;min-width:100px}
.prog i{display:block;height:100%;background:var(--accent)}
.cnt{font-family:var(--f-mono);font-size:12px}
.sec{font-family:var(--f-head);font-size:15px;margin-top:8px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
.item{display:grid;grid-template-columns:80px minmax(0,1fr);gap:4px 14px;padding:12px 0;border-bottom:1px solid var(--line)}
.item .cl{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.item h4{margin:0 0 2px;font-size:15px;font-weight:600}
.q{margin:2px 0;font-size:14px}
.q .tag{margin-right:6px}
.ctl{grid-column:2;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.res{display:flex;gap:4px}
.res button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 12px;font-weight:500;font-size:13px;cursor:pointer;color:var(--muted)}
.res button[aria-pressed=true][data-r=PASS]{background:var(--pass-soft);color:var(--pass);border-color:var(--pass)}
.res button[aria-pressed=true][data-r=OBS]{background:var(--obs-soft);color:var(--obs);border-color:var(--obs)}
.res button[aria-pressed=true][data-r=NC]{background:var(--nc-soft);color:var(--nc);border-color:var(--nc)}
.res button[aria-pressed=true][data-r=NA]{background:var(--na-soft);color:var(--na);border-color:var(--na)}
.item textarea{flex:1 1 240px;min-height:34px;height:34px;resize:vertical}
.pill{font-size:12px;padding:1px 8px;border-radius:10px;font-weight:500}
.p-PASS{background:var(--pass-soft);color:var(--pass)}.p-OBS{background:var(--obs-soft);color:var(--obs)}.p-NC{background:var(--nc-soft);color:var(--nc)}.p-NA{background:var(--na-soft);color:var(--na)}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
[hidden]{display:none!important}
@media (max-width:560px){.item{grid-template-columns:minmax(0,1fr)}.ctl{grid-column:1}.item .cl{flex-direction:row;flex-wrap:wrap}}
@media (prefers-reduced-motion:no-preference){.prog i{transition:width .25s}}
body{margin:0}
.login{max-width:420px;margin:12vh auto;display:flex;flex-direction:column;gap:12px}
.det{margin:6px 0 2px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.det summary{cursor:pointer;padding:5px 10px;font-size:13px;color:var(--accent);font-weight:500}
.det .dt{padding:6px 12px 8px;border-top:1px solid var(--line);font-size:13px}
.det ul,.bl{margin:4px 0 4px 18px;padding:0}.bl{font-size:13px;color:var(--muted)}
.ro{background:var(--obs-soft);color:var(--obs);border:1px solid var(--obs);border-radius:8px;padding:8px 14px;font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:20;font-size:14px;max-width:90vw}
#who{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.car{padding:0}.car>summary{cursor:pointer;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;list-style:none}
.car>summary::-webkit-details-marker{display:none}
.car .cb{padding:4px 16px 16px;border-top:1px solid var(--line)}
.car .form{margin-top:12px}
.car textarea{min-height:64px}
.wide{grid-column:1/-1}
.sevbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;padding:6px 8px;border:1px dashed var(--nc);border-radius:8px}.sevbox .res button[aria-pressed=true][data-s=MA]{background:var(--nc);color:#fff;border-color:var(--nc)}.sevbox .res button[aria-pressed=true][data-s=MI]{background:var(--obs-soft);color:var(--obs);border-color:var(--obs)}
.pill.s-MA{background:var(--nc-soft);color:var(--nc)}.pill.s-MI{background:var(--obs-soft);color:var(--obs)}.pill.s-OBS{background:var(--accent-soft);color:var(--accent)}
.hint{font-size:12px;color:var(--muted)}
#printArea{display:none}
.pf{font-family:'IBM Plex Sans Thai',sans-serif;color:#000;background:#fff;font-size:12px;line-height:1.45}
.pf table{width:100%;border-collapse:collapse}.pf td,.pf th{border:1px solid #000;padding:4px 6px;vertical-align:top;color:#000;font-size:12px;text-transform:none;letter-spacing:0;font-weight:400}
.pf th{font-weight:600;background:#eee;text-align:center}
.pf h1{font-size:16px;text-align:center;margin:0 0 4px;font-family:inherit}
.pf .hd{display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px}
.pf .sg{display:flex;justify-content:space-around;margin-top:28px;text-align:center}
.pf .pb{page-break-after:always;margin-bottom:24px}
@media print{
 body.printing>*:not(#printArea){display:none!important}
 body.printing>#printArea{display:block!important}
 @page{size:A4;margin:12mm}
}
</style>

var BAPX=[["core","BAP · Core หมวด 1","1.1.1","","โรงงานต้องแสดงให้เห็นว่ามีสิทธิ์ในการแปรรูปและผลิตสัตว์น้ำ ณ สถานที่ที่ยื่นขอการรับรอง ซึ่งรวมถึงเอกสารเพื่อยืนยันสิ่งต่อไปนี้:","ข้อกำหนดนี้เกี่ยวข้องโดยเฉพาะกับการแปรรูปสัตว์น้ำ โรงงานแปรรูปต้องมีเอกสารที่อนุญาตให้แปรรูปผลิตภัณฑ์อาหารสัตว์น้ำ ณ สถานที่ที่ยื่นขอการรับรอง เอกสารเหล่านี้โดยทั่วไปออกโดยหน่วยงานราชการ ซึ่งรวมถึงหน่วยงานระดับประเทศ ระดับรัฐ ระดับจังหวัด หรือระดับเทศบาล ในบางกรณีอาจต้องได้รับการอนุมัติหลายฉบับเพื่อจัดหา แปรรูป และจำหน่ายผลิตภัณฑ์สัตว์น้ำ"],["core","BAP · Core หมวด 1","1.1.1.1","","การใช้ที่ดินและน้ำของโรงงานเป็นไปตามกฎหมาย","กฎระเบียบเกี่ยวกับการใช้ที่ดินและน้ำของโรงงานแปรรูปแตกต่างกันไปในแต่ละประเทศ การใช้งานที่ถูกต้องตามกฎหมายต้องได้รับการยืนยันด้วยเอกสารที่ออกโดยหน่วยงานกำกับดูแลในพื้นที่ที่ดำเนินการ"],["core","BAP · Core หมวด 1","1.1.1.2","","ใบอนุญาตประกอบธุรกิจและใบอนุญาตดำเนินการที่เป็นปัจจุบัน","กฎระเบียบเกี่ยวกับใบอนุญาตดำเนินการของโรงงานแปรรูปมีความแตกต่างกันอย่างมากในแต่ละประเทศ ใบอนุญาตประกอบธุรกิจ ใบอนุญาตดำเนินการ และเอกสารอนุญาตต่าง ๆ ต้องได้รับการยืนยันด้วยเอกสารที่ออกโดยหน่วยงานกำกับดูแลในพื้นที่ที่ดำเนินการ"],["core","BAP · Core หมวด 1","1.1.1.3","","การปฏิบัติตามกฎระเบียบด้านสิ่งแวดล้อมที่เกี่ยวข้องกับการก่อสร้างและการดำเนินการ","โรงงานแปรรูปต้องสามารถแสดงให้เห็นว่ามีใบอนุญาตที่จำเป็นสำหรับการก่อสร้าง รวมถึงการปรับปรุงต่อเติมที่เกิดขึ้นล่าสุด และปฏิบัติตามกฎระเบียบด้านสิ่งแวดล้อมในพื้นที่ที่โรงงานตั้งอยู่ โรงงานต้องนำเสนอข้อกำหนดด้านสิ่งแวดล้อมของท้องถิ่นให้แก่ผู้ตรวจประเมิน ขั้นตอนดำเนินการนี้ต้องมีการจัดทำเป็นเอกสาร ซึ่งรวมถึงการระบุกฎหมายที่เกี่ยวข้อง"],["core","BAP · Core หมวด 1","1.1.1.4","","ไม่มีการปล่อยน้ำทิ้งลงสู่แหล่งน้ำธรรมชาติ: โรงงานที่ไม่มีการปล่อยน้ำเสีย (Effluent) ทั้งทางตรงหรือทางอ้อมลงสู่แหล่งน้ำที่เกิดขึ้นตามธรรมชาติ และปฏิบัติตามข้อกำหนด SPS อื่น ๆ ทั้งหมด มีสิทธิ์ได้รับการรับรอง GSA","ไม่มีข้อกำหนดให้ต้องตรวจติดตามน้ำเสีย หากโรงงานไม่มีการปล่อยน้ำเสียทั้งทางตรงหรือทางอ้อมลงสู่แหล่งน้ำที่เกิดขึ้นตามธรรมชาติ ตัวอย่าง: น้ำเสียที่นำไปใช้เพื่อการชลประทานหรือวัตถุประสงค์อื่นใด โดยไม่มีการปล่อยลงสู่แหล่งน้ำที่เกิดขึ้นตามธรรมชาติ ภายนอกเขตพื้นที่ของโรงงาน"],["core","BAP · Core หมวด 1","1.1.1.5","","การปล่อยน้ำทิ้งสู่โรงบำบัดน้ำเสียของเทศบาลหรือเอกชน: โรงงานที่มีสัญญาที่มีผลบังคับใช้กับเทศบาลหรือนิคมอุตสาหกรรม ซึ่งรับผิดชอบในการบำบัดและกำจัดน้ำเสียให้เป็นไปตามกฎระเบียบของรัฐบาล ระดับภูมิภาค และระดับท้องถิ่น มีสิทธิ์ได้รับการรับรอง GSA หากปฏิบัติตามข้อกำหนด GSA อื่น ๆ ทั้งหมด","ต้องมีสัญญาที่มีผลบังคับใช้กับเทศบาลหรือนิคมอุตสาหกรรม ซึ่งรับผิดชอบในการบำบัดและกำจัดน้ำเสียทั้งหมดให้เป็นไปตามกฎระเบียบของรัฐบาล ระดับภูมิภาค และระดับท้องถิ่น เมื่อได้รับการยืนยันในเรื่องนี้แล้ว ไม่จำเป็นต้องมีการเก็บตัวอย่างและทดสอบน้ำเสีย • โรงงานต้องไม่ปล่อยน้ำเสียเกินระดับปริมาณที่ได้รับอนุญาตจากหน่วยงานรัฐระดับท้องถิ่นหรือระดับประเทศ เมื่อปล่อยน้ำเสียลงสู่ระบบบำบัดของเทศบาลหรือนิคมอุตสาหกรรม"],["core","BAP · Core หมวด 1","1.1.1.6","","โรงงานต้องทราบและปฏิบัติตามกฎหมายที่เกี่ยวข้องที่เป็นปัจจุบันทั้งหมด ทั้งของประเทศที่ผลิตสัตว์น้ำและประเทศที่ส่งออกไปจำหน่าย","ข้อมูลทางวิทยาศาสตร์และกฎหมายมีการเปลี่ยนแปลงอยู่เสมอ เพื่อให้มั่นใจว่าปฏิบัติตามแนวทางที่ดีที่สุด โรงงานควรจัดให้มีวิธีการสำหรับเจ้าหน้าที่ฝ่ายเทคนิคในการติดตามข้อมูลด้านความปลอดภัยอาหารและกฎหมายที่เป็นปัจจุบัน ทั้งในประเทศที่ทำการแปรรูปและประเทศใด ๆ ที่ส่งออกหรือจัดหาวัตถุดิบมา จุดประสงค์คือเพื่อให้แน่ใจว่าการเปลี่ยนแปลงใด ๆ ด้านความปลอดภัยอาหารหรือกฎหมายที่อาจส่งผลกระทบต่อการผลิตของโรงงานจะเป็นที่รับทราบโดยทีมงานฝ่ายเทคนิคของโรงงาน และมีการปรับปรุงระบบ QMS/ระบบความปลอดภัยอาหารอย่างเหมาะสม ขั้นตอนดำเนินการนี้อาจได้รับการสนับสนุนจากข้อมูลที่ได้รับจากหน่วยงานราชการ หน่วยงานบุคคลที่สาม (Third …"],["core","BAP · Core หมวด 1","1.1.1.7","","ผลิตภัณฑ์ต้องมีการติดฉลากอย่างถูกต้องครบถ้วนตามข้อมูลที่กำหนด รวมถึงสารก่อภูมิแพ้ (Allergens) ตามที่กฎหมายท้องถิ่นและกฎหมายของประเทศปลายทางกำหนด รวมถึงเอกสารสนับสนุนข้อกล่าวอ้าง (Claims) ที่มีการยืนยันใด ๆ ผลิตภัณฑ์ต้องมีการให้ข้อมูลเพื่อความปลอดภัยในการจัดการ การเก็บรักษา การเตรียม และการใช้งานผลิตภัณฑ์ตลอดสายโซ่อุปทานหรือโดยผู้บริโภค","ตัวอย่างของข้อมูลเพื่อการจัดการอย่างปลอดภัย ได้แก่ วิธีการปรุงอาหาร คำแนะนำในการเก็บรักษา เช่น เก็บแบบแช่แข็งหรือแช่เย็น ข้อมูลการละลายน้ำแข็ง (Thawing) และต้องมีเอกสารสนับสนุนข้อกล่าวอ้างของผลิตภัณฑ์ที่มีการยืนยันใด ๆ"],["core","BAP · Core หมวด 1","1.1.1.8","","สัตว์น้ำที่มีชีวิต ซึ่งรวมถึงแต่ไม่จำกัดเฉพาะปลาและหอยสองฝา (Molluscan Shellfish) ต้องจัดซื้อจากแหล่งจำหน่ายเชิงพาณิชย์ที่ได้รับใบอนุญาตตามกฎหมายและกฎระเบียบที่บังคับใช้เท่านั้น และต้องได้มาจากการจับที่ถูกกฎหมาย","การประมงธรรมชาติ (Wild Fisheries) อยู่ภายใต้การกำกับดูแลของหน่วยงานและองค์กรต่าง ๆ ทั่วโลก โรงงานที่รับซื้อวัตถุดิบจากการจับตามธรรมชาติต้องแสดงให้เห็นว่าวัตถุดิบดังกล่าวเป็นไปตามกฎระเบียบที่บังคับใช้ทั้งหมด กฎระเบียบอาจรวมถึงข้อจำกัดด้านชนิดพันธุ์ ฤดูกาลจับ ขนาดของปลา ข้อจำกัดด้านเครื่องมือประมง ประเภทและขนาดของเรือ พื้นที่จับและโควตา ข้อจำกัดปริมาณสัตว์น้ำพลอยจับได้ (By-catch) และกฎระเบียบเฉพาะอื่น ๆ หรือกฎระเบียบเฉพาะประเทศ โรงงานต้องแสดงให้เห็นว่ามีความตระหนักรู้และปฏิบัติตามกฎระเบียบและข้อกำหนดด้านใบอนุญาตที่จำเป็นทั้งหมด สามารถดูรายชื่อเรือประมง IUU แบบรวม (Combined IUU Vessel List) ได้ท…"],["core","BAP · Core หมวด 2","2.1.1","","โรงงานต้องมีระบบ QMS (ระบบบริหารคุณภาพ) ที่จัดทำเป็นเอกสาร ได้รับการอนุมัติจากผู้บริหารระดับสูง มีการนำไปปฏิบัติอย่างมีประสิทธิผล มีการดูแลรักษา และออกแบบมาเพื่อปรับปรุงระบบบริหารความปลอดภัยอาหารอย่างต่อเนื่อง องค์ประกอบของ QMS ต้องรวมถึงองค์ประกอบของวัฒนธรรมความปลอดภัยอาหาร (Food Safety Culture) ซึ่งต้องมีอย่างน้อยดังต่อไปนี้: • การสื่อสาร • การฝึกอบรม • กลไกในการรับข้อเสนอแนะ (Feedback) จากพนักงาน • ผลการดำเนินงานของกระบวนการที่เกี่ยวข้องกับความปลอดภัยอาหาร","ระบบบริหารคุณภาพต้องมีการจัดทำและนำไปใช้จริงภายในโรงงานของผู้ยื่นขอการรับรอง ระบบบริหารคุณภาพนี้จะต้องเป็นเอกสารที่เป็นทางการ หรือชุดของเอกสารที่ได้รับการอนุมัติและลงนามโดยผู้บริหารระดับสูง ซึ่งนำไปใช้ควบคุมกระบวนการต่าง ๆ ที่ดำเนินการภายในโรงงานอย่างมีประสิทธิผล ทั้งในด้านการบริหารความปลอดภัยอาหารและวัฒนธรรมความปลอดภัยอาหาร ระบบ QMS ต้องได้รับการดูแลรักษาผ่านขั้นตอนการควบคุมเอกสารตามที่กำหนด มีการทบทวนและปรับปรุงตามความจำเป็น"],["core","BAP · Core หมวด 2","2.1.2","","ระบบ QMS ต้องได้รับการทบทวนและปรับปรุงหลังจากเกิดเหตุการณ์ด้านความปลอดภัยอาหารหรือการเรียกคืนผลิตภัณฑ์ (Recall) โดยต้องมีความถี่อย่างน้อยปีละหนึ่งครั้ง","การทบทวนระบบบริหารคุณภาพต้องดำเนินการอย่างน้อยปีละหนึ่งครั้ง และทุกครั้งที่โรงงานประสบเหตุการณ์ด้านความปลอดภัยอาหารหรือการเรียกคืนผลิตภัณฑ์ การทบทวน QMS ควรเป็นการทบทวนในภาพรวมและครอบคลุมทุกด้านที่เกี่ยวข้องของระบบความปลอดภัยอาหารและระบบคุณภาพ ซึ่งรวมถึงแต่ไม่จำกัดเฉพาะ: คู่มือคุณภาพ ความรับผิดชอบของฝ่ายบริหารและโครงสร้างองค์กร ความมุ่งมั่นของฝ่ายบริหาร ข้อกำหนดเฉพาะและการจัดซื้อ การบริหารจัดการผู้ขาย ข้อเสนอแนะจากพนักงาน การฝึกอบรม ข้อบกพร่อง (Non-conformities) และการปฏิบัติการแก้ไข การควบคุมเอกสาร ระบบข้อร้องเรียนของลูกค้า และกิจกรรมที่ว่าจ้างหน่วยงานภายนอกดำเนินการ (Outsourcing) นอกจากนี้ …"],["core","BAP · Core หมวด 2","2.1.3","","โรงงานต้องกำหนด จัดทำเป็นเอกสาร และดูแลให้มีการติดตามวัตถุประสงค์ด้านคุณภาพและความปลอดภัยอาหาร/ตัวชี้วัดผลการดำเนินงานหลัก (Key Performance Indicators) โดยมีผลลัพธ์ที่สามารถวัดได้ ผลการติดตามต้องนำเสนอต่อฝ่ายบริหารในระหว่างการทบทวนระบบ ฝ่ายบริหารต้องนำนโยบายและขั้นตอนดำเนินการไปปฏิบัติเพื่อสนับสนุนการพัฒนา การนำไปปฏิบัติ และการเสริมสร้างวัฒนธรรมความปลอดภัยอาหาร วัฒนธรรมความปลอดภัยอาหารต้องริเริ่มโดยผู้บริหารระดับสูง และต้องบูรณาการทั่วทั้งองค์กร","ผู้บริหารระดับสูงต้องกำหนดและรักษาแผนสำหรับการพัฒนาและการปรับปรุงอย่างต่อเนื่องด้านความปลอดภัยอาหาร คุณภาพ และวัฒนธรรมความปลอดภัยอาหาร (Food Safety Culture) แผนนี้รวมถึงการติดตามตัวชี้วัดผลการปฏิบัติงานหลัก (Key Performance Indicators) บางประการ ซึ่งอาจอยู่ในรูปแบบของกิจกรรมที่กำหนดไว้ซึ่งส่งผลกระทบโดยตรงต่อความปลอดภัยหรือคุณภาพของผลิตภัณฑ์ โรงงานต้องระบุประเด็นด้านความปลอดภัยอาหารและคุณภาพของธุรกิจที่จะส่งเสริมวัฒนธรรมความปลอดภัยอาหาร และได้รับประโยชน์จากการกำหนดเป้าหมายและการติดตามผลการดำเนินงานเพื่อบรรลุเป้าหมายดังกล่าว การวัดความก้าวหน้าอย่างเป็นภาวะวิสัย (Objective Measurement) เป็นข้อกำ…"],["core","BAP · Core หมวด 2","2.1.4","","โรงงานต้องมีสำเนาฉบับปัจจุบันของ SPS (มาตรฐานการแปรรูปสัตว์น้ำ) ที่ใช้ในการตรวจประเมินโรงงานไว้ ณ สถานที่ปฏิบัติงาน",""],["core","BAP · Core หมวด 2","2.2.1","","โรงงานต้องมีคู่มือคุณภาพ (Quality Manual) ซึ่งครอบคลุมด้านความปลอดภัยอาหาร โดยต้องพร้อมให้บุคลากรทุกคนที่เกี่ยวข้องกับการบริหารจัดการคุณภาพเข้าถึงได้ และต้อง:","คู่มือคุณภาพต้องครอบคลุมหลักการและการควบคุมด้านความปลอดภัยอาหารไว้ในขอบเขตของคู่มือ ให้ครบถ้วนตามข้อกำหนดทั้งหมดของมาตรฐาน GSA คู่มือคุณภาพต้องพร้อมให้บุคลากรที่จำเป็นต้องใช้อ้างอิงเนื้อหาสามารถเข้าถึงได้ โดยทั่วไปอาจจัดวางไว้ในตำแหน่งที่กำหนดภายในโรงงาน"],["core","BAP · Core หมวด 2","2.2.1.1","","ครอบคลุมมาตรการควบคุมที่ครอบคลุมข้อกำหนดทั้งหมดของ SPS รวมถึงโมดูล (Modules) ที่เกี่ยวข้องทั้งหมด","ขอแนะนำให้ตรวจประเมินข้อกำหนดนี้ภายหลังจากที่การตรวจประเมินดำเนินไปเป็นส่วนใหญ่แล้ว หลังจากทบทวนเนื้อหาของคู่มือคุณภาพแล้ว ให้พิจารณาว่าหลักการและการควบคุมด้านความปลอดภัยอาหารเพียงพอที่จะครอบคลุมผลิตภัณฑ์ภายในขอบเขตของการตรวจประเมิน รวมถึงโมดูลที่เกี่ยวข้องหรือไม่"],["core","BAP · Core หมวด 2","2.2.1.2","","ครอบคลุมผลิตภัณฑ์ที่จะทำการแปรรูป และต้องรวมถึงขั้นตอนการปฏิบัติงานที่เป็นลายลักษณ์อักษร หรือการอ้างอิงที่เจาะจงถึงขั้นตอนดังกล่าวด้วย","มาตรฐานกำหนดให้องค์กรต้องมีคู่มือความปลอดภัยอาหาร (Food Safety Manual) หรือระบบเอกสารที่มีขอบเขตเหมาะสมกับช่วงของกิจกรรมทางธุรกิจที่ต้องครอบคลุม คู่มือคุณภาพต้องครอบคลุมผลิตภัณฑ์ทั้งหมดที่ผลิตในโรงงาน และควรได้รับการปรับปรุงตามความจำเป็น ตัวอย่างเช่น เมื่อมีการนำผลิตภัณฑ์ใหม่เข้ามา มีการประกาศใช้กฎหมายใหม่ มีการระบุตลาดส่งออกใหม่ หรือมีการเพิ่มบุคลากรหลักใหม่เข้ามาในโรงงาน คู่มือคุณภาพต้องรวมหรืออ้างอิงถึงขั้นตอนการปฏิบัติงานหรือคำแนะนำการทำงานที่เป็นลายลักษณ์อักษร ซึ่งถูกนำมาใช้ปฏิบัติเพื่อให้มั่นใจว่าการผลิตผลิตภัณฑ์มีความปลอดภัย ถูกต้องตามกฎหมาย และมีคุณภาพ"],["core","BAP · Core หมวด 2","2.2.1.3","","กำหนดคุณลักษณะด้านคุณภาพและความปลอดภัยอาหารทั้งหมดของวัตถุดิบที่รับเข้าและผลิตภัณฑ์สำเร็จรูปที่ผลิตขึ้นไว้อย่างชัดเจน ซึ่งต้องมีการติดตามตรวจสอบและควบคุมเพื่อให้มั่นใจว่าเป็นไปตามข้อกำหนดทางกฎหมาย และข้อกำหนดของลูกค้าและโรงงาน","คุณลักษณะด้านคุณภาพโดยทั่วไปจะรวมอยู่ในข้อกำหนดคุณลักษณะ (Specifications) ของวัตถุดิบและผลิตภัณฑ์สำเร็จรูป เอกสารข้อกำหนดคุณลักษณะต้องได้รับการทบทวน (ติดตามตรวจสอบ) และปรับปรุงแก้ไข (ควบคุม) หากมีการเปลี่ยนแปลงเกิดขึ้น ในบางกรณี (เช่น กุ้งธรรมชาติ) ข้อกำหนดคุณลักษณะของวัตถุดิบอาจแปรผันไปตามความพร้อมของผลิตภัณฑ์และความต้องการของตลาดของโรงงาน ณ ขณะที่มีการจัดซื้อ และอาจเปลี่ยนแปลงได้ในแต่ละครั้งที่มีการส่งมอบ"],["core","BAP · Core หมวด 2","2.2.1.4","","ต้องครอบคลุมอย่างน้อยดังนี้ การกำหนดขนาดการสุ่มตัวอย่าง ความถี่ในการทดสอบ ขั้นตอนการปฏิบัติงาน ระดับค่าคลาดเคลื่อนสูงสุดหรือต่ำสุดที่ยอมรับได้ การปฏิบัติการแก้ไข บุคลากรผู้รับผิดชอบ และข้อกำหนดในการจัดเก็บบันทึกที่เกี่ยวข้องกับขั้นตอนการบริหารจัดการคุณภาพทั้งหมด","คู่มือคุณภาพต้องได้รับการดูแลรักษาให้เป็นเอกสารที่ครอบคลุมข้อกำหนดคุณลักษณะของค่าพารามิเตอร์ด้านคุณภาพทั้งหมดที่ส่งผลต่อข้อกำหนดด้านประสาทสัมผัส กฎหมาย และความปลอดภัยอาหาร คุณลักษณะที่ต้องรวมไว้อย่างน้อย ได้แก่ ข้อกำหนดด้านความสอดคล้องสำหรับ การติดฉลาก น้ำหนักสุทธิ คุณลักษณะทางประสาทสัมผัสที่ถูกต้อง สีสัน ตำหนิจากการตัดแต่ง กระดูก หนัง และตำหนิจากรอยช้ำ"],["core","BAP · Core หมวด 2","2.3.1","","โรงงานต้องมีนโยบายด้านความปลอดภัยอาหารและระบบบริหารจัดการคุณภาพ (Quality Management System Policy) ที่กำหนดไว้อย่างชัดเจนและเป็นลายลักษณ์อักษร โดยเป็นส่วนหนึ่งของคู่มือคุณภาพ ได้รับการอนุมัติจากผู้บริหารระดับสูง ซึ่งสะท้อนถึงความมุ่งมั่นต่อขอบเขตทั้งหมดของมาตรฐาน SPS รวมถึงวัฒนธรรมความปลอดภัยอาหารและโมดูลที่เกี่ยวข้อง","แถลงการณ์นโยบายคุณภาพ (Quality Policy) ที่ระบุถึงระดับความมุ่งมั่นขององค์กรในการตอบสนองความต้องการด้านความปลอดภัยอาหารของผลิตภัณฑ์ และการพัฒนาและส่งเสริมวัฒนธรรมความปลอดภัยอาหาร แถลงการณ์นโยบายคุณภาพโดยทั่วไปเป็นนโยบายสรุปที่แสดงความมุ่งมั่นของโรงงานต่อการผลิตผลิตภัณฑ์ที่ปลอดภัย ถูกต้องตามกฎหมาย มีความรับผิดชอบต่อสังคม และมีคุณภาพ และรวมถึงความมุ่งมั่นในการปฏิบัติตามมาตรฐาน GSA Seafood Processing Standard และโมดูลที่เกี่ยวข้อง แถลงการณ์นโยบายคุณภาพต้องได้รับการอนุมัติ (ลงนาม) และระบุวันที่โดยผู้บริหาร ซึ่งโดยทั่วไปจะเป็นผู้บริหารระดับสูงสุดของโรงงาน"],["core","BAP · Core หมวด 2","2.4.1","","โรงงานต้องมีแผนผังโครงสร้างองค์กรที่สะท้อนถึงผู้บริหารโรงงานปัจจุบันและสมาชิกทีม HACCP และอย่างน้อยต้องระบุพนักงานและบุคลากรสำรองที่รับผิดชอบด้านการปฏิบัติตามข้อกำหนดการประกันคุณภาพ ความถูกต้องตามกฎหมาย และความปลอดภัยอาหาร","ผู้สมัครต้องจัดทำและดูแลรักษาแผนผังโครงสร้างองค์กรของโรงงาน/ธุรกิจ เอกสารนี้ต้องแสดงให้เห็นอย่างชัดเจนถึงตำแหน่งงานของพนักงานที่กิจกรรมของตนส่งผลต่อความปลอดภัยของผลิตภัณฑ์ และความสัมพันธ์ในการรายงาน หน้าที่งานด้าน QC ควรรายงานตรงต่อตำแหน่งที่อยู่นอกสายการบังคับบัญชาของฝ่ายผลิต ตำแหน่งสำรองสามารถระบุไว้ในเอกสารแยกต่างหากได้ ห้ามใช้ชื่อบุคคลในแผนผังโครงสร้างองค์กร ให้ใช้เฉพาะตำแหน่งงานที่มีอยู่ในองค์กรเท่านั้น"],["core","BAP · Core หมวด 2","2.4.2","","โรงงานต้องกำหนดและจัดทำเอกสารหน้าที่งาน ความรับผิดชอบ และความสัมพันธ์ในการรายงานของพนักงานอย่างน้อยที่กิจกรรมของตนส่งผลต่อคุณภาพผลิตภัณฑ์ ความถูกต้องตามกฎหมาย และความปลอดภัยอาหาร","ใบพรรณนางาน (Job Description) ต้องจัดทำเป็นเอกสารสำหรับแต่ละตำแหน่งงานที่ส่งผลต่อคุณภาพผลิตภัณฑ์ ความถูกต้องตามกฎหมาย และความปลอดภัยอาหาร หน้าที่งานต้องเป็นปัจจุบัน และระบุความรับผิดชอบของหน้าที่งานนั้น รวมถึงโครงสร้างการรายงานของตำแหน่งดังกล่าว ตำแหน่งสำรองอาจถูกกำหนดไว้ในใบพรรณนา งานด้วย"],["core","BAP · Core หมวด 2","2.4.3","","โรงงานต้องระบุสมาชิกและความสามารถ (Competency) ของทีม HACCP โดยความสามารถต้องแสดงให้เห็นผ่านหลักฐานเป็นลายลักษณ์อักษรของการฝึกอบรม HACCP และประสิทธิผลของการฝึกอบรม","ตำแหน่งของสมาชิกทีม HACCP ต้องระบุไว้อย่างชัดเจน ซึ่งรวมถึงหัวหน้าทีมและสมาชิกทีม การฝึกอบรมหัวหน้าทีมต้องดำเนินการโดยหลักสูตร Seafood HACCP ที่เป็นทางการ สมาชิกทีมสามารถได้รับการฝึกอบรมภายในโรงงานโดยผู้ที่ได้รับการรับรอง HACCP หรือเข้าร่วมหลักสูตรภายนอกได้ ประสิทธิผลของการฝึกอบรมสามารถตรวจสอบยืนยันได้โดยการสอบข้อเขียน การสัมภาษณ์ที่มีการบันทึกเป็นลายลักษณ์อักษร หรือการสังเกตการปฏิบัติงานที่เกี่ยวข้องกับ HACCP"],["core","BAP · Core หมวด 2","2.5.1","","ผู้บริหารระดับสูงของโรงงานต้องแสดงให้เห็นถึงความมุ่งมั่นต่อการพัฒนาและการปรับปรุงอย่างต่อเนื่องของระบบบริหารจัดการคุณภาพ (QMS) และจัดสรรทรัพยากรทั้งหมดที่จำเป็นสำหรับการนำไปปฏิบัติและการดูแลรักษา","มาตรฐานกำหนดให้ผู้บริหารระดับสูงขององค์กรต้องพิจารณาและจัดสรรทรัพยากรที่มีคุณสมบัติเหมาะสม (รวมถึงบุคลากรที่มีคุณสมบัติเหมาะสม) ที่จำเป็นสำหรับการนำไปปฏิบัติ การดูแลรักษา และการปรับปรุงระบบความปลอดภัยอาหาร ผู้บริหารระดับสูงต้องจัดสรร: ทรัพยากรเพื่อสนับสนุนและนำระบบ QMS ไปปฏิบัติ ทรัพยากรที่จัดสรรเพื่อจ้างและฝึกอบรมบุคลากรที่จำเป็นในการผลิตอาหารที่ปลอดภัยและถูกต้องตามกฎหมาย • ทรัพยากรสำหรับการดูแลรักษาและปรับปรุงโรงงาน ซึ่งมีส่วนช่วยให้เป็นไปตามข้อกำหนดของมาตรฐานและป้องกันการปนเปื้อนข้าม (Cross Contamination) • จัดให้มีการฝึกอบรมแก่พนักงานเพื่อให้เป็นไปตามข้อกำหนดด้านผลการปฏิบัติงาน • จัดให้มี…"],["core","BAP · Core หมวด 2","2.5.2","","การประชุมทบทวนโดยฝ่ายบริหาร (Management Review) ต้องมีผู้บริหารระดับสูงเข้าร่วม และจัดขึ้นตามช่วงเวลาที่กำหนดไว้ - อย่างน้อยปีละหนึ่งครั้ง เพื่อให้มั่นใจว่าแผนงาน ขั้นตอนการปฏิบัติงาน และระบบต่าง ๆ เป็นปัจจุบัน มีประสิทธิผลอย่างต่อเนื่อง และเป็นไปตามขอบเขตทั้งหมดของ SPS รวมถึงโมดูลที่เกี่ยวข้อง","แม้ว่าการทวนสอบการบริหาร (Management Review) จะต้องดำเนินการอย่างน้อยปีละหนึ่งครั้ง แต่โรงงานอาจเลือกจัดการประชุมให้บ่อยขึ้นเพื่อทบทวนองค์ประกอบต่าง ๆ ของระบบคุณภาพและความปลอดภัยอาหาร การทวนสอบการบริหารสามารถดำเนินการในครั้งเดียว หรือแบ่งออกเป็นช่วงที่กำหนดไว้ล่วงหน้าตลอดทั้งปีก็ได้ ประสิทธิผลของแผนงาน ขั้นตอนการปฏิบัติงาน และระบบทั้งหมดควรได้รับการประเมินเป็นประจำทุกปี การทวนสอบการบริหารด้านคุณภาพครอบคลุมการทบทวนกิจกรรมการตรวจประเมินทั้งหมด แนวโน้มและข้อมูลป้อนกลับจากข้อร้องเรียนของลูกค้า ข้อบกพร่อง (Non-conformances) กิจกรรมด้านกฎระเบียบ องค์ประกอบของระบบความปลอดภัยอาหาร การปรับปรุงกระบวนกา…"],["core","BAP · Core หมวด 2","2.5.3","","โรงงานต้องจัดทำและเก็บรักษารายงานการประชุมทวนสอบการบริหาร (Management Review) ไว้เพื่อให้พร้อมสำหรับการตรวจสอบ","รายงานการประชุมอย่างน้อยต้องประกอบด้วย รายชื่อผู้เข้าร่วมประชุม วาระการประชุม มติที่สำคัญ และมาตรการติดตามผลพร้อมกำหนดระยะเวลาในการดำเนินการให้แล้วเสร็จและผู้รับผิดชอบ มาตรการติดตามผลต้องดำเนินการให้แล้วเสร็จภายในเวลาที่เหมาะสม และต้องบันทึกผลการดำเนินการไว้เป็นลายลักษณ์อักษร"],["core","BAP · Core หมวด 2","2.6.1","","โรงงานต้องมีข้อกำหนดเฉพาะ (Specifications) เป็นลายลักษณ์อักษรและจัดทำเอกสารสำหรับสิ่งของทุกรายการที่จัดซื้อซึ่งมีผลกระทบต่อความปลอดภัยอาหาร ข้อกำหนดด้านกฎระเบียบ และคุณภาพ กระบวนการจัดซื้อต้องได้รับการควบคุมโดยบุคลากรที่ได้รับมอบหมาย เพื่อให้แน่ใจว่าสิ่งของเหล่านี้เป็นไปตามข้อกำหนด","ข้อกำหนดนี้หมายถึง 'สิ่งของ' หรือสินค้าที่จับต้องได้ ซึ่งรวมถึงวัตถุดิบ ส่วนผสม บรรจุภัณฑ์ และวัตถุเจือปน ข้อกำหนดนี้ไม่รวมถึงการจัดซื้อบริการ (เช่น การควบคุมสัตว์รบกวน การจ้างเหมากระบวนการผลิตและการวิเคราะห์ทางห้องปฏิบัติการ) และโดยทั่วไปไม่นำไปใช้กับสินค้าเชิงพาณิชย์ที่มีแคตตาล็อก ผู้สมัครขอรับการรับรองต้องแสดงให้เห็นถึงการควบคุมกระบวนการจัดซื้อ ควรมีขั้นตอนการควบคุมเพื่อยืนยันว่าข้อกำหนดเฉพาะของสิ่งของซึ่งอ้างอิงจากหลักการทางวิทยาศาสตร์นั้นสอดคล้องกับข้อกำหนด การควบคุมอาจรวมถึง แต่ไม่จำกัดเพียง ระบบใบสั่งซื้อ การตรวจสอบ ณ จุดรับสินค้า และบุคลากรจัดซื้อที่ได้รับมอบหมาย"],["core","BAP · Core หมวด 2","2.6.1.1","","โรงงานต้องแสดงให้เห็นถึงการควบคุมอย่างน้อยผ่านการแต่งตั้งบุคลากรจัดซื้อที่ได้รับมอบหมาย และขั้นตอนการจัดซื้อเป็นลายลักษณ์อักษร (ดูเพิ่มเติมในข้อ 2.7 – “การอนุมัติผู้ขายและการติดตามผลการปฏิบัติงาน (Supplier Approval and Performance Monitoring)”)","ตำแหน่งที่ได้รับมอบหมายให้ควบคุมการจัดซื้อต้องถูกระบุไว้ในเอกสารพรรณนางาน (Job Description) หรือในขั้นตอนการปฏิบัติงานมาตรฐาน (SOP) ด้านการจัดซื้อ"],["core","BAP · Core หมวด 2","2.6.2","","ข้อกำหนดเฉพาะต้องเป็นข้อมูลปัจจุบันและได้รับการทบทวนเป็นระยะ อย่างน้อยปีละหนึ่งครั้ง และต้องพร้อมให้พนักงานที่ได้รับมอบหมายเข้าถึงได้โดยง่าย","ข้อกำหนดเฉพาะด้านการจัดซื้อควรเป็นข้อมูลที่เป็นปัจจุบันและได้รับการทบทวนเป็นประจำทุกปี การทบทวนประจำปีสามารถดำเนินการโดยการทบทวนตามกำหนดการเป็นชุดหรือการทบทวนข้อกำหนดเฉพาะทั้งหมดในครั้งเดียว"],["core","BAP · Core หมวด 2","2.7.1","","โรงงานต้องควบคุมผลิตภัณฑ์ทุกชนิด (เช่น วัตถุดิบ บรรจุภัณฑ์ วัตถุเจือปน และส่วนผสม) และผู้ให้บริการที่อาจมีผลกระทบต่อความปลอดภัยอาหาร ความถูกต้องตามกฎหมาย คุณภาพ ผลกระทบต่อสิ่งแวดล้อม สวัสดิภาพสัตว์ การสืบย้อนกลับ (Traceability) และความรับผิดชอบต่อสังคม","ข้อกำหนดนี้ต้องได้รับการตรวจประเมินหลังจากที่ข้อกำหนดอื่น ๆ ในหมวดนี้ (2.7.2-2.7.4) ได้รับการประเมินแล้ว"],["core","BAP · Core หมวด 2","2.7.2","","โรงงานต้องมีโปรแกรมการอนุมัติผู้ขาย (Supplier Approval Program) ซึ่งประกอบด้วยรายชื่อผู้ขายและผู้ให้บริการที่ได้รับการอนุมัติ รายชื่อนี้ต้องเป็นข้อมูลปัจจุบันและได้รับการทบทวนอย่างน้อยปีละหนึ่งครั้ง","วันที่ปฏิเสธ"],["core","BAP · Core หมวด 2","2.7.3","","โปรแกรมการอนุมัติผู้ขายผลิตภัณฑ์และบริการต้องครอบคลุมผู้ขายทุกรายที่ระบุไว้ในข้อ 2.7.1 โปรแกรมนี้ต้องรวมถึงหลักเกณฑ์ในการอนุมัติ และนโยบายและ/หรือขั้นตอนของโรงงานสำหรับการใช้ผู้ขายที่ยังไม่ได้รับการอนุมัติเป็นการชั่วคราว","ตัวอย่างหลักเกณฑ์ในการอนุมัติ: • ผู้ขายต้องมีระบบการสืบย้อนกลับ (Traceability) เพื่อให้สามารถสืบย้อนไปถึงเรือประมงหรือผู้ค้าส่งสำหรับสัตว์น้ำที่จับจากธรรมชาติ หรือฟาร์มรายบุคคลสำหรับสัตว์น้ำที่เพาะเลี้ยง • ข้อมูลการรับรอง (ในกรณีที่เกี่ยวข้อง) • ใบรับรองผลการวิเคราะห์ (Certificate of Analysis) (สำหรับส่วนผสมหรือวัตถุเจือปนบางชนิด) • การตรวจประเมินโดยหน่วยงานกำกับดูแล (Regulatory Authority Audits) • การประเมินด้วยสายตา (สำหรับวัสดุบรรจุภัณฑ์) • การตรวจประเมินผู้ขาย โดยบุคลากรของโรงงานเองหรือโดยหน่วยงานภายนอก • การประเมินความเสี่ยง – โดยเฉพาะสำหรับสัตว์น้ำที่อาจมีปัญหาด้านความเป็นพิษหรือสารก่อภ…"],["core","BAP · Core หมวด 2","2.7.4","","โรงงานต้องมีขั้นตอนการปฏิบัติงานสำหรับการติดตามผลการปฏิบัติงานของผู้ขายผลิตภัณฑ์และบริการอย่างสม่ำเสมอ การติดตามนี้ต้องดำเนินการด้วยความถี่ที่สอดคล้องกับระดับความเสี่ยงของผลิตภัณฑ์หรือบริการที่จัดหา ต้องกำหนดหลักเกณฑ์ด้านผลการปฏิบัติงาน รวมถึงมาตรการที่ต้องดำเนินการในกรณีที่ผลการปฏิบัติงานไม่เป็นไปตามหลักเกณฑ์ ผลการประเมินผลการปฏิบัติงานของผู้ขายและมาตรการติดตามผลต้องมีการบันทึกไว้","ข้อกำหนดนี้เป็นข้อกำหนดประจำปี ผลการปฏิบัติงานของผู้ขายต้องได้รับการติดตามและประเมินเทียบกับหลักเกณฑ์ผลการปฏิบัติงานที่ยอมรับได้ ตัวอย่างของหลักเกณฑ์ผลการปฏิบัติงาน ได้แก่ การจัดส่งตรงเวลา ความถูกต้องของการจัดส่ง ความถูกต้องของการติดฉลาก ความเหมาะสมของบรรจุภัณฑ์ ราคา ระดับการปฏิเสธรับสินค้า นอกเหนือจากหลักเกณฑ์ในการยอมรับแล้ว ต้องมีการจัดทำเอกสารมาตรการที่ต้องดำเนินการในกรณีที่ผู้ขายไม่เป็นไปตามหลักเกณฑ์ ในกรณีนี้ต้องมีการบันทึกมาตรการติดตามผลไว้เป็นลายลักษณ์อักษร"],["core","BAP · Core หมวด 2","2.7.5","","โรงงานหลักต้องไม่จัดซื้อบริการปอกและตัดหัวกุ้งจากหน่วยงานที่ไม่เป็นทางการซึ่งเรียกว่า “โรงเรือนปอกหรือตัดหัวกุ้ง (Peeling or De-heading Sheds)” เพื่อให้มีสิทธิ์ได้รับการรับรอง SPS การปอกและ/หรือตัดหัวกุ้งต้องดำเนินการในสถานประกอบการที่ได้รับอนุมัติจากหน่วยงานราชการอย่างถูกต้องเท่านั้น และต้องมีหลักเกณฑ์ด้านกฎหมาย ความปลอดภัยอาหาร สิ่งแวดล้อม และสังคมที่ครบถ้วน ซึ่งจะต้องได้รับการตรวจประเมินตามที่ระบุไว้ในข้อกำหนด OSP1 ของโมดูลการจ้างเหมา (Outsourcing Module) สถานประกอบการดังกล่าวต้อง: • เป็นของโรงงานผู้สมัครขอรับการรับรอง หรือ • อยู่ภายใต้การควบคุมอย่างสมบูรณ์ของโรงงานผู้สมัครขอรับการรับรองโดยมีข้อตกลงที่ถูกต้องตามกฎหมาย หรือ • ตั้งอยู่ภายในบริเวณของโรงงานหลัก หรือตั้งอยู่ในระยะเดินทางไม่เกิน 90 นาทีจากโรงงานหลัก และรวมอยู่ในขอบเขตของการตรวจประเมิน SPS ประจำปี","หมายเหตุ: โรงเรือนปอกหรือตัดหัวกุ้ง หรือหน่วยแปรรูปขั้นต้น (Pre-processing Units) หมายถึง การดำเนินงานตามฤดูกาลแบบ “สถานประกอบการบริวาร (Satellite)” ที่เป็นอิสระ ไม่ว่าจะเป็นบุคคลที่หนึ่ง ที่สอง หรือที่สาม ซึ่งดำเนินการปอกหรือตัดหัวกุ้ง โดยมักเป็นการดำเนินการชั่วคราวในช่วงฤดูเก็บเกี่ยวสูงสุด โดยอาจมีหรือไม่มีการอนุมัติอย่างเป็นทางการจากหน่วยงานราชการและการควบคุมด้านกฎหมาย ความปลอดภัยอาหาร สิ่งแวดล้อม และกระบวนการทางสังคม หน่วยแปรรูปกุ้งขั้นต้นใด ๆ ที่ถูกใช้ในการจัดซื้อกุ้งแปรรูปขั้นต้นโดยโรงงานที่ได้รับการรับรอง SPS หรือโรงงานผู้สมัครขอรับการรับรอง จะต้องได้รับการตรวจประเมินโดยวิธีใดวิธีหนึ่ง…"],["core","BAP · Core หมวด 2","2.8.1","","โรงงานต้องมีระเบียบปฏิบัติการควบคุมเอกสารที่เป็นลายลักษณ์อักษร ซึ่งรับรองว่าเอกสารและระเบียบปฏิบัติทั้งหมดที่จำเป็นต่อการปฏิบัติตามข้อกำหนดของ Seafood Processing Standard (มาตรฐานการแปรรูปสัตว์น้ำ) ในขอบเขตทั้งหมด รวมถึงโมดูลต่าง ๆ ได้รับการนำไปปฏิบัติและควบคุมอย่างเหมาะสม","ระเบียบปฏิบัติการควบคุมเอกสารต้องระบุวิธีการควบคุมฉบับแก้ไข (version) ผู้มีอำนาจในการแก้ไขและอนุมัติเอกสาร และมาตรการเพื่อป้องกันการใช้เอกสารฉบับที่ล้าสมัยหรือถูกยกเลิกแล้ว ระเบียบปฏิบัติการควบคุมเอกสารที่เป็นลายลักษณ์อักษรต้องมีอยู่ในคู่มือคุณภาพ (Quality Manual) หรืออ้างอิงไว้ในคู่มือคุณภาพ ฝ่ายบริหารต้องแต่งตั้งบุคคลหรือกลุ่มบุคคลที่รับผิดชอบในการจัดการควบคุมเอกสาร ระเบียบปฏิบัติการควบคุมเอกสารดังกล่าวต้องครอบคลุมการควบคุมนโยบาย คู่มือ บันทึก และข้อมูลทั้งหมดที่มีความสำคัญต่อการจัดการด้านความปลอดภัยของผลิตภัณฑ์ ความปลอดภัยด้านสิ่งแวดล้อม ความถูกต้องตามกฎหมาย และคุณภาพ"],["core","BAP · Core หมวด 2","2.9.1","","โรงงานต้องจัดทำและนำไปปฏิบัติซึ่งวิธีปฏิบัติงานมาตรฐาน (Standard Operating Procedures) ระเบียบปฏิบัติด้านคุณภาพ ระเบียบปฏิบัติการจัดการความปลอดภัยด้านอาหาร ระเบียบปฏิบัติด้านความรับผิดชอบต่อสังคม ระเบียบปฏิบัติด้านสวัสดิภาพสัตว์ และคำแนะนำในการทำงาน (work instructions) สำหรับกระบวนการและการปฏิบัติงานทั้งหมดที่มีผลต่อความปลอดภัยของผลิตภัณฑ์ ความถูกต้องตามกฎหมาย และคุณภาพ","ต้องมีการจัดทำระเบียบปฏิบัติเป็นลายลักษณ์อักษรและนำไปปฏิบัติ เพื่อให้มั่นใจว่าโรงงานสามารถควบคุมการปฏิบัติงานประจำวันและการผลิตอาหารที่ปลอดภัยและมีคุณภาพสม่ำเสมอ ระเบียบปฏิบัติโดยละเอียดที่เป็นลายลักษณ์อักษรต้องมีพร้อมใช้งานภายในโรงงาน และอย่างน้อยต้องครอบคลุมกระบวนการและการปฏิบัติงานที่มีผลต่อความปลอดภัยของผลิตภัณฑ์ ความถูกต้องตามกฎหมาย และคุณภาพ ตัวอย่างเช่น คำแนะนำในการทำงานสำหรับการแปรรูปและการบรรจุ การตั้งค่ากระบวนการของเครื่องจักร การทำความสะอาดและการสุขาภิบาล ระเบียบปฏิบัติ GMP ระเบียบปฏิบัติด้านความปลอดภัยเช่นการล็อกและติดป้ายเตือน (lock out tag out) และระเบียบปฏิบัติการสุ่มตัวอย่างผล…"],["core","BAP · Core หมวด 2","2.10.1","","โรงงานต้องจัดเก็บบันทึกที่แสดงถึงการปฏิบัติตามข้อกำหนดของ SPS ในขอบเขตทั้งหมดและโมดูลที่เกี่ยวข้อง บันทึกต่าง ๆ รวมถึงบันทึกอิเล็กทรอนิกส์ ต้องมีความสมบูรณ์ จัดเก็บอย่างปลอดภัย และพร้อมให้ใช้งานตามความจำเป็นสำหรับพนักงานและผู้ตรวจประเมิน","บันทึกต้องพร้อมให้ผู้ตรวจประเมินตรวจสอบได้ในเวลาที่เหมาะสมระหว่างการตรวจประเมิน การควบคุมบันทึกต้องแสดงให้เห็นได้โดยการแต่งตั้งบุคคลหรือกลุ่มบุคคลที่มีอำนาจในการเข้าถึงและดูแลรักษาบันทึก"],["core","BAP · Core หมวด 2","2.10.2","","บันทึกต้องถูกจัดเก็บไว้ตามระยะเวลาที่จำเป็นเพื่อให้เป็นไปตามข้อกำหนดของลูกค้า ข้อกำหนดด้านกฎระเบียบ และข้อกำหนดทางกฎหมาย โดยอย่างน้อยต้องเก็บไว้เป็นระยะเวลาเท่ากับอายุการเก็บรักษา (shelf life) ของผลิตภัณฑ์บวกอีกหนึ่งปี และหากเป็นการแปรรูป Low Acid Canned Foods (LACF) ต้องเก็บเพิ่มอีกสองปี บันทึกต้องจัดเก็บไว้ในที่ที่สามารถเข้าถึงได้","ข้อกำหนดนี้ระบุระยะเวลาขั้นต่ำในการจัดเก็บบันทึก อย่างไรก็ตาม กฎหมายและข้อกำหนดของโรงงานอาจกำหนดให้มีระยะเวลาการจัดเก็บที่นานกว่านี้"],["core","BAP · Core หมวด 2","2.10.3","","บันทึกการเฝ้าติดตามและการปฏิบัติการแก้ไขทั้งหมดต้องได้รับการทบทวนโดยผู้ที่มีคุณสมบัติเหมาะสม ซึ่งเป็นบุคคลอื่นที่ไม่ใช่ผู้จัดทำบันทึกนั้น","เจตนารมณ์ของข้อกำหนดนี้คือเพื่อให้มั่นใจว่าผู้ที่ปฏิบัติงานและบันทึกกิจกรรมการเฝ้าติดตามที่เกี่ยวข้องกับความปลอดภัยของอาหารและเอกสารการปฏิบัติการแก้ไข ไม่ใช่บุคคลเดียวกันกับผู้ที่ตรวจสอบยืนยันข้อมูลของกิจกรรมนั้น"],["core","BAP · Core หมวด 2","2.10.4","","บันทึกและเอกสารอื่น ๆ ทั้งหมดต้องมีความถูกต้อง และต้องไม่มีหลักฐานหรือข้อบ่งชี้ของการปลอมแปลงหรือการทำให้ผิดเพี้ยนไปจากความเป็นจริง","บันทึกควรมีความชัดเจนอ่านง่าย และบันทึกข้อมูลที่ถูกต้องตามสิ่งที่เฝ้าติดตามหรืออธิบายไว้ในขณะที่เกิดขึ้นจริง ต้องระบุเวลาและวันที่ที่ถูกต้อง การควบคุมบันทึกต้องแสดงให้เห็นได้โดยการแต่งตั้งบุคคลหรือกลุ่มบุคคลที่มีอำนาจในการเข้าถึงและดูแลรักษาบันทึก บันทึกต้องอ่านได้ชัดเจนโดยไม่ใช้น้ำยาลบคำผิด (white out) สำหรับการแก้ไขข้อผิดพลาดหรือเอกสารที่ไม่ถูกต้อง การแก้ไขบันทึกใด ๆ ต้องทำโดยการขีดเส้นตรงเรียบร้อยผ่านข้อผิดพลาดนั้น และเขียนข้อมูลที่ถูกต้องไว้ พร้อมทั้งระบุเหตุผลของข้อผิดพลาดและลงชื่อย่อของผู้บันทึกข้อมูลไว้เหนือรายการที่ถูกขีดออก"],["core","BAP · Core หมวด 2","2.10.5","","ในกรณีที่มีโครงการตรวจประเมินหรือตรวจสอบของหน่วยงานรัฐในระดับท้องถิ่น ระดับประเทศ หรือระดับนานาชาติ บันทึกดังกล่าวต้องพร้อมให้ตรวจสอบทบทวนได้","หากโรงงานได้รับการตรวจประเมินหรือตรวจสอบจากหน่วยงานรัฐนับตั้งแต่การตรวจประเมิน SPS ครั้งล่าสุด หรือในระหว่างปีที่ผ่านมา โรงงานต้องจัดเตรียมบันทึกผลการตรวจประเมินดังกล่าวให้แก่ผู้ตรวจประเมินของ CB (Certification Body) ข้อกำหนดนี้ครอบคลุมเฉพาะการตรวจประเมินที่ดำเนินการโดยหน่วยงานรัฐเท่านั้น"],["core","BAP · Core หมวด 2","2.10.6","","บันทึก HACCP ต้องได้รับการทบทวนโดยผู้ที่ผ่านการฝึกอบรมด้าน HACCP","การฝึกอบรมสามารถดำเนินการโดยหน่วยงานภายนอก หรือดำเนินการภายในโดยผู้ที่มีคุณสมบัติเหมาะสม"],["core","BAP · Core หมวด 2","2.11.1","","ในกรณีที่เกิดข้อบกพร่อง (non-conformity) ใด ๆ โรงงานต้องมั่นใจว่ามีการจัดทำและบันทึกระเบียบปฏิบัติสำหรับการจัดทำเอกสารและการปฏิบัติการแก้ไข ระเบียบปฏิบัติดังกล่าวต้องครอบคลุมขอบเขตทั้งหมดของ SPS และโมดูลที่เกี่ยวข้อง และต้องระบุแนวทางในการป้องกันการเกิดซ้ำในอนาคต","การปฏิบัติการแก้ไข (Corrective actions) คือการแก้ไขปัญหาในทันที การสอบสวนหาสาเหตุที่แท้จริง (Root Cause Investigation) คือการค้นหาสาเหตุที่แท้จริงของปัญหา การปฏิบัติการป้องกัน (Preventative action) คือการดำเนินการเพื่อป้องกันสาเหตุที่แท้จริงของปัญหาไม่ให้เกิดขึ้นซ้ำ"],["core","BAP · Core หมวด 2","2.11.2","","ข้อบกพร่องทั้งหมดต้องถูกบันทึกไว้ และต้องมีการสอบสวนหาสาเหตุของปัญหา เพื่อให้มั่นใจว่าบุคลากรของโรงงานได้ดำเนินการตอบสนองและบันทึกไว้เป็นเอกสาร","การสอบสวนหาสาเหตุของปัญหาโดยทั่วไปหมายถึงการค้นหาสาเหตุที่แท้จริง เพื่อให้สามารถดำเนินการตอบสนองที่เหมาะสมในการป้องกันการเกิดปัญหาซ้ำ"],["core","BAP · Core หมวด 2","2.11.3","","ประสิทธิผลของการปฏิบัติการแก้ไขและการปฏิบัติการป้องกันต้องรวมอยู่ในการทบทวนกิจกรรมและระบบต่าง ๆ อย่างสม่ำเสมอ หากไม่สามารถดำเนินการได้ตามระยะเวลาที่กำหนดไว้ ต้องมีการบันทึกเหตุผลของการไม่สามารถดำเนินการได้ตามกำหนดดังกล่าว","เจตนารมณ์ของข้อกำหนดนี้คือเพื่อให้มั่นใจว่าการปฏิบัติการแก้ไขได้รับการทบทวนและรวมอยู่ในระบบการจัดการคุณภาพ (Quality Management System) การทบทวนดังกล่าวต้องพิจารณาว่าการดำเนินการเป็นไปตามระยะเวลาที่กำหนดหรือไม่ และพิจารณาว่าการดำเนินการที่ดำเนินไปแล้วสามารถป้องกันการเกิดซ้ำได้หรือไม่"],["core","BAP · Core หมวด 2","2.12.1","","โรงงานต้องมีระเบียบปฏิบัติที่เป็นเอกสารเพื่อให้มั่นใจว่าผลิตภัณฑ์ใด ๆ ที่ไม่เป็นไปตามข้อกำหนดได้รับการระบุอย่างชัดเจนและถูกควบคุมเพื่อป้องกันการนำไปใช้หรือการส่งมอบโดยไม่ได้ตั้งใจ ทั้งนี้ให้ครอบคลุมผลิตภัณฑ์ทั้งหมดที่ไม่เป็นไปตามข้อกำหนดด้านความปลอดภัยของอาหาร คุณภาพ ความถูกต้องตามกฎหมาย หรือข้อกำหนดของลูกค้า การกำหนดวิธีจัดการผลิตภัณฑ์ที่ไม่เป็นไปตามข้อกำหนด (disposition) ต้องดำเนินการโดยบุคลากรที่ได้รับมอบอำนาจและต้องบันทึกไว้เป็นเอกสาร","ต้องมีระเบียบปฏิบัติที่เป็นลายลักษณ์อักษรสำหรับการควบคุมข้อบกพร่อง (Control of Non Conformity) ที่พร้อมใช้งาน เป็นฉบับล่าสุด และได้รับการอนุมัติ ระเบียบปฏิบัตินี้ควรอยู่ในคู่มือคุณภาพหรืออ้างอิงไว้ในคู่มือ ผลิตภัณฑ์ต้องเป็นไปตามข้อกำหนดที่กำหนดไว้ ไม่ว่าจะเป็นข้อกำหนดด้านความปลอดภัยของอาหาร คุณภาพ ความถูกต้องตามกฎหมาย หรือข้อกำหนดของลูกค้า ข้อกำหนดดังกล่าวจะระบุไว้ในข้อกำหนดเฉพาะของผลิตภัณฑ์ (product specification) แผน HACCP หรือพารามิเตอร์การแปรรูป เมื่อเกิดผลิตภัณฑ์ที่ไม่เป็นไปตามข้อกำหนด ต้องมีการระบุอย่างชัดเจนด้วยการติดป้ายและการแยกเก็บ ผลิตภัณฑ์ดังกล่าวต้องถูกควบคุมและแยกกักไว้เพื่อป้อง…"],["core","BAP · Core หมวด 2","2.13.1","","โรงงานต้องมีระเบียบปฏิบัติด้านความต่อเนื่องทางธุรกิจ (business continuity) ที่เป็นเอกสาร ซึ่งอธิบายว่าจะรักษาความปลอดภัยและคุณภาพของผลิตภัณฑ์ไว้ได้อย่างไรในกรณีที่เกิดเหตุการณ์ร้ายแรง","เหตุการณ์ร้ายแรง ได้แก่ อัคคีภัย น้ำท่วม สารเคมีรั่วไหล ไฟฟ้าดับเป็นเวลานาน และปัญหาด้านความมั่นคงของโครงสร้างอาคาร"],["core","BAP · Core หมวด 2","2.13.2","","เหตุการณ์ร้ายแรงที่เกิดขึ้นในโรงงานต้องได้รับการบันทึกไว้เป็นเอกสาร ต้องมีการจัดเก็บบันทึกการจัดการผลิตภัณฑ์และสถานะของผลิตภัณฑ์ทั้งในระหว่างและหลังจากเกิดเหตุการณ์ อย่างน้อยต้องครอบคลุมวิธีการรักษาความสมบูรณ์ของผลิตภัณฑ์ ความปลอดภัยของพนักงาน และการดำเนินงานที่สำคัญของโรงงาน","กำหนดให้ต้องบันทึกเหตุการณ์ร้ายแรง (อัคคีภัย น้ำท่วม สารเคมีรั่วไหล ไฟฟ้าดับ พายุเฮอริเคน แผ่นดินไหว) ไว้เป็นเอกสาร นอกจากนี้ยังกำหนดให้ต้องมีบันทึกวิธีการจัดการด้านความปลอดภัยและคุณภาพของผลิตภัณฑ์ วิธีการรักษาความสมบูรณ์ของผลิตภัณฑ์ ความปลอดภัยของพนักงาน และการดำเนินงานที่สำคัญของโรงงานในกรณีที่เกิดเหตุการณ์ร้ายแรง"],["core","BAP · Core หมวด 2","2.14.1","","ต้องมีแผนการเรียกคืนและถอนผลิตภัณฑ์ (Recall and Withdrawal Plan) เป็นลายลักษณ์อักษร ซึ่งระบุวิธีการระบุ ค้นหา และเรียกคืนหรือถอนผลิตภัณฑ์ที่จัดส่งไปแล้ว ในกรณีที่มีการปฏิเสธหรือไม่เป็นไปตามข้อกำหนดที่เกี่ยวข้องกับความปลอดภัยด้านอาหาร ความถูกต้องตามกฎหมาย หรือคุณภาพ แผนนี้ต้องมั่นใจด้วยว่าผลิตภัณฑ์ที่ไม่เป็นไปตามข้อกำหนดหรือที่ถูกเรียกคืนจะไม่ถูกนำไปปนกับผลิตภัณฑ์ที่เป็นไปตามข้อกำหนด หรือถูกปล่อยออกไปโดยไม่ได้รับอนุญาตอย่างถูกต้อง","การถอนผลิตภัณฑ์ (Product Withdrawal) หมายถึง ผลิตภัณฑ์ที่ไม่เป็นไปตามข้อกำหนดที่ออกจากโรงงานแล้ว แต่ยังไม่ ถึงมือลูกค้าและยังอยู่ในสายโซ่อุปทาน ผลิตภัณฑ์ดังกล่าวสามารถถูกนำออกจากสายโซ่อุปทานได้อย่างปลอดภัยโดยไม่ต้องแจ้งเตือนลูกค้า ส่วนการเรียกคืนผลิตภัณฑ์ (Product Recall) คือกรณีที่ผลิตภัณฑ์ที่ไม่เป็นไปตามข้อกำหนดได้ถึงมือลูกค้าแล้ว และต้องทำการเรียกคืนจากลูกค้า แผนการเรียกคืนต้องมีขั้นตอนสำหรับการระบุและค้นหาผลิตภัณฑ์ที่จะถอนหรือเรียกคืน เมื่อมีการเรียกคืนแล้ว ขั้นตอนดังกล่าวต้องมีมาตรการป้องกันการปล่อยผลิตภัณฑ์ที่ไม่เหมาะสม หรือการนำผลิตภัณฑ์ที่เรียกคืนไปปนกับผลิตภัณฑ์ที่เป็นไปตามข้อกำหนด"],["core","BAP · Core หมวด 2","2.14.2","","แผนการเรียกคืนต้องระบุรายชื่อบุคลากรทุกคนที่เป็นสมาชิกของทีมเรียกคืน (Recall Team) รวมถึงหมายเลขติดต่อนอกเวลาทำงานของสมาชิกทีมเรียกคืนและหน้าที่ความรับผิดชอบของแต่ละคน แผนดังกล่าวต้องมีรายชื่อหน่วยงานกำกับดูแลภายนอกที่สำคัญทั้งหมดซึ่งต้องได้รับการแจ้งในกรณีที่มีการเรียกคืนผลิตภัณฑ์ โรงงานต้องแจ้งหน่วยรับรอง (Certification Body: CB) และเจ้าของโปรแกรม SPS (GSA) โดยตรงภายใน 24 ชั่วโมง หลังจากมีการเรียกคืนที่เกี่ยวข้องกับความปลอดภัยด้านอาหาร","ทีมเรียกคืนอาจถูกเรียกให้ปฏิบัติงานตอบสนองต่อการเรียกคืนหรือถอนผลิตภัณฑ์ได้ทุกเมื่อ ดังนั้น รายชื่อทีมเรียกคืนจึงต้องมีข้อมูลการติดต่อของสมาชิกแต่ละคน และยังมีข้อกำหนดให้ต้องติดต่อหน่วยรับรอง (CB) และเจ้าของมาตรฐานภายใน 24 ชั่วโมง"],["core","BAP · Core หมวด 2","2.14.3","","แผนการเรียกคืนและถอนผลิตภัณฑ์ต้องได้รับการทดสอบอย่างน้อยปีละครั้งด้วยการทดสอบ “การเรียกคืนจำลอง” (Mock Recall) ผลการทดสอบที่บันทึกไว้ต้องระบุอย่างน้อย ได้แก่ เหตุการณ์ “จำลอง” การระบุผลิตภัณฑ์ทั้งหมดที่ได้รับผลกระทบและสถานที่ที่จัดส่งไป วิธีการแจ้งลูกค้าที่ได้รับผลิตภัณฑ์ (หรือที่จะได้รับการแจ้ง) และร้อยละของผลิตภัณฑ์ที่สามารถระบุได้สำเร็จว่า “ถูกเรียกคืน/ถอนออก” ต้องมีการบันทึกระยะเวลาที่ใช้ในการทดสอบจำลองดังกล่าวด้วย","แผนการเรียกคืนของโรงงานต้องได้รับการทดสอบ ข้อกำหนดนี้ระบุรายละเอียดขององค์ประกอบที่ต้องรวมอยู่ในการทดสอบ (การเรียกคืนจำลอง) การฝึกซ้อมนี้อาจเป็นการเรียกคืนจริงสำหรับผลิตภัณฑ์ที่จัดส่งไปแล้ว หรือเป็นเหตุการณ์ที่สมมติขึ้น (จำลอง) ซึ่งความปลอดภัยด้านอาหารหรือคุณภาพอาจได้รับผลกระทบจากเหตุการณ์ภายใน เช่น การละเมิดอุณหภูมิระหว่างการขนส่ง การติดฉลากผิดพลาด หรือการปนเปื้อนโลหะ ขั้นตอนการเรียกคืนต้องได้รับการทดสอบอย่างน้อยปีละครั้ง"],["core","BAP · Core หมวด 2","2.14.4","","การทดสอบ “การเรียกคืนจำลอง” ต้องสามารถระบุผลิตภัณฑ์ได้สำเร็จ 100% ต้องมีการบันทึกและดำเนินการแก้ไข (Corrective Action) สำหรับข้อบกพร่องใดๆ ที่พบในระบบการเรียกคืน/ถอนผลิตภัณฑ์จำลอง การแก้ไขดังกล่าวต้องนำไปใช้ในการทบทวนและปรับปรุงแผนการเรียกคืนและถอนผลิตภัณฑ์","เจตนาของข้อกำหนดนี้คือการเปิดเผยข้อบกพร่องในระบบการเรียกคืน/ถอนผลิตภัณฑ์ และดำเนินการแก้ไขหากไม่สามารถระบุผลิตภัณฑ์ได้ครบ 100%"],["core","BAP · Core หมวด 2","2.14.5","","ต้องมีการแต่งตั้งผู้บริหารที่รับผิดชอบในการกำหนดสถานะหรือการจัดการทำลาย/กำจัดผลิตภัณฑ์ที่ถูกเรียกคืนหรือถอนออก",""],["core","BAP · Core หมวด 2","2.15.1","","โรงงานต้องจัดทำและดำเนินการระบบการจัดการข้อร้องเรียนของลูกค้า เพื่อควบคุมและแก้ไขข้อบกพร่องด้านความปลอดภัยด้านอาหาร คุณภาพ ความถูกต้องตามกฎหมาย และความพึงพอใจของลูกค้า","• มาตรฐานกำหนดให้องค์กรต้องจัดทำ ดำเนินการ และรักษาไว้ซึ่งระบบที่มีประสิทธิผลสำหรับการจัดการข้อร้องเรียนและข้อมูลข้อร้องเรียน เพื่อควบคุมและแก้ไขข้อบกพร่องด้านความปลอดภัยด้านอาหาร ต้องมีขั้นตอนการจัดการข้อร้องเรียนของลูกค้าเป็นลายลักษณ์อักษร ซึ่งอาจอยู่ในคู่มือคุณภาพ (Quality Manual) หรืออ้างอิงไว้ในคู่มือดังกล่าว ขั้นตอนนี้ต้องระบุผู้รับผิดชอบที่ได้รับการแต่งตั้งในการจัดการข้อร้องเรียน กระบวนการจัดการข้อร้องเรียน รวมถึงระยะเวลาตอบสนองที่กำหนดไว้ตามลักษณะของข้อร้องเรียน • ข้อร้องเรียนทั้งหมดต้องได้รับการบันทึก ไม่ว่าจะเกี่ยวข้องกับคุณภาพ ความปลอดภัย หรือความถูกต้องตามกฎหมายของผลิตภัณฑ์ ได้แก่…"],["core","BAP · Core หมวด 2","2.15.2","","ข้อร้องเรียนของลูกค้าทั้งหมดต้องได้รับการบันทึกเป็นลายลักษณ์อักษร บันทึกต้องประกอบด้วย ลักษณะของข้อร้องเรียน การสอบสวน ผลิตภัณฑ์ที่ได้รับผลกระทบ การวิเคราะห์หาสาเหตุที่แท้จริง (Root Cause Analysis) การดำเนินการแก้ไขและป้องกัน สถานะของผลิตภัณฑ์ตามความเหมาะสม และการแก้ไขข้อร้องเรียนขั้นสุดท้าย","ข้อกำหนดนี้ระบุองค์ประกอบขั้นต่ำที่ต้องรวมอยู่ในบันทึกข้อร้องเรียนของลูกค้า"],["core","BAP · Core หมวด 3","3.1.1","","แผน HACCP และการวิเคราะห์อันตราย (Hazard Analysis) ต้องครอบคลุมอย่างน้อยอันตรายที่ระบุโดย Codex Alimentarius หรือเอกสารแนวทาง “Fish and Fishery Products Hazards and Controls Guidance” ของ USFDA (หรือที่เรียกว่า “FDA Hazards and Controls Guide”) ฉบับปัจจุบัน หรือองค์ประกอบที่เกี่ยวข้องของกฎ Preventative Controls for Human Foods ภายใต้ Food Safety Modernization Act (FSMA) ในกรณีที่ข้อกำหนดของประเทศแหล่งกำเนิดผลิตภัณฑ์และประเทศผู้นำเข้าแตกต่างกัน ให้ใช้ข้อกำหนดที่เข้มงวดกว่าเป็นหลัก ในกรณีที่ไม่มีกฎหมายหรือแนวทางที่เฉพาะเจาะจงสำหรับประเทศแหล่งกำเนิดหรือประเทศผู้นำเข้าผลิตภัณฑ์ ให้ใช้อันตรายที่กำหนดไว้ใน “FDA Hazards and Controls Guide” ฉบับปัจจุบันเป็นหลัก สำหรับโรงงานที่แปรรูปปลาในอันดับ Siluriformes ให้อ้างอิง USDA Mandatory Inspection of Fish of the Order Siluriform and Products Derived F…","ไม่จำเป็นต้องมีคำอธิบายเพิ่มเติม - ดูรายละเอียดอ้างอิงเกี่ยวกับ Codex Alimentarius และ US FDA Seafood Hazards and Controls Guide ได้ในอภิธานศัพท์ (Glossary)"],["core","BAP · Core หมวด 3","3.1.2","","ขอบเขตของระบบ HACCP ต้องถูกกำหนดตามผลิตภัณฑ์ สายการผลิต และ/หรือสถานที่ผลิตแต่ละแห่ง โดยต้องรวมถึงแผนภูมิกระบวนการผลิต (Process Flow Diagram) ที่ผ่านการตรวจสอบยืนยันแล้ว รวมถึงกระบวนการที่ว่าจ้างหน่วยงานภายนอกดำเนินการ คำอธิบายผลิตภัณฑ์และรูปแบบการนำเสนอผลิตภัณฑ์ วัตถุประสงค์การใช้งาน และวิธีการจัดจำหน่าย ความถูกต้องของแผนภูมิกระบวนการผลิตต้องได้รับการตรวจสอบยืนยันโดยสมาชิกทุกคนของทีม HACCP อย่างน้อยปีละครั้ง","ต้องมีแผนภูมิของขั้นตอนกระบวนการทั้งหมดสำหรับผลิตภัณฑ์แต่ละชนิดที่อยู่ในขอบเขตการตรวจประเมิน รวมถึงปัจจัยนำเข้าทั้งหมด (ส่วนผสม สารช่วยในกระบวนการผลิต บรรจุภัณฑ์ น้ำ น้ำแข็ง) และผลผลิตออก (ของเสียจากกระบวนการผลิต ของเสียจากบรรจุภัณฑ์) การไหลของผลิตภัณฑ์ตลอดกระบวนการต้องเป็นไปตามลำดับของกระบวนการ ซึ่งครอบคลุมทุกขั้นตอนของกระบวนการตั้งแต่ต้นจนจบ • คำอธิบายผลิตภัณฑ์ต้องมีความเฉพาะเจาะจงเพียงพอที่จะระบุประเด็นความปลอดภัยด้านอาหารที่อาจส่งผลกระทบต่อผลิตภัณฑ์ในแต่ละขั้นตอน ต้องกำหนดรูปแบบการนำเสนอผลิตภัณฑ์ วัตถุประสงค์การใช้งาน และวิธีการจัดจำหน่ายด้วย"],["core","BAP · Core หมวด 3","3.1.3","","จุดควบคุมวิกฤต (Critical Control Points: CCPs) ทั้งหมดต้องได้รับการระบุอย่างถูกต้อง และต้องปฏิบัติตามขั้นตอนอย่างเคร่งครัดเพื่อควบคุมหรือป้องกันอันตราย","สำหรับอันตรายที่ถูกระบุไว้เพื่อป้องกันหรือลดระดับอันตรายให้อยู่ในระดับที่ยอมรับได้ ต้องมีการควบคุมในขั้นตอนดังกล่าว ต้องมีบันทึกที่แสดงให้เห็นว่า CCP ถูกกำหนดขึ้นอย่างไร (การวิเคราะห์อันตราย แผนภูมิกระบวนการผลิต ต้นไม้การตัดสินใจ (Decision Tree)) หมายเหตุ: บางครั้งโรงงานอาจกำหนดให้บางขั้นตอนของกระบวนการเป็น CCP ทั้งที่ไม่จำเป็นต้องกำหนดเป็น CCP อย่างเคร่งครัด กรณีนี้ไม่ถือเป็นข้อไม่สอดคล้อง (Non-conformity) ตราบใดที่มีการกำหนดค่าจำกัดวิกฤต (Critical Limits) ไว้อย่างชัดเจน และขั้นตอนดังกล่าวปฏิบัติตามการควบคุมและการจัดทำเอกสารที่กำหนดไว้สำหรับสถานะ CCP"],["core","BAP · Core หมวด 3","3.1.4","","แผน HACCP และการวิเคราะห์อันตรายต้องรวมถึงรายการสารก่อภูมิแพ้ (Allergens) ทั้งหมดที่มีอยู่ในโรงงาน รวมถึงชนิดพันธุ์สัตว์น้ำต่างๆ ที่มีการดำเนินการ โดยแต่ละชนิดพันธุ์ต้องระบุด้วยชื่อทางวิทยาศาสตร์ สารก่อภูมิแพ้ทั้งหมดต้องได้รับการควบคุมอย่างมีประสิทธิผลตลอดการดำเนินงานทั้งหมดของโรงงาน รวมถึงการรับเข้า การจัดเก็บ การจัดการ และการใช้งาน","สารก่อภูมิแพ้ (Allergen) เป็นอันตรายที่อาจเกิดขึ้นได้ในกระบวนการแปรรูปสัตว์น้ำ รายการสารก่อภูมิแพ้ที่มีอยู่ในโรงงาน และต้องได้รับการควบคุมอย่างมีประสิทธิภาพ ต้องครอบคลุมชนิดของสัตว์น้ำ ส่วนประกอบที่เป็นสารก่อภูมิแพ้ สารช่วยในกระบวนการผลิต (processing aids) และสารก่อภูมิแพ้ใดๆ ที่อยู่ในเครื่องจำหน่ายสินค้าอัตโนมัติ (vending machine) ภายในโรงงาน ต้องมีการอธิบายวิธีการควบคุมสารก่อภูมิแพ้ภายในโรงงานตลอดกระบวนการรับวัตถุดิบ การจัดเก็บ การจัดการ และการใช้งาน นอกจากนี้ต้องตระหนักด้วยว่าสารก่อภูมิแพ้อาจถูกนำเข้ามาในโรงงานโดยพนักงาน การระบุรายการสารก่อภูมิแพ้ทั้งหมดที่พนักงานอาจนำเข้ามาในโรงงานอาจไม่ส…"],["core","BAP · Core หมวด 3","3.1.5","","โรงงานต้องแสดงให้เห็นว่าได้มีการติดป้ายแสดงการมีอยู่ของสารก่อภูมิแพ้ในผลิตภัณฑ์สำเร็จรูป","การติดป้ายแสดงสารก่อภูมิแพ้ต้องได้รับการยอมรับว่าเป็นอันตรายที่รวมอยู่ในแผน HACCP ทั้งนี้อาจอยู่ในรูปแบบของจุดควบคุมวิกฤต (Critical Control Point) หรือวิธีการอื่น เช่น วิธีปฏิบัติงานมาตรฐาน (SOP) สำหรับการยืนยันว่าการติดป้ายแสดงสารก่อภูมิแพ้ถูกต้องและได้รับการตรวจสอบแล้ว"],["core","BAP · Core หมวด 3","3.1.6","","ค่าจำกัดวิกฤต (Critical Limit) ที่กำหนดไว้ในแต่ละ CCP ต้องอ้างอิงจากกระบวนการที่ผ่านการทวนสอบความถูกต้อง (validated) มาตรฐานอุตสาหกรรม หรือแนวทางทางวิทยาศาสตร์และข้อกำหนดทางกฎหมาย","CCP ทุกจุดต้องมีการกำหนดค่าจำกัดวิกฤตไว้อย่างชัดเจน ค่าจำกัดดังกล่าวต้องสามารถวัดได้อย่างเป็นภาวะวิสัย (objectively measurable) เท่าที่จะเป็นไปได้ หากการควบคุมของ CCP อาศัยการพิจารณาจากลักษณะที่มองเห็นได้ (visual appearance) ต้องมีภาพถ่ายแสดงค่าจำกัดที่ยอมรับได้และยอมรับไม่ได้ประกอบไว้เป็นส่วนหนึ่งของ CCP นั้นด้วย และต้องมีเอกสารแสดงวิธีการกำหนด CCP ดังกล่าวให้พร้อมสำหรับการตรวจสอบ"],["core","BAP · Core หมวด 3","3.1.7","","ต้องมีวิธีปฏิบัติในการเฝ้าติดตาม (Monitoring) เพื่อควบคุมอันตรายในแต่ละ CCP และต้องบันทึกไว้ในแผน HACCP โดยวิธีปฏิบัติดังกล่าวต้องระบุความถี่ในการเฝ้าติดตาม วิธีการ ผู้รับผิดชอบ และบันทึกที่เกี่ยวข้อง","วิธีปฏิบัติในการเฝ้าติดตามเป็นปัจจัยสำคัญในการพิจารณาว่า CCP อยู่ภายใต้การควบคุมหรือไม่ โดยทั่วไปวิธีปฏิบัติในการเฝ้าติดตามจะถูกบันทึกไว้ในแบบฟอร์มแผน HACCP ข้อกำหนดนี้ระบุองค์ประกอบที่ควรรวมอยู่ในวิธีปฏิบัติการเฝ้าติดตามไว้อย่างเฉพาะเจาะจง • ควรกำหนดความถี่ในการเฝ้าติดตามให้สามารถตรวจพบความผันแปรของค่าจำกัดของ CCP ได้ และสามารถดำเนินการแก้ไขได้ทันเวลาก่อนที่ผลิตภัณฑ์จะถูกปล่อยออกเพื่อจำหน่ายหรือแปรรูปต่อไป • องค์ประกอบเรื่อง \"สิ่งที่ต้องตรวจดู (what to look for)\" ต้องรวมอยู่ในวิธีปฏิบัติการเฝ้าติดตามด้วย"],["core","BAP · Core หมวด 3","3.1.8","","โรงงานต้องระบุไว้ในแผน HACCP ถึงมาตรการแก้ไข (Corrective Action) ที่ต้องดำเนินการทุกครั้งที่ค่าจำกัดวิกฤตของ CCP ใดๆ ไม่เป็นไปตามที่กำหนด มาตรการแก้ไขที่ดำเนินการต้องมีการบันทึกไว้เป็นเอกสาร และต้องครอบคลุมการจัดการผลิตภัณฑ์ (Product Disposition) รวมถึงการวิเคราะห์สาเหตุที่แท้จริง (Root Cause) และการป้องกันการเกิดซ้ำในอนาคต","• ผู้สมัครต้องมั่นใจว่าเมื่อค่าวิกฤตของอันตรายที่ระบุไว้เกินกำหนด จะมีการดำเนินมาตรการแก้ไข โดยมาตรการแก้ไขดังกล่าวต้องมีการระบุ ดำเนินการ และเฝ้าติดตามในฐานะส่วนหนึ่งของแผน HACCP ข้อกำหนดนี้ระบุองค์ประกอบที่ต้องพิจารณาในมาตรการแก้ไข และยังกำหนดให้ต้องรวมการป้องกันการเกิดซ้ำในอนาคตไว้ด้วย• ต้องมีการลงนามอนุมัติโดยผู้มีอำนาจสำหรับมาตรการแก้ไขทุกครั้ง"],["core","BAP · Core หมวด 3","3.1.9","","ต้องมีเครื่องตรวจจับโลหะ (Metal Detector) หรือเครื่องเอกซเรย์ (X-ray) ที่ทำงานได้อย่างถูกต้อง เพื่อใช้ตรวจสอบผลิตภัณฑ์สำเร็จรูปทั้งหมด เว้นแต่โรงงานสามารถแสดงให้เห็นได้ผ่านการวิเคราะห์อันตราย (Hazard Analysis) ในแผน HACCP ว่าไม่มีความเป็นไปได้อย่างสมเหตุสมผลที่เศษโลหะจะปนเปื้อนเข้าไปในอาหาร","ผู้สมัครต้องมั่นใจว่าผลิตภัณฑ์สำเร็จรูปทั้งหมดผ่านเครื่องตรวจจับโลหะที่ทำงานได้อย่างถูกต้อง เว้นแต่สามารถแสดงให้เห็นได้ผ่านการวิเคราะห์ความเสี่ยงว่ามีการใช้วิธีการอื่นเพื่อป้องกันการปนเปื้อนของโลหะ หากมีการใช้เครื่องตรวจจับโลหะ ต้องมีวิธีปฏิบัติที่เป็นเอกสารสำหรับการบริหารจัดการเครื่อง รวมถึงความถี่ในการทวนสอบ (Verification) และมาตรการที่ต้องดำเนินการเมื่อผลิตภัณฑ์ไม่ผ่านเกณฑ์ หรือการทวนสอบไม่ผ่าน “การตรวจจับโลหะในผลิตภัณฑ์สำเร็จรูปที่ไม่แช่แข็งและ/หรือแช่เย็นด้วยน้ำแข็ง อาจดำเนินการตามมาตรการอื่นตามที่ระบุไว้ใน FDA Hazards Guide บทที่ 20” เครื่องเอกซเรย์อาจเป็นทางเลือกที่ยอมรับได้แทนเครื่องต…"],["core","BAP · Core หมวด 3","3.1.10","","โรงงานต้องรวมอันตรายที่อาจเกิดขึ้นจากสารปนเปื้อนในสิ่งแวดล้อม ณ ฟาร์มหรือแหล่งจับสัตว์น้ำที่เป็นแหล่งวัตถุดิบไว้ในการวิเคราะห์อันตราย ทั้งนี้รวมถึงสารเคมี สารกำจัดศัตรูพืช หรือโลหะหนัก ที่อาจมีแหล่งกำเนิดจากการดำเนินกิจกรรมทางอุตสาหกรรมหรือการเกษตรบริเวณใกล้เคียงกับฟาร์มหรือแหล่งจับสัตว์น้ำนั้น","ผู้สมัครต้องพิจารณาอันตรายที่อาจเกิดขึ้นซึ่งมีแหล่งกำเนิดจากแหล่งจับสัตว์น้ำ... มีแหล่งที่มาของสารปนเปื้อนซึ่งเกิดขึ้นในระดับแหล่งจับสัตว์น้ำหรือระหว่างการขนส่งมายังโรงงานแปรรูป ซึ่งต้องได้รับการควบคุมเพื่อให้มั่นใจว่าผลิตภัณฑ์ไม่ปนเปื้อนหรือมีการปลอมปน ตัวอย่างอาจรวมถึง: • กิจกรรมทางการเกษตรในปัจจุบันหรือในอดีตบริเวณใกล้เคียงหรือ ณ แหล่งจับสัตว์น้ำ ซึ่งอาจส่งผลให้ดินปนเปื้อน หรือมีการชะล้างของสารกำจัดศัตรูพืช สารกำจัดแมลง หรือสารเคมีอื่นๆ ลงสู่ดินหรือแหล่งน้ำที่เป็นต้นน้ำ"],["core","BAP · Core หมวด 3","3.2.1","","แผน HACCP ต้องรวมการเฝ้าติดตามสารตกค้างจากยาที่ใช้ในการเพาะเลี้ยงสัตว์น้ำที่ไม่ได้รับการรับรอง (unapproved aquaculture drugs) ให้เหมาะสมกับชนิดสัตว์น้ำ โรงงานต้องกำหนดแผนการสุ่มตัวอย่างโดยอ้างอิงจากการประเมินความเสี่ยง ข้อตกลงกับผู้ส่งมอบ และการวิเคราะห์ข้อมูลในอดีต โรงงานต้องมีโปรแกรมการทวนสอบที่มีการจัดทำเอกสารอย่างครบถ้วน ครอบคลุมยาทุกชนิดตามสารตกค้างทางเคมีที่ห้ามใช้ตาม SPS (อ้างอิง Annex 1 – Seafood Processing Standard 6.0 Finished Product Testing Operational Guidance ตารางที่ 3)","ข้อกำหนดนี้กำหนดให้ต้องมีการทดสอบวัตถุดิบที่นำเข้ามาเพื่อตรวจหาสารตกค้างจากยาที่ใช้ในการเพาะเลี้ยงสัตว์น้ำให้เหมาะสมกับชนิดสัตว์น้ำ การทดสอบอาจดำเนินการโดยห้องปฏิบัติการภายในที่มีคุณสมบัติเหมาะสม หรือใช้ห้องปฏิบัติการภายนอก (third-party labs) ที่ปฏิบัติตามหลักการปฏิบัติที่ดีของห้องปฏิบัติการ (Good Laboratory Practices) ห้องปฏิบัติการต้องสามารถแสดงให้เห็นว่ามีการควบคุมระบบบริหารคุณภาพ (Quality System Management Controls) และมีบันทึกการทวนสอบความถูกต้อง (validation) ของผลการทดสอบภายใน ข้อกำหนดพื้นฐานคือต้องเก็บตัวอย่าง 1 ตัวอย่างต่อลอตการรับวัตถุดิบเพื่อนำไปทดสอบ อย่างไรก็ตาม หากโรงงานมีโปรแกรม…"],["core","BAP · Core หมวด 3","3.2.2","","โรงงานต้องรวมการทดสอบยาอื่นๆ ที่ได้รับการรับรอง ไม่ได้รับการรับรอง และ/หรือถูกห้ามใช้ นอกเหนือจากที่ระบุไว้ใน Annex 1 - Seafood Processing Standard 6.0 Finished Product Testing Operational Guidance ตารางที่ 3 ไว้ในแผน HACCP ในกรณีที่กฎหมายของประเทศแหล่งกำเนิดสินค้า หรือกฎหมายของประเทศผู้นำเข้า หรือข้อกำหนดของผู้ซื้อกำหนดให้ต้องปฏิบัติตาม","ประเทศผู้ผลิตและประเทศผู้รับการส่งออก รวมถึงผู้ซื้อ อาจมีข้อกำหนดทางกฎหมายเฉพาะสำหรับการทดสอบที่มากกว่าข้อกำหนดในโมดูลการทดสอบผลิตภัณฑ์สำเร็จรูป ในกรณีนี้ โรงงานต้องรวมยาที่ได้รับการรับรองหรือไม่ได้รับการรับรองดังกล่าวไว้เป็นอันตรายที่อาจเกิดขึ้นซึ่งระบุไว้ในแผน HACCP"],["core","BAP · Core หมวด 3","3.3.1","","ทีม HACCP ต้องจัดประชุมอย่างสม่ำเสมอเพื่อทวนสอบความสอดคล้องของ HACCP และประเมินความจำเป็นในการปรับปรุงแก้ไขแผน ทีมงานต้องประกอบด้วยบุคลากรจากหลายสาขาที่มีคุณสมบัติเหมาะสม และต้องมีการกำหนดหัวหน้าทีมไว้อย่างชัดเจน การทวนสอบดังกล่าวต้องดำเนินการเพื่อประเมินประสิทธิผล และต้องดำเนินการล่วงหน้าก่อนมีการเปลี่ยนแปลงใดๆ ในผลิตภัณฑ์ กระบวนการ หรือส่วนประกอบ ที่อาจส่งผลกระทบต่อความปลอดภัยอาหาร ต้องมีการจัดเก็บบันทึกการประชุมดังกล่าวไว้ ในกรณีที่ไม่มีการเปลี่ยนแปลงใดๆ การประชุมและการประเมินแผนดังกล่าวต้องดำเนินการอย่างน้อยปีละหนึ่งครั้ง","การทบทวนการปฏิบัติตามระบบ HACCP เป็นข้อกำหนดที่ต้องดำเนินการเป็นประจำทุกปี หากไม่มีการเปลี่ยนแปลงผลิตภัณฑ์ กระบวนการผลิต ส่วนผสม หรืออันตรายที่อาจส่งผลกระทบต่อความปลอดภัยอาหาร หากจะมีการเปลี่ยนแปลงเกิดขึ้น ทีมงาน HACCP จะต้องทบทวนการเปลี่ยนแปลงดังกล่าวก่อนที่จะนำไปปฏิบัติ สมาชิกของทีมงาน HACCP ควรเป็นผู้แทนจากฝ่ายงานหลักต่าง ๆ ที่มีผลต่อความปลอดภัยอาหาร จะต้องมีการจัดเก็บบันทึกการประชุม HACCP ทุกครั้ง"],["core","BAP · Core หมวด 3","3.3.2","","การใช้สารเคมีจะต้องได้รับการทบทวนเพื่อให้มั่นใจว่าการใช้งานดังกล่าวเป็นไปตามกฎระเบียบของทั้งประเทศที่ทำการผลิตและประเทศที่จะส่งออกผลิตภัณฑ์ไปจำหน่าย","จะต้องมีการทบทวนสารเคมีที่ใช้ซึ่งอาจสัมผัสกับผลิตภัณฑ์ เพื่อตรวจสอบว่าสารเคมีดังกล่าวเป็นไปตามกฎระเบียบของทั้งประเทศที่ทำการผลิตและประเทศที่จะส่งออกผลิตภัณฑ์ไปจำหน่าย ตัวอย่างสารเคมีบางชนิด ได้แก่ ซัลไฟต์ (Sulphites) คลอรีน (Chlorine) โซเดียมไตรโพลีฟอสเฟต (Sodium Tri Polyphosphate) สารเคมีสำหรับหม้อไอน้ำ (Boiler Chemicals) ไนโตรเจน (Nitrogen) คาร์บอนไดออกไซด์ (Carbon Dioxide) คลอรีนไดออกไซด์ (Chlorine Dioxide) และโอโซน (Ozone)"],["core","BAP · Core หมวด 3","3.4.1","","สถานประกอบการจะต้องมีขั้นตอนการประเมินความล่อแหลมต่อการปลอมปนอาหาร (Food Fraud Vulnerability Assessment) ที่เป็นเอกสาร (VACCP - Vulnerability Assessment Critical Control Points) เพื่อระบุความล่อแหลมที่อาจเกิดขึ้นและจัดลำดับความสำคัญของมาตรการลดความเสี่ยงจากการปลอมปนอาหาร โดย VACCP จะต้องเป็นไปตามรูปแบบของเครื่องมือประเมิน Food Fraud Vulnerability Assessment หรือเครื่องมือที่คล้ายคลึงกันจาก www.ssafe-food.org","การประเมินความล่อแหลมต่อการปลอมปนอาหารที่เป็นเอกสารอาจครอบคลุม ขึ้นอยู่กับผลิตภัณฑ์และกระบวนการผลิต การประเมินระดับความเสี่ยงของการสับเปลี่ยนวัตถุดิบ การติดฉลากผิด การเจือจาง/การผสม การปลอมแปลง การเติมสารเจือปน สินค้าที่ถูกขโมย หรือการแทรกแซง/ปลอมปน จะต้องประเมินทุกจุดในกระบวนการที่มีความเสี่ยงจากความล่อแหลมดังกล่าวอย่างน้อยหนึ่งประการ เมื่อระบุความล่อแหลมได้แล้ว จึงสามารถกำหนดมาตรการลดความเสี่ยง จัดลำดับความสำคัญ และนำไปปฏิบัติได้ รูปแบบของ VACCP สามารถออกแบบให้เหมาะสมกับผลิตภัณฑ์ที่ทำการผลิตได้ การประเมินความล่อแหลมต่อการปลอมปนอาหารที่เป็นเอกสารคือการประเมินความเสี่ยงของแต่ละขั้นตอนในแผนภูม…"],["core","BAP · Core หมวด 3","3.4.2","","แผนป้องกันการปลอมปนอาหารและการประเมินความเสี่ยงจะต้องได้รับการทบทวนทุกครั้งที่มีการพบความล่อแหลมใหม่ แต่ต้องทบทวนอย่างน้อยปีละหนึ่งครั้ง","ผลิตภัณฑ์และสภาวะตลาดของสถานประกอบการแปรรูปอาหารอาจมีการเปลี่ยนแปลงได้ ดังนั้นแผนป้องกันการปลอมปนอาหารและการประเมินความเสี่ยงจะต้องได้รับการทบทวนเป็นประจำทุกปีตามปีปฏิทิน การทบทวนจะต้องมีการบันทึกเป็นเอกสาร และต้องนำการเปลี่ยนแปลงที่จำเป็นไปปฏิบัติ การทบทวนแผนป้องกันการปลอมปนอาหารและการประเมินความเสี่ยงสามารถดำเนินการในครั้งเดียวหรือแบ่งดำเนินการตามช่วงเวลาที่กำหนดไว้ล่วงหน้าตลอดทั้งปีก็ได้"],["core","BAP · Core หมวด 3","3.4.3","","สถานประกอบการจะต้องมีแผนที่เป็นเอกสารซึ่งระบุมาตรการที่องค์กรได้นำไปปฏิบัติเพื่อลดความเสี่ยงด้านสาธารณสุขจากความล่อแหลมต่อการปลอมปนอาหารที่ระบุไว้","ข้อกำหนดนี้กำหนดให้ต้องมีแผนที่เป็นลายลักษณ์อักษรซึ่งอธิบายวิธีการลดความเสี่ยงด้านสาธารณสุขที่เกิดจากความล่อแหลมต่อการปลอมปนอาหาร แผนนี้มุ่งเน้นด้านสาธารณสุขเป็นหลัก ไม่ใช่ผลกระทบทางเศรษฐกิจจากการปลอมปนอาหาร"],["core","BAP · Core หมวด 3","3.4.4","","แผนลดความเสี่ยงจากการปลอมปนอาหารของสถานประกอบการจะต้องได้รับการสนับสนุนจากระบบการจัดการความปลอดภัยอาหาร (Food Safety Management System) ขององค์กร","ระบบความปลอดภัยอาหารของสถานประกอบการจะต้องสอดคล้องกับข้อกำหนดในการลดปัญหาด้านสาธารณสุขที่อาจเกิดขึ้นซึ่งระบุไว้ในแผนลดความเสี่ยงจากการปลอมปนอาหาร นโยบายและขั้นตอนด้านความปลอดภัยอาหารที่มีอยู่หลายรายการสามารถนำมาประยุกต์ใช้ได้โดยตรง หรือปรับปรุงเพื่อนำไปใช้ในการลดผลกระทบด้านสุขภาพจากการปลอมปนอาหารได้"],["core","BAP · Core หมวด 3","3.5.1","","สถานประกอบการจะต้องมีระบบและขั้นตอนการประเมินความเสี่ยงที่เป็นเอกสาร (แผนการป้องกันอาหาร/TACCP - Threat Assessment Critical Control Points) เพื่อระบุและจัดการความเสี่ยงด้านการป้องกันอาหาร (Food Defense) โดยจะต้องมีการจัดทำ นำไปปฏิบัติ และคงไว้เพื่อป้องกัน ลด หรือขจัดความเสี่ยงดังกล่าว และจะต้องรวมอยู่ในระบบการจัดการความปลอดภัยอาหารของสถานประกอบการ แผนการป้องกันอาหารและการประเมินความเสี่ยงจะต้องได้รับการทบทวนอย่างน้อยปีละหนึ่งครั้ง","ความเสี่ยงด้านการป้องกันอาหาร (Food Defense) เกี่ยวข้องกับความปลอดภัยของสถานประกอบการ/การก่อวินาศกรรม ตัวอย่างเช่น การแทรกแซงหรือปลอมปนผลิตภัณฑ์หรือระบบน้ำประปาโดยบุคคลที่ไม่ได้รับอนุญาตเข้าพื้นที่ การเข้าพื้นที่โดยพนักงานที่ไม่พึงพอใจหรือถูกเลิกจ้าง การเข้าถึงพื้นที่จัดเก็บโดยไม่มีการควบคุม หรือการเข้าถึงและการใช้สารพิษในสถานประกอบการในทางที่ผิด ตัวอย่างรายการตรวจสอบการประเมินความเสี่ยงด้านการป้องกันอาหารสามารถดูได้ที่ https://www.fda.gov/media/75085/download, https://www.fsis.usda.gov/sites/default/files/2020-08/Form-5420-5-General-Food-Defense-Plan.pdf และเครื่องมือสร้างแผนการป้องกันอาหารข…"],["core","BAP · Core หมวด 3","3.5.2","","จะต้องระบุบุคลากรที่มีหน้าที่รับผิดชอบในการนำแผนการป้องกันอาหารไปปฏิบัติ (\"ทีมงานป้องกันอาหาร\") ไว้อย่างชัดเจนในเอกสาร สมาชิกของทีมงานป้องกันอาหารจะต้องได้รับการฝึกอบรมและมีความรู้ในด้านนี้ เพื่อให้มั่นใจว่าแผนการป้องกันอาหารได้รับการนำไปปฏิบัติอย่างมีประสิทธิผล และจะต้องมั่นใจว่ามีการประเมินกลยุทธ์ในการลดความเสี่ยงเพื่อตรวจสอบว่าแผนการป้องกันอาหารได้รับการนำไปปฏิบัติอย่างมีประสิทธิผล","จะต้องมีทีมงานป้องกันอาหารซึ่งประกอบด้วยพนักงาน สมาชิกของทีมงานป้องกันอาหารจะต้องสามารถแสดงให้เห็นถึงความรู้ในเรื่องการป้องกันอาหารได้ การฝึกอบรมด้านการป้องกันอาหารเป็นวิธีหนึ่งที่สมาชิกทีมงานสามารถแสดงความรู้ได้ อีกแนวทางหนึ่งคือให้ผู้ตรวจประเมินสัมภาษณ์สมาชิกของทีมงานป้องกันอาหารและประเมินความเข้าใจของพวกเขาเกี่ยวกับความเสี่ยงด้านการป้องกันอาหารและกลยุทธ์ในการลดความเสี่ยงที่ได้ประเมินไว้"],["core","BAP · Core หมวด 3","3.6.1","","สถานประกอบการจะต้องมีโปรแกรม/ระบบควบคุมสัตว์พาหะที่ป้องกันและควบคุมความเสี่ยงจากการแพร่ระบาดของสัตว์พาหะและพื้นที่ที่เป็นแหล่งหลบซ่อนภายในสถานประกอบการและบริเวณโดยรอบ การควบคุมสัตว์พาหะจะต้องดำเนินการโดยบุคคลที่สามที่ได้รับอนุญาต หรือโดยบุคลากรภายในสถานประกอบการที่ได้รับการฝึกอบรมอย่างเหมาะสม สารเคมีที่ใช้ในสถานประกอบการอาหารจะต้องเป็นไปตามมาตรฐานของ US EPA เป็นอย่างน้อย หรือมาตรฐานที่เทียบเท่า","การควบคุม/ป้องกันสัตว์พาหะเป็นส่วนสำคัญของสุขลักษณะของสถานประกอบการและผลิตภัณฑ์ โปรแกรมการป้องกันสัตว์พาหะที่ดียังช่วยป้องกันการปนเปื้อนของสิ่งแปลกปลอมได้อีกด้วย ข้อกำหนดนี้เปิดให้เลือกปฏิบัติได้สองแนวทาง คือ การควบคุมสัตว์พาหะสามารถดำเนินการโดยบุคคลที่สามที่ได้รับอนุญาต หรือโดยบุคลากรภายในสถานประกอบการที่ได้รับการฝึกอบรมอย่างเหมาะสม"],["core","BAP · Core หมวด 3","3.6.2","","เศษขยะ/ของเสีย และอุปกรณ์ที่ถูกทิ้งแล้วจะต้องได้รับการกำจัดหรือจัดเก็บอย่างเหมาะสม เพื่อหลีกเลี่ยงการสร้างพื้นที่ที่เป็นแหล่งหลบซ่อนของสัตว์พาหะ","สถานประกอบการจะต้องมีขั้นตอนการปฏิบัติงานที่แสดงให้เห็นถึงวิธีการจัดการเศษขยะ/ของเสีย เพื่อป้องกันการสร้างพื้นที่ที่เป็นแหล่งหลบซ่อนของสัตว์พาหะ"],["core","BAP · Core หมวด 3","3.6.3","","หน้าต่าง ประตู ผนัง และช่องเปิดอื่น ๆ ที่เชื่อมต่อกับภายนอกสถานประกอบการจะต้องได้รับการปิดผนึก ติดตาข่าย หรือปิดคลุมเพื่อป้องกันสัตว์พาหะ และจะต้องมั่นใจว่ามีการดำเนินการตามขั้นตอนที่เหมาะสมทั้งหมดเพื่อป้องกันการเข้ามาของสัตว์พาหะ ผ่านการออกแบบอาคารที่มีประสิทธิภาพ การบำรุงรักษา ขั้นตอนการปฏิบัติงาน และการฝึกอบรมพนักงาน","ตรวจสอบโดยการสังเกต"],["core","BAP · Core หมวด 3","3.6.4","","กับดักสัตว์พาหะทั้งหมดจะต้องถูกวางในตำแหน่งที่ไม่ก่อให้เกิดการปนเปื้อนต่อพื้นที่แปรรูปอาหาร ห้ามวางกับดักเหยื่อพิษไว้ภายในพื้นที่ผลิตอาหาร","ตรวจสอบโดยการสังเกต"],["core","BAP · Core หมวด 3","3.6.5","","สถานประกอบการจะต้องมีโปรแกรมการตรวจสอบกับดักสัตว์พาหะ ซึ่งประกอบด้วยแผนผังแสดงตำแหน่งกับดัก การทำความสะอาดอย่างสม่ำเสมอ และบันทึกสัตว์พาหะที่จับได้ เพื่อให้สามารถวิเคราะห์แนวโน้มได้เป็นประจำทุกปี กับดักสัตว์พาหะทั้งหมดจะต้องสามารถใช้งานได้อย่างสมบูรณ์","จะต้องมีโปรแกรมการจัดการควบคุมสัตว์พาหะ (Pest Control Management) เพื่อควบคุมกิจกรรมของสัตว์พาหะภายในและรอบสถานประกอบการ โปรแกรมนี้อย่างน้อยจะต้องมี แผนผังปัจจุบันแสดงตำแหน่งและประเภทของกับดัก การตรวจสอบและทำความสะอาดอุปกรณ์อย่างสม่ำเสมอ บันทึกสัตว์พาหะที่จับได้หรือกิจกรรมของสัตว์พาหะ"],["core","BAP · Core หมวด 3","3.6.6","","พื้นที่แปรรูปและพื้นที่จัดเก็บหลักภายในสถานประกอบการจะต้องไม่พบหลักฐานของสัตว์พาหะหรือกิจกรรมของสัตว์พาหะ","ตรวจสอบโดยการสังเกต"],["core","BAP · Core หมวด 3","3.7.1","","บริเวณโดยรอบและพื้นที่ภายนอกของสถานประกอบการจะต้องได้รับการดูแลรักษาเพื่อป้องกันอันตรายต่อความปลอดภัยของพนักงาน อันตรายต่อสิ่งแวดล้อม และความเสี่ยงจากการเป็นแหล่งหลบซ่อนของสัตว์พาหะ","พื้นที่ภายนอกต้องอยู่ในสภาพเรียบร้อยและดี เพื่อป้องกันการเจริญเติบโตของพุ่มไม้/หญ้าที่มากเกินไปซึ่งอาจก่อให้เกิดที่หลบซ่อนของสัตว์พาหะ (pest harborage) พืชพรรณรอบบริเวณโรงงานควรมีระยะห่างที่ชัดเจนระหว่างพืชพรรณกับผนังภายนอกของโรงงาน เพื่อให้สามารถตรวจสอบได้และลดโอกาสการเป็นที่หลบซ่อนของสัตว์พาหะ ระบบระบายน้ำต้องสามารถรองรับปริมาณน้ำฝน/หิมะตามปกติได้ เพื่อป้องกันน้ำท่วมภายในโรงงานหรือก่อให้เกิดอันตรายต่อพนักงาน เช่น การลื่นและหกล้ม"],["core","BAP · Core หมวด 3","3.7.2","","พื้นที่และอุปกรณ์ที่สัมผัสกับอาหารทั้งหมดต้องสร้างจากวัสดุที่ใช้กับอาหารได้ (food grade) และต้องได้รับการออกแบบ ติดตั้ง สร้าง และใช้งานในลักษณะที่ป้องกันการปนเปื้อนของผลิตภัณฑ์","วัสดุที่ใช้สำหรับอุปกรณ์ การซ่อมบำรุง และการก่อสร้าง ต้องทำจากวัสดุที่ใช้กับอาหารได้ (food grade) และต้องระบุสารก่อภูมิแพ้ (allergen) ที่ทราบแล้ว เพื่อป้องกันการปนเปื้อนของผลิตภัณฑ์ สารหล่อลื่นที่ใช้กับอุปกรณ์ที่สัมผัสอาหารต้องเป็นชนิดที่ใช้กับอาหารได้ (food grade) และต้องมีการติดป้ายระบุไว้อย่างชัดเจน อุปกรณ์ต้องได้รับการออกแบบ ติดตั้ง สร้าง ใช้งาน และจัดเก็บในลักษณะที่ป้องกันความเสี่ยงต่อการปนเปื้อนของผลิตภัณฑ์"],["core","BAP · Core หมวด 3","3.7.3","","ห้องสุขาและพื้นที่สุขอนามัยส่วนบุคคลอื่น ๆ ต้องเปิดออกสู่พื้นที่เปลี่ยนผ่าน (transition area) ที่มีการควบคุมสุขลักษณะที่เหมาะสม และต้องไม่เปิดตรงเข้าสู่พื้นที่การผลิตภายในโรงงานโดยตรง","ข้อกำหนดนี้มีวัตถุประสงค์เพื่อป้องกันการปนเปื้อนของผลิตภัณฑ์ที่มีสาเหตุมาจากสิ่งอำนวยความสะดวกของพนักงาน ผู้ขอรับการรับรองต้องมั่นใจโดยผ่านการออกแบบและการก่อสร้างที่มีประสิทธิภาพว่าห้องสุขาและพื้นที่สุขอนามัยส่วนบุคคลเปิดออกสู่พื้นที่เปลี่ยนผ่านที่มีการควบคุมสุขลักษณะที่เหมาะสม และไม่เปิดตรงเข้าสู่พื้นที่การผลิตโดยตรง"],["core","BAP · Core หมวด 3","3.7.4","","พื้นและผนังภายในต้องทำจากวัสดุที่มีผิวเรียบ ไม่ดูดซึมน้ำ (impermeable) ซึ่งสามารถทำความสะอาดและฆ่าเชื้อได้อย่างง่ายดาย","เพื่อให้มั่นใจว่าผนังสามารถทำความสะอาดได้อย่างเหมาะสมและไม่มีการสะสมของความชื้น/การกลั่นตัวของหยดน้ำซึ่งอาจก่อให้เกิดการเจริญเติบโตของเชื้อรา พื้นผิวต้องเรียบเพื่อให้สามารถทำความสะอาดได้อย่างเหมาะสม มุมและรอยต่อต่าง ๆ ควรได้รับการปกป้องด้วยวัสดุที่ไม่ดูดซึมน้ำ เพื่อป้องกันการสะสมของสิ่งสกปรกหรือความชื้น"],["core","BAP · Core หมวด 3","3.7.5","","รอยต่อระหว่างพื้นและผนังต้องได้รับการปิดผนึกและดูแลรักษาอย่างเหมาะสม เพื่อป้องกันการสะสมของเศษของเสียและสารปนเปื้อน","รอยต่อระหว่างผนังและพื้นของโรงงานต้องมีการทำมุมโค้งอย่างเหมาะสม หรือปิดผนึกและดูแลรักษาอย่างเหมาะสม เพื่อป้องกันการสะสมของเศษของเสียและสารปนเปื้อน"],["core","BAP · Core หมวด 3","3.7.6","","พื้นต้องได้รับการออกแบบเพื่อหลีกเลี่ยงการขังของน้ำและการสะสมของเศษของเสียและสารปนเปื้อน","ผ่านการออกแบบที่มีประสิทธิภาพ ผู้ขอรับการรับรองต้องมั่นใจว่าพื้นมีความลาดเอียงเพียงพอไปยังท่อระบายน้ำ เพื่อให้น้ำไหลระบายได้สะดวกโดยไม่มีน้ำขังและการสะสมของเศษของเสีย ท่อระบายน้ำควรมีความสามารถในการรองรับปริมาณน้ำสูงสุดได้อย่างเพียงพอ น้ำที่ขังอยู่บนพื้นอาจก่อให้เกิดสภาวะ “การกระเซ็น” (splash-up) ซึ่งอาจสัมผัสกับผลิตภัณฑ์หรือวัสดุบรรจุภัณฑ์ได้ หมายเหตุ: ในบางกรณี การระบายน้ำบนพื้นอาจใช้วิธีให้พนักงานดันน้ำไปยังท่อระบายน้ำ ซึ่งสามารถยอมรับได้หากมีประสิทธิภาพและมีการจัดทำวิธีปฏิบัติงาน (SOP) ที่กำหนดความถี่และวัตถุประสงค์ของกิจกรรมดังกล่าวไว้อย่างชัดเจน"],["core","BAP · Core หมวด 3","3.7.7","","โรงงานต้องมีการจัดลำดับการผลิต (production flow) ที่รักษาการแยกระหว่างผลิตภัณฑ์สำเร็จรูปและผลิตภัณฑ์ที่ยังไม่สำเร็จรูป เพื่อป้องกันการปนเปื้อนข้าม (cross contamination)","การไหลของกระบวนการผลิตภัณฑ์และการเคลื่อนย้ายบุคคลต้องได้รับการออกแบบและนำไปปฏิบัติใช้ เพื่อป้องกันการปนเปื้อนทางจุลชีววิทยา เคมี หรือทางกายภาพต่อผลิตภัณฑ์ ควรมีการดำเนินกระบวนการที่ผ่านการทวนสอบความถูกต้อง (validated) เพื่อยืนยันว่าระยะห่างระหว่างพื้นที่ที่มีการดำเนินการกับผลิตภัณฑ์ที่ยังไม่สำเร็จรูป (วัตถุดิบ งานระหว่างกระบวนการ) บรรจุภัณฑ์ ผลิตภัณฑ์ที่นำมาแก้ไขใหม่ (rework) และผลิตภัณฑ์สำเร็จรูป สามารถลดโอกาสการปนเปื้อนให้น้อยที่สุด"],["core","BAP · Core หมวด 3","3.8.1","","ต้องมีการจัดทำโปรแกรมการซ่อมบำรุงที่ครอบคลุม รวมถึงการบำรุงรักษาเชิงป้องกัน (preventative maintenance) และจัดทำเป็นเอกสาร โปรแกรมนี้ต้องครอบคลุมผนัง พื้น และอุปกรณ์ทุกรายการ รวมถึงพื้นผิวสัมผัสอาหารอื่น ๆ ที่มีความสำคัญต่อคุณภาพและความปลอดภัยของผลิตภัณฑ์ โปรแกรมนี้ต้องประกอบด้วยอย่างน้อยดังนี้: • รายการแยกตามรายการของสิ่งของและพื้นที่ที่ต้องได้รับการบำรุงรักษา • แผนการบำรุงรักษาเชิงป้องกัน • บันทึกการตรวจสอบและการบำรุงรักษาที่ดำเนินการ","ต้องมีการดำเนินโปรแกรมการซ่อมบำรุงที่มีประสิทธิภาพ เพื่อป้องกันการปนเปื้อนต่อผลิตภัณฑ์ และป้องกันการเสียหายของอุปกรณ์ที่ไม่จำเป็นในระหว่างการผลิตซึ่งอาจส่งผลกระทบต่อความปลอดภัยของอาหาร โปรแกรมที่มีประสิทธิภาพควรประกอบด้วยการตรวจสอบอุปกรณ์ตามแผนที่กำหนด โปรแกรมการบำรุงรักษาเชิงป้องกัน และวิธีปฏิบัติที่ระบุวิธีการและช่วงเวลาในการซ่อมแซม รวมถึงในระหว่างการดำเนินการผลิต"],["core","BAP · Core หมวด 3","3.8.2","","ไฟส่องสว่างเหนือศีรษะทั้งหมดในพื้นที่ผลิตอาหารและพื้นที่จัดเก็บหลัก ต้องมีฝาครอบป้องกันหรือทำจากวัสดุที่ป้องกันการแตกกระจาย เพื่อป้องกันการปนเปื้อนของเศษแก้วในผลิตภัณฑ์จากหลอดไฟที่แตก","การแตกของหลอดไฟส่องสว่างเหนือศีรษะอาจก่อให้เกิดการปนเปื้อนในพื้นที่การผลิตหรือพื้นที่จัดเก็บเป็นบริเวณกว้าง ต้องมีวิธีการเพื่อยืนยันว่าไฟส่องสว่างเหนือศีรษะเป็นชนิดป้องกันการแตกกระจายหรือมีฝาครอบป้องกัน การทวนสอบนี้โดยปกติทำโดยการสังเกตการณ์ แต่สามารถรวมถึงการตรวจสอบเอกสารการจัดซื้อหรือเอกสารการบำรุงรักษาได้ด้วย"],["core","BAP · Core หมวด 3","3.8.3","","โรงงานต้องจัดให้มีแสงสว่างที่เหมาะสมกับการใช้งานในพื้นที่การผลิตและพื้นที่ตรวจสอบผลิตภัณฑ์","แสงสว่างต้องมีความเพียงพอสำหรับพนักงานในการปฏิบัติหน้าที่ที่จำเป็นในพื้นที่ตรวจสอบ พื้นที่ผลิต และพื้นที่จัดเก็บ แสงสว่างที่เพียงพอต้องช่วยให้พนักงานสามารถตรวจติดตามคุณภาพและข้อบกพร่องได้ ช่วยให้มีสภาพแวดล้อมการทำงานที่ปลอดภัย และช่วยให้สามารถทำความสะอาดและฆ่าเชื้อพื้นที่ผลิตและพื้นที่จัดเก็บทั้งหมดได้อย่างเหมาะสม"],["core","BAP · Core หมวด 3","3.8.4","","เพดานของพื้นที่ผลิตอาหาร บรรจุภัณฑ์อาหาร พื้นที่จัดเก็บวัตถุดิบและสารเคมี ต้องได้รับการดูแลรักษา และต้องไม่มีร่องรอยของการรั่วซึม เชื้อรา สนิม หรือสีลอกหลุดร่อน","เพื่อปกป้องผลิตภัณฑ์และวัสดุบรรจุภัณฑ์จากการปนเปื้อนที่อาจเกิดขึ้น และป้องกันการเจริญเติบโตของเชื้อราและปัญหาสัตว์พาหะ หลังคาและเพดานภายในพื้นที่ผลิตอาหาร พื้นที่จัดเก็บอาหาร พื้นที่จัดเก็บสารเคมี พื้นที่จัดเก็บวัตถุดิบ และพื้นที่จัดเก็บบรรจุภัณฑ์ ต้องอยู่ในสภาพดี ไม่มีการรั่วซึม การหยดของหยดน้ำจากการกลั่นตัว สนิมหรือสีที่ลอกหลุดร่อน"],["core","BAP · Core หมวด 3","3.8.5","","พื้นผิวพื้นทั้งหมดในพื้นที่ผลิตอาหารและพื้นที่จัดเก็บหลักต้องอยู่ในสภาพดี และไม่มีรอยแตกหรือรอยขุดร่องที่มีนัยสำคัญ ในกรณีที่พื้นเกิดความเสียหาย การซ่อมแซมต้องอยู่ในแผนการบำรุงรักษาเชิงป้องกัน โดยระยะเวลาที่อนุญาตให้ซ่อมแซมต้องพิจารณาจากระดับความเสี่ยง","พื้นและท่อระบายน้ำในพื้นที่ผลิตอาหารและพื้นที่จัดเก็บหลักต้องได้รับการดูแลรักษาให้อยู่ในสภาพที่ไม่ก่อให้เกิดความเสี่ยงต่อความปลอดภัยของอาหารหรือความปลอดภัยของบุคคล หากพื้นหรือท่อระบายน้ำเกิดความเสียหายอย่างมีนัยสำคัญ บันทึกการบำรุงรักษาควรระบุถึงความพยายามในการแก้ไขจุดที่เป็นปัญหา และมีการวางแผนการซ่อมแซมในอนาคตไว้ในแผนการบำรุงรักษา พื้นที่ที่มีความเสี่ยงซึ่งอาจก่อให้เกิดอันตรายต่อความปลอดภัยของอาหารหรือบุคคล ต้องได้รับการจัดลำดับความสำคัญในการซ่อมแซมก่อน"],["core","BAP · Core หมวด 3","3.9.1","","พื้นผิวการทำงานที่สัมผัสกับผลิตภัณฑ์อาหาร (โต๊ะ อุปกรณ์ เครื่องมือ ถุงมือและเสื้อผ้าของพนักงาน) ต้องอยู่ในสภาพดี และได้รับการทำความสะอาดและฆ่าเชื้อก่อนใช้งาน รวมถึงผนังในพื้นที่ผลิตและพื้นที่จัดเก็บอาหารซึ่งต้องรักษาให้สะอาดอยู่เสมอ","ผู้ขอรับการรับรองต้องมีโปรแกรมที่ทำให้พื้นผิวสัมผัสอาหารทั้งหมดปราศจากสนิม รอยแตก การกัดกร่อน หรือความเสียหายอื่น ๆ รวมถึงปราศจากรอยเชื่อมที่แตกหักหรือไม่สมบูรณ์ การทำความสะอาดและการฆ่าเชื้อต้องดำเนินการตามที่กำหนดไว้ในวิธีปฏิบัติงานด้านสุขาภิบาลมาตรฐาน (SSOP) โดยใช้สารเคมีที่ได้รับการอนุมัติ ทั้งนี้ครอบคลุมถึงอุปกรณ์ โต๊ะ เครื่องมือ ถุงมือ และเสื้อผ้าป้องกัน ผนังควรปราศจากเศษอาหารและเชื้อราตั้งแต่เพดานจนถึงพื้น"],["core","BAP · Core หมวด 3","3.9.2","","โรงงานต้องจัดทำวิธีปฏิบัติงานด้านสุขาภิบาลมาตรฐาน (Standard Sanitation Operating Procedure: SSOP) เป็นลายลักษณ์อักษร ซึ่งระบุความถี่ในการทำความสะอาด และกำหนดผู้รับผิดชอบในการปฏิบัติงานและการทวนสอบ","ผู้สมัครขอการรับรองต้องจัดทำ SSOP (มาตรฐานการปฏิบัติงานด้านสุขาภิบาล) เป็นลายลักษณ์อักษร ซึ่งมีคำแนะนำโดยละเอียดสำหรับการทำความสะอาดและการฆ่าเชื้อ โดยอาจรวมถึงแผนภาพหรือภาพถ่ายเพื่อประกอบคำอธิบายขั้นตอนการปฏิบัติงาน การใช้สารเคมี ระยะเวลาสัมผัส (contact time) การจัดการสารเคมีอย่างปลอดภัย และ PPE (อุปกรณ์ป้องกันส่วนบุคคล) ที่จำเป็น การฝึกอบรมเรื่อง SSOP ต้องดำเนินการโดยผู้ที่มีความรู้ด้านการจัดการสารเคมี SSOP ต้องได้รับการทวนสอบความถูกต้อง (validate) ด้วยการตรวจด้วยแผ่นสวอบ ATP และการตรวจสอบด้วยสายตา การทดสอบด้วยแผ่นสวอบ ATP ต้องดำเนินการเพื่อยืนยันประสิทธิผลของโปรแกรมการทำความสะอาด ผลการทดสอบ…"],["core","BAP · Core หมวด 3","3.9.3","","การทวนสอบด้านสุขาภิบาลต้องรวมถึงโปรแกรมการตรวจติดตามสภาพแวดล้อม (environmental monitoring) ที่ใช้แนวทางบนพื้นฐานความเสี่ยง เพื่อประเมินประสิทธิผลของกิจกรรมการทำความสะอาดและการฆ่าเชื้อ ต้องมีการวิเคราะห์จุลินทรีย์ตามแผนงานและอย่างสม่ำเสมอ (การทดสอบ ATP หรือการทดสอบคราบโปรตีนตกค้าง) ในพื้นที่ที่สัมผัสกับอาหารโดยดำเนินการหลังการทำความสะอาดและก่อนการฆ่าเชื้อทุกครั้งเมื่อสามารถทำได้","โรงงานต้องมีโปรแกรมที่ทำให้มั่นใจว่าความเสี่ยงที่อาจเกิดขึ้นในพื้นที่การผลิตและพื้นที่ผลิตภัณฑ์แบบเปิดได้รับการจัดการ เพื่อป้องกันความเสี่ยงด้านความปลอดภัยของอาหารที่เกิดจากจุลินทรีย์ก่อโรค การทำความสะอาดที่เหมาะสมโดยมุ่งควบคุมและ/หรือลดการปนเปื้อนและการเจริญเติบโตของจุลินทรีย์ก่อโรคในโรงงานแปรรูปมีความสำคัญอย่างยิ่งต่อการผลิตอาหารที่ปลอดภัย โปรแกรมการตรวจติดตามสภาพแวดล้อมที่มีประสิทธิผลต้องให้การทวนสอบว่าขั้นตอนการทำความสะอาดที่ดำเนินการในโรงงานสามารถป้องกันการเจริญเติบโตและ/หรือการปนเปื้อนของสภาพแวดล้อมในการแปรรูปได้ ต้องใช้แนวทางบนพื้นฐานความเสี่ยงในการกำหนดหลักการพื้นฐานของโปรแกรมการตรวจต…"],["core","BAP · Core หมวด 3","3.9.4","","บันทึกผลการวิเคราะห์การทวนสอบสภาพแวดล้อมต้องรวมถึง Listeria spp. (สำหรับท่อระบายน้ำเท่านั้น) และเชื้อบ่งชี้อื่น ๆ ที่เกี่ยวข้องกับกระบวนการผลิต เช่น Enterobacteriaceae หรือการนับจำนวนจุลินทรีย์ทั้งหมด (standard plate count)","โรงงานต้องมีโปรแกรมที่ทำให้มั่นใจว่าความเสี่ยงที่อาจเกิดขึ้นในพื้นที่การผลิตและพื้นที่ผลิตภัณฑ์แบบเปิดได้รับการจัดการ เพื่อป้องกันความเสี่ยงด้านความปลอดภัยของอาหารที่เกิดจากจุลินทรีย์ก่อโรค การทำความสะอาดที่เหมาะสมโดยมุ่งควบคุมและ/หรือลดการปนเปื้อนและการเจริญเติบโตของจุลินทรีย์ก่อโรคในโรงงานแปรรูปมีความสำคัญอย่างยิ่งต่อการผลิตอาหารที่ปลอดภัย โปรแกรมการตรวจติดตามสภาพแวดล้อมที่มีประสิทธิผลต้องให้การทวนสอบว่าขั้นตอนการทำความสะอาดที่ดำเนินการในโรงงานสามารถป้องกันการเจริญเติบโตและ/หรือการปนเปื้อนของสภาพแวดล้อมในการแปรรูปได้ ต้องใช้แนวทางบนพื้นฐานความเสี่ยงในการกำหนดหลักการพื้นฐานของโปรแกรมการตรวจต…"],["core","BAP · Core หมวด 3","3.10.1","","โรงงานต้องมีมาตรฐานและโปรแกรมด้านสุขวิทยาส่วนบุคคล (personal hygiene) เป็นลายลักษณ์อักษรเพื่อป้องกันการปนเปื้อนผลิตภัณฑ์ ซึ่งอย่างน้อยต้องประกอบด้วยองค์ประกอบด้านล่างนี้และองค์ประกอบอื่น ๆ ที่เกี่ยวข้องของมาตรฐานนี้ ตลอดจนมาตรการเพิ่มเติมตามความเหมาะสมบนพื้นฐานความเสี่ยง","เพื่อให้มั่นใจว่าโรงงานมีแผนสุขวิทยาส่วนบุคคลเป็นลายลักษณ์อักษรที่ป้องกันการปนเปื้อนของกระบวนการผลิตและผลิตภัณฑ์ที่มีต้นเหตุมาจากบุคลากรของโรงงาน ผู้รับเหมา หรือผู้มาเยือน โปรแกรมที่ระบุไว้ด้านล่างนี้ไม่ครอบคลุมทั้งหมด การประเมินความเสี่ยงของแต่ละโรงงานอาจต้องมีโปรแกรมเพิ่มเติมเพื่อลดการปนเปื้อนที่อาจเกิดขึ้นตามประเภทผลิตภัณฑ์และลักษณะของโรงงาน"],["core","BAP · Core หมวด 3","3.10.2","","ต้องมีการดำเนินการตามขั้นตอนการตรวจคัดกรองสุขภาพ (medical screening) สำหรับพนักงาน ผู้รับเหมา และผู้มาเยือน","สำหรับการเข้าสู่พื้นที่ผลิต ผู้สมัครขอการรับรองต้องดูแลให้มีการตรวจคัดกรองสุขภาพสำหรับพนักงาน ผู้รับเหมา และผู้มาเยือน การตรวจคัดกรองสุขภาพอาจอยู่ในรูปแบบแบบสอบถามก่อนเข้าทำงาน หรือในกรณีที่กฎหมายกำหนด อาจเป็นการตรวจสุขภาพ สำหรับผู้รับเหมาและผู้มาเยือน การตรวจคัดกรองสุขภาพโดยทั่วไปจะอยู่ในรูปแบบแบบสอบถามสุขภาพซึ่งกรอกก่อนเข้าสู่พื้นที่แปรรูป แบบสอบถามดังกล่าวต้องได้รับการทบทวนและอนุมัติโดยผู้ที่โรงงานกำหนดไว้ ก่อนที่ผู้รับเหมาและผู้มาเยือนจะได้รับอนุญาตให้เข้าสู่โรงงาน"],["core","BAP · Core หมวด 3","3.10.3","","พนักงานทุกคนต้องได้รับการตรวจติดตามสัญญาณของโรคติดต่อที่มองเห็นได้ ทั้งเมื่อมาถึงและระหว่างการทำงานในพื้นที่ผลิตและบรรจุอาหาร พนักงานที่พบว่าป่วยต้องถูกนำออกจากพื้นที่โรงงานและต้องมีการจัดเก็บบันทึกไว้","ความเจ็บป่วยรวมถึงอาการไอ จาม แผล การติดเชื้อที่ผิวหนัง เป็นต้น และความเจ็บป่วยที่เกี่ยวข้องกับบุคลากรซึ่งเกิดจากอาหาร (ท้องร่วง ไข้ ดีซ่าน เป็นต้น) ต้องมีการตรวจติดตามสุขภาพด้วยสายตาของพนักงานในพื้นที่ผลิตและบรรจุอาหาร การตรวจติดตามนี้รวมถึงสัญญาณทางร่างกายทั่วไปของความเจ็บป่วยหรือการติดเชื้อ"],["core","BAP · Core หมวด 3","3.10.4","","โรงงานต้องมีนโยบายกำหนดให้พนักงานรายงานต่อหัวหน้างานทันทีหากได้รับบาดเจ็บหรือเจ็บป่วยระหว่างวันทำงาน","เจตนารมณ์คือเพื่อให้พนักงานเฝ้าสังเกตตนเองและหัวหน้างานได้รับแจ้งอย่างทันเวลาเพื่อดำเนินการหากพนักงานเจ็บป่วยหรือได้รับบาดเจ็บ นโยบายนี้ต้องมีขึ้นเพื่อป้องกันโรคติดต่อหรือความเจ็บป่วยที่เกี่ยวข้องกับอาหารจากการปนเปื้อนผลิตภัณฑ์ในสายการผลิต และเพื่อปกป้องพนักงานคนอื่น ๆ นโยบายนี้ต้องรวมอยู่ในการฝึกอบรมด้านสุขวิทยาส่วนบุคคลของพนักงาน"],["core","BAP · Core หมวด 3","3.10.5","","พนักงานทุกคนในพื้นที่ผลิตและบรรจุอาหารต้องไม่สวมเครื่องประดับและต้องไม่พกสิ่งของในกระเป๋าเสื้อผ้า เว้นแต่ได้รับอนุมัติจากฝ่ายบริหาร สายรัดข้อมือทางการแพทย์ สร้อยคอทางการแพทย์ หรือแหวนแต่งงานอาจสวมได้โดยมีการป้องกันที่เหมาะสมเพื่อป้องกันการปนเปื้อนอาหาร และต้องได้รับอนุมัติจากฝ่ายบริหาร เครื่องประดับดังกล่าวต้องมีพื้นผิวเรียบ ไม่มีอัญมณีหรือส่วนเว้าลึก","วัตถุประสงค์ของข้อกำหนดนี้คือเพื่อป้องกันการปนเปื้อนผลิตภัณฑ์โดยไม่ได้ตั้งใจจากสิ่งของเช่น อัญมณีบนเครื่องประดับ นาฬิกา หรือเล็บปลอมที่อาจหลุดร่วงเข้าไปในพื้นที่ผลิตภัณฑ์ เล็บที่ยาวและเล็บที่ทาสีก็เป็นความเสี่ยงที่จะแตกหักหรือสีเล็บหลุดร่วงเข้าไปในพื้นที่ผลิตภัณฑ์เช่นกัน เครื่องประดับ ได้แก่ ต่างหู เครื่องประดับเจาะหน้า นาฬิกา สายรัดข้อมือ เล็บปลอม ขนตาปลอม"],["core","BAP · Core หมวด 3","3.10.6","","ต้องจัดหาชุดป้องกันให้แก่พนักงานและพนักงานต้องสวมชุดป้องกันสำหรับงานที่ได้รับมอบหมาย","โรงงานควรจัดหา PPE ให้สอดคล้องกับหน้าที่การทำงาน ตัวอย่างเช่น ชุดกันความเย็นสำหรับพนักงานประจำห้องเย็น หน้ากากป้องกันและถุงมือสำหรับงานเชื่อมของฝ่ายซ่อมบำรุงที่ปฏิบัติงานเชื่อม ตาข่ายคลุมผม เสื้อคลุม รองเท้า ถุงมือ ผ้ากันเปื้อน ปลอกแขน และอุปกรณ์ป้องกันตาบนสายการผลิต"],["core","BAP · Core หมวด 3","3.10.7","","พนักงานต้องไม่นำอาหารและเครื่องดื่มเข้าไปในพื้นที่แปรรูป บรรจุ และจัดเก็บ และต้องไม่สูบบุหรี่ เคี้ยวยาเส้น หรือเคี้ยวหมากฝรั่ง ข้อกำหนดนี้ยังรวมถึงบุหรี่ไฟฟ้า สารเสพติดหลอนประสาทหรือสารเสพติดเพื่อการพักผ่อน และยารักษาโรคส่วนบุคคล","นโยบายนี้มีวัตถุประสงค์เพื่อป้องกันการปนเปื้อนและความเสี่ยงด้านความปลอดภัยอาหารที่อาจเกิดขึ้น รวมถึงสารก่อภูมิแพ้ (allergens) ไม่ให้เข้าสู่โรงงาน ผู้สมัครขอรับรองต้องมีนโยบายสุขลักษณะส่วนบุคคล (personal hygiene) ที่มีประสิทธิผลและเป็นลายลักษณ์อักษรที่ใช้งานจริง ซึ่งระบุถึงความรับผิดชอบของพนักงานอย่างชัดเจน รวมถึงข้อกำหนดที่ห้ามนำอาหารและเครื่องดื่มเข้าไปในพื้นที่ผลิต บรรจุ และจัดเก็บ ห้ามเคี้ยวยาเส้นหรือหมากฝรั่ง การสูบบุหรี่ หากได้รับอนุญาต ให้กระทำได้เฉพาะในพื้นที่ที่บริษัทกำหนดไว้เท่านั้น"],["core","BAP · Core หมวด 3","3.10.8","","พนักงานต้องไม่นำสิ่งของส่วนตัวเข้าไปในพื้นที่แปรรูป บรรจุ และจัดเก็บ","เจตนารมณ์ของข้อกำหนดนี้คือเพื่อป้องกันการนำสิ่งของที่ไม่ได้รับอนุญาตมาใช้ในพื้นที่แปรรูป บรรจุ และจัดเก็บ ต้องมีนโยบายสุขลักษณะส่วนบุคคลที่เป็นลายลักษณ์อักษรและใช้งานจริง ซึ่งระบุถึงความรับผิดชอบของพนักงานในการไม่นำสิ่งของส่วนตัวทั้งหมดเข้าไปในพื้นที่ผลิต บรรจุ และจัดเก็บ เพื่อป้องกันการปนเปื้อนของผลิตภัณฑ์"],["core","BAP · Core หมวด 3","3.10.9","","โรงงานต้องมีอ่างล้างเท้า (foot bath) เกล็ดสารต้านเชื้อแบคทีเรีย ระบบโฟม (foamer) หรือระบบพ่นสาร จุดล้างมือ/จุดจุ่มมือ และจุดสุขาภิบาลที่สามารถเข้าถึงได้ทั่วพื้นที่ผลิตอาหาร จุดเหล่านี้ต้องได้รับการดูแลบำรุงรักษาอย่างสม่ำเสมอ และต้องจัดวางในตำ
