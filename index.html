แหน่งที่ไม่สามารถหลีกเลี่ยงได้ง่าย เพื่อส่งเสริมการปฏิบัติตามหลักสุขาภิบาลที่ดี","คำถามที่มักถูกถามคือ จำนวนอ่างล้างเท้า ระบบโฟม หรือจุดล้างมือที่เพียงพอควรเป็นเท่าใด ซึ่งจะแตกต่างกันไปตามขนาดและลักษณะการจัดวางของโรงงาน เจตนารมณ์คือให้มีอ่างล้างเท้าและจุดล้างมือที่ตั้งอยู่ในตำแหน่งที่สะดวก เพื่อส่งเสริมให้พนักงานใช้งาน จำนวนและตำแหน่งของระบบโฟมและอ่างล้างเท้าที่ประตูจะขึ้นอยู่กับประเภทของการสัญจรและระดับความเสี่ยงของพื้นที่ที่เข้าถึง ตัวอย่างเช่น หากมีการใช้รถเข็นหรือรถยกพาเลท (pallet jack) เข้าสู่พื้นที่ที่มีความเสี่ยงสูง ควรมีระบบโฟมที่ประตู จุดล้างมือควรตั้งอยู่ในตำแหน่งที่พนักงานไม่ต้องเดินผ่านพื้นที่ปฏิบัติงานแปรรูปที่กำลังดำเนินการเพื่อไปถึง อ่างล้างเท้าและจุดจุ่มมือ…"],["core","BAP · Core หมวด 3","3.10.10","","โรงงานต้องตรวจติดตามและควบคุมให้พนักงานปฏิบัติตามขั้นตอนด้านสุขาภิบาลตามที่ระบุไว้ในนโยบาย GMP/สุขลักษณะของโรงงาน","เพื่อให้จุดสุขาภิบาลมีประสิทธิผล พนักงานต้องใช้งานอย่างถูกต้องและสม่ำเสมอ ข้อกำหนดนี้กำหนดให้ต้องมีการตรวจติดตามและควบคุมการปฏิบัติตามขั้นตอนด้านสุขลักษณะ"],["core","BAP · Core หมวด 3","3.10.11","","โรงงานต้องจัดให้มีวัสดุสุขาภิบาล (หรือสิ่งอำนวยความสะดวกในการล้าง ตามความเหมาะสมทางวัฒนธรรม) ผ้าเช็ดมือแบบใช้แล้วทิ้งหรืออุปกรณ์ทำให้แห้งอื่น ๆ และสบู่ ในสิ่งอำนวยความสะดวกด้านสุขาภิบาลสำหรับพนักงาน อุปกรณ์เป่าลมทำให้มือแห้งแบบเครื่องกลต้องได้รับการทดสอบตามคำแนะนำของผู้ผลิตหรือการประเมินความเสี่ยงด้านการปนเปื้อนทางจุลชีววิทยา","เพื่อให้จุดสุขาภิบาลมีประสิทธิผล ต้องมีการเติมวัสดุสิ้นเปลืองให้ครบถ้วนตลอดทุกช่วงการผลิต เครื่องเป่าลมทำให้มือแห้งแบบใช้แรงลม (mechanical forced hand air dryer) อาจแพร่กระจายการปนเปื้อนได้หากไม่ได้รับการทำความสะอาดและบำรุงรักษาอย่างเหมาะสม ต้องมีการทดสอบหาสารปนเปื้อนทางจุลชีววิทยาของอุปกรณ์ดังกล่าว ความถี่ในการทดสอบควรพิจารณาจากคำแนะนำของผู้ผลิตหรือจากการประเมินความเสี่ยง หมายเหตุ: ผลการทดสอบเครื่องเป่าลมทำให้มือแห้งโดยทั่วไปจะรายงานเป็นค่า Aerobic Plate Count เกณฑ์ของการทดสอบจะถูกกำหนดผ่านการทดสอบพื้นฐาน (baseline testing) ที่โรงงาน ผลการทดสอบควรแสดงถึงการปรับปรุงอย่างต่อเนื่อง (ค่าที่ลดลง)…"],["core","BAP · Core หมวด 3","3.10.12","","ต้องมีนโยบายที่เป็นลายลักษณ์อักษรเพื่อให้คำแนะนำแก่ผู้รับเหมาและผู้มาเยือนเกี่ยวกับนโยบายด้านสุขาภิบาลและสุขลักษณะของโรงงาน รวมถึงการล้างมือ การควบคุมสิ่งของส่วนตัว และการใช้ชุดป้องกัน (protective clothing) อย่างถูกต้อง โรงงานต้องกำหนดให้บุคคลดังกล่าวปฏิบัติตามนโยบายเหล่านี้","ผู้รับเหมาและผู้มาเยือนต้องได้รับคำแนะนำและปฏิบัติตามนโยบายด้านสุขลักษณะ หากประสงค์จะเข้าไปในพื้นที่แปรรูป บรรจุ หรือจัดเก็บ"],["core","BAP · Core หมวด 3","3.11.1","","น้ำที่ใช้ในพื้นที่ผลิตอาหารต้องได้รับการตรวจสอบพารามิเตอร์ทางจุลชีววิทยาอย่างน้อยทุกหกเดือนโดยห้องปฏิบัติการบุคคลที่สาม (3rd party) ที่ได้รับการรับรอง นอกจากนี้ การทดสอบราย 6 เดือนอย่างน้อยหนึ่งครั้งต้องรวมถึงการทดสอบโลหะหนัก ตามที่ระบุไว้ใน Table 1.0 Water Quality Testing Requirements","น้ำที่ใช้ในพื้นที่ผลิตอาหาร ไม่ว่าจะมาจากแหล่งใดก็ตาม ต้องได้รับการทดสอบพารามิเตอร์ทางจุลชีววิทยาทุกหกเดือน และทดสอบพารามิเตอร์ทางเคมีปีละหนึ่งครั้ง การเก็บตัวอย่างสามารถดำเนินการโดยโรงงานได้ แต่การทดสอบต้องดำเนินการโดยห้องปฏิบัติการบุคคลที่สามที่เป็นอิสระและได้รับการรับรอง การทดสอบต้องดำเนินการโดยห้องปฏิบัติการที่มีความสามารถ โดยใช้วิธีการเก็บตัวอย่างและวิธีทดสอบที่เหมาะสม และการวิเคราะห์ดังกล่าวต้องดำเนินการตามข้อกำหนดที่เกี่ยวข้องของ ISO/IEC 17025 พารามิเตอร์ที่กำหนดให้ทดสอบระบุไว้ใน Water & Ice Testing Table 1 ของมาตรฐาน SPS • ผลการทดสอบน้ำประปาของหน่วยงานท้องถิ่น (municipal water) ไม่สาม…"],["core","BAP · Core หมวด 3","3.11.2","","โรงงานต้องดำเนินการตรวจสอบคุณภาพน้ำเป็นประจำในวันที่มีการผลิต เพื่อตรวจหาระดับสารฆ่าเชื้อคงเหลือ (residual disinfectant) เช่น คลอรีนหรือโอโซน โดยต้องตรวจสอบอย่างน้อยวันละครั้ง และโรงงานต้องทดสอบหาการปนเปื้อนของโคลิฟอร์ม (coliform) เป็นประจำทุกเดือนด้วย","เจตนารมณ์ของข้อกำหนดนี้คือเพื่อให้มั่นใจว่ามีคลอรีนคงเหลือ (residual chlorine) อยู่ในระดับที่เหมาะสมในวันที่มีการผลิต เกณฑ์ตามกฎระเบียบอาจแตกต่างกันไปในแต่ละประเทศ ระดับคลอรีนคงเหลือต้องเป็นไปตามข้อกำหนดของกฎระเบียบท้องถิ่นหรือ 0.2 ppm แล้วแต่ค่าใดเข้มงวดกว่า ต้องมีแผนการปฏิบัติการแก้ไข (corrective action plan) หากระดับต่ำกว่าเกณฑ์ตามกฎระเบียบหรือต่ำกว่า 0.2 ppm (0.2 มก./ล. เป็นเกณฑ์ตามระเบียบของ EPA) ระดับโอโซนกำหนดตามคำแนะนำของผู้ผลิตสำหรับการใช้งานเฉพาะแต่ละกรณี น้ำต้องได้รับการทดสอบหาการปนเปื้อนของโคลิฟอร์ม ไม่ว่าจะมาจากแหล่งใด อย่างน้อยเดือนละครั้ง การทดสอบนี้อาจดำเนินการภายในโรงงานเองหร…"],["core","BAP · Core หมวด 3","3.11.3","","โรงงานต้องป้องกันการปนเปื้อนของน้ำโดยใช้วาล์วป้องกันการไหลย้อนกลับ (backflow pressure valve) และการจัดเก็บสายยางอย่างเหมาะสม","ต้องติดตั้งวาล์วป้องกันการไหลย้อนกลับ (backflow pressure valve) ที่จุดจ่ายน้ำ และตรวจสอบเป็นประจำทุกปี สายยางต้องจัดเก็บโดยยกสูงจากพื้น และไม่สัมผัสกับแหล่งน้ำที่ไม่สามารถบริโภคได้ (non-potable water)"],["core","BAP · Core หมวด 3","3.11.4","","น้ำแข็งที่ใช้กับผลิตภัณฑ์หรือในพื้นที่ผลิตอาหารของโรงงานที่จัดซื้อจากแหล่งภายนอก ต้องได้รับการทดสอบพารามิเตอร์ทางจุลชีววิทยาอย่างน้อยทุกหกเดือนโดยห้องปฏิบัติการบุคคลที่สาม นอกจากนี้ การทดสอบราย 6 เดือนอย่างน้อยหนึ่งครั้งต้องรวมถึงการทดสอบโลหะหนัก ตามที่ระบุไว้ใน Table 1.0 Water Quality Testing Requirements","น้ำแข็งที่จัดซื้อจากผู้จำหน่ายภายนอกซึ่งใช้ในพื้นที่ผลิตอาหาร ไม่ว่าจะมาจากแหล่งใดก็ตาม ต้องได้รับการทดสอบพารามิเตอร์ทางจุลชีววิทยาทุกหกเดือน และการทดสอบราย 6 เดือนอย่างน้อยหนึ่งครั้งต้องรวมถึงการทดสอบโลหะหนัก การเก็บตัวอย่างสามารถดำเนินการโดยโรงงานได้ การทดสอบต้องดำเนินการโดยห้องปฏิบัติการที่มีความสามารถ โดยใช้วิธีการเก็บตัวอย่างและวิธีทดสอบที่เหมาะสม และการวิเคราะห์ดังกล่าวต้องดำเนินการตามข้อกำหนดที่เกี่ยวข้องของ ISO/IEC 17025 พารามิเตอร์ที่กำหนดให้ทดสอบระบุไว้ในตาราง Water & Ice Quality Testing หากมีการจัดซื้อน้ำแข็งเป็นครั้งคราวเพื่อเสริมปริมาณที่จัดหาตามปกติเท่านั้น ต้องมีการทดสอบอย่างน้…"],["core","BAP · Core หมวด 3","3.11.5","","น้ำแข็งที่ผลิตโดยโรงงานต้องได้รับการทดสอบอย่างน้อยทุกหกเดือนโดยห้องปฏิบัติการบุคคลที่สาม เฉพาะพารามิเตอร์ทางจุลชีววิทยาที่ระบุไว้ใน Table 1.0 Water Quality Testing Requirements เท่านั้น","เจตนาของข้อกำหนดนี้คือการนำผลการตรวจสอบคุณภาพน้ำมาใช้ในการกำหนดข้อกำหนดการทดสอบสำหรับน้ำแข็งที่ผลิตจากน้ำนั้น หากน้ำที่ใช้ผลิตน้ำแข็งเป็นไปตามข้อกำหนดด้านการปนเปื้อนทางจุลชีววิทยาและทางเคมีตามที่ระบุไว้ในตารางที่ 1 ซึ่งอยู่ในตารางการทดสอบคุณภาพน้ำและน้ำแข็ง ก็จำเป็นต้องทดสอบน้ำแข็งเฉพาะพารามิเตอร์ทางจุลชีววิทยาเท่านั้น โดยไม่ต้องทดสอบการปนเปื้อนทางเคมี เหตุผลคือ หากน้ำที่ใช้ผลิตน้ำแข็งปราศจากการปนเปื้อนทางเคมี ก็มีความเป็นไปได้น้อยที่น้ำแข็งจะปนเปื้อนทางเคมี อย่างไรก็ตาม การปนเปื้อนทางจุลชีววิทยาของน้ำแข็งอาจเกิดขึ้นได้ในเครื่องผลิตน้ำแข็งหรือภาชนะขนส่งและจัดเก็บน้ำแข็ง น้ำแข็งที่ใช้ในพื้นที่…"],["core","BAP · Core หมวด 3","3.11.6","","น้ำแข็งต้องจัดเก็บในพื้นที่ที่สะอาดถูกสุขลักษณะและได้รับการดูแลบำรุงรักษาอย่างดี ปราศจากหยดน้ำจากการควบแน่น สนิม สิ่งสกปรก และสิ่งปนเปื้อนอื่น ๆ ห้ามนำน้ำแข็งกลับมาใช้ซ้ำ และต้องมีการจัดการเพื่อป้องกันการปนเปื้อนข้ามจากแหล่งใด ๆ รวมถึงอุปกรณ์เครื่องมือ เครื่องแต่งกายของพนักงาน ภาชนะจัดเก็บ และภาชนะขนส่ง","น้ำแข็งต้องได้รับการจัดการเช่นเดียวกับผลิตภัณฑ์อาหารอื่น ๆ ดูแลบำรุงรักษา และจัดเก็บในสภาวะที่ถูกสุขลักษณะ บุคลากรที่เข้าไปในพื้นที่จัดเก็บน้ำแข็งต้องไม่ทำให้น้ำแข็งปนเปื้อนจากรองเท้า รองเท้าและอุปกรณ์ที่ใช้เคลื่อนย้ายน้ำแข็งต้องได้รับการฆ่าเชื้อเพื่อป้องกันการปนเปื้อนข้าม พลั่วตักน้ำแข็งต้องจัดเก็บโดยไม่วางบนพื้น และใช้สำหรับน้ำแข็งเท่านั้น ฝาปิดถังน้ำแข็งต้องจัดเก็บโดยไม่วางบนพื้น และใช้สำหรับน้ำแข็งเท่านั้น"],["core","BAP · Core หมวด 3","3.11.7","","โรงงานต้องดำเนินการตรวจสอบคุณภาพน้ำแข็งเป็นประจำ ไม่ว่าน้ำแข็งจะมาจากแหล่งใดก็ตาม เพื่อตรวจหาโคลิฟอร์ม (Coliform) เป็นประจำทุกเดือน","น้ำแข็งต้องได้รับการทดสอบเพื่อตรวจหาโคลิฟอร์มอย่างน้อยเดือนละครั้ง ไม่ว่าจะใช้น้ำชนิดใดในการผลิตน้ำแข็งก็ตาม การทดสอบนี้อาจดำเนินการภายในโรงงานเองหรือโดยห้องปฏิบัติการภายนอกก็ได้ ผลการทดสอบต้องมีการบันทึกและทบทวน และต้องมีแผนการปฏิบัติการแก้ไขที่ถูกต้องในกรณีที่ตรวจพบโคลิฟอร์มในน้ำแข็ง"],["core","BAP · Core หมวด 3","3.11.8","","โรงงานต้องมีขั้นตอนการปฏิบัติงานเพื่อประกันความปลอดภัยของอากาศ อากาศอัด ไอน้ำ หรือแก๊สอื่น ๆ ที่ใช้สัมผัสโดยตรงกับอาหาร บรรจุภัณฑ์อาหาร หรือส่วนผสมในอาหาร โรงงานต้องเฝ้าติดตามรายการเหล่านี้เพื่อยืนยันว่าไม่ก่อให้เกิดความเสี่ยงต่อการปนเปื้อนต่ออาหารหรือพื้นผิวที่สัมผัสอาหาร","แก๊สหลายชนิดมักถูกใช้ในกระบวนการแปรรูปสัตว์น้ำและสัมผัสกับผลิตภัณฑ์ ข้อกำหนดนี้กำหนดให้ต้องเฝ้าติดตามและทดสอบแก๊สดังกล่าวเมื่อจำเป็น เพื่อให้แน่ใจว่าแก๊สเหล่านั้นไม่ก่อให้เกิดการปนเปื้อนต่อผลิตภัณฑ์ ตัวอย่างได้แก่ ถังละลายน้ำแข็งที่ใช้เครื่องเป่าอากาศ (air bubbler) อากาศอัดสำหรับทำให้ผลิตภัณฑ์แห้ง เครื่องต้มด้วยไอน้ำ อุโมงค์ไนโตรเจนแบบ IQF อากาศอัดที่ใช้เปิดถุงก่อนการบรรจุ แก๊สที่ใช้สำหรับ MAP (การบรรจุภัณฑ์ด้วยการปรับสภาพบรรยากาศ) และการอัดไนโตรเจนกลับเข้าไปในขวดโหล ในกรณีที่แก๊สสัมผัสกับผลิตภัณฑ์ ต้องมีหลักฐานแสดงว่าแก๊สนั้นไม่ก่อให้เกิดการปนเปื้อนต่อผลิตภัณฑ์ แก๊สที่จัดซื้อต้องมีหนังสือรับ…"],["core","BAP · Core หมวด 3","3.11.9","","น้ำที่ไม่สามารถบริโภคได้ (non-potable water) ต้องแยกออกจากแหล่งน้ำที่บริโภคได้ (potable water) ในระหว่างการจัดเก็บ การลำเลียงเพื่อใช้งานในโรงงาน และในระหว่างการใช้งาน ท่อและภาชนะที่ใช้สำหรับน้ำที่ไม่สามารถบริโภคได้ต้องมีการทำเครื่องหมายที่สามารถมองเห็นได้อย่างชัดเจน","เจตนาของข้อกำหนดนี้คือเพื่อป้องกันการปนกันระหว่างน้ำที่บริโภคได้กับน้ำที่ไม่สามารถบริโภคได้ หรือการนำน้ำที่ไม่สามารถบริโภคได้มาใช้ในพื้นที่ผลิตโดยไม่ได้ตั้งใจ"],["core","BAP · Core หมวด 3","3.12.1","","สารเคมีทั้งหมด รวมถึงสารทำความสะอาด สารฆ่าเชื้อ คลอรีน สารเคมีสำหรับหม้อไอน้ำ (boiler) และสารเคมีอื่นใดที่ใช้ในพื้นที่ผลิต ต้องได้รับการอนุมัติให้ใช้ในโรงงานอาหาร และต้องใช้ตามคำแนะนำของผู้ผลิต","โรงงานแปรรูปสัตว์น้ำมีการใช้สารเคมีทำความสะอาดหลายชนิดที่แตกต่างกัน สารเคมีบางชนิดได้รับการอนุมัติให้สัมผัสโดยตรงกับอาหารและพื้นผิวที่สัมผัสอาหาร และบางชนิดมีการสัมผัสกับอาหารหรือพื้นผิวที่สัมผัสอาหารโดยบังเอิญ สิ่งสำคัญคือสารเคมีเหล่านี้ต้องได้รับการอนุมัติอย่างเป็นทางการให้ใช้ในโรงงานอาหาร ส่วนที่สองของข้อกำหนดนี้กำหนดให้ต้องใช้สารเคมีตามคำแนะนำของผู้ผลิต การดำเนินกิจกรรมการทำความสะอาดและการฆ่าเชื้อต้องดำเนินการโดยบุคลากรที่ได้รับการฝึกอบรม"],["core","BAP · Core หมวด 3","3.12.2","","ต้องมีการจัดทำบันทึกการเฝ้าติดตามสารเคมีทั้งหมดตามความถี่ที่ผู้จำหน่ายสารเคมีแนะนำ บันทึกดังกล่าวต้องประกอบด้วยอย่างน้อย ชื่อสารเคมี ระดับความเข้มข้น และผลการทดสอบที่ดำเนินการเพื่อยืนยันความเข้มข้นที่ถูกต้อง","เจตนาของข้อกำหนดนี้คือเพื่อยืนยันว่าสารเคมีถูกใช้ในระดับความเข้มข้นที่มีประสิทธิผล กิจกรรมการยืนยันได้แก่ การไทเทรต (titration) และ/หรือผลการทดสอบด้วยแผ่นทดสอบ (test strip) การทบทวนเอกสารข้อมูลความปลอดภัย (Safety Data Sheets)"],["core","BAP · Core หมวด 3","3.13.1","","ต้องไม่มีหยดน้ำจากการควบแน่นที่มีศักยภาพในการปนเปื้อนผลิตภัณฑ์ วัสดุบรรจุภัณฑ์ ส่วนผสม หรือพื้นผิวที่สัมผัสอาหาร","หยดน้ำจากการควบแน่นที่หยดลงบนผลิตภัณฑ์ ส่วนผสม พื้นผิวที่สัมผัสอาหาร และวัสดุบรรจุภัณฑ์ มีศักยภาพในการปนเปื้อนวัสดุเหล่านี้ การควบแน่นสามารถเกิดขึ้นได้ในหลายบริเวณที่มีความแตกต่างของอุณหภูมิ พื้นที่ปรุงสุกและพื้นที่แช่แข็งเป็นตัวอย่างของบริเวณที่สามารถก่อให้เกิดการควบแน่นได้"],["core","BAP · Core หมวด 3","3.14.1","","ต้องมีขั้นตอนการปฏิบัติงานเพื่อประกันว่าวัตถุดิบ บรรจุภัณฑ์ สารทำความสะอาด สารฆ่าเชื้อ และส่วนผสม ถูกนำมาใช้ตามลำดับการหมุนเวียนคลังสินค้า/สต๊อกที่ถูกต้อง และภายในอายุการเก็บรักษาที่กำหนด (ในกรณีที่เกี่ยวข้อง)","การหมุนเวียนคลังสินค้าเป็นหน้าที่สำคัญที่มีส่วนช่วยให้เกิดการผลิตผลิตภัณฑ์ที่มีคุณภาพสูงและปลอดภัย ระบบสำหรับจัดการการใช้คลังสินค้ามีตั้งแต่ระบบคอมพิวเตอร์ที่มีความซับซ้อนสูง จนถึงขั้นตอนแบบใช้เอกสารกระดาษและการปฏิบัติงานทางกายภาพด้วยมือ ขั้นตอนการจัดการคลังสินค้าอาจรวมถึงหลักการเข้าก่อน-ออกก่อน (first in-first out) และ/หรือหมดอายุก่อน-ออกก่อน (first expiry-first out) สำหรับวัตถุดิบ งานระหว่างผลิต ส่วนผสม บรรจุภัณฑ์ ผลิตภัณฑ์สำเร็จรูป สารทำความสะอาด และสารฆ่าเชื้อ"],["core","BAP · Core หมวด 3","3.14.2","","วัตถุดิบ ผลิตภัณฑ์สำเร็จรูป ส่วนผสม บรรจุภัณฑ์ และรายการอื่น ๆ ที่สัมผัสอาหารซึ่งจัดเก็บในสภาวะอุณหภูมิห้อง แช่แข็ง และ/หรือแช่เย็น ต้องจัดเก็บโดยไม่วางบนพื้น ห่างจากผนัง และมีการปกคลุมเพื่อป้องกันการปนเปื้อน ต้องมีการเว้นระยะห่างระหว่างพาเลท และระยะห่างระหว่างพาเลทในห้องเก็บแช่แข็ง/แช่เย็นเพื่อให้อากาศไหลเวียนได้","เจตนาของข้อกำหนดนี้คือเพื่อป้องกันการปนเปื้อนของผลิตภัณฑ์ และเอื้อให้สามารถทำความสะอาดและตรวจสอบพื้นที่คลังสินค้าได้อย่างเหมาะสม"],["core","BAP · Core หมวด 3","3.14.3","","โรงงานต้องจัดทำบันทึกอุณหภูมิเพื่อการเฝ้าติดตามที่มีประสิทธิผลของพื้นที่จัดเก็บแช่แข็งที่อุณหภูมิ -18 °c หรือต่ำกว่า และห้องเย็นที่อุณหภูมิ 0-5°c สำหรับการจัดเก็บแบบแช่เย็น/ควบคุมความเย็น","การเฝ้าติดตามที่มีประสิทธิผลของห้องแช่แข็งและห้องเย็นโดยทั่วไปหมายถึงการเฝ้าติดตามอุณหภูมิแบบ 'ต่อเนื่อง' โดยใช้เครื่องบันทึกอุณหภูมิแบบอัตโนมัติ อย่างไรก็ตาม โปรแกรมการเฝ้าติดตามรูปแบบอื่นอาจมีประสิทธิผลและเป็นไปตามข้อกำหนดของข้อนี้ได้ ตัวอย่างเช่น การบันทึกอุณหภูมิด้วยมือตามความถี่ที่กำหนด"],["core","BAP · Core หมวด 3","3.14.4","","ยานพาหนะทั้งหมด รวมถึงยานพาหนะที่จ้างเหมาจากภายนอก ซึ่งใช้ในการขนส่งวัตถุดิบ ส่วนผสม บรรจุภัณฑ์ ผลิตภัณฑ์ระหว่างผลิต/ผลิตภัณฑ์กึ่งแปรรูป และผลิตภัณฑ์สำเร็จรูป ต้องมีความเหมาะสมกับวัตถุประสงค์การใช้งาน ได้รับการดูแลบำรุงรักษาให้อยู่ในสภาพดี มีอุณหภูมิที่เหมาะสมในกรณีที่เกี่ยวข้อง และได้รับการทำความสะอาดเพื่อประกันว่าจะไม่เกิดการปนเปื้อนต่อสินค้าที่ขนส่ง การควบคุมอุณหภูมิ ในกรณีที่มีการใช้งาน ต้องได้รับการเฝ้าติดตามอย่างต่อเนื่อง และต้องมีบันทึกไว้เป็นหลักฐาน","พื้นที่จัดเก็บแช่แข็งต้องมีการจัดวางอย่างเป็นระเบียบเพื่อให้อากาศหมุนเวียนได้ดีและสามารถเข้าถึงผลิตภัณฑ์เพื่อทำความสะอาดได้"],["core","BAP · Core หมวด 3","3.14.5","","ต้องมีแผนการตรวจสอบที่เป็นลายลักษณ์อักษรสำหรับสินค้าเข้าและสินค้าออกทั้งหมด ซึ่งครอบคลุมอย่างน้อยรายการที่ระบุไว้ในข้อ 3.14.4 การตรวจสอบดังกล่าวต้องประกันว่าสินค้าและภาชนะขนส่งเป็นไปตามข้อกำหนดด้านความปลอดภัยและคุณภาพ","เจตนารมณ์ของข้อกำหนดนี้คือเพื่อให้มั่นใจว่าวิธีการขนส่งจะไม่ก่อให้เกิดการปนเปื้อนหรือส่งผลกระทบต่อคุณภาพของวัตถุดิบ ส่วนผสม วัสดุบรรจุภัณฑ์ และผลิตภัณฑ์สำเร็จรูป"],["core","BAP · Core หมวด 3","3.15.1","","สถานประกอบการ อุปกรณ์ ขั้นตอนการปฏิบัติงาน และการไหลของกระบวนการผลิต ต้องได้รับการออกแบบ ก่อสร้าง และดูแลรักษา เพื่อป้องกันความเสี่ยงจากการปนเปื้อนหรือการสัมผัสข้ามของสารก่อภูมิแพ้ (allergen cross contact) ต่ออาหาร พื้นผิวที่สัมผัสกับอาหาร และส่วนผสม","เจตนารมณ์ของข้อกำหนดนี้คือเพื่อให้มั่นใจว่าสถานประกอบการนำหลักการด้านความปลอดภัยของอาหารมาใช้เพื่อลดการปนเปื้อนข้าม (cross contamination) ในทุกพื้นที่ของกระบวนการผลิต การผสมผสานองค์ประกอบทั้งหมดของการผลิตทำงานร่วมกันเพื่อให้มั่นใจถึงการผลิตอาหารที่ปลอดภัย"],["core","BAP · Core หมวด 3","3.15.2","","กิจกรรมการทำความสะอาดและการฆ่าเชื้อต้องไม่ดำเนินการในบริเวณที่มีผลิตภัณฑ์ บรรจุภัณฑ์ ส่วนผสม หรืออุปกรณ์ที่เปิดเผยอยู่ใกล้เคียง เพื่อป้องกันการปนเปื้อนข้าม","เป็นเรื่องปกติที่สถานประกอบการแปรรูปจะดำเนินการล้างทำความสะอาด (washdown) พื้นที่การผลิตในช่วงพักของพนักงานหรือช่วงเปลี่ยนผลิตภัณฑ์ ในกรณีดังกล่าว ผลิตภัณฑ์ ส่วนผสม เครื่องมือ และวัสดุบรรจุภัณฑ์ต้องถูกปกคลุมหรือนำออกจากพื้นที่โดยสมบูรณ์ เพื่อป้องกันการปนเปื้อนจากกิจกรรมการล้างทำความสะอาดดังกล่าว"],["core","BAP · Core หมวด 3","3.15.3","","ผลิตภัณฑ์ทั้งหมดที่จัดเก็บในห้องเย็นและ/หรือห้องแช่แข็งต้องจัดเก็บในกล่องกระดาษที่ปิดผนึกเพื่อป้องกัน หรือหากไม่สามารถทำได้ ให้จัดเก็บในระบบการจัดเก็บที่สามารถป้องกันการปนเปื้อนหรือการสูญเสียความชื้น (dehydration) ได้","เจตนารมณ์ของข้อกำหนดนี้คือเพื่อให้มั่นใจถึงความสมบูรณ์ของผลิตภัณฑ์ที่จัดเก็บในตู้แช่แข็งและห้องเย็น"],["core","BAP · Core หมวด 3","3.15.4","","ต้องมีขั้นตอนการปฏิบัติงานที่มีประสิทธิผลเพื่อป้องกันการปนเปื้อนข้ามและการสัมผัสข้ามระหว่างผลิตภัณฑ์ ส่วนผสม อุปกรณ์ และพนักงานที่เป็นสารก่อภูมิแพ้ (allergen) และไม่ใช่สารก่อภูมิแพ้ ตลอดกระบวนการรับ การจัดเก็บ การจัดการ และการใช้งาน นอกจากนี้ต้องมีขั้นตอนการปฏิบัติงานเพื่อป้องกันการปนเปื้อนข้ามระหว่างส่วนผสมหรือผลิตภัณฑ์ที่มีสารก่อภูมิแพ้ต่างชนิดกันด้วย","เจตนารมณ์ของข้อกำหนดนี้คือเพื่อป้องกันการปนเปื้อนข้ามและการสัมผัสข้ามระหว่างสารก่อภูมิแพ้และสิ่งที่ไม่ใช่สารก่อภูมิแพ้ และระหว่างสารก่อภูมิแพ้ต่างชนิดกัน มาตรการควบคุมที่จำเป็นได้แก่ การแยกทางกายภาพ การใช้รหัสสี (color-coding) การติดป้ายระบุ และการแยกเวลาการใช้งาน"],["core","BAP · Core หมวด 3","3.15.5","","ต้องมีโปรแกรมป้องกันวัตถุแปลกปลอม (foreign materials) (หรือชุดของโปรแกรมแยกกัน) ที่ป้องกันการปนเปื้อนจากวัตถุแปลกปลอมทุกรูปแบบ รวมถึงแต่ไม่จำกัดเพียง สีทาบ้าน ไม้ แก้ว พลาสติก โลหะ เส้นผม สนิม เป็นต้น","ต้องมีโปรแกรมป้องกันวัตถุแปลกปลอมที่จัดทำเป็นเอกสาร ซึ่งอาจประกอบด้วยองค์ประกอบดังต่อไปนี้: การตรวจสอบพาเลทไม้ การตรวจสอบแก้วและพลาสติก การตรวจจับโลหะ/เครื่องเอกซเรย์ การตรวจสอบเครื่องจักร สุขลักษณะส่วนบุคคล/GMP โปรแกรมควบคุมสัตว์พาหะ (Pest Control Program) การตรวจสอบวัสดุบรรจุภัณฑ์ การควบคุมสารก่อภูมิแพ้ และการฝึกอบรม"],["core","BAP · Core หมวด 3","3.16.1","","ต้องมีโปรแกรมที่จัดทำเป็นลายลักษณ์อักษรสำหรับการใช้วัตถุเจือปนอาหาร (food additives) หรือสารเคมี เช่น ซัลไฟต์ สารแต่งสี ฟอสเฟต สารผสมฟอสเฟต หรือสารช่วยรักษาความชื้นอื่น ๆ นอกจากนี้สถานประกอบการต้องตรวจสอบยืนยันว่าสารดังกล่าวเป็นเกรดอาหาร (food grade) และใช้งานตามข้อกำหนดทางกฎหมาย ข้อกำหนดของลูกค้า และข้อกำหนดของผู้ผลิต","การใช้วัตถุเจือปนอาหารและสารเคมีต้องมีการบันทึกเป็นเอกสาร และสารเคมีที่ใช้ต้องได้รับการรับรอง/อนุมัติที่เหมาะสม นอกจากนี้ การใช้งานสารเคมีดังกล่าวต้องสอดคล้องกับข้อกำหนดทางกฎหมาย ข้อกำหนดของลูกค้า และข้อกำหนดของผู้ผลิต"],["core","BAP · Core หมวด 3","3.16.2","","สถานประกอบการต้องดำเนินการตรวจวิเคราะห์ทางจุลชีววิทยา (microbiological testing) กับผลิตภัณฑ์สำเร็จรูปแต่ละล็อต ตามที่กำหนดโดยกฎหมายท้องถิ่นและกฎหมายของประเทศผู้นำเข้า และตามข้อกำหนดของลูกค้า","ต้องมีโปรแกรมการตรวจวิเคราะห์ผลิตภัณฑ์สำเร็จรูป หากมีข้อกำหนดจากกฎหมายหรือลูกค้า การตรวจวิเคราะห์ต้องดำเนินการโดยห้องปฏิบัติการที่ได้รับการรับรอง (accredited laboratory) เว้นแต่กฎหมายหรือข้อกำหนดของลูกค้าจะอนุญาตเป็นอย่างอื่น หมายเหตุ: ทั้งผู้แปรรูปขั้นต้น (primary/first processor) และผู้แปรรูปขั้นที่สอง (secondary/value added processor ที่รับผลิตภัณฑ์จากโรงงานขั้นต้น) ต้องปฏิบัติตามข้อกำหนดการตรวจวิเคราะห์นี้"],["core","BAP · Core หมวด 3","3.16.3","","ต้องมีการจัดทำ นำไปปฏิบัติ และดูแลรักษาขั้นตอนการออกแบบและพัฒนาผลิตภัณฑ์ สำหรับผลิตภัณฑ์ใหม่และการเปลี่ยนแปลงผลิตภัณฑ์หรือกระบวนการผลิต เพื่อให้มั่นใจว่าผลิตภัณฑ์ที่ผลิตขึ้นมีความปลอดภัยและถูกต้องตามกฎหมาย","กระบวนการเพื่อให้มั่นใจว่าผลิตภัณฑ์มีความปลอดภัยและถูกต้องตามกฎหมายอาจประกอบด้วย: การตรวจคัดกรองส่วนผสมของผลิตภัณฑ์ใหม่ในด้านสารก่อภูมิแพ้และความเป็นเกรดอาหาร อาจมีการทบทวน HACCP สำหรับผลิตภัณฑ์ใหม่และการเปลี่ยนแปลงที่มีนัยสำคัญต่อผลิตภัณฑ์ที่มีอยู่ กระบวนการผลิตตัวอย่างหรือการผลิตนำร่อง (pilot production) ต้องไม่ก่อให้เกิดอันตรายต่อผลิตภัณฑ์ที่มีอยู่ เครื่องจักรแปรรูปใหม่ต้องได้รับการประเมินด้านคุณลักษณะความปลอดภัยและสุขลักษณะ กิจกรรมการพัฒนาผลิตภัณฑ์ใหม่หรือที่มีการปรับเปลี่ยนต้องมีการบันทึกเป็นเอกสาร การศึกษาอายุการเก็บรักษา (shelf-life studies) อาจดำเนินการให้เสร็จสิ้นเป็นส่วนหนึ่งของกระบ…"],["core","BAP · Core หมวด 4","4.1.1","","สถานประกอบการต้องจัดทำเป็นเอกสารและนำไปปฏิบัติตามขั้นตอนการปล่อยผลิตภัณฑ์ (Product Release Procedures) ที่เหมาะสม ซึ่งระบุกระบวนการและขั้นตอนการตรวจวิเคราะห์ที่ต้องดำเนินการก่อนการปล่อยผลิตภัณฑ์ ขั้นตอนดังกล่าวต้องระบุบุคคลผู้รับผิดชอบที่ได้รับมอบอำนาจให้ปล่อยผลิตภัณฑ์ และต้องรวมถึงข้อกำหนดด้านความปลอดภัยของอาหาร คุณภาพ และกฎหมาย ที่ต้องได้รับการตรวจสอบยืนยันว่าเป็นไปตามข้อกำหนดก่อนปล่อยผลิตภัณฑ์เข้าสู่ตลาด","ต้องมีการนำขั้นตอนการปล่อยผลิตภัณฑ์ที่จัดทำเป็นเอกสารไปปฏิบัติ โดยมีการกำหนดเกณฑ์การปล่อยผลิตภัณฑ์และระบุบุคคลผู้รับผิดชอบในการปล่อยผลิตภัณฑ์ไว้อย่างชัดเจน ขั้นตอนนี้เป็นสิ่งจำเป็นสำหรับการปล่อยผลิตภัณฑ์สำเร็จรูปเพื่อการจัดจำหน่าย"],["core","BAP · Core หมวด 4","4.2.1","","สถานประกอบการต้องมีระบบการตรวจประเมินภายใน (internal audit) ที่กำหนดให้มีการประเมินผลการปฏิบัติงานของสถานประกอบการเทียบกับขอบเขตทั้งหมดของ SPS รวมถึงโมดูล (modules) ที่เกี่ยวข้อง","เพื่อให้เป็นไปตามข้อกำหนด การตรวจประเมินภายในต้องครอบคลุมข้อกำหนดที่เกี่ยวข้องทั้งหมดของมาตรฐานนี้ รวมถึงโมดูล การแก้ไขเพิ่มเติม (amendments) และคำแนะนำ (guidance) ที่เกี่ยวข้องทั้งหมด นอกจากนี้ สถานประกอบการยังต้องตรวจสอบเว็บไซต์ของ GSA เพื่อดูการตีความด้านความสมบูรณ์ของโปรแกรม (program integrity interpretations) ใด ๆ ที่ได้ประกาศออกมาตั้งแต่การตรวจประเมินภายในครั้งก่อน"],["core","BAP · Core หมวด 4","4.2.2","","ผู้ตรวจประเมินภายในของสถานประกอบการต้องได้รับการฝึกอบรมและมีความรู้ความสามารถในการดำเนินการตรวจประเมินภายใน และต้องไม่ตรวจประเมินพื้นที่ปฏิบัติงานของตนเอง","การฝึกอบรมอาจประกอบด้วยรายการใดรายการหนึ่งต่อไปนี้: การผ่านหลักสูตรการตรวจประเมินภายใน การผ่านหลักสูตรฝึกอบรมผู้ตรวจประเมินของ GSA สำหรับหมวดที่ 1 (Seafood Processing Standard) การผ่านหลักสูตรผู้ตรวจประเมินหลัก (lead auditor) หรือการได้รับการรับรองให้ตรวจประเมินมาตรฐานความปลอดภัยของอาหารตาม GFSI ผู้ตรวจประเมินภายในต้องใช้เช็คลิสต์และคู่มือการตีความ (interpretation guide) ฉบับปัจจุบันในการดำเนินการตรวจประเมินภายใน นโยบายการตรวจประเมินภายในต้องระบุห้ามอย่างชัดเจนไม่ให้ผู้ตรวจประเมินภายในตรวจประเมินพื้นที่ใดที่ตนมีอำนาจควบคุม การฝึกอบรมสามารถดำเนินการภายในองค์กร (in house) ได้เฉพาะในกรณีที่ผู้ฝึ…"],["core","BAP · Core หมวด 4","4.2.3","","ต้องมีการจัดเก็บบันทึกการตรวจประเมินภายใน บันทึกต้องสะท้อนผลการตรวจประเมินภายใน รวมถึงความสอดคล้อง (conformity) และความไม่สอดคล้อง (non-conformity) ในกรณีที่พบความไม่สอดคล้อง บันทึกต้องระบุมาตรการแก้ไข (corrective actions) และกำหนดเวลาที่จะดำเนินการให้แล้วเสร็จสำหรับแต่ละรายการ","ผู้ตรวจประเมินภายในต้องให้ความเห็นในทุกข้อกำหนดของมาตรฐานที่เกี่ยวข้อง พร้อมระบุเหตุผล (หลักฐาน) สำหรับความสอดคล้องหรือความไม่สอดคล้อง ข้อกำหนดที่ไม่เกี่ยวข้องต้องระบุว่า 'NA' และระบุเหตุผลว่าเพราะเหตุใดจึงไม่เกี่ยวข้อง ความไม่สอดคล้องต้องมีการบันทึกเป็นเอกสารซึ่งประกอบด้วย: ข้อกำหนดของข้อนั้น สิ่งที่ผิดพลาด และหลักฐานการตรวจประเมิน มาตรการแก้ไขและมาตรการป้องกัน (corrective and preventative actions) ต้องดำเนินการให้แล้วเสร็จภายในกำหนดเวลาที่กำหนดไว้ล่วงหน้า ผลการตรวจประเมินภายในต้องมีการสื่อสารไปยังพนักงานที่เกี่ยวข้อง"],["core","BAP · Core หมวด 4","4.2.4","","ความถี่ของการตรวจประเมินภายในภายในสถานประกอบการและแผนกต่าง ๆ ต้องกำหนดโดยการประเมินความเสี่ยง (risk assessment) และต้องดำเนินการอย่างน้อยปีละ 1 ครั้ง","วัตถุประสงค์ของการตรวจประเมินภายในคือเพื่อตรวจสอบยืนยันความสอดคล้องของสถานประกอบการต่อมาตรฐาน SPS การตรวจประเมินภายในต้องดำเนินการและแล้วเสร็จอย่างน้อย 1 ครั้งต่อรอบการตรวจประเมิน การตรวจประเมินภายในไม่จำเป็นต้องดำเนินการในช่วงเวลาที่เจาะจงเพียงครั้งเดียว สามารถแบ่งการตรวจประเมินภายในออกเป็นรายไตรมาส รายเดือน หรือลำดับเวลาอื่น ๆ ได้ ตราบใดที่ครอบคลุมทุกข้อกำหนดก่อนการตรวจประเมินเพื่อขอต่ออายุการรับรอง (recertification audit) สถานประกอบการใหม่ต้องดำเนินการตรวจประเมินภายในให้แล้วเสร็จก่อนการรับรองครั้งแรก (initial certification) มีการประเมินภายในแยกต่างหากที่สถานประกอบการต้องดำเนินการให้แล้วเสร…"],["core","BAP · Core หมวด 4","4.3.1","","เครื่องมือเฝ้าติดตามกระบวนการ (process-monitoring instruments) ที่มีความสำคัญต่อความปลอดภัยของอาหาร คุณภาพ และความถูกต้องตามกฎหมาย ต้องได้รับการทดสอบความถูกต้องแม่นยำภายในองค์กร","โรงงานมีหน้าที่รับผิดชอบในการสอบเทียบ (ตรวจสอบความถูกต้อง) เครื่องมือในกระบวนการผลิต ความถี่ในการตรวจสอบความถูกต้องต้องกำหนดโดยการประเมินความเสี่ยง เครื่องมือดังกล่าวรวมถึงแต่ไม่จำกัดเพียง เครื่องวัดอุณหภูมิ เครื่องวัดค่าพีเอช (pH meter) โพเทนชิโอมิเตอร์ เครื่องวัดความเค็ม รีแฟรกโตมิเตอร์ เกจวัดความดัน เครื่องตรวจจับโลหะ เครื่องชั่งน้ำหนัก นาฬิกาจับเวลา/ตัวตั้งเวลา เครื่องชั่งตรวจสอบ (check weigher) และอุปกรณ์อื่น ๆ ที่ใช้ตรวจติดตาม CCP"],["core","BAP · Core หมวด 4","4.3.2","","อุปกรณ์วัดและตรวจติดตามต้องมีป้ายติดระบุรหัสเครื่องมือและวันครบกำหนดสอบเทียบ โรงงานต้องจัดทำเอกสารขั้นตอนการตรวจสอบความถูกต้องและกำหนดการที่ระบุอุปกรณ์วัดและตรวจติดตามทั้งหมด กำหนดการดังกล่าวต้องระบุ: • รายการแต่ละรายการที่ต้องตรวจสอบ • วันที่ตรวจสอบความถูกต้อง • ความถี่ตามกำหนดของการตรวจสอบความถูกต้อง • วิธีการหรือมาตรฐานที่เป็นที่ยอมรับซึ่งใช้ในการตรวจสอบความถูกต้อง และ; • ผู้ปฏิบัติการตรวจสอบความถูกต้อง เครื่องมือที่ไม่สามารถปรับให้ตรงกับค่าอ้างอิงที่สอบเทียบได้อย่างถูกต้อง ต้องได้รับการซ่อมแซมหรือเปลี่ยนใหม่ในทันที","ข้อกำหนดนี้กำหนดให้องค์กรระบุอุปกรณ์ที่ใช้วัดค่าพารามิเตอร์ที่มีความสำคัญต่อความปลอดภัยของอาหาร ข้อกำหนดนี้ระบุข้อมูลที่จำเป็นต้องรวมอยู่ในกำหนดการตรวจสอบความถูกต้องที่จัดทำเป็นเอกสาร ข้อกำหนดนี้ครอบคลุมการตรวจสอบความถูกต้องภายในทั้งหมด"],["core","BAP · Core หมวด 4","4.3.3","","โรงงานต้องมั่นใจว่าอุปกรณ์วัดและตรวจติดตามทั้งหมดที่มีความสำคัญต่อความปลอดภัยของอาหารได้รับการสอบเทียบจากภายนอกอย่างน้อยปีละครั้ง หรือตามข้อกำหนดของผู้ผลิต โดยหน่วยงานภายนอกที่มีคุณสมบัติเหมาะสม และสามารถสืบย้อนไปยังมาตรฐานที่เป็นที่ยอมรับในระดับประเทศหรือระดับสากลได้","· มาตรฐานนี้กำหนดให้องค์กรระบุวิธีการที่ทำให้มั่นใจได้ว่าการสอบเทียบอุปกรณ์วัดและตรวจติดตามเหล่านี้สามารถสืบย้อนไปยังมาตรฐานที่เป็นที่ยอมรับ เช่น สถาบันมาตรฐานและเทคโนโลยีแห่งชาติของสหรัฐอเมริกา (National Institute of Standards and Technology: NIST) โรงงานต้องมั่นใจว่าอุปกรณ์วัดและตรวจติดตามทั้งหมดที่มีความสำคัญต่อความปลอดภัยของอาหาร คุณภาพ และความถูกต้องตามกฎหมาย ได้รับการสอบเทียบอย่างน้อยปีละครั้งโดยหน่วยงานภายนอกที่มีคุณสมบัติเหมาะสม เครื่องมือบางชนิดอาจมีการสอบเทียบที่มีอายุใช้งานนานกว่าหนึ่งปี ซึ่งเป็นสิ่งที่ยอมรับได้"],["core","BAP · Core หมวด 4","4.4.1","","โรงงานต้องจัดทำแผนการสุ่มตัวอย่างผลิตภัณฑ์เป็นลายลักษณ์อักษรโดยพิจารณาจากความเสี่ยง ซึ่งระบุรายละเอียดความถี่และประเภทของการทดสอบผลิตภัณฑ์ แผนการสุ่มตัวอย่างนี้ต้องครอบคลุมการทดสอบใด ๆ ที่กำหนดโดยการรับรองที่มีอยู่ในปัจจุบัน ลูกค้า หรือหน่วยงานกำกับดูแล","ข้อกำหนดนี้กำหนดให้มีแผนการสุ่มตัวอย่างสำหรับการทดสอบผลิตภัณฑ์ทั้งหมดตามความเหมาะสม แผนการสุ่มตัวอย่างต้องระบุประเภทของผลิตภัณฑ์ที่ทดสอบ สารที่ทดสอบวิเคราะห์ และความถี่ของการทดสอบ แผนควรครอบคลุม (หากเกี่ยวข้อง) การทดสอบวัตถุดิบ การทดสอบส่วนผสม และผลิตภัณฑ์สำเร็จรูป แผนการสุ่มตัวอย่างนี้ต้องครอบคลุมการทดสอบใด ๆ ที่นอกเหนือจาก GSA (Global Seafood Alliance) ซึ่งกำหนดโดยประเทศผู้ผลิตหรือประเทศที่ส่งออกผลิตภัณฑ์ไปยัง หรือหน่วยงานกำกับดูแลและข้อกำหนดของลูกค้า"],["core","BAP · Core หมวด 4","4.5.1","","โรงงานต้องจัดทำและนำระบบไปปฏิบัติเพื่อให้มั่นใจว่าการทดสอบและวิเคราะห์ผลิตภัณฑ์และส่วนผสมทั้งหมดที่มีความสำคัญต่อความปลอดภัยของอาหารดำเนินการตามมาตรฐาน ISO 17025 หากมีความจำเป็นต้องใช้ห้องปฏิบัติการที่ไม่ได้รับการรับรอง ห้องปฏิบัติการนั้นต้องดำเนินงานตามหลักการของ ISO/IEC17025 รวมถึงเข้าร่วมโปรแกรมทดสอบความชำนาญ (proficiency testing) ที่ได้รับการรับรอง หากมีการทดสอบเชื้อก่อโรคภายในองค์กร ห้องปฏิบัติการต้องแสดงหลักฐานว่าห้องปฏิบัติการดังกล่าวถูกแยกออกจากพื้นที่การผลิตและพื้นที่จัดเก็บอย่างสมบูรณ์","เจตนารมณ์ของข้อกำหนดนี้คือเพื่อให้มั่นใจว่าผลการทดสอบส่วนผสมและสารเคมี รวมถึงการทดสอบอาหารและน้ำ มีความน่าเชื่อถือ ห้องปฏิบัติการต้องดำเนินงานตามหลักการของ ISO/IEC17025 และมีคุณสมบัติและความสามารถในการวิเคราะห์พารามิเตอร์ทางจุลชีววิทยาและทางเคมีสำหรับเมทริกซ์อาหาร หลักการของ ISO/IEC17025 ประกอบด้วยสิ่งต่อไปนี้: • ความสามารถ: ห้องปฏิบัติการมีบุคลากรที่มีทักษะและความรู้ที่จำเป็นหรือไม่ • การใช้ดุลยพินิจตามความรับผิดชอบ • วิธีการทางวิทยาศาสตร์ • ความเที่ยงธรรมของผลลัพธ์ • ความไม่ลำเอียงในการปฏิบัติงาน • ื้นที่จัดเก็บต้องกันน้ำและมีการระบายอากาศที่ดี","สารเคมีที่เป็นอันตราย เช่น สารกำจัดแมลง คลอไรด์ และโซเดียมเมตาไบซัลไฟต์ ต้องจัดเก็บในภาชนะที่กันน้ำ ในห้องที่มีการล็อกและมีการระบายอากาศที่ดี สารเคมีที่เป็นอันตรายต้องมีมาตรการกักเก็บเพื่อควบคุมการรั่วไหล ต้องมีการติดป้ายเตือน สารออกซิแดนต์ต้องจัดเก็บในพื้นที่ที่ปลอดภัยซึ่งจะไม่สัมผัสกับน้ำมันดีเซลหรือน้ำมันอื่น ๆ เพื่อหลีกเลี่ยงการระเบิด"],["core","BAP · Core หมวด 5","5.1.5","","พื้นที่จัดเก็บเชื้อเพลิง น้ำมัน และสารหล่อลื่น ต้องมีพื้นที่กักเก็บสำรอง (secondary containment) เพื่อควบคุมการรั่วไหลที่อาจเกิดขึ้น และต้องมีความจุเท่ากับหรือมากกว่า 110% ของความจุของภาชนะจัดเก็บที่ใช้งานในโรงงาน","จำเป็นต้องมีพื้นที่กักเก็บสำรองสำหรับเชื้อเพลิง น้ำมัน และสารหล่อลื่น เพื่อควบคุมการรั่วไหล ภาชนะกักเก็บต้องไม่มีรอยรั่วและต้องมีความจุ 110% ของภาชนะจัดเก็บเดิม ถังจัดเก็บบางประเภทได้รับการออกแบบให้มีผนังสองชั้นเพื่อการกักเก็บ"],["core","BAP · Core หมวด 5","5.1.6","","พื้นที่จัดเก็บเชื้อเพลิง สารหล่อลื่น สารเคมี และพื้นที่ซ่อมบำรุง ต้องมีการติดป้ายเตือน","ป้ายเตือนต้องติดไว้ในตำแหน่งที่มองเห็นได้ชัดเจนบนประตูหรือบริเวณใกล้เคียงกับพื้นที่จัดเก็บสารเคมี ป้ายที่ใช้โดยทั่วไปอาจรวมถึง “เฉพาะผู้ที่ได้รับอนุญาตเท่านั้น”, “วัตถุไวไฟ”, “ห้ามสูบบุหรี่”, “อันตราย” ป้ายเตือนตามความเหมาะสม (เช่น “เฉพาะผู้ที่ได้รับอนุญาตเท่านั้น”, “วัตถุไวไฟ”, “ห้ามสูบบุหรี่”, “อันตราย”)"],["core","BAP · Core หมวด 5","5.1.7","","โรงงานต้องมีขั้นตอนปฏิบัติเพื่อป้องกันและจัดการการรั่วไหลของสารเคมี อุปกรณ์และวัสดุสำหรับจัดการและทำความสะอาดการรั่วไหลต้องมีพร้อมใช้งาน ชุดอุปกรณ์ทำความสะอาดการรั่วไหล (spill kit) ต้องมีการติดฉลากและตรวจสอบเป็นระยะเกี่ยวกับเนื้อหาภายในและผลิตภัณฑ์ที่หมดอายุ","ต้องมีการจัดทำขั้นตอนปฏิบัติสำหรับจัดการการรั่วไหลหรือการรั่วซึมของน้ำมัน เชื้อเพลิง แก๊ส สารเคมี และผลิตภัณฑ์อื่น ๆ อุปกรณ์และวัสดุที่จำเป็นสำหรับจัดการและทำความสะอาดการรั่วไหลเหล่านี้ต้องมีพร้อมใช้งานและเข้าถึงได้ง่าย"],["core","BAP · Core หมวด 5","5.2.1","","น้ำเสียจากโรงงานต้องได้รับการควบคุมเพื่อหลีกเลี่ยงการปนเปื้อนต่อสิ่งแวดล้อม พื้นที่ผลิตอาหาร พื้นที่พักผ่อนและที่พักอาศัยของพนักงาน และแหล่งน้ำใช้ ต้องมีการบำบัดอย่างเหมาะสมผ่านระบบบำบัดน้ำเสียของเทศบาลหรือของโรงงาน","ผู้สมัครต้องมั่นใจว่ามีระบบบำบัดน้ำเสีย (sewage system) ที่ได้รับการออกแบบและก่อสร้างอย่างเหมาะสม เพื่อให้แน่ใจว่าน้ำเสียถูกควบคุมภายใต้สภาวะที่มีการควบคุม เพื่อป้องกันการปนเปื้อนต่อสิ่งแวดล้อม แหล่งน้ำ และพื้นที่ผลิตอาหาร น้ำเสียต้องได้รับการบำบัดโดยผ่านระบบบำบัดของเทศบาลท้องถิ่น หรือผ่านระบบบำบัดน้ำเสียของผู้สมัครเอง"],["core","BAP · Core หมวด 5","5.2.2","","ขยะมูลฝอย (solid waste) ในพื้นที่ผลิตของโรงงานและบริเวณโรงงานต้องได้รับการจัดเก็บและกำจัดอย่างเหมาะสมตามกฎหมายและระเบียบข้อบังคับของท้องถิ่นและระดับประเทศ ขยะดังกล่าวต้องได้รับการกำจัดเพื่อหลีกเลี่ยง บรรเทา และ/หรือชดเชยผลกระทบเชิงลบต่อชุมชนท้องถิ่น","ขยะมูลฝอยรวมถึงผลพลอยได้จากการแปรรูป (processing by-products) เช่น หัว เปลือก กระดูก เครื่องใน ฯลฯ และวัสดุบรรจุภัณฑ์ที่ใช้แล้ว) • ห้ามทิ้งขยะมูลฝอยในที่ดินว่างเปล่า ขยะดังกล่าวต้องถูกเผา หมักทำปุ๋ย หรือนำไปฝังกลบตามกฎหมายท้องถิ่น ขยะมูลฝอยที่สะสมและวัสดุบรรจุภัณฑ์ที่ใช้แล้วต้องถูกนำออกจากพื้นที่ผลิตอย่างสม่ำเสมอ และขยะประเภทกระดาษและพลาสติกต้องนำไปรีไซเคิลเมื่อสามารถทำได้"],["core","BAP · Core หมวด 5","5.2.2.1","","หากผลพลอยได้จากขยะมูลฝอยจะถูกนำไปใช้เป็นวัตถุดิบสำหรับการผลิตผลิตภัณฑ์จากทะเล (marine ingredient) หรืออาหารสัตว์เลี้ยง (pet food) จะต้องดำเนินการให้เป็นไปตามระเบียบข้อบังคับด้านอาหารสัตว์และ/หรืออาหารสัตว์เลี้ยง","มาตรฐานอาหารสัตว์เลี้ยงกำหนดให้มีการจัดการผลพลอยได้เป็นกรณีพิเศษ โดยทั่วไปผลพลอยได้ที่ใช้ผลิตอาหารสัตว์เลี้ยงต้องได้รับการจัดการภายใต้ GMP และต้องรวมอยู่ในแผนความปลอดภัยด้านอาหาร (food safety plan)"],["core","BAP · Core หมวด 5","5.2.3","","ภาชนะบรรจุสารเคมีและเชื้อเพลิงที่ใช้แล้ว น้ำมันเสีย สารหล่อลื่น สารเคมีที่หมดอายุ และวัสดุเหลือใช้อื่น ๆ ต้องได้รับการกำจัดตามคำแนะนำของผู้ผลิตและระเบียบข้อบังคับด้านสิ่งแวดล้อมของหน่วยงานราชการท้องถิ่น หรือนำไปรีไซเคิล โรงงานต้องจัดเก็บสำเนาระเบียบข้อบังคับของหน่วยงานราชการที่เกี่ยวข้องและเป็นฉบับปัจจุบัน","ผู้สมัครต้องมั่นใจว่าสารหล่อลื่นที่ใช้แล้วได้รับการกำจัดอย่างเหมาะสมตามคำแนะนำบนป้ายกำกับหรือแนวทางของผู้ผลิต และกฎหมายด้านสิ่งแวดล้อมของท้องถิ่น โรงงานที่จ้างผู้รับเหมาให้ดำเนินการขนย้ายน้ำมันเสีย สารหล่อลื่น สารเคมีที่หมดอายุ และวัตถุดิบ ต้องมีเอกสารบันทึกปริมาณที่ถูกขนย้ายออกไป"],["core","BAP · Core หมวด 5","5.2.4","","ในกรณีที่หน่วยงานราชการท้องถิ่นกำหนดให้ต้องมีใบอนุญาตสำหรับกิจกรรมการจัดเก็บและกำจัดขยะ โรงงานต้องมีสำเนาใบอนุญาตของโรงงานเองหรือของผู้ให้บริการที่เป็นฉบับปัจจุบัน","หน่วยงานราชการบางแห่งกำหนดให้บริษัทที่จัดเก็บหรือกำจัดผลิตภัณฑ์เหลือใช้ต้องได้รับใบอนุญาตที่ถูกต้องสำหรับกิจกรรมดังกล่าว"],["core","BAP · Core หมวด 6","6.1.1","","โรงงานต้องดำเนินกระบวนการจัดเก็บบันทึกด้านการสืบย้อนกลับ (traceability) ที่มีการบันทึกข้อมูลอย่างทันเวลา เป็นระบบ และถูกต้องแม่นยำ โดยดำเนินการและควบคุมดูแลโดยบุคลากรที่ได้รับการฝึกอบรมและได้รับมอบหมายให้รับผิดชอบในการเก็บรวบรวมข้อมูล เพื่อให้มั่นใจว่าข้อมูลมีความสมบูรณ์และถูกต้อง และเป็นไปตามข้อกำหนดด้านการสืบย้อนกลับ","การจัดเก็บบันทึกเป็นหัวใจสำคัญของระบบการสืบย้อนกลับ ดังนั้น ระบบการจัดเก็บบันทึกต้องมีความเป็นระบบ ถูกต้อง และสามารถเข้าถึงได้อย่างรวดเร็ว ต้องมีบุคลากรที่ได้รับการฝึกอบรมเพื่อควบคุมดูแลระบบเอกสารและการเก็บรวบรวมข้อมูล"],["core","BAP · Core หมวด 6","6.1.2","","ในกรณีที่ระบบการสืบย้อนกลับของโรงงานใช้ระบบออนไลน์หรือฐานข้อมูลคอมพิวเตอร์ โรงงานต้องจัดเก็บสำเนาเอกสารหรือบันทึกที่ใช้ในการถ่ายโอนข้อมูลเข้าสู่ระบบอิเล็กทรอนิกส์ เพื่อให้สามารถตรวจสอบความถูกต้องของข้อมูลในระบบอิเล็กทรอนิกส์ได้","บันทึกด้านการสืบย้อนกลับและผลการทดสอบการสืบย้อนกลับต้องสามารถส่งต่อได้ ซึ่งหมายความว่าบันทึกและข้อมูลที่เป็นเอกสารกระดาษต้องถูกแปลงเป็นไฟล์อิเล็กทรอนิกส์ในรูปแบบใดรูปแบบหนึ่ง ข้อกำหนดนี้เอื้อให้สามารถทำการทบทวนและตรวจประเมินระบบการสืบย้อนกลับได้จากระยะไกล"],["core","BAP · Core หมวด 6","6.2.1","","โรงงานต้องจัดเก็บและนำเสนอต่อผู้ตรวจประเมินซึ่งบันทึกเป็นเอกสารสำหรับล็อต/แบทช์การผลิตทั้งหมด ที่มีองค์ประกอบข้อมูลสำคัญ (Key Data Elements, KDE) ตามที่เกี่ยวข้องสำหรับแต่ละจุดติดตามที่สำคัญ (Critical Tracking Event, CTE) ทั้งสำหรับสัตว์น้ำจากการเพาะเลี้ยงและสัตว์น้ำจากการจับธรรมชาติ: องค์ประกอบข้อมูลสำคัญ (KDE) ทั่วไปที่กำหนดให้ต้องมีทั้งสำหรับสัตว์น้ำจากการจับธรรมชาติและจากการเพาะเลี้ยง ได้แก่: • คำอธิบายสถานที่ - สถานที่แปรรูปสัตว์น้ำ • หมายเลขล็อต/แบทช์ รหัสล็อตเพื่อการสืบย้อนกลับ (Traceability Lot Code, TLC) • สถานที่จัดเก็บ • การจัดส่ง • การรับสินค้า • หมายเลขระบุการจัดส่งที่ไม่ซ้ำกัน – หมายเลขตู้คอนเทนเนอร์หรือซีล ใบตราส่งสินค้า (bill of lading) • ข้อมูลลูกค้าผู้รับสินค้า – ชื่อ ที่อยู่ ใบแจ้งหนี้ หรือหมายเลขคำสั่งซื้อ • การแยกประเภทชนิดสัตว์น้ำทั้งหมด (การแปรสภาพ) (แยกระหว่างสัตว์…","เจตนารมณ์ของข้อกำหนดนี้คือเพื่อให้มั่นใจว่าโรงงานจัดเก็บบันทึก (องค์ประกอบข้อมูลสำคัญ) จากทุกเหตุการณ์การส่งมอบและการแปรรูป ซึ่งเรียกว่าจุดติดตามที่สำคัญ (Critical Tracking Event, CTE) เพื่อให้สามารถสืบย้อนกลับผลิตภัณฑ์ทั้งหมดที่ผลิตในโรงงานได้อย่างสมบูรณ์ จุดติดตามที่สำคัญรวมถึงการเก็บเกี่ยว การทำความเย็น การบรรจุ การรับสินค้า และการแปรรูป กิจกรรมเหล่านี้ทั้งหมดอาจเกี่ยวข้องหรือไม่เกี่ยวข้องกับโรงงานก็ได้ บันทึกที่เกี่ยวข้องกับเหตุการณ์เหล่านี้คือองค์ประกอบข้อมูลสำคัญ ตัวอย่าง KDE สำหรับสัตว์น้ำจากการเพาะเลี้ยง ได้แก่: • ชื่อผู้จำหน่ายฟาร์ม • หมายเลขระบุบ่อ ถัง หรือกระชัง (การเพาะเลี้ยงสัตว์…"],["core","BAP · Core หมวด 6","6.2.2","","โรงงานต้องจัดเก็บบันทึกการผลิตสำหรับล็อตหรือแบทช์ทั้งหมด ซึ่งช่วยให้โรงงานสามารถแสดงการสืบย้อนกลับของล็อตในทุกขั้นตอนของกระบวนการผลิต รวมถึงการแก้ไขงาน (rework) และกระบวนการที่ว่าจ้างภายนอก (outsourced processes) บันทึกต้องประกอบด้วย: • แหล่งที่มาและคำอธิบายของวัตถุดิบ; • หมายเลขล็อตและปริมาณของวัตถุดิบ; • หมายเลขล็อตของส่วนผสมและวัสดุบรรจุภัณฑ์ที่ใช้; • ข้อมูลลูกค้าผู้รับสินค้า; และ ปริมาณผลิตภัณฑ์สำเร็จรูปที่จัดส่งแยกตามชนิดสัตว์น้ำ ผลการทดสอบการสืบย้อนไปข้างหน้า (trace forward) และการสืบย้อนกลับไปข้างหลัง (trace back) ต้องครอบคลุมผลิตภัณฑ์ 100% และผลการทดสอบต้องแล้วเสร็จภายใน 4 ชั่วโมง หลังจากผู้ตรวจประเมิน SPS เลือกและกำหนดล็อตที่จะทดสอบ",""],["core","BAP · Core หมวด 6","6.2.3","","โรงงานต้องดำเนินการทดสอบการสืบย้อนไปข้างหน้า (trace forward) และการสืบย้อนกลับไปข้างหลัง (trace back) อย่างน้อยหนึ่งครั้ง ผลการทดสอบการสืบย้อนไปข้างหน้าและการสืบย้อนกลับไปข้างหลังต้องครอบคลุมผลิตภัณฑ์ 100% และผลการทดสอบต้องแล้วเสร็จภายใน 4 ชั่วโมง หลังจากผู้ตรวจประเมิน SPS เลือกและกำหนดล็อตที่จะทดสอบ","ผู้ตรวจประเมินต้องเลือกล็อตผลิตภัณฑ์สำเร็จรูปสำหรับการทดสอบการสืบย้อนไปข้างหน้าและการสืบย้อนกลับไปข้างหลังของผลิตภัณฑ์ ซึ่งรวมถึงบรรจุภัณฑ์ ส่วนผสม วัตถุดิบ และปลายทางของผลิตภัณฑ์ ล็อตที่ผู้ตรวจประเมินเลือกต้องเป็นหมายเลขล็อตผลิตภัณฑ์สำเร็จรูปที่ได้จัดส่งไปแล้ว"],["core","BAP · Core หมวด 6","6.3.1","","ผลิตภัณฑ์ต้องมีการติดฉลากอย่างถูกต้องครบถ้วนด้วยข้อมูลทั้งหมด รวมถึงสารก่อภูมิแพ้ (allergens) ตามที่กำหนดโดยกฎหมายท้องถิ่นและกฎหมายของประเทศปลายทาง ผลิตภัณฑ์ต้องมีข้อมูลเพื่อให้มั่นใจในการขนถ่าย การจัดเก็บ การเตรียม และการใช้งานผลิตภัณฑ์อย่างปลอดภัยตลอดสายโซ่อุปทานหรือโดยผู้บริโภค","ผลิตภัณฑ์ต้องมีการติดฉลากอย่างถูกต้องครบถ้วนด้วยข้อมูลทั้งหมด รวมถึงสารก่อภูมิแพ้ (allergens) ตามที่กำหนดโดยกฎหมายท้องถิ่นและกฎหมายของประเทศปลายทาง รวมถึงเอกสารสนับสนุนข้อกล่าวอ้างใด ๆ ที่มีการระบุ (substantiated claims) ผลิตภัณฑ์ต้องมีข้อมูลเพื่อให้มั่นใจในการขนถ่าย การจัดเก็บ การเตรียม และการใช้งานผลิตภัณฑ์อย่างปลอดภัยตลอดสายโซ่อุปทานหรือโดยผู้บริโภค ถ้อยคำมีความคล้ายคลึงกับข้อกำหนด 1.1.1.7 มาก ยกเว้นส่วนที่ระบุว่า \"รวมถึงเอกสารสนับสนุนข้อกล่าวอ้างใด ๆ ที่มีการระบุ\" ซึ่งอยู่ในข้อกำหนด 1.1.1.7"],["2a","BAP · 2A Social · SR1","SR1.1","","สถานประกอบการต้องมีนโยบายจริยธรรมทางธุรกิจ (Business Ethics Policy) ที่ได้รับการอนุมัติจากผู้บริหารระดับสูง เพื่อแสดงให้เห็นถึงความมุ่งมั่นของสถานประกอบการในการปฏิบัติตามกฎหมายต่อต้านการติดสินบนแห่งชาติที่บังคับใช้ทั้งหมด และห้ามการกระทำใด ๆ ที่เป็นการทุจริต การขู่กรรโชก การยักยอกทรัพย์ หรือการติดสินบนในทุกรูปแบบ ไม่ว่าจะเป็นทางตรงหรือทางอ้อม","เจตนา: เพื่อยืนยันว่าสถานประกอบการดำเนินงานอย่างมีจริยธรรม การตีความ: หากไม่มีกฎหมายต่อต้านการติดสินบนแห่งชาติ สถานประกอบการยังคงต้องปฏิบัติตามมาตรฐานนี้ในเรื่องการห้ามการกระทำใด ๆ ที่เป็นการทุจริต การขู่กรรโชก การยักยอกทรัพย์ หรือการติดสินบนในทุกรูปแบบ สถานประกอบการต้องเก็บบันทึกไว้เพื่อพิสูจน์ว่ามีการปฏิบัติตามข้อกำหนดของมาตรฐานนี้"],["2a","BAP · 2A Social · SR2","SR2.1","","สถานประกอบการต้องมั่นใจว่าคนงานทุกคนได้รับค่าจ้างไม่น้อยกว่าค่าจ้างขั้นต่ำตามกฎหมาย สำหรับสัปดาห์การทำงานมาตรฐาน (ไม่รวมค่าล่วงเวลา) หรืออัตราค่าจ้างที่กำหนดไว้ในสัญญาจ้างงานหรือข้อตกลงการเจรจาต่อรองร่วม (Collective Bargaining Agreement) แล้วแต่อัตราใดสูงกว่า","เจตนา: เพื่อยืนยันว่าคนงานได้รับค่าจ้างไม่น้อยกว่าค่าจ้างขั้นต่ำหรือตามที่ได้รับการรับปากไว้ การตีความ: คนงานทุกคน หมายรวมถึงคนงานที่จ้างโดยตรง คนงานพาร์ทไทม์ คนงานที่รับค่าจ้างตามผลงาน (Piece Rate) คนงานตามสัญญา และคนงานที่จ้างผ่านผู้รับเหมาช่วง"],["2a","BAP · 2A Social · SR2","SR2.2","","สถานประกอบการต้องมีแผนการจ่ายค่าจ้างที่เพียงพอต่อการดำรงชีพ (Living Wage) ให้แก่คนงาน ค่าจ้างที่เพียงพอต่อการดำรงชีพต้องอ้างอิงจากการประเมินในระดับท้องถิ่นถึงความจำเป็นด้านค่าจ้างที่ครอบคลุมค่าใช้จ่ายพื้นฐานของคนงาน และเผื่อเงินส่วนที่คนงานและครอบครัวสามารถใช้จ่ายได้ตามความต้องการ แผนการจ่ายค่าจ้างที่เพียงพอต่อการดำรงชีพต้องได้รับการทบทวนอย่างน้อยปีละหนึ่งครั้ง ขั้นตอนที่ดำเนินการเพื่อให้บรรลุแผนค่าจ้างที่เพียงพอต่อการดำรงชีพต้องมีการจัดทำเป็นเอกสาร","เจตนา: เพื่อยืนยันว่าสถานประกอบการมีแผนที่ได้รับการทบทวนอย่างสม่ำเสมอเพื่อจ่ายค่าจ้างที่เพียงพอต่อการดำรงชีพ การตีความ: องค์การแรงงานระหว่างประเทศ (ILO) ให้คำนิยามค่าจ้างที่เพียงพอต่อการดำรงชีพว่า \"ระดับค่าจ้างที่จำเป็นเพื่อให้คนงานและครอบครัวมีมาตรฐานการครองชีพที่เหมาะสม โดยพิจารณาจากสภาพการณ์ของประเทศนั้น ๆ และคำนวณจากงานที่ทำในช่วงเวลาทำงานปกติ\" ตำแหน่งงานของคนงาน ระยะเวลาที่ทำงานกับบริษัท หรือปัจจัยอื่น ๆ ไม่มีผลต่อการพิจารณาว่าคนงานควรได้รับค่าจ้างที่เพียงพอต่อการดำรงชีพหรือไม่ แต่ปัจจัยเหล่านั้นอาจนำมาพิจารณาเป็นส่วนหนึ่งของแผนของสถานประกอบการในการจ่ายค่าจ้างที่เพียงพอต่อการดำรงชีพให้แก…"],["2a","BAP · 2A Social · SR2","SR2.3","","สถานประกอบการต้องจัดให้มีสวัสดิการอย่างน้อยตามที่กฎหมายท้องถิ่นหรือกฎหมายแห่งชาติ หรือข้อตกลงการเจรจาต่อรองร่วมกำหนด หากกฎหมายไม่ได้กำหนดไว้ สถานประกอบการต้องพยายามจัดให้มีสวัสดิการขั้นพื้นฐานที่ทำให้คนงานมีสภาพการทำงานที่เหมาะสม รวมถึงสิทธิการลาพักร้อน สวัสดิการกรณีเจ็บป่วย ประกันสุขภาพหรือประกันการรักษาพยาบาล และการลาคลอด/ลาเพื่อเลี้ยงดูบุตรโดยได้รับค่าจ้าง","เจตนา: เพื่อยืนยันว่าคนงานได้รับสวัสดิการที่พึงมีสิทธิ์ตามกฎหมายหรือสัญญา และอย่างน้อยได้รับสวัสดิการขั้นพื้นฐาน หรือสถานประกอบการมีแผนดำเนินการเพื่อไปสู่การจัดให้มีสวัสดิการขั้นพื้นฐาน การตีความ: ข้อกำหนดนี้ใช้กับคนงานทุกคน รวมถึงคนงานตามสัญญาและคนงานต่างชาติ"],["2a","BAP · 2A Social · SR2","SR2.4","","สถานประกอบการต้องจ่ายค่าตอบแทนแก่คนงานสำหรับชั่วโมงการทำงานล่วงเวลาที่เกินกว่าสัปดาห์การทำงานมาตรฐานที่กฎหมายแห่งชาติกำหนด ในอัตราพิเศษ (Premium Rate) ที่เท่ากับอัตราที่กำหนดไว้ในสัญญาจ้างงาน ข้อตกลงการเจรจาต่อรองร่วม หรือตามที่กฎหมายท้องถิ่นกำหนด แล้วแต่อัตราใดสูงกว่า","เจตนา: เพื่อยืนยันว่าคนงานได้รับอัตราค่าล่วงเวลาที่ถูกต้อง การตีความ: หากไม่ได้ระบุอัตราพิเศษสำหรับค่าล่วงเวลาไว้ อนุสัญญา ILO ฉบับที่ 1 และฉบับที่ 30 ระบุว่าอัตราค่าจ้างสำหรับการทำงานล่วงเวลาต้อง ไม่น้อยกว่าหนึ่งเท่าและหนึ่งในสี่ เท่าของอัตราค่าจ้างปกติ ในหลายประเทศใช้อัตราพิเศษสำหรับค่าล่วงเวลา ที่ร้อยละ 50 เหนือค่าจ้างปกติ เป็นมาตรฐานทั่วไป"],["2a","BAP · 2A Social · SR2","SR2.4.A","","ระบุอัตราค่าล่วงเวลาเฉลี่ยต่อชั่วโมงเป็นสกุลเงินดอลลาร์สหรัฐ (USD)",""],["2a","BAP · 2A Social · SR2","SR2.5","","สถานประกอบการต้องไม่หักค่าจ้างในลักษณะที่กฎหมายแห่งชาติไม่อนุญาต","เจตนา: เพื่อยืนยันว่ามีการหักค่าจ้างเฉพาะรายการที่ได้รับอนุญาตเท่านั้น การตีความ: การหักค่าจ้าง คือ จำนวนเงินใด ๆ ที่หักออกจากค่าจ้าง โดยทั่วไปการหักค่าจ้างมักเป็นไปเพื่อประโยชน์ของคนงาน เช่น ประกันสุขภาพ เงินออมเพื่อการเกษียณ แต่ก็อาจเป็นไปเพื่อสิ่งอื่น เช่น ภาษี การหักค่าจ้างต้องไม่ถูกนำมาใช้เป็นส่วนหนึ่งของการลงโทษทางวินัย หรือเพื่อชำระค่าสิ่งของที่จำเป็นต่อการปฏิบัติงาน เช่น อุปกรณ์ การเดินทางมายังสถานประกอบการ"],["2a","BAP · 2A Social · SR2","SR2.6","","สถานประกอบการต้องไม่หักค่าจ้างเพื่อเป็นส่วนหนึ่งของกระบวนการลงโทษทางวินัย","ดูคำแนะนำสำหรับ SR 2.5"],["2a","BAP · 2A Social · SR2","SR2.7","","คนงานต้องได้รับการแจ้งข้อมูลเกี่ยวกับการหักค่าจ้างใด ๆ เป็นลายลักษณ์อักษร และ/หรือในภาษา/รูปแบบที่คนงานเข้าใจได้","เจตนา: เพื่อยืนยันว่าคนงานรับทราบและเข้าใจเรื่องการหักค่าจ้าง การตีความ: หากมีคนงานที่ไม่สามารถอ่านออกเขียนได้ (ไม่สามารถอ่านหรือเขียนภาษาแม่ของตนเองได้) นอกจากการให้ข้อมูลเป็นลายลักษณ์อักษรแล้ว ต้องมีการสื่อสารด้วยวาจาในภาษาที่คนงานเข้าใจ และ/หรือผ่านรูปภาพ"],["2a","BAP · 2A Social · SR2","SR2.8","","สถานประกอบการต้องสามารถเข้าถึงบัญชีธนาคารของคนงานได้เพื่อการนำเงินเข้าบัญชีเท่านั้น","เจตนา: เพื่อยืนยันว่าสถานประกอบการไม่ได้ใช้ข้อมูลบัญชีของคนงานเพื่อถอนเงิน การตีความ: หากสถานประกอบการกำหนดให้คนงานต้องแจ้งข้อมูลบัญชีธนาคารเพื่อการจ่ายเงินทางอิเล็กทรอนิกส์ สถานประกอบการต้อง จัดเก็บรายละเอียดบัญชีธนาคารไว้ในที่ปลอดภัย และใช้ข้อมูลดังกล่าวเพื่อการนำเงินเข้าบัญชีของคนงานเท่านั้น"],["2a","BAP · 2A Social · SR2","SR2.9","","การจ่ายค่าจ้างต้องไม่จ่ายให้แก่บุคคลอื่นที่ไม่ใช่ตัวคนงาน หรือเข้าบัญชีที่ไม่ได้อยู่ภายใต้การควบคุมของคนงาน","เจตนา: เพื่อยืนยันว่าคนงานเป็นผู้ได้รับค่าจ้างโดยตรง ไม่ใช่บริษัทจัดหางาน สมาชิกในครอบครัว หรือหน่วยงานอื่น การตีความ: สถานประกอบการต้องมีกระบวนการตรวจสอบว่าคนงานมีสิทธิควบคุมบัญชีโดยตรง และบัญชีดังกล่าวไม่ได้อยู่ภายใต้การควบคุมของนายหน้าจัดหางาน สมาชิกในครอบครัว หรือหน่วยงานอื่น"],["2a","BAP · 2A Social · SR2","SR2.10","","คนงานทุกคนต้องได้รับค่าจ้างเต็มจำนวน เป็นเงินที่ชำระหนี้ได้ตามกฎหมาย (Legal Tender) หรือโดยการโอนเข้าบัญชีธนาคารในชื่อของตนเองโดยตรง อย่างน้อยเดือนละครั้งหรือบ่อยกว่านั้น ตามที่ระบุไว้ในสัญญาจ้างงานของคนงาน ห้ามการจ่ายค่าจ้างล่าช้าหรือการจ่ายค่าจ้างที่ไม่สม่ำเสมอ ห้ามการบังคับออมเงิน","เจตนา: เพื่อยืนยันว่าคนงานได้รับค่าจ้างอย่างสม่ำเสมอ ครบถ้วน และตรงเวลา การตีความ: คนงานทุกคน หมายรวมถึงคนงานที่จ้างโดยตรง คนงานตามสัญญา และคนงานต่างชาติ เงินที่ชำระหนี้ได้ตามกฎหมาย (Legal Tender) คือ เงินที่มีผลบังคับตามกฎหมายในการชำระหนี้"],["2a","BAP · 2A Social · SR","SR.2.10.1","","การจ่ายค่าจ้างทั้งหมดต้องมีการจัดทำเป็นเอกสาร และต้องออกสลิปเงินเดือนให้แก่คนงานซึ่งแสดงข้อมูลค่าจ้างและรายการหักอย่างน้อยที่สุด","เจตนา: เพื่อยืนยันว่ามีการจัดทำเอกสารการจ่ายค่าจ้าง และคนงานได้รับสลิปเงินเดือน การตีความ: เอกสารต้องระบุอย่างน้อยค่าจ้างปกติ ค่าล่วงเวลา และรายการหัก"],["2a","BAP · 2A Social · SR2","SR2.11","","สถานประกอบการต้องไม่ใช้ผู้รับเหมา ผู้รับเหมาช่วง คนงานชั่วคราว คนงานที่ทำงานที่บ้าน ผู้ฝึกงาน หรือรูปแบบการจ้างงานแบบไม่เต็มเวลาอื่น ๆ เพื่อหลีกเลี่ยงการจ่ายสวัสดิการ ประกันสังคม และอื่น ๆ ที่กฎหมายท้องถิ่นหรือกฎหมายแห่งชาติกำหนดไว้ภายใต้ความสัมพันธ์การจ้างงานตามปกติ","เจตนา: เพื่อยืนยันว่าสถานประกอบการไม่ได้หลีกเลี่ยงการจ่ายสวัสดิการ ประกันสังคม และเงินอื่น ๆ ด้วยการไม่จ้างคนงานโดยตรงแบบเต็มเวลา การตีความ: หากสถานประกอบการจ้างคนงานที่ไม่ได้จ้างโดยตรงหรือไม่เต็มเวลา สถานประกอบการต้องมีเอกสารแสดงเหตุผลว่าเหตุใดจึงไม่เสนอการจ้างงานโดยตรงแบบเต็มเวลา"],["2a","BAP · 2A Social · SR2","SR2.12","","สถานประกอบการต้องเก็บรักษาเอกสารที่เกี่ยวข้องทั้งหมด รวมถึงบันทึกการทำงานและบันทึกเวลาทำงานที่ครบถ้วนและถูกต้อง เพื่อยืนยันว่าคนงานทุกคน (รวมถึงคนงานที่รับค่าจ้างตามผลงานและคนงานที่จ้างผ่านบุคคลที่สาม) ได้รับค่าจ้างสอดคล้องกับกฎหมายท้องถิ่นและกฎหมายแห่งชาติที่กำกับดูแลค่าจ้างขั้นต่ำ ค่าล่วงเวลา และสวัสดิการ","เจตนา: เพื่อยืนยันว่ามีการเก็บรักษาเอกสารที่เกี่ยวข้องกับการจ่ายค่าจ้าง การตีความ: เอกสารเช่น สลิปเงินเดือน บันทึกเวลาทำงาน และอัตราค่าจ้างตามประเภทงาน เป็นหลักฐานแสดงว่าสถานประกอบการปฏิบัติตามกฎหมายท้องถิ่นหรือกฎหมายแห่งชาติ"],["2a","BAP · 2A Social · SR3","SR3.1","","โรงงานต้องกำหนดชั่วโมงการทำงานสำหรับสัปดาห์การทำงานมาตรฐานซึ่งต้องไม่เกิน 48 ชั่วโมง (ไม่รวมการทำงานล่วงเวลา) โดยสอดคล้องกับกฎหมายท้องถิ่นหรือกฎหมายแห่งชาติ ข้อตกลงร่วมหรือสัญญาจ้างงาน (หากมี) หรือมาตรฐานอุตสาหกรรมในประเทศนั้น โดยให้ใช้เกณฑ์ที่ให้สวัสดิการแก่คนงานมากกว่า","วัตถุประสงค์: เพื่อยืนยันว่าสัปดาห์การทำงานมาตรฐานเป็นไปตามกฎหมายท้องถิ่นหรือกฎหมายแห่งชาติ ข้อตกลงร่วม หรือสัญญาจ้างงาน และไม่เกิน 48 ชั่วโมงต่อสัปดาห์ การตีความ: สัปดาห์การทำงานมาตรฐานต้องไม่เกิน 48 ชั่วโมง และควรจำกัดไม่เกิน 8 ชั่วโมงต่อวัน"],["2a","BAP · 2A Social · SR3","SR3.1.A","","กรอกจำนวนชั่วโมงเฉลี่ยของคนงานในสัปดาห์การทำงานมาตรฐาน",""],["2a","BAP · 2A Social · SR3","SR3.2","","คนงานต้องไม่ทำงานล่วงเวลาเกิน 12 ชั่วโมงในสัปดาห์การทำงานมาตรฐานใด ๆ เว้นแต่ได้รับอนุญาตในสถานการณ์พิเศษ เป็นไปตามที่กฎหมายแห่งชาติอนุญาต และได้แสดงให้เห็นว่ามีมาตรการป้องกันเพื่อคุ้มครองสุขภาพและความปลอดภัยของคนงาน","วัตถุประสงค์: เพื่อยืนยันว่าการทำงานล่วงเวลาเป็นไปโดยความสมัครใจและไม่มากเกินไป การตีความ: การทำงานล่วงเวลาเกิน 12 ชั่วโมงต่อสัปดาห์ต้องไม่เกิดขึ้นเป็นประจำ กล่าวคือ ต้องไม่เกิน 3 เดือนในทุกช่วง 6 เดือน"],["2a","BAP · 2A Social · SR3","SR3.2.A","","กรอกจำนวนชั่วโมงทำงานล่วงเวลาเฉลี่ยของคนงานต่อเดือน:",""],["2a","BAP · 2A Social · SR","SR.3.2.1","","หากกฎหมายแห่งชาติที่เกี่ยวข้องอนุญาตให้ทำงานเกิน 60 ชั่วโมงต่อสัปดาห์ ต้องมีการตรวจสอบยืนยันว่าจำนวนชั่วโมงทำงานรวมสูงสุดเป็นไปตามข้อกำหนดของกฎหมายแห่งชาติ และต้องบันทึกชื่อ ตำแหน่ง และจำนวนชั่วโมงทำงานของคนงานในสัปดาห์นั้น ๆ","วัตถุประสงค์: เพื่อจำกัดและเก็บบันทึกการทำงานล่วงเวลาที่มากเกินไป"],["2a","BAP · 2A Social · SR3","SR3.3","","คนงานทุกคนต้องได้รับเวลาพักและเวลาพักรับประทานอาหารระหว่างการทำงานเป็นอย่างน้อยตามที่กฎหมายท้องถิ่นและกฎหมายแห่งชาติกำหนด","วัตถุประสงค์: เพื่อยืนยันว่ามีการให้เวลาพักที่เพียงพอเพื่อช่วยคุ้มครองสุขภาพและความปลอดภัย การตีความ: ในวันทำงาน 8 ชั่วโมง โรงงานอาจจัดให้มีเวลาพัก 10-30 นาที จำนวน 2 ครั้ง รวมกับเวลาพักกลางวันที่นานขึ้น รวมทั้งอนุญาตให้พักเข้าห้องน้ำ พักละหมาด/สวดภาวนา และพักเพื่อจัดการความจำเป็นส่วนตัวอื่น ๆ"],["2a","BAP · 2A Social · SR3","SR3.4","","คนงานต้องมีสิทธิได้รับวันหยุดพักเต็มวันอย่างน้อย 1 วัน (24 ชั่วโมงต่อเนื่อง) หลังจากทำงานต่อเนื่อง 6 วัน หรือได้รับวันหยุดพักเต็มวัน 2 วันในระยะเวลา 14 วัน","วัตถุประสงค์: เพื่อยืนยันว่าคนงานได้รับการพักผ่อนที่เพียงพอเพื่อสนับสนุนสุขภาพ ความปลอดภัย และความเป็นอยู่ที่ดีของตน การตีความ: โดยปกติควรให้วันหยุดพักเต็มวันอย่างน้อย 1 วันต่อสัปดาห์ ในกรณีที่ปริมาณการผลิตเพิ่มสูงขึ้นจนต้องทำงานหนักต่อเนื่อง ควรให้วันหยุดพักเต็มวันอย่างน้อย 2 วันทุก 2 สัปดาห์ คนงานอาจเลือกที่จะไม่ใช้วันหยุดก็ได้ สำหรับโรงงานแปรรูปสัตว์น้ำจากธรรมชาติในพื้นที่ห่างไกลที่ดำเนินการตามฤดูกาล (ดำเนินการต่อเนื่องน้อยกว่า 3 เดือน) คนงานอาจตกลงไว้เป็นส่วนหนึ่งของสัญญาจ้างว่า ในสถานการณ์พิเศษเพื่อป้องกันความเสียหายของสินค้าที่เน่าเสียง่าย คนงานอาจถูกกำหนดให้ทำงานต่อเนื่องเกิน 14 วันได้"],["2a","BAP · 2A Social · SR4","SR4.1","","การทำงานทั้งหมด รวมถึงการทำงานล่วงเวลา ต้องเป็นไปโดยความสมัครใจ คนงานต้องมีสิทธิยกเลิกสัญญาจ้างงานของตน รวมถึงข้อตกลงเกี่ยวกับการทำงานล่วงเวลาโดยความสมัครใจ โดยไม่ถูกข่มขู่ด้วยการลงโทษหรือบทลงโทษใด ๆ และสามารถลาออกจากงานได้หลังจากแจ้งล่วงหน้าตามระยะเวลาที่ตกลงกัน หนี้ที่คนงานติดค้างกับโรงงานหรือบุคคลอื่นใดต้องไม่เป็นเหตุขัดขวางคนงานจากการยกเลิกการจ้างงาน","วัตถุประสงค์: เพื่อป้องกันการใช้แรงงานบังคับและยืนยันว่าการทำงานเป็นไปโดยความสมัครใจ การตีความ: คนงานต้องให้ความยินยอมโดยเสรีและได้รับข้อมูลอย่างครบถ้วน การข่มขู่ด้วยบทลงโทษครอบคลุมถึงการบังคับข่มขู่ทั้งทางตรงและทางอ้อมในหลากหลายรูปแบบ"],["2a","BAP · 2A Social · SR4","SR4.2","","โรงงานต้องไม่มีส่วนเกี่ยวข้องกับการค้ามนุษย์ในทุกรูปแบบ รวมถึงแรงงานบังคับหรือแรงงานขัดหนี้","วัตถุประสงค์: เพื่อยืนยันว่าไม่มีการค้ามนุษย์เกิดขึ้นในโรงงาน การตีความ: การค้ามนุษย์ คือ การจัดหา ขนส่ง โยกย้าย กักตัว หรือรับตัวบุคคลโดยใช้กำลัง การฉ้อฉล หรือการหลอกลวง โดยมีเจตนาแสวงหาประโยชน์จากบุคคลนั้นเพื่อผลกำไร แรงงานบังคับ คือ การทำงานที่ถูกบังคับให้ทำโดยไม่สมัครใจภายใต้การข่มขู่ด้วยบทลงโทษ"],["2a","BAP · 2A Social · SR4","SR4.3","","โรงงานต้องไม่ยึดเอกสารประจำตัวส่วนบุคคลของคนงานไม่ว่ากรณีใด รวมถึงหนังสือเดินทาง ใบอนุญาตทำงาน และวีซ่า หรือทรัพย์สินมีค่า รวมถึงโทรศัพท์มือถือหรือช่องทางการสื่อสารอื่น ๆ ต้องไม่ขัดขวางหรือป้องกันการต่ออายุเอกสารการเดินทางหรือเอกสารประจำตัว หรือใช้วิธีการข่มขู่บังคับรูปแบบอื่นใดเพื่อบังคับให้บุคคลใดทำงาน","วัตถุประสงค์: เพื่อยืนยันว่าคนงานไม่รู้สึกว่าตนไม่สามารถออกจากสถานที่ทำงานได้ เนื่องจากไม่สามารถเข้าถึงเอกสารหรือทรัพย์สินมีค่าของตน หรือเนื่องจากเอกสารหมดอายุ"],["2a","BAP · 2A Social · SR4","SR4.4","","หากมีการใช้แรงงานผู้ต้องขัง การทำงานนั้นต้องเป็นไปโดยความสมัครใจ ผู้ต้องขังแต่ละคนต้องได้รับค่าจ้างไม่น้อยกว่าค่าจ้างขั้นต่ำ และได้รับการคุ้มครองด้านสุขภาพและความปลอดภัยในสถานที่ทำงานเช่นเดียวกับคนงานอื่น ๆ","วัตถุประสงค์: เพื่อยืนยันว่าการใช้แรงงานผู้ต้องขังเป็นไปโดยความสมัครใจและเคารพสิทธิแรงงาน การตีความ: ในการพิจารณาว่าผู้ต้องขังยินยอมทำงานโดยเสรีหรือไม่ ให้ตรวจสอบว่าเงื่อนไขการจ้างงานใกล้เคียงกับเงื่อนไขของคนงานอื่น ๆ หรือไม่"],["2a","BAP · 2A Social · SR4","SR4.5","","คนงานต้องไม่ถูกกำหนดให้ต้องชำระเงินมัดจำ พันธบัตร หรือหลักประกัน หรือค่าธรรมเนียมการจัดหางาน หรือค่าใช้จ่ายที่เกี่ยวข้อง ทั้งทางตรงหรือทางอ้อม เพื่อให้ได้รับการจ้างงานกับโรงงาน","วัตถุประสงค์: เพื่อยืนยันว่าคนงานไม่ตกอยู่ในภาวะแรงงานขัดหนี้ การตีความ: ค่าธรรมเนียมการจัดหางานและค่าใช้จ่ายที่เกี่ยวข้อง ตามที่องค์การแรงงานระหว่างประเทศ (ILO) นิยามไว้ รวมถึงค่ารักษาพยาบาล ค่าเดินทาง ค่าที่พัก ค่าอุปกรณ์ ค่าฝึกอบรม ค่าปฐมนิเทศ ค่าตรวจสอบ/ทดสอบ และค่าใช้จ่ายด้านธุรการที่เกี่ยวข้องกับการจัดหางาน https://www.ilo.org/wcmsp5/groups/public/---ed_protect/---protrav/---migrant/documents/publication/wcms_536755.pdf การชำระเงินอาจต้องกู้ยืมเงิน และอาจใช้ที่ดิน ทองคำ เครื่องประดับ ยานพาหนะ หรืออุปกรณ์การเกษตรเป็นหลักประกันเงินกู้"],["2a","BAP · 2A Social · SR4","SR4.6","","คนงานทุกคนต้องมีสิทธิเคลื่อนไหวได้อย่างเสรีภายในโรงงาน ยกเว้นในพื้นที่ที่ห้ามเข้าด้วยเหตุผลด้านสุขภาพและความปลอดภัยหรือความปลอดภัยด้านอาหาร และมีสิทธิออกจากสถานที่ทำงานเมื่อไม่ได้ปฏิบัติงาน รวมถึงการเดินทางกลับบ้านในช่วงลา ห้ามใช้การสอดส่องเพื่อวัตถุประสงค์ในการข่มขู่หรือควบคุมคนงาน หากโรงงานตั้งอยู่ในพื้นที่ห่างไกล ต้องไม่กักกันการขนส่งจากคนงานเพื่อขัดขวางไม่ให้คนงานออกจากสถานที่ทำงาน","วัตถุประสงค์: เพื่อยืนยันว่าโรงงานไม่ควบคุมการเคลื่อนไหวของคนงาน การตีความ: โรงงานต้องไม่ควบคุมการเคลื่อนไหวของคนงาน เว้นแต่ในพื้นที่ภายในโรงงานที่ห้ามเข้าด้วยเหตุผลด้านสุขภาพและความปลอดภัย หรือความปลอดภัยด้านอาหาร"],["2a","BAP · 2A Social · SR4","SR4.7","","โรงงานต้องแสดงข้อมูลในตำแหน่งที่เห็นได้ชัดเจน โดยใช้ภาษาท้องถิ่นหรือรูปแบบที่คนงานสามารถเข้าใจได้ เกี่ยวกับการร้องเรียนและข้อร้องทุกข์ สายด่วน หน่วยงานที่มีอำนาจหน้าที่ และแหล่งข้อมูลอื่น ๆ สำหรับผู้ที่ถูกละเมิดสิทธิแรงงาน","วัตถุประสงค์: เพื่อยืนยันว่าคนงานได้รับข้อมูลเกี่ยวกับวิธีการขอความช่วยเหลือหากสิทธิแรงงานของตนถูกละเมิด การตีความ: ต้องมีการให้ข้อมูลทั้งแหล่งข้อมูลภายในและภายนอกองค์กร"],["2a","BAP · 2A Social · SR4","SR4.8","","หากมีการให้เงินล่วงหน้าหรือเงินกู้แก่คนงาน โรงงานต้องมีนโยบายเป็นลายลักษณ์อักษรระบุข้อกำหนดและเงื่อนไข และต้องสื่อสารให้คนงานเข้าใจก่อนที่คนงานจะยอมรับเงินกู้หรือเงินล่วงหน้านั้น ข้อกำหนดและเงื่อนไขดังกล่าวต้องไม่ถูกนำมาใช้เพื่อผูกมัดคนงานให้ต้องทำงานต่อไป คนงานต้องไม่ถูกกำหนดให้ต้องชำระหนี้ให้หมดก่อนจึงจะสามารถลาออกจากงานได้","วัตถุประสงค์: เพื่อยืนยันว่าคนงานไม่ถูกบังคับให้ต้องทำงานต่อไปเพื่อชำระเงินกู้ การตีความ: ข้อกำหนดและเงื่อนไขของเงินกู้ต้องไม่เอื้อประโยชน์ต่อคนงานน้อยกว่าเงินกู้จากธนาคารท้องถิ่น และต้องอนุญาตให้คนงานลาออกจากงานได้ก่อนที่จะชำระเงินกู้ครบถ้วน โรงงานควรให้เงินกู้เป็นทางเลือกสุดท้ายเท่านั้น โดยควรสนับสนุนให้คนงานขอสินเชื่อจากสถาบันการเงินที่เป็นทางการก่อน"],["2a","BAP · 2A Social · SR5","SR5.1","","โรงงานต้องไม่มีส่วนเกี่ยวข้องกับหรือสนับสนุนการใช้แรงงานเด็ก โรงงานต้องปฏิบัติตามกฎหมายท้องถิ่นเกี่ยวกับแรงงานเด็กในเรื่องอายุขั้นต่ำในการทำงาน หรืออายุที่สิ้นสุดการศึกษาภาคบังคับ หรือให้สอดคล้องกับอนุสัญญาองค์การแรงงานระหว่างประเทศ (ILO) ฉบับที่ 138 ว่าด้วยอายุขั้นต่ำ (Minimum Age Convention 138) โดยใช้เกณฑ์อายุที่สูงกว่า โรงงานต้องเก็บรวบรวม ตรวจสอบ และจัดเก็บสำเนาหลักฐานเกี่ยวกับอายุของคนงาน เพื่อยืนยันว่าเป็นไปตามข้อกำหนดด้านอายุ","เจตนา: เพื่อยืนยันว่าโรงงานไม่ได้ใช้แรงงานเด็ก การตีความ: อนุสัญญา ILO ว่าด้วยอายุขั้นต่ำ (Minimum Age Convention, C138) กำหนดอายุขั้นต่ำในการทำงานไว้ที่ 15 ปี เว้นแต่เศรษฐกิจหรือระบบการศึกษาของประเทศนั้นยังพัฒนาไม่เพียงพอ ซึ่งในกรณีนี้อาจกำหนดอายุขั้นต่ำเริ่มต้นไว้ที่ 14 ปีได้ ผู้ที่มีอายุระหว่างอายุขั้นต่ำในการทำงานจนถึง 18 ปี อาจถือเป็นแรงงานเด็กหากปฏิบัติงานที่เป็นอันตราย"],["2a","BAP · 2A Social · SR5","SR5.2","","การจ้างแรงงานเยาวชน (ผู้ที่มีอายุสูงกว่าอายุขั้นต่ำแต่ต่ำกว่า 18 ปี) ต้องเป็นไปตามกฎหมายท้องถิ่นหรือกฎหมายของประเทศ รวมถึงการเข้าถึงการศึกษาภาคบังคับตามที่กำหนด และข้อจำกัดด้านชั่วโมงการทำงานและช่วงเวลาทำงานใด ๆ","เจตนา: เพื่อยืนยันว่าแรงงานที่มีอายุระหว่าง 14/15 ถึง 18 ปี ไม่ได้ปฏิบัติงานที่ก่อให้เกิดความเสี่ยงต่อสุขภาพและความปลอดภัย หรือต่อพัฒนาการด้านศีลธรรมและสังคมของตน การตีความ: ประเภทของงานที่ห้ามตามข้อกำหนดนี้ให้เป็นไปตามที่กฎหมายและระเบียบข้อบังคับของประเทศกำหนด"],["2a","BAP · 2A Social · SR5","SR5.3","","แรงงานเยาวชนต้องไม่ถูกกำหนดให้อยู่ในสภาวะที่ก่อให้เกิดความเสี่ยงต่อสุขภาพหรือความปลอดภัย ซึ่งรวมถึงการจำกัดชั่วโมงการทำงาน และการห้ามทำงานกลางคืนและงานที่เป็นอันตราย","เจตนา: เพื่อยืนยันว่าแรงงานเยาวชนไม่ได้ถูกใช้เป็นแรงงานเด็ก"],["2a","BAP · 2A Social · SR5","SR5.4","","โรงงานต้องมีนโยบายและขั้นตอนการเยียวยาแก้ไข เพื่อให้การช่วยเหลือแก่ผู้ที่ถูกระบุว่าเป็นแรงงานเด็กในโรงงาน ทั้งนี้ขึ้นอยู่กับอายุของเด็ก การช่วยเหลืออย่างน้อยต้องรวมถึงการนำเด็กออกจากงานและส่งกลับเข้าสู่ระบบการศึกษา","เจตนา: เพื่อยืนยันการเยียวยาแก้ไขสำหรับแรงงานเด็ก การตีความ: นโยบายการเยียวยาแก้ไขต้องรวมถึงข้อกำหนดที่ทำให้มั่นใจว่าเด็กได้รับความช่วยเหลือที่จำเป็นในการกลับเข้าโรงเรียน รวมถึงการชำระค่าเล่าเรียน และการให้สิทธิ์แก่เด็กในการเลือกกลับมาทำงานที่โรงงานเมื่อมีอายุครบตามข้อกำหนดใน SR 5.1"],["2a","BAP · 2A Social · SR5","SR5.4.1","","หากมีการดำเนินการตามขั้นตอนการเยียวยาแก้ไข โรงงานต้องเก็บบันทึกการดำเนินการทั้งหมดและขั้นตอนที่จัดทำขึ้นเพื่อป้องกันการเกิดซ้ำ ไว้เป็นระยะเวลาอย่างน้อยสามปี","เจตนา: เพื่อยืนยันว่ามีการเยียวยาแก้ไขเกิดขึ้นจริง มีการบันทึกเป็นเอกสาร และมีการดำเนินมาตรการป้องกัน การตีความ: มาตรการป้องกันควรอ้างอิงจากการวิเคราะห์สาเหตุที่แท้จริง (root cause analysis) เพื่อหาสาเหตุที่มีการจ้างแรงงานเด็กซึ่งขัดต่อนโยบายห้ามใช้แรงงานเด็ก"],["2a","BAP · 2A Social · SR5","SR5.5","","ในกรณีที่มีการใช้ผู้รับเหมาหรือบริษัทจัดหางาน โรงงานต้องมีนโยบายและขั้นตอนเพื่อตรวจสอบยืนยันว่าองค์กรดังกล่าวปฏิบัติตามข้อกำหนดของ SPS","เจตนา: เพื่อยืนยันว่าผู้รับเหมาและบริษัทจัดหางานปฏิบัติตามข้อกำหนดของ SPS"],["2a","BAP · 2A Social · SR5","SR5.5.A","","ระบุค่าธรรมเนียมเฉลี่ยที่จ่ายให้แก่บริษัทจัดหางานต่อแรงงานหนึ่งคน เป็นสกุลเงินดอลลาร์สหรัฐ (USD):",""],["2a","BAP · 2A Social · SR5","SR5.5.B","","ระบุชื่อบริษัทจัดหางาน:",""],["2a","BAP · 2A Social · SR5","SR 5.6","","จุดข้อมูล: โรงงานมีการจ้างแรงงานเยาวชนที่มีอายุต่ำกว่า 18 ปีหรือไม่","เจตนา: เพื่อยืนยันว่ามีแรงงานเยาวชนอยู่ในโรงงานหรือไม่ การตีความ: การจ้างแรงงานเยาวชนมีแนวโน้มเกิดขึ้นได้มากกว่าในกรณีที่เป็นการทำงานในช่วงเวลานอกเวลาเรียน ในงานที่สกปรก อันตราย หรือย่ำยีเกียรติ เมื่อแรงงานข้ามชาติเดินทางมาพร้อมกับบุตรของตน เมื่อมีแรงงานที่รับค่าจ้างตามผลงาน หรือเมื่อมีการจ้างงานแบบไม่ผ่านการจ้างตรง"],["2a","BAP · 2A Social · SR6","SR6.1","","แรงงานต้องได้รับอนุญาตตามกฎหมายให้ทำงานในประเทศที่ตนได้รับการจ้างงาน การปฏิบัติงานและข้อกำหนดการจ้างงานต้องเป็นไปตามมาตรฐานแรงงานท้องถิ่น มาตรฐานแรงงานของประเทศ หรือมาตรฐานแรงงานระดับสากล โดยให้ใช้มาตรฐานที่เข้มงวดกว่า","เจตนา: เพื่อยืนยันว่ามีการได้รับสัญชาติหรือเอกสารการทำงานที่ถูกต้อง การตีความ: การได้รับอนุญาตตามกฎหมายให้ทำงาน หมายถึงแรงงานเป็นผู้มีสัญชาติของประเทศที่โรงงานตั้งอยู่ หรือมีเอกสารที่ถูกต้องสำหรับการทำงานในสถานที่นั้น"],["2a","BAP · 2A Social · SR6","SR6.2","","แรงงานทุกคน รวมถึงแรงงานชั่วคราวและแรงงานที่ได้รับการจ้างผ่านบริษัทจัดหางาน ต้องเริ่มทำงานภายใต้สัญญาที่มีการลงนาม ซึ่งจัดทำในรูปแบบ/ภาษาที่แรงงานสามารถเข้าใจได้ โดยระบุข้อกำหนดและเงื่อนไขการจ้างงาน รวมถึงสิทธิ สวัสดิการ ค่าตอบแทนของแรงงาน ชั่วโมงการทำงานที่คาดหวัง รายละเอียดค่าจ้างในแต่ละรอบการจ่ายเงินทุกครั้งที่มีการจ่ายค่าจ้าง และนโยบายของโรงงานเกี่ยวกับการดำเนินการทางวินัย ขั้นตอนการร้องเรียน การหักเงินค่าจ้างที่ได้รับอนุญาตใด ๆ ลักษณะงานที่ต้องปฏิบัติ สภาพแวดล้อมในการทำงานและที่พักอาศัย และเรื่องอื่น ๆ ในทำนองเดียวกัน","เจตนา: เพื่อยืนยันว่าข้อกำหนดและเงื่อนไขการจ้างงานมีการจัดทำเป็นเอกสาร และแรงงานได้รับและลงนามในสัญญาดังกล่าว"],["2a","BAP · 2A Social · SR6","SR6.3","","โรงงานต้องมีนโยบายที่ส่งเสริมการจ้างแรงงานโดยตรง ในกรณีที่มีการใช้บริษัทจัดหางาน บริษัทดังกล่าวต้องปฏิบัติตามมาตรฐานนี้ และต้อง: • ได้รับใบอนุญาตและ/หรือการรับรองจากหน่วยงานที่เกี่ยวข้อง (หากมี) • ปฏิบัติตามระเบียบข้อบังคับของประเทศที่เกี่ยวข้อง • ดำเนินการอย่างมีจริยธรรม","เจตนา: เพื่อยืนยันว่าบริษัทจัดหางานเป็นที่รู้จัก มีใบอนุญาต และดำเนินการอย่างมีความรับผิดชอบ การตีความ: หลักการในการดำเนินงานของบริษัทจัดหางานที่มีจริยธรรม มีความรับผิดชอบ หรือเป็นธรรม มีระบุไว้ใน ILO Principles and Operations Guidelines on Fair Recruitment - https://www.ilo.org/wcmsp5/groups/public/---ed_protect/---protrav/---migrant/documents/publication/wcms_536755.pdf"],["2a","BAP · 2A Social · SR6","SR6.4","","โรงงานต้องมีขั้นตอนในการตรวจสอบยืนยันข้อมูลข้างต้น",""],["2a","BAP · 2A Social · SR6","SR6.5","","โรงงานต้องมีนโยบายที่สะท้อนหลักการ Employer Pays Principle (หลักการนายจ้างเป็นผู้รับผิดชอบค่าใช้จ่าย) ซึ่งเปิดเผยต่อสาธารณะและสื่อสารให้แรงงานทุกคน บริษัทจัดหางาน และคู่ค้าทางธุรกิจอื่น ๆ ทราบ","เจตนา: เพื่อยืนยันว่าโรงงานมีนโยบายที่นำมาปฏิบัติใช้เพื่อป้องกันไม่ให้แรงงานต้องจ่ายค่าธรรมเนียมการจัดหางานและค่าใช้จ่ายที่เกี่ยวข้อง การตีความ: หลักการ Employer Pays Principle ระบุว่า \"แรงงานไม่ควรต้องจ่ายเงินเพื่อได้งาน ค่าใช้จ่ายในการจัดหางานควรเป็นภาระของนายจ้าง ไม่ใช่ของแรงงาน\" ILO ได้กำหนดนิยามของค่าธรรมเนียมการจัดหางานและค่าใช้จ่ายที่เกี่ยวข้องให้ครอบคลุมถึงสิ่งต่าง ๆ เช่น หนังสือเดินทาง วีซ่า การฝึกอบรม การตรวจสุขภาพ และค่าเดินทางไป-กลับสถานที่ทำงาน สามารถดูนิยามฉบับสมบูรณ์ได้ที่หน้า 27-29 (https://www.ilo.org/wcmsp5/groups/public/---ed_protect/---protrav/---migrant/documents/publicat…"],["2a","BAP · 2A Social · SR6","SR6.5.1","","หากแรงงานได้จ่ายค่าธรรมเนียมการจัดหางานหรือค่าใช้จ่ายที่เกี่ยวข้องไปแล้ว โรงงานต้องบันทึกเป็นเอกสารและชดใช้ค่าธรรมเนียมดังกล่าวพร้อมดอกเบี้ยที่เกิดขึ้นโดยเร็ว และต้องจัดทำแผนเพื่อป้องกันการเรียกเก็บค่าธรรมเนียมดังกล่าวในอนาคต","เจตนา: เพื่อยืนยันการเยียวยาในกรณีที่แรงงานได้จ่ายค่าธรรมเนียมการจัดหางาน การตีความ: ดูคำนิยามของค่าธรรมเนียมการจัดหางานและค่าใช้จ่ายที่เกี่ยวข้องข้างต้น องค์กร Impact ได้จัดทำ Principles and Guidelines for the Repayment of Migrant Worker Recruitment Fees and Related Costs (https://impacttlimited.com/principles-for-repayment-of-recruitment-fees/)"],["2a","BAP · 2A Social · SR6","SR6.6","","โรงงานต้องจัดทำรายชื่อบริษัทจัดหางานทั้งหมดที่ใช้บริการ และต้องมีกระบวนการที่บันทึกเป็นเอกสารสำหรับการติดตามตรวจสอบเป็นประจำทุกปี เพื่อให้มั่นใจว่าบริษัทดังกล่าวยังคงดำเนินการอย่างถูกต้องตามกฎหมายและมีจริยธรรม ต้องเก็บบันทึกไว้เป็นระยะเวลาอย่างน้อยสามปี และต้องจัดเก็บและติดตามแผนการปฏิบัติการแก้ไข","เจตนา: เพื่อยืนยันการกำกับดูแลบริษัทจัดหางานเพื่อให้มั่นใจยิ่งขึ้นว่าดำเนินการอย่างมีจริยธรรม การตีความ: การดำเนินการอย่างมีจริยธรรม หมายถึงการปฏิบัติตามหลักการของ ILO ว่าด้วยการจัดหางานที่เป็นธรรม (https://www.ilo.org/wcmsp5/groups/public/---ed_protect/---protrav/---migrant/documents/publication/wcms_703485.pdf)"],["2a","BAP · 2A Social · SR6","SR6.7","","แรงงานต้องได้รับการแจ้งล่วงหน้าก่อนที่โรงงานจะกำหนดให้มีการเปลี่ยนแปลงใด ๆ ในสัญญาจ้าง แรงงานต้องได้รับโอกาสในการยอมรับการเปลี่ยนแปลงดังกล่าว หรือเสนอข้อประนีประนอมที่ทั้งสองฝ่ายยอมรับได้ หากไม่สามารถบรรลุข้อตกลงได้ แรงงานมีสิทธิ์ลาออกจากตำแหน่งงาน","เจตนา: เพื่อยืนยันว่าแรงงานทราบถึงการเปลี่ยนแปลงในสัญญาจ้างก่อนที่จะมีการเปลี่ยนแปลงเกิดขึ้นจริง และแรงงานไม่ถูกบังคับให้ยอมรับการเปลี่ยนแปลงและทำงานต่อไปหากไม่สามารถยอมรับได้ การตีความ: การเปลี่ยนแปลงสัญญาจ้างต้องมีเหตุผลทางธุรกิจที่สมควร"],["2a","BAP · 2A Social · SR7","SR7.1","","โรงงานต้องมีนโยบายความเท่าเทียมทางโอกาส (equal opportunity) ที่ห้ามการเลือกปฏิบัติหรือยินยอมให้มีการเลือกปฏิบัติในทุกด้านของการสรรหา การจ้างงาน และค่าตอบแทน โดยพิจารณาจากลักษณะส่วนบุคคลที่ได้รับการคุ้มครองตามกฎหมาย ข้อกำหนดและเงื่อนไขการจ้างงานต้องพิจารณาจากความสามารถในการปฏิบัติงาน มิใช่จากลักษณะส่วนบุคคลหรือความเชื่อ","เจตนา: เพื่อยืนยันว่าสถานประกอบการไม่มีการเลือกปฏิบัติ การตีความ: อนุสัญญาว่าด้วยการเลือกปฏิบัติ (การจ้างงานและอาชีพ) ฉบับที่ C111 ขององค์การแรงงานระหว่างประเทศ (ILO) นิยามการเลือกปฏิบัติ (Discrimination) ว่ารวมถึง \"การแบ่งแยก การกีดกัน หรือการเลือกที่รักมักที่ชังใด ๆ บนพื้นฐานของเชื้อชาติ สีผิว เพศ ศาสนา ความคิดเห็นทางการเมือง เชื้อชาติกำเนิด หรือกำเนิดทางสังคม\""],["2a","BAP · 2A Social · SR7","SR7.2","","สถานประกอบการต้องมีนโยบายด้านสถานที่ทำงานที่ครอบคลุมเรื่องความรุนแรงและการล่วงละเมิดในสถานที่ทำงาน โดยต้องระบุให้ชัดเจนว่าคนงานทุกคนจะต้องได้รับการปฏิบัติด้วยเกียรติและความเคารพ และจะไม่มีการยอมรับการล่วงละเมิดทางจิตใจ ร่างกาย คำพูด หรือทางเพศ การกลั่นแกล้ง หรือการคุกคามที่เกิดขึ้นจริงหรือการขู่ว่าจะกระทำการดังกล่าว","เจตนา: เพื่อยืนยันว่าสถานประกอบการมีนโยบายและขั้นตอนการปฏิบัติเพื่อป้องกันความรุนแรงและการล่วงละเมิด การตีความ: ความรุนแรงหรือการล่วงละเมิดรวมถึงการใช้หรือการขู่ว่าจะลงโทษทางร่างกาย การบังคับขู่เข็ญทางจิตใจหรือร่างกาย การกลั่นแกล้ง การล่วงละเมิด รวมถึงการล่วงละเมิดทางเพศ หรือการทำร้ายในรูปแบบใด ๆ"],["2a","BAP · 2A Social · SR7","SR7.3","","สถานประกอบการต้องไม่เลิกจ้างพนักงานเนื่องจากการตั้งครรภ์ ต้องไม่บังคับให้ใช้การคุมกำเนิด และต้องไม่ลดค่าจ้างหรือเลือกปฏิบัติในรูปแบบใด ๆ ต่อคนงานที่กลับมาทำงานหลังการลาคลอด/ลาเพื่อดูแลบุตร ผู้สมัครงานและคนงานต้องไม่ถูกบังคับให้เข้ารับการตรวจการตั้งครรภ์ การตรวจพรหมจรรย์ การตรวจเชื้อ HIV หรือการตรวจโรคติดต่อทางเพศสัมพันธ์ (STI)","เจตนา: เพื่อยืนยันว่าสถานประกอบการเคารพความเป็นส่วนตัวของคนงาน และไม่ลงโทษคนงานจากการตัดสินใจด้านการเจริญพันธุ์ การตีความ: การตัดสินใจด้านการเจริญพันธุ์เป็นสิทธิของแต่ละบุคคล และคนงานต้องไม่ถูกลงโทษจากการตัดสินใจดังกล่าว"],["2a","BAP · 2A Social · SR7","SR7.4","","สถานประกอบการต้องมีขั้นตอนการปฏิบัติที่เป็นลายลักษณ์อักษรเพื่อจัดการข้อร้องทุกข์ ข้อร้องเรียน และข้อกังวลจากคนงานทุกคนและบุคคลภายนอก โดยไม่ต้องเกรงกลัวการตอบโต้ ขั้นตอนดังกล่าวต้องระบุว่าจะไม่มีการยอมรับการตอบโต้ต่อผู้ที่ยื่นข้อร้องเรียน","เจตนา: เพื่อยืนยันว่าคนงานมีช่องทางในการยกประเด็นปัญหาโดยไม่ต้องเกรงกลัวการตอบโต้ การตีความ: หลักเกณฑ์ความมีประสิทธิผลของกลไกรับข้อร้องทุกข์ถูกกำหนดไว้ในหลักการที่ 31 ของหลักการชี้แนะแห่งสหประชาชาติว่าด้วยธุรกิจกับสิทธิมนุษยชน (UN Guiding Principles on Business and Human Rights) กลไกรับข้อร้องทุกข์ที่มีประสิทธิผลควรมีความชอบธรรม เข้าถึงได้ คาดการณ์ได้ เป็นธรรม โปร่งใส สอดคล้องกับสิทธิ เป็นแหล่งของการเรียนรู้อย่างต่อเนื่อง และตั้งอยู่บนพื้นฐานของการมีส่วนร่วมและการเจรจา สถานประกอบการต้องมีขั้นตอนการปฏิบัติที่เป็นลายลักษณ์อักษรเพื่อจัดการข้อร้องเรียนหรือข้อกังวล กลไกรับข้อร้องทุกข์ต้องสามารถเข้…"],["2a","BAP · 2A Social · SR7","SR7.5","","สถานประกอบการต้องมีระบบการรับข้อร้องเรียนและการเยียวยาที่จัดตั้งขึ้นเพื่อจัดการกรณีและข้อกล่าวหาต่าง ๆ รวมถึงการล่วงละเมิด/คุกคามทางเพศ การกลั่นแกล้ง และการปฏิบัติที่เลือกปฏิบัติต่อผู้สมัครงานและคนงาน รวมถึงผู้บริหารและพนักงาน ระบบดังกล่าวต้องประกอบด้วยอย่างน้อย กลไกการรายงานที่เป็นความลับ ข้อมูลเกี่ยวกับสายด่วนหรือบริการภายนอกอื่น ๆ ที่มีอยู่ และความเป็นไปได้ในการเริ่มดำเนินการประเมิน/อนุญาโตตุลาการโดยหน่วยงานอิสระ","เจตนา: เพื่อยืนยันว่าสถานประกอบการมีขั้นตอนภายในสำหรับจัดการข้อร้องเรียนและเยียวยาความเสียหาย และคนงานทราบถึงบริการภายนอกที่มีอยู่ การตีความ ดูข้อมูลเกี่ยวกับกลไกรับข้อร้องทุกข์ได้ที่ SR 7.4 การเยียวยาควรรวมถึงการวิเคราะห์หาสาเหตุที่แท้จริง (root cause analysis) และการพัฒนาระบบเพื่อช่วยป้องกันไม่ให้ปัญหาเกิดขึ้นอีกในอนาคต"],["2a","BAP · 2A Social · SR7","SR7.6","","บันทึกการดำเนินการเพื่อจัดการข้อร้องทุกข์ ข้อร้องเรียน และข้อกังวล ต้องถูกเก็บรักษาไว้เป็นระยะเวลาสูงสุด 3 ปี ด้วยวิธีที่ปลอดภัยและเป็นความลับ และต้องระบุกรอบเวลาที่กำหนดไว้สำหรับปิดประเด็นแต่ละเรื่องที่พบจากการสอบสวน","เจตนา: เพื่อยืนยันว่ามีการเยียวยาเกิดขึ้นจริงและมีการเก็บบันทึกไว้เป็นความลับ การตีความ: วิธีที่ปลอดภัยและเป็นความลับ หมายถึงวิธีที่อนุญาตให้เฉพาะผู้ที่เกี่ยวข้องกับกรณีนั้นเข้าถึงบันทึกได้เท่านั้น"],["2a","BAP · 2A Social · SR7","SR7.7","","กรณีการค้ามนุษย์ และการใช้แรงงานนักโทษ แรงงานภาคบังคับตามสัญญาผูกมัด แรงงานบังคับ แรงงานขัดหนี้ หรือแรงงานเด็ก ที่เกิดขึ้นภายในการดำเนินงานของสถานประกอบการหรือในสายอุปทานที่เกี่ยวข้อง ไม่ว่าจะเป็นกรณีที่คาดว่าเกิดขึ้นหรือได้รับการพิสูจน์แล้ว ต้องรายงานให้ GSA และหน่วยรับรอง (Certification Body) ของสถานประกอบการทราบทันที หรืออย่างช้าที่สุดภายใน 48 ชั่วโมงหลังจากสถานประกอบการตรวจพบประเด็นดังกล่าว","เจตนา: เพื่อให้แน่ใจว่ากรณีที่ถูกกล่าวหาว่าเป็นการค้ามนุษย์ การใช้แรงงานนักโทษ แรงงานบังคับ แรงงานขัดหนี้ และแรงงานเด็ก ได้รับการรายงานอย่างทันเวลา การตีความ: แรงงานบังคับ (Forced labor) คือ งานที่ถูกบังคับให้ทำโดยไม่สมัครใจและอยู่ภายใต้การขู่ว่าจะลงโทษในรูปแบบใด ๆ แรงงานขัดหนี้ (Bonded labor) คือ กรณีที่บุคคลถูกผูกมัดให้ทำงานเพื่อชำระคืนเงินกู้หรือหนี้สิน แรงงานเด็ก (Child labor) มักถูกนิยามว่าเป็นงานที่พรากเด็กจากวัยเด็ก ศักยภาพ และคุณค่าความเป็นมนุษย์ของพวกเขา และเป็นอันตรายต่อพัฒนาการทางร่างกายและจิตใจ"],["2a","BAP · 2A Social · SR7","SR7.8","","สถานประกอบการต้องมีขั้นตอนการเยียวยาที่จะนำมาใช้เมื่อพบกรณีการค้ามนุษย์ การใช้แรงงานนักโทษ แรงงานภาคบังคับตามสัญญาผูกมัด แรงงานบังคับ แรงงานขัดหนี้ หรือแรงงานเด็ก ภายในการดำเนินงานของตนหรือในสายอุปทานที่เกี่ยวข้อง โดยต้องจัดทำแผนการเยียวยาเพื่อสนับสนุนการฟื้นฟูคนงานที่ได้รับผลกระทบ และในกรณีที่จำเป็นต้องมั่นใจว่ามีการดำเนินการที่แตกต่างกันตามอายุของคนงาน","เจตนา: เพื่อยืนยันว่ากรณีการค้ามนุษย์ แรงงานนักโทษที่ไม่สมัครใจ แรงงานบังคับ แรงงานขัดหนี้ และแรงงานเด็ก ได้รับการเยียวยา และมีการดำเนินการเพื่อป้องกันไม่ให้เกิดกรณีดังกล่าวขึ้นอีกในอนาคต การตีความ: ดูคำนิยามของแรงงานบังคับ แรงงานขัดหนี้ และแรงงานเด็กได้ในข้อข้างต้น ตัวอย่างของการเยียวยา ได้แก่ การชดเชยความเสียหายต่อบุคคลและทรัพย์สิน การนำคนงานออกจากสถานประกอบการและการกลับคืนสู่ชุมชนพร้อมโอกาสด้านการศึกษาหรือการมีงานที่มีคุณค่า"],["2a","BAP · 2A Social · SR7","SR7.9","","สถานประกอบการต้องมีขั้นตอนการลงโทษทางวินัยที่เป็นลายลักษณ์อักษร และต้องจัดทำให้อยู่ในภาษาหรือรูปแบบที่คนงานสามารถเข้าใจได้","เจตนา: เพื่อยืนยันว่ากฎเกณฑ์ที่เกี่ยวข้องกับการลงโทษทางวินัยได้รับการจัดทำเป็นเอกสารและคนงานเข้าใจกฎเกณฑ์ดังกล่าว การตีความ: ขั้นตอนการลงโทษทางวินัยควรมีความเป็นธรรม มีเหตุผลรองรับ และคนงานต้องได้รับโอกาสในการนำเสนอหลักฐานว่าตนไม่ได้กระทำการที่เข้าข่ายต้องได้รับการลงโทษทางวินัย นอกจากนี้ ในกรณีที่มีการลงโทษทางวินัยต่อคนงาน ต้องมีการเก็บบันทึกกรณีดังกล่าวไว้อย่างครบถ้วน"],["2a","BAP · 2A Social · SR7","SR7.9.1","","บันทึกการสอบสวนพร้อมผลลัพธ์ที่บันทึกเป็นเอกสาร รวมถึงการลงโทษทางวินัย ต้องถูกเก็บรักษาไว้อย่างเป็นความลับเป็นระยะเวลาสามปี หรือตามที่กฎหมายระดับประเทศหรือระดับท้องถิ่นกำหนด","เจตนา: เพื่อให้แน่ใจว่าการลงโทษทางวินัยได้รับการบันทึกเป็นเอกสาร และมีการเก็บบันทึกไว้เป็นระยะเวลาสามปีด้วยวิธีที่ปลอดภัย การตีความ: วิธีที่เป็นความลับ หมายถึงวิธีที่อนุญาตให้เฉพาะผู้ที่เกี่ยวข้องกับกรณีนั้นเข้าถึงบันทึกได้เท่านั้น"],["2a","BAP · 2A Social · SR7","SR7.9.2","","สถานประกอบการต้องมั่นใจว่าการลงโทษทางวินัยไม่รวมถึงการปรับเงิน หรือการขู่หรือการกล่าวถึงการปรับเงินดังกล่าว หรือการหักเงินอื่น ๆ ที่ไม่ได้รับอนุญาตตามกฎหมายของประเทศ","เจตนา: เพื่อยืนยันว่าการลงโทษทางวินัยไม่รวมถึงการปรับเงินหรือการหักเงินที่ไม่ได้รับอนุญาตตามกฎหมายของประเทศ การตีความ: การปรับเงินหรือการหักเงินรวมถึงการลดค่าจ้าง มาตรการทางวินัยต้องไม่รวมถึงความรุนแรงหรือการล่วงละเมิดทางร่างกาย คำพูด จิตใจ หรือทางเพศไม่ว่าในกรณีใด ๆ"],["2a","BAP · 2A Social · SR8","SR8.1","","คนงานทุกคนต้องมีสิทธิในการรวมตัว จัดตั้งองค์กร และเจรจาต่อรองร่วม (หรือไม่กระทำการดังกล่าว) โดยไม่ต้องขออนุญาตล่วงหน้าจากฝ่ายบริหาร สถานประกอบการต้องไม่ตอบโต้คนงานที่ใช้สิทธิในการมีตัวแทนตามมาตรฐานแรงงานระหว่างประเทศ","เจตนา: เพื่อยืนยันว่าสิทธิของคนงานในการรวมตัวและการเจรจาต่อรองร่วมไม่ถูกลดทอนโดยสถานประกอบการ การตีความ: เสรีภาพในการรวมตัว (Freedom of association) คือ สิทธิในการจัดตั้งหรือเข้าร่วมสหภาพแรงงาน ซึ่งเป็นสิทธิแรงงานขั้นพื้นฐานและได้รับการรับรองไว้ในปฏิญญาสากลว่าด้วยสิทธิมนุษยชน"],["2a","BAP · 2A Social · SR8","SR8.2","","ในกรณีที่สิทธิในการรวมตัวและการเจรจาต่อรองร่วมถูกห้ามหรือถูกจำกัดตามกฎหมายท้องถิ่นหรือกฎหมายประเทศ สถานประกอบการต้องพยายามใช้วิธีการอื่นเพื่อสนับสนุนการมีตัวแทนและการเจรจาของคนงาน (ตัวอย่างเช่น การเลือกตั้งคนงานหนึ่งคนหรือมากกว่าโดยคนงานคนอื่น ๆ เพื่อเป็นตัวแทนในการติดต่อกับฝ่ายบริหาร)","เจตนา: เพื่อจัดให้คนงานมีวิธีการอื่นในการร่วมมือกันปรับปรุงสภาพการทำงานของตน ในกรณีที่เสรีภาพในการรวมตัวถูกห้ามในประเทศที่สถานประกอบการดำเนินธุรกิจอยู่ การตีความ: ดู SR.8.1"],["2a","BAP · 2A Social · SR8","SR8.3","","สถานประกอบการต้องอนุญาตให้ผู้แทนแรงงานเข้าถึงสถานที่ทำงานเพื่อปฏิบัติหน้าที่ในการเป็นผู้แทนของตน","เจตนา: เพื่อยืนยันว่าผู้แทนแรงงานที่ได้รับเลือกสามารถปฏิบัติหน้าที่เป็นผู้แทนของแรงงานได้ การตีความ: ดูข้อ SR 8.1"],["2a","BAP · 2A Social · SR8","SR8.4","","สถานประกอบการต้องแจ้งให้แรงงานทราบถึงสิทธิในการรวมตัวและเจรจาต่อรองร่วม (freedom of association and collective bargaining) และต้องปรึกษาหารือกับสหภาพแรงงานหรือผู้แทนแรงงานที่ได้รับการเสนอชื่อในทุกประเด็นที่อาจส่งผลกระทบต่อแรงงาน","เจตนา: เพื่อยืนยันว่าแรงงานรับทราบถึงสิทธิในการรวมตัวและเจรจาต่อรองร่วม และในกรณีที่มีสหภาพแรงงานหรือผู้แทนแรงงาน จะมีการปรึกษาหารือกับบุคคลดังกล่าวในประเด็นที่อาจส่งผลกระทบต่อแรงงาน"],["2a","BAP · 2A Social · SR9","SR9.1","","หากมีการจัดหาหรือมีข้อกำหนดให้จัดที่พักอาศัย ที่พักอาศัยดังกล่าวต้องตั้งอยู่ในอาคารที่แยกจากพื้นที่การผลิตและพื้นที่จัดเก็บ","เจตนา: เพื่อยืนยันว่าแรงงานไม่ได้พักนอนในพื้นที่การผลิตหรือพื้นที่จัดเก็บ การตีความ: แรงงานต้องมีที่พักอาศัยที่ปลอดภัย สะอาด และให้ความเป็นส่วนตัวในระดับหนึ่ง"],["2a","BAP · 2A Social · SR9","SR9.2","","ที่พักอาศัยที่จัดหาให้หรือที่กำหนดไว้ต้องเป็นไปตามมาตรฐานความปลอดภัยและสุขภาพในระดับท้องถิ่นและ/หรือระดับประเทศ ซึ่งรวมถึงแต่ไม่จำกัดเพียงโครงสร้างที่สะอาด ป้องกันน้ำได้ พื้นที่ที่เพียงพอตามภาระการใช้งานของสถานประกอบการ ระบบทำความร้อน/ระบายอากาศ/ทำความเย็น การควบคุมสัตว์พาหะ และจำนวนอ่างล้างมือ ห้องอาบน้ำ และห้องสุขาที่เพียงพอ","เจตนา: เพื่อยืนยันว่าที่พักอาศัยที่นายจ้างจัดหาให้มีความปลอดภัย สะอาด ให้ความสะดวกสบายในระดับหนึ่ง และให้ความเป็นส่วนตัว การตีความ: มาตรฐานท้องถิ่นหรือระดับประเทศเกี่ยวกับที่พักอาศัยที่นายจ้างจัดหาให้อาจมีจำกัด ข้อกำหนดนี้จึงกำหนดมาตรฐานขั้นต่ำสำหรับกรณีดังกล่าว"],["2a","BAP · 2A Social · SR9","SR9.3","","สถานประกอบการต้องจัดให้มีสภาพแวดล้อมที่ปลอดภัย ถูกสุขลักษณะ และสะอาดในพื้นที่ทำงาน พื้นที่พักผ่อน พื้นที่รับประทานอาหาร และพื้นที่พักอาศัยทั้งหมด ทั้งนี้รวมถึงแต่ไม่จำกัดเพียงการจัดหาน้ำดื่มสะอาด ห้องสุขาที่ถูกสุขลักษณะ และพื้นที่ครัวและพื้นที่จัดเก็บที่เกี่ยวข้องกับการผลิตอาหารที่สะอาด","เจตนา: เพื่อยืนยันว่าสถานที่ทำงานและพื้นที่อื่น ๆ ที่นายจ้างจัดหาให้มีความปลอดภัยและสะอาด การตีความ: ในพื้นที่ทั้งหมดที่สถานประกอบการจัดหาให้ สภาพแวดล้อมต้องปลอดภัยและสะอาด"],["2a","BAP · 2A Social · SR9","SR9.3.1","","แรงงานต้องสามารถเข้าถึงน้ำดื่มสะอาดโดยไม่มีค่าใช้จ่ายในบริเวณใกล้เคียงกับสถานที่ทำงานของตน","เจตนา: เพื่อยืนยันว่าแรงงานสามารถเข้าถึงน้ำดื่มได้ในระหว่างวันทำงาน การตีความ: น้ำดื่มควรอยู่ในบริเวณที่ใกล้พอที่จะทำให้แรงงานสามารถไปดื่มน้ำได้โดยไม่ต้องละจากงานเป็นเวลานาน ควรมีภาชนะสำหรับดื่มน้ำในจำนวนที่เพียงพอ"],["2a","BAP · 2A Social · SR9","SR9.4","","สถานประกอบการต้องมีห้องสุขาและอ่างล้างมือที่เป็นส่วนตัว สะอาด และปลอดภัยในจำนวนที่เพียงพอ สอดคล้องกับกฎหมายท้องถิ่นและกฎหมายระดับประเทศ และมีการบริหารจัดการให้รองรับความต้องการใช้งานในช่วงเวลาพักของแรงงาน สิ่งเหล่านี้ต้องสามารถเข้าถึงได้โดยพนักงานและได้รับการดูแลซ่อมแซมให้อยู่ในสภาพดี","เจตนา: เพื่อยืนยันว่าแรงงานสามารถเข้าถึงห้องสุขาที่สะอาด ปลอดภัย และเป็นส่วนตัวได้โดยไม่มีค่าใช้จ่าย การตีความ: การเข้าถึงห้องสุขาต้องไม่ถูกจำกัดให้ใช้ได้เฉพาะบางช่วงเวลาเท่านั้น"],["2a","BAP · 2A Social · SR9","SR9.5","","แรงงานทุกคนต้องได้รับการจัดหาห้องเปลี่ยนเสื้อผ้าที่เป็นส่วนตัว ปลอดภัย และถูกสุขลักษณะ โดยไม่มีค่าใช้จ่าย และมีตู้ล็อกเกอร์สำหรับจัดเก็บเอกสารส่วนตัวและสิ่งของส่วนตัวทั้งหมดอย่างปลอดภัย ซึ่งสามารถเข้าถึงได้ตลอดเวลา","เจตนา: เพื่อยืนยันว่าแรงงานมีสถานที่เป็นส่วนตัวสำหรับเปลี่ยนเสื้อผ้าและสถานที่ปลอดภัยสำหรับจัดเก็บสิ่งของส่วนตัวระหว่างชั่วโมงทำงาน การตีความ: ต้องจัดให้มีสถานที่ปลอดภัยสำหรับจัดเก็บสิ่งของส่วนตัวโดยไม่มีค่าใช้จ่าย ห้องเปลี่ยนเสื้อผ้าต้องมีความเป็นระเบียบเรียบร้อยและแยกเป็นช่องหรือพื้นที่เฉพาะตามเพศ"],["2a","BAP · 2A Social · SR9","SR9.6","","หากมีการจัดหาอาหาร อาหารดังกล่าวต้องปลอดภัย มีคุณภาพดีหรือมีคุณค่าทางโภชนาการ และเหมาะสมกับวัฒนธรรมการบริโภคอาหารท้องถิ่นของแรงงาน","เจตนา: เพื่อยืนยันว่าแรงงานได้รับอาหารที่มีคุณค่าทางโภชนาการซึ่งตอบสนองความต้องการด้านแคลอรีและข้อจำกัดด้านอาหารของตน การตีความ: อาหารที่สถานประกอบการจัดหาให้ต้องมีความหลากหลาย เพื่อให้แรงงานสามารถเลือกรับประทานอาหารที่ตอบสนองความต้องการด้านแคลอรีและข้อจำกัดด้านอาหารของตนได้ โดยเป็นตัวเลือกที่แรงงานโดยทั่วไปชื่นชอบ"],["2a","BAP · 2A Social · SR9","SR9.7a","","ข้อมูลที่ต้องบันทึก: สถานประกอบการจัดหาที่พักอาศัยชั่วคราวหรือถาวรหรือไม่?","การเก็บข้อมูล"],["2a","BAP · 2A Social · SR9","SR9.7b","","ข้อมูลที่ต้องบันทึก: หากมี แรงงานสามารถ \"ปฏิเสธ\" การใช้สิทธิที่พักอาศัยชั่วคราวหรือถาวรนี้ได้หรือไม่?","การเก็บข้อมูล"],["2a","BAP · 2A Social · SR9","SR9.8a","","ข้อมูลที่ต้องบันทึก: มีการจัดหาอาหารให้แรงงานโดยไม่มีค่าใช้จ่ายหรือไม่?","การเก็บข้อมูล"],["2a","BAP · 2A Social · SR9","SR9.8b","","ข้อมูลที่ต้องบันทึก: มีการจัดหาอาหารให้แรงงานโดยมีค่าใช้จ่ายหรือไม่?","การเก็บข้อมูล"],["2a","BAP · 2A Social · SR10","SR10.1","","สถานประกอบการต้องแต่งตั้งผู้บริหารรับผิดชอบดูแลด้านสุขภาพ ความปลอดภัย และการฝึกอบรมของแรงงาน","เจตนา: เพื่อยืนยันว่ามีผู้บริหารที่รับผิดชอบด้านสุขภาพ ความปลอดภัย และการฝึกอบรมของแรงงาน การตีความ: ต้องมีนโยบายและโครงสร้างการบริหารจัดการที่ระบุความรับผิดชอบอย่างชัดเจนสำหรับการพัฒนาและการนำระบบด้านสุขภาพและความปลอดภัยไปปฏิบัติภายในสถานประกอบการ โดยกำหนดวัตถุประสงค์เพื่อให้มั่นใจว่าระบบดังกล่าวได้รับการดูแลรักษาและมีความทันสมัยอยู่เสมอ"],["2a","BAP · 2A Social · SR10","SR10.2","","สถานประกอบการต้องระบุ ป้องกัน กำจัด หรือลดความเสี่ยงด้านสุขภาพและความปลอดภัยในสถานที่ทำงาน โดยผ่านการวิเคราะห์ประเมินความเสี่ยงที่ดำเนินการโดยบุคคลที่มีความสามารถอย่างน้อยปีละครั้ง หรือหลังจากเกิดเหตุการณ์ อุบัติเหตุ หรือเหตุการณ์เฉียดอุบัติเหตุ (near miss)","เจตนา: เพื่อยืนยันว่ามีระบบสำหรับการประเมินและปรับปรุงนโยบายและแนวปฏิบัติด้านสุขภาพและความปลอดภัยอย่างต่อเนื่อง การตีความ: การวิเคราะห์ประเมินความเสี่ยงต้องดำเนินการเป็นประจำทุกปี และต้องมีการปรับปรุงนโยบายและแนวปฏิบัติตามผลการประเมิน"],["2a","BAP · 2A Social · SR10","SR10.3","","การเกิดขึ้นและการสอบสวนเหตุการณ์ด้านสุขภาพและความปลอดภัย การสอบสวนอุบัติเหตุ รวมถึงสาเหตุและมาตรการแก้ไขที่ดำเนินการต้องได้รับการบันทึกเป็นเอกสาร ข้อมูลนี้ต้องถูกสื่อสารไปยังผู้บริหารของสถานประกอบการและแรงงานที่มีความเสี่ยง","เจตนา: เพื่อยืนยันว่ามีการบันทึกเอกสารเกี่ยวกับเหตุการณ์ด้านสุขภาพและความปลอดภัย การสอบสวน การวิเคราะห์สาเหตุที่แท้จริง และมาตรการแก้ไข การตีความ: สถานประกอบการต้องกำหนดให้มีการหาสาเหตุของเหตุการณ์ด้านสุขภาพและความปลอดภัยเมื่อเกิดขึ้น และต้องมีมาตรการแก้ไขที่เหมาะสมเพื่อป้องกันการเกิดเหตุการณ์ที่คล้ายคลึงกันซ้ำ"],["2a","BAP · 2A Social · SR10","SR10.4","","สถานประกอบการต้องมีแผนป้องกันและคุ้มครองด้านอัคคีภัยและเหตุฉุกเฉินครอบคลุมทุกส่วนของสถานประกอบการ รวมถึงที่พักอาศัย พื้นที่พักผ่อน โรงอาหาร และพื้นที่จัดเก็บ ตามที่เกี่ยวข้อง แผนดังกล่าวต้องรวมถึงแต่ไม่จำกัดเพียงกฎระเบียบท้องถิ่นและระดับประเทศที่เกี่ยวข้องกับ: • จำนวนเครื่องตรวจจับควันและ/หรือสัญญาณเตือนอัคคีภัยและตำแหน่งที่ติดตั้ง • จำนวนเครื่องดับเพลิง/หัวจ่ายน้ำดับเพลิงที่ใช้งานได้ • การระบุและจำนวนทางออกฉุกเฉินที่เพียงพอ (รวมถึงการจัดให้มีบันไดหนีไฟฉุกเฉินที่ออกแบบอย่างเหมาะสมในอาคารหลายชั้นเพื่อสนับสนุนการอพยพบุคลากร) • การระบุเส้นทางอพยพที่มีการทำเครื่องหมายอย่างชัดเจน มีแสงสว่างที่เหมาะสม และปราศจากสิ่งกีดขวางและไม่ถูกล็อกในขณะที่มีพนักงานอยู่ • การจัดฝึกอบรมและการบังคับใช้แนวปฏิบัติสำหรับการจัดการของเหลวไวไฟและสารเคมี • ขั้นตอนการป้องกันอัคคีภัยระหว่างการปฏิบัติงานที่มีความร้อนสูง…","เจตนา: เพื่อยืนยันว่าสถานประกอบการมีนโยบายและขั้นตอนด้านความปลอดภัยจากอัคคีภัยและเหตุฉุกเฉิน เพื่อช่วยป้องกันและลดการบาดเจ็บหรือการสูญเสียชีวิต การตีความ: นโยบายและขั้นตอนควรอยู่บนพื้นฐานของการประเมินความเสี่ยงซึ่งรวมถึงการระบุสิ่งที่อาจก่อให้เกิดอัคคีภัยและบุคคลที่อาจได้รับอันตรายหากเกิดเพลิงไหม้ ควรกำจัดสาเหตุดังกล่าวให้มากที่สุดเท่าที่จะเป็นไปได้ หากไม่สามารถกำจัดได้ ควรลดและควบคุมความเสี่ยง เช่น การแยกแหล่งความร้อน/ประกายไฟออกจากสารไวไฟ การจัดวางเครื่องทำความร้อนหรือถังแก๊สให้ไม่สามารถล้มคว่ำได้ การมีเครื่องตรวจจับควัน สัญญาณเตือนอัคคีภัย วิธีการดับเพลิงขนาดเล็กได้อย่างง่าย และการฝึกอบรม"],["2a","BAP · 2A Social · SR10","SR10.5","","สถานประกอบการต้องตรวจสอบให้อุปกรณ์และเครื่องจักรมีความปลอดภัยผ่านมาตรการต่าง ๆ ซึ่งรวมถึงแต่ไม่จำกัดเพียง: • ฝาครอบหรืออุปกรณ์ป้องกันที่ทำงานได้อย่างเหมาะสม • สัญลักษณ์/ภาพเตือน • สวิตช์ตัดการทำงานฉุกเฉิน • การนำขั้นตอน lock-out/tag-out (การล็อกและติดป้ายแสดงสถานะ) มาใช้เพื่อป้องกันการเปิดเครื่องระหว่างการซ่อมบำรุง","เจตนา: เพื่อยืนยันว่าเครื่องจักรของสถานประกอบการมีคุณสมบัติด้านความปลอดภัยที่เหมาะสมและได้รับการบำรุงรักษา และแรงงานได้รับการฝึกอบรมอย่างเหมาะสมเพื่อหลีกเลี่ยงการบาดเจ็บหรือการสูญเสียชีวิต การตีความ การเฝ้าติดตามอุปกรณ์รวมถึงการสังเกตด้วยสายตาและบันทึกการบำรุงรักษาพร้อมหลักฐานว่าปัญหาต่าง ๆ ได้รับการแก้ไขแล้ว"],["2a","BAP · 2A Social · SR10","SR10.6","","สถานประกอบการต้องตรวจติดตามความแข็งแรง ความมั่นคง และความปลอดภัยของอาคารและอุปกรณ์ในพื้นที่ปฏิบัติงาน พื้นที่รับประทานอาหาร และพื้นที่พักอาศัย (ในกรณีที่มี) ทั้งนี้รวมถึงแต่ไม่จำกัดเพียงงานเชื่อม/ยึดโครงสร้าง การรับรองความปลอดภัยทางไฟฟ้าด้วยการเดินสายไฟที่ถูกต้อง การต่อสายดินของสายเคเบิล และการปิดคลุมกล่องวงจรไฟฟ้า","เจตนา: เพื่อยืนยันว่าสถานประกอบการมีการตรวจสอบและแก้ไขปัญหาด้านความปลอดภัยของอาคารอย่างสม่ำเสมอ เพื่อป้องกันการบาดเจ็บหรือการสูญเสียชีวิต การตีความ: การตรวจติดตามรวมถึงการสังเกตด้วยสายตาและการประเมินโดยผู้เชี่ยวชาญอย่างสม่ำเสมอเกี่ยวกับความแข็งแรง ความมั่นคง และความปลอดภัยของอาคารและอุปกรณ์ รวมถึงการดำเนินการแก้ไขเมื่อจำเป็น"],["2a","BAP · 2A Social · SR10","SR10.7","","ต้องจัดทำแผนตอบสนองเหตุฉุกเฉิน (Emergency Response Plan) สำหรับกรณีการเจ็บป่วยรุนแรง อุบัติเหตุ ภัยธรรมชาติ หรือเหตุการณ์อื่น ๆ โดยเป็นส่วนหนึ่งของแผนดังกล่าว สถานประกอบการต้องแจ้งให้พนักงานทุกคนทราบว่า หากพนักงานรู้สึกว่าตนเองตกอยู่ในอันตรายที่ใกล้จะเกิดขึ้นต่อความปลอดภัยส่วนบุคคล พนักงานมีสิทธิที่จะย้ายไปยังพื้นที่ปลอดภัยได้โดยไม่ต้องขออนุญาตจากทีมบริหารของสถานประกอบการก่อน","เจตนา: เพื่อยืนยันว่ามีแผนตอบสนองเหตุฉุกเฉิน และพนักงานรับทราบว่าสามารถออกจากสถานประกอบการได้โดยไม่ต้องขออนุญาต หากเกรงว่าความปลอดภัยของตนจะได้รับอันตราย เพื่อป้องกันการบาดเจ็บหรือการสูญเสียชีวิต การตีความ: แผนตอบสนองเหตุฉุกเฉินต้องครอบคลุมอย่างน้อยประเด็นความเสี่ยงระดับสูงหรือปานกลางในพื้นที่ที่สถานประกอบการตั้งอยู่ แยกประเภทของเหตุฉุกเฉินที่แตกต่างกัน (เช่น น้ำท่วม แผ่นดินไหว อัคคีภัย) และกำหนดบทบาทและความรับผิดชอบในกรณีเกิดเหตุฉุกเฉิน"],["2a","BAP · 2A Social · SR10","SR10.8","","พนักงานที่ได้รับคัดเลือกต้องได้รับการฝึกอบรมในรายละเอียดของแผนตอบสนองเหตุฉุกเฉิน และการปฐมพยาบาลกรณีไฟฟ้าช็อต เลือดออกมาก จมน้ำ และเหตุฉุกเฉินทางการแพทย์อื่น ๆ ที่อาจเกิดขึ้น ต้องมีรายชื่อพนักงานที่ผ่านการฝึกอบรมไว้ให้พร้อมตรวจสอบ และต้องมีพนักงานที่ผ่านการฝึกอบรมอย่างน้อยหนึ่งคนอยู่ที่สถานประกอบการในขณะที่มีการดำเนินงานหรือการซ่อมบำรุง","เจตนา: เพื่อยืนยันว่าบุคลากรหลักได้รับการฝึกอบรมเกี่ยวกับแผนฉุกเฉินและเข้าใจบทบาทและความรับผิดชอบของตน การตีความ: ต้องมีพนักงานอย่างน้อยหนึ่งคนจากแต่ละกะที่ผ่านการฝึกอบรม เพื่อให้มั่นใจว่ามีพนักงานที่ผ่านการฝึกอบรมประจำอยู่ที่สถานประกอบการตลอดเวลา"],["2a","BAP · 2A Social · SR10","SR10.9","","ต้องจัดการฝึกซ้อมการอพยพในกรณีเหตุฉุกเฉิน (เช่น อัคคีภัย สารเคมีรั่วไหล หรือเหตุการณ์คล้ายคลึงกัน) อย่างน้อยปีละหนึ่งครั้ง โดยครอบคลุมทุกกะการทำงานและทุกชั้นอาคาร และดำเนินการร่วมกับผู้ใช้อาคารรายอื่น ๆ ต้องจัดการฝึกซ้อมในลักษณะเดียวกันในสถานที่พักอาศัยด้วย ต้องมีการจัดทำเอกสารและตรวจสอบความถี่ของการฝึกซ้อมอัคคีภัยและการอพยพ","เจตนา: เพื่อยืนยันว่ามีการฝึกซ้อมอย่างสม่ำเสมอ และพนักงานเข้าใจสิ่งที่ต้องปฏิบัติในกรณีเกิดเหตุฉุกเฉินประเภทต่าง ๆ การตีความ: ต้องจัดการฝึกซ้อมการอพยพสำหรับเหตุฉุกเฉินความเสี่ยงระดับสูงหรือปานกลางแต่ละประเภทในพื้นที่ที่สถานประกอบการตั้งอยู่"],["2a","BAP · 2A Social · SR10","SR10.10","","สถานประกอบการต้องจำกัดการรับสัมผัสเสียงของพนักงานที่มีระดับเสียงเกิน 85 dB ให้น้อยกว่าแปดชั่วโมงต่อวัน หรือเป็นไปตามมาตรฐานแห่งชาติที่เข้มงวดกว่า หรือจัดหาอุปกรณ์ป้องกันการได้ยินเพื่อลดระดับเสียงให้ต่ำกว่า 85dB","เจตนา: เพื่อยืนยันว่าสถานประกอบการปกป้องพนักงานจากเสียงดังเกินไปที่อาจรบกวนสมาธิหรือส่งผลให้สูญเสียการได้ยิน โดยการจำกัดการรับสัมผัสเสียงในระดับที่เกิน 85dB การตีความ: ควรวัดระดับเสียงด้วยเครื่องวัดระดับเสียง อุปกรณ์ป้องกันการได้ยินอาจรวมถึงปลั๊กอุดหูหรือที่ครอบหู"],["2a","BAP · 2A Social · SR10","SR10.11","","จุดข้อมูล: มีการรายงานอุบัติเหตุและเหตุการณ์ด้านอาชีวอนามัยและความปลอดภัยที่สถานประกอบการในช่วง 12 เดือนที่ผ่านมาจำนวนกี่ครั้ง","ระบุจำนวน"],["2a","BAP · 2A Social · SR11","SR11.1","","สถานประกอบการต้องจัดทำรายการอุปกรณ์ป้องกันส่วนบุคคล (PPE) และมีขั้นตอนการเบิกจ่ายที่มีการควบคุม เพื่อตรวจติดตามการใช้อุปกรณ์และเครื่องแต่งกายป้องกันที่จัดให้แก่พนักงาน ผู้รับเหมา และผู้มาเยือนอย่างถูกต้อง","เจตนา: เพื่อยืนยันว่าสถานประกอบการจัดหา PPE ให้ และพนักงาน ผู้รับเหมา และผู้มาเยือนทราบวิธีการใช้งาน การตีความ: PPE รวมถึงเสื้อคลุม อุปกรณ์ป้องกันดวงตา ถุงมือ เครื่องแต่งกายกันความหนาวสำหรับพื้นที่เย็น รองเท้าบูตสำหรับพื้นที่เปียก การตรวจติดตามการใช้งานที่ถูกต้องรวมถึงการให้คำแนะนำหรือการฝึกอบรมวิธีการใช้ PPE และการตรวจสอบว่าพนักงาน ผู้มาเยือน และผู้รับเหมาใช้งานอย่างถูกต้อง อุปกรณ์ป้องกันที่จำเป็นสำหรับงานเฉพาะด้านต้องระบุไว้อย่างชัดเจน เช่น ในคำอธิบายลักษณะงานหรือวิธีปฏิบัติงาน (SOP) สำหรับหน้าที่งานเฉพาะนั้น ๆ"],["2a","BAP · 2A Social · SR11","SR11.2","","ต้องจัดหา PPE และเครื่องแต่งกายที่ถูกสุขลักษณะให้โดยไม่มีค่าใช้
