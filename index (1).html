<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KST Audit Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600&display=swap">
<style>
/* Layout: sticky top bar with tabs; single column workspace, checklist rows as ruled audit-sheet lines */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18232d; --muted:#5d6c78; --line:#d9e0e6;
  --accent:#0d5c7a; --accent-ink:#ffffff; --accent-soft:#e1eef3;
  --pass:#1d7a4a; --pass-soft:#e2f3ea; --obs:#9a6400; --obs-soft:#fbf0d9; --nc:#b3261e; --nc-soft:#fbe5e3; --na:#6a7782; --na-soft:#e9edf0;
  --f-body:'IBM Plex Sans Thai','Sarabun',system-ui,sans-serif; --f-head:'Prompt','IBM Plex Sans Thai',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --surface:#17212a; --ink:#e6edf2; --muted:#93a3b0; --line:#2a3947;
  --accent:#5db6d6; --accent-ink:#06222d; --accent-soft:#16323e;
  --pass:#5ccf94; --pass-soft:#123424; --obs:#e8b44f; --obs-soft:#3a2c0e; --nc:#ff8a80; --nc-soft:#3d1a18; --na:#9aa8b3; --na-soft:#222e38; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --surface:#17212a; --ink:#e6edf2; --muted:#93a3b0; --line:#2a3947;
  --accent:#5db6d6; --accent-ink:#06222d; --accent-soft:#16323e;
  --pass:#5ccf94; --pass-soft:#123424; --obs:#e8b44f; --obs-soft:#3a2c0e; --nc:#ff8a80; --nc-soft:#3d1a18; --na:#9aa8b3; --na-soft:#222e38; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
h1,h2,h3{font-family:var(--f-head);font-weight:600;margin:0;text-wrap:balance;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:10px}
.brand{display:flex;flex-direction:column}
.brand b{font-family:var(--f-head);font-size:17px}
.brand span{font-size:12px;color:var(--muted)}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{border:0;background:none;padding:7px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
nav button[aria-selected=true]{background:var(--accent-soft);color:var(--accent)}
nav button:focus-visible,.btn:focus-visible,.res button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px 60px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.sys{display:flex;flex-direction:column;gap:6px;min-width:0}
.sys .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.sys .big{font-family:var(--f-head);font-size:26px;line-height:1}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:500}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:3px 10px;font-size:13px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;padding:1px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent);margin-right:4px;white-space:nowrap}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.chk label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;background:var(--bg)}
.chk input{width:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
.empty{border:1px dashed var(--line);border-radius:8px;padding:24px;text-align:center;color:var(--muted)}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.team{display:flex;flex-direction:column;gap:8px;min-width:0}
.team h3{font-size:16px}
.mem{display:flex;gap:6px;align-items:center;justify-content:space-between;font-size:14px;border-top:1px solid var(--line);padding-top:4px}
.mem select{width:auto;padding:2px 4px;font-size:12px}
.lead{font-weight:600}
/* checklist */
.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.prog{flex:1 1 160px;height:8px;background:var(--na-soft);border-radius:4px;overflow:hidden;min-width:100px}
.prog i{display:block;height:100%;background:var(--accent)}
.cnt{font-family:var(--f-mono);font-size:12px}
.sec{font-family:var(--f-head);font-size:15px;margin-top:8px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
.item{display:grid;grid-template-columns:80px minmax(0,1fr);gap:4px 14px;padding:12px 0;border-bottom:1px solid var(--line)}
.item .cl{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.item h4{margin:0 0 2px;font-size:15px;font-weight:600}
.q{margin:2px 0;font-size:14px}
.q .tag{margin-right:6px}
.ctl{grid-column:2;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.res{display:flex;gap:4px}
.res button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 12px;font-weight:500;font-size:13px;cursor:pointer;color:var(--muted)}
.res button[aria-pressed=true][data-r=PASS]{background:var(--pass-soft);color:var(--pass);border-color:var(--pass)}
.res button[aria-pressed=true][data-r=OBS]{background:var(--obs-soft);color:var(--obs);border-color:var(--obs)}
.res button[aria-pressed=true][data-r=NC]{background:var(--nc-soft);color:var(--nc);border-color:var(--nc)}
.res button[aria-pressed=true][data-r=NA]{background:var(--na-soft);color:var(--na);border-color:var(--na)}
.item textarea{flex:1 1 240px;min-height:34px;height:34px;resize:vertical}
.pill{font-size:12px;padding:1px 8px;border-radius:10px;font-weight:500}
.p-PASS{background:var(--pass-soft);color:var(--pass)}.p-OBS{background:var(--obs-soft);color:var(--obs)}.p-NC{background:var(--nc-soft);color:var(--nc)}.p-NA{background:var(--na-soft);color:var(--na)}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
[hidden]{display:none!important}
@media (max-width:560px){.item{grid-template-columns:minmax(0,1fr)}.ctl{grid-column:1}.item .cl{flex-direction:row;flex-wrap:wrap}}
@media (prefers-reduced-motion:no-preference){.prog i{transition:width .25s}}
body{margin:0}
.login{max-width:420px;margin:12vh auto;display:flex;flex-direction:column;gap:12px}
</style>
</head><body>


<header class="top"><div class="wrap bar">
  <div class="brand"><b>KST Audit Hub</b><span>QMR · ISO 9001 · ISO 14001 · FSSC 22000 · BAP SPS 6.0</span></div>
  <nav role="tablist" id="nav">
    <button role="tab" data-t="home" aria-selected="true">ภาพรวม</button>
    <button role="tab" data-t="teams" aria-selected="false">ทีมตรวจ</button>
    <button role="tab" data-t="audit" aria-selected="false">Checklist</button>
    <button role="tab" data-t="sum" aria-selected="false">สรุปผล</button>
  </nav>
</div></header>

<main class="wrap">
  <section id="v-home"></section>
  <section id="v-teams" hidden></section>
  <section id="v-audit" hidden></section>
  <section id="v-sum" hidden></section>
</main>

/* ---------- state ---------- */
var S={tab:'home',audits:{},teams:null,cur:null,filter:'all',db:null,mode:'local',ready:false};
var timers={};
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function uid(){return 'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- teams ---------- */
function defaultTeams(){
  var t=LEADS.map(function(l,i){return{lead:l,members:[],systems:DEFAULT_SCOPE[i].slice()}});
  AUDITORS.forEach(function(a,i){t[i%t.length].members.push(a)});
  return t;
}
function getTeams(){return S.teams||defaultTeams()}
function saveTeams(){
  S.teams=getTeams();
  if(S.db){S.db.doc('config/teams').set({teams:S.teams,updated:Date.now()}).catch(function(){})}
  else lsSet('kst-hub-teams',S.teams);
}

/* ---------- audit sessions ---------- */
function saveAudit(a,now){
  a.updated=Date.now();
  var run=function(){
    delete timers[a.id];
    if(S.db){S.db.doc('audits/'+a.id).set(a).catch(function(){})}
    else{var all=lsGet('kst-hub-audits')||{};all[a.id]=a;lsSet('kst-hub-audits',all)}
  };
  clearTimeout(timers[a.id]);
  if(now)run();else timers[a.id]=setTimeout(run,600);
}
function removeAudit(id){
  delete S.audits[id];
  if(S.db)S.db.doc('audits/'+id).delete().catch(function(){});
  else{var all=lsGet('kst-hub-audits')||{};delete all[id];lsSet('kst-hub-audits',all)}
}

/* build the checklist rows for a session from its selected systems */
function rowsFor(systems){
  var rows=[],hs=systems.filter(function(s){return s!=='bap'&&SYS[s]&&(s==='q9'||s==='e14'||s==='f22')});
  if(hs.length){
    HLS.forEach(function(h){
      var qs=hs.map(function(s){return{s:s,c:h.c[s],q:h.q[s]}}).filter(function(x){return x.q});
      if(qs.length)rows.push({id:'H_'+h.c.q9.replace(/\./g,'_'),group:'ข้อกำหนดร่วม ISO (โครงสร้าง HLS) · '+hs.map(function(s){return SYS[s].short}).join(' + '),title:h.t,qs:qs});
    });
  }
  SPEC.forEach(function(r){
    if(systems.indexOf(r[0])<0)return;
    rows.push({id:r[0]+'_'+r[2].replace(/\./g,'_'),group:r[1],title:r[3],qs:[{s:r[0],c:r[2],q:r[4]}]});
  });
  return rows;
}
function stats(a){
  var rows=rowsFor(a.systems||[]),c={PASS:0,OBS:0,NC:0,NA:0,open:0};
  rows.forEach(function(r){var v=(a.results||{})[r.id];if(v&&v.r)c[v.r]++;else c.open++});
  c.total=rows.length;c.done=c.total-c.open;
  var ap=c.PASS+c.OBS+c.NC;c.pct=ap?Math.round(c.PASS/ap*100):null;
  return c;
}
function thDate(d){try{var p=d.split('-');return p[2]+'/'+p[1]+'/'+(+p[0]+543)}catch(e){return d||''}}

/* ---------- views ---------- */
function show(t){
  S.tab=t;
  ['home','teams','audit','sum'].forEach(function(k){$('v-'+k).hidden=(k!==t)});
  Array.prototype.forEach.call($('nav').children,function(b){b.setAttribute('aria-selected',b.dataset.t===t)});
  if(t==='home')renderHome();if(t==='teams')renderTeams();if(t==='audit')renderAudit();if(t==='sum')renderSum();
  try{window.scrollTo(0,0)}catch(e){}
}

function renderHome(){
  var list=Object.keys(S.audits).map(function(k){return S.audits[k]}).sort(function(a,b){return (b.updated||0)-(a.updated||0)});
  var teams=getTeams();
  var perSys=SKEYS.map(function(s){
    var n=0,nc=0,obs=0;
    list.forEach(function(a){if((a.systems||[]).indexOf(s)<0)return;n++;
      rowsFor(a.systems).forEach(function(r){var v=(a.results||{})[r.id];if(!v||!v.r)return;
        if(r.qs.some(function(q){return q.s===s})){if(v.r==='NC')nc++;if(v.r==='OBS')obs++}})});
    return '<div class="card sys"><span class="n">'+esc(SYS[s].name)+'</span><span class="big">'+n+' <span class="small muted" style="font-family:var(--f-body)">การตรวจ</span></span><span class="small"><span class="pill p-NC">NC '+nc+'</span> <span class="pill p-OBS">OBS '+obs+'</span></span></div>'}).join('');
  var teamOpts=teams.map(function(t,i){return '<option value="'+i+'">ทีม '+(i+1)+' · หัวหน้า '+esc(t.lead)+'</option>'}).join('');
  var n=list.length+1;
  var today=new Date().toISOString().slice(0,10);
  $('v-home').innerHTML=

function configured(){return CFG.url&&CFG.anonKey&&CFG.url.indexOf('YOUR-')<0&&CFG.anonKey.indexOf('YOUR-')<0}
function adapter(sb){
  function snapDocs(rows){return {docs:rows.map(function(r){return{id:r.id,data:function(){return r.data}}})}}
  var ch=0;
  return{
    doc:function(path){var p=path.split('/'),tbl=p[0],id=p[1];
      return{
        set:function(d){var row=tbl==='audits'?{id:id,data:d,updated_at:new Date().toISOString()}:{key:id,data:d,updated_at:new Date().toISOString()};
          return sb.from(tbl).upsert(row).then(function(r){if(r.error)throw r.error})},
        delete:function(){return sb.from(tbl).delete().eq(tbl==='audits'?'id':'key',id).then(function(r){if(r.error)throw r.error})},
        onSnapshot:function(next){
          var load=function(){sb.from(tbl).select('data').eq('key',id).maybeSingle().then(function(r){
            var d=r.data&&r.data.data;next({exists:!!d,data:function(){return d}})})};
          load();sb.channel('cfg'+(++ch)).on('postgres_changes',{event:'*',schema:'public',table:tbl},load).subscribe();}
      }},
    collection:function(tbl){return{
      onSnapshot:function(next){
        var load=function(){sb.from(tbl).select('id,data').then(function(r){if(!r.error)next(snapDocs(r.data||[]))})};
        load();sb.channel('col'+(++ch)).on('postgres_changes',{event:'*',schema:'public',table:tbl},load).subscribe();}
    }}
  };
}
function attach(db){
  S.db=db;S.mode='db';S.audits={};
  db.collection('audits').onSnapshot(function(snap){
    var m={};snap.docs.forEach(function(d){m[d.id]=d.data()});S.audits=m;
    var ae=document.activeElement;
    if(S.tab==='home')renderHome();
    else if(S.tab==='sum')renderSum();
    else if(S.tab==='audit'&&!(ae&&ae.tagName==='TEXTAREA')&&!Object.keys(timers).length)renderAudit();
  });
  db.doc('config/teams').onSnapshot(function(s){
    if(s.exists&&s.data()&&s.data().teams){S.teams=s.data().teams;if(S.tab==='teams'&&!(document.activeElement&&document.activeElement.tagName==='SELECT'))renderTeams()}
  });
}

    var m=document.getElementById('lg-mail').value.trim();if(!m)return;
    sb.auth.signInWithOtp({email:m,options:{emailRedirectTo:location.href.split('#')[0]}}).then(function(r){
      document.getElementById('lg-msg').textContent=r.error?('ส่งไม่ได้: '+r.error.message):'ส่งลิงก์แล้ว เปิดอีเมลและกดลิงก์เพื่อเข้าใช้งาน'})};
}
function start(sb){
  var d=document.getElementById('login');if(d)d.remove();
  document.querySelector('main').hidden=false;document.querySelector('header.top').hidden=false;
  S.audits={};attach(adapter(sb));
}
if(configured()&&window.supabase){
  var sb=window.supabase.createClient(CFG.url,CFG.anonKey);
  sb.auth.getSession().then(function(r){
    if(r.data&&r.data.session)start(sb);else loginView(sb);
    sb.auth.onAuthStateChange(function(ev,sess){if(sess&&!S.db)start(sb)});
  });
}
})();
</script>
</body></html>
